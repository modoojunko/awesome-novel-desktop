# 会话隔离栈（novel-sai）：本 worktree 专用，独立容器名/端口/数据目录（per-session 规则）。
# 用法：docker compose -p novel-sai -f docker-compose.yml -f docker-compose.sai.yml up -d --build
services:
  server-backend:
    container_name: sai-server-backend
    ports: !override ["18600:19000"]
    volumes:
      - ./.docker-data/server:/app/data

  client-backend:
    container_name: sai-client-backend
    ports: !override ["17600:8000"]
    environment:
      SERVER_API_BASE: "http://server-backend:19000/api"
      PUBLIC_SERVER_API: "http://localhost:15674/api"
    volumes:
      - ./.docker-data/client:/app/data

  client-frontend:
    container_name: sai-client-frontend
    ports: !override ["15674:80"]
