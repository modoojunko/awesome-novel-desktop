<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拆书知识图谱 · __BOOK_TITLE__</title>
<!--
   AwesomeNovel 拆书导出件 · 图谱查看器（生产模板：deconstruct/assets/graph_viewer.html）
  · 单文件离线零依赖（禁 CDN）；后台渲染器注入图谱 JSON 岛（< 已转义为 \u003c）与标题占位符。
  · 注入纪律：一切来自模型/原文的文本经 esc() 后才进入 DOM；JSON 岛内 < 以 \u003c 转义。
  · 数据契约：deconstruct-graph/6（见 docs/design-c/contracts/ 正身 schema）。
  · 视图分工：关系网不表达地点；「人在哪」只在场景图与地点树面板。
-->
<style>
:root {
  --bg: oklch(98% 0.004 240); --surface: oklch(100% 0 0); --fg: oklch(20% 0.02 240);
  --muted: oklch(50% 0.018 240); --border: oklch(90% 0.006 240);
  --accent: oklch(48% 0.11 170); --accent-strong: oklch(41% 0.10 170);
  --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
  --ok: oklch(52% 0.11 155); --ok-soft: color-mix(in oklch, var(--ok) 14%, transparent);
  --warn: oklch(50% 0.13 75); --warn-soft: color-mix(in oklch, var(--warn) 16%, transparent);
  --err: oklch(50% 0.17 25); --err-soft: color-mix(in oklch, var(--err) 12%, transparent);
  --fg-soft: color-mix(in oklch, var(--fg) 5%, transparent);
  --faint: color-mix(in oklch, var(--muted) 68%, transparent);
  --on-accent: oklch(100% 0 0);
  --shadow-card: 0 1px 2px color-mix(in oklch, var(--fg) 5%, transparent), 0 12px 32px -12px color-mix(in oklch, var(--fg) 14%, transparent);
  --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'Iowan Old Style', Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, 'JetBrains Mono', monospace;
  --radius: 10px; --radius-lg: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.65 var(--font-body); }
.top { padding: 15px 22px 9px; border-bottom: 1px solid var(--border); background: var(--surface); }
.top h1 { margin: 0; font: 600 19px/1.3 var(--font-display); }
.top h1 .sub { font: 400 12.5px var(--font-body); color: var(--muted); margin-left: 10px; }
.badges { margin-top: 7px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); background: var(--bg); }
.badge.ed { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
.legend { margin-left: auto; display: flex; gap: 13px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend .l-fac { border-radius: 3px; } .legend .l-item { transform: rotate(45deg); border-radius: 2px; width: 9px; height: 9px; }
#banner { display: none; margin: 9px 22px 0; padding: 9px 14px; border: 1px solid var(--warn); border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); font-size: 12.5px; }
#banner.err { border-color: var(--err); background: var(--err-soft); color: var(--err); }
#banner details { margin-top: 4px; }
.stage { display: grid; grid-template-columns: 252px minmax(0,1fr) 320px; gap: 14px; padding: 13px 22px; }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); overflow: hidden; }
.panel > h2 { margin: 0; padding: 10px 14px 8px; font: 600 13.5px var(--font-body); border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel > h2 .hint { font: 400 11px var(--font-body); color: var(--faint); margin-left: auto; }
.tabs { display: inline-flex; gap: 4px; }
.tabs button { font: 600 12px var(--font-body); padding: 3px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tree { padding: 7px 6px 10px; overflow: auto; }
#tree { max-height: 230px; }
#chapters { max-height: 300px; }
.trow { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 8px; cursor: pointer; }
.trow:hover { background: var(--fg-soft); }
.trow.on { background: var(--accent-soft); } .trow.on .tn { color: var(--accent-strong); font-weight: 600; }
.trow.hl .tn { border-bottom: 2px solid var(--accent); }
.tconn { color: var(--faint); font: 11px var(--font-mono); flex-shrink: 0; }
.tn { font-size: 13px; }
.tc { margin-left: auto; font: 10.5px var(--font-mono); color: var(--faint); white-space: nowrap; flex-shrink: 0; }
.trow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0; flex-shrink: 0; }
.trow.hl .dot { opacity: 1; }
.cbeat { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas-wrap { position: relative; display: flex; flex-direction: column; }
#netwrap, #scenewrap { flex: 1; display: flex; flex-direction: column; min-height: 430px; }
#graph, #scene { flex: 1; display: block; width: 100%; }
#scene { touch-action: none; }
.chapnav { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg); font-size: 12.5px; }
.chapnav button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.chapnav button:hover { border-color: var(--accent); color: var(--accent-strong); }
.chapnav .now { font-weight: 600; } .chapnav .beat { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filters { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-left: auto; }
.filters select { font-size: 12px; padding: 2px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); }
.edge { stroke: color-mix(in oklch, var(--muted) 55%, transparent); stroke-linecap: round; }
.edge.hot { stroke: var(--accent-strong); }
.edge-fp { stroke: color-mix(in oklch, var(--err) 58%, transparent); }
.edge-hier { stroke: color-mix(in oklch, var(--warn) 62%, transparent); }
.sedge { stroke: color-mix(in oklch, var(--muted) 62%, transparent); fill: none; stroke-width: 1.6; }
.sedge.hot { stroke: var(--accent-strong); stroke-width: 2.2; }
.sedge.edge-fp { stroke: color-mix(in oklch, var(--err) 60%, transparent); }
.sedge.edge-hier { stroke: color-mix(in oklch, var(--warn) 64%, transparent); }
.slab { font: 10px var(--font-mono); fill: var(--muted); }
.node { cursor: pointer; }
.n-zj { fill: var(--accent); stroke: var(--accent-strong); } .n-pj { fill: var(--surface); stroke: var(--accent); }
.n-fp { fill: var(--err); stroke: var(--err); } .n-fac { fill: var(--warn-soft); stroke: var(--warn); } .n-item { fill: var(--ok-soft); stroke: var(--ok); }
.node text, .pin text { font: 12px var(--font-body); fill: var(--fg); pointer-events: none; }
.node .alias { fill: var(--faint); font-size: 10.5px; }
.dim { opacity: 0.16; }
.box { fill: var(--bg); stroke: var(--border); stroke-width: 1.4; }
.box.county { fill: none; stroke: color-mix(in oklch, var(--accent) 45%, var(--border)); stroke-dasharray: 5 4; }
.box.unknown { fill: none; stroke: var(--warn); stroke-dasharray: 3 4; }
.blab { font: 600 12.5px var(--font-body); fill: var(--accent-strong); }
.bsub { font: 10.5px var(--font-mono); fill: var(--faint); }
.pin { cursor: pointer; }
.pin circle, .pin rect, .pin path { stroke-width: 2; }
.side { padding: 14px 16px; max-height: 588px; overflow: auto; }
.side h3 { margin: 0 0 4px; font: 600 17px var(--font-display); }
.rolechip { display: inline-block; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
.rc-主角 { background: var(--accent); color: var(--on-accent); }
.rc-配角 { background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent); }
.rc-反派 { background: var(--err-soft); color: var(--err); border: 1px solid var(--err); }
.rc-组织 { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }
.rc-物品 { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.rc-地点 { background: var(--accent-soft); color: var(--accent-strong); border: 1px solid var(--accent); }
.rc-章 { background: var(--fg-soft); color: var(--fg); border: 1px solid var(--border); }
.side p { margin: 8px 0; color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
.chip { font: 11px var(--font-mono); padding: 2px 7px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); background: var(--bg); }
.chip[data-nav-who], .chip[data-nav-place], .chip[data-nav-chap], .chip[data-nav-ev] { cursor: pointer; }
.chip.loc { border-color: var(--accent); color: var(--accent-strong); }
.chip.ev { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.crumb { font: 11.5px var(--font-mono); color: var(--faint); margin: 2px 0 6px; }
.crumb b { color: var(--accent-strong); }
.sh { margin: 12px 0 6px; font: 600 13px var(--font-body); color: var(--fg); border-top: 1px solid var(--border); padding-top: 10px; }
.erow { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-bottom: 1px dashed color-mix(in oklch, var(--border) 60%, transparent); font-size: 13px; cursor: pointer; }
.erow:hover { color: var(--accent-strong); }
.erow .k { flex-shrink: 0; font-weight: 600; min-width: 4.5em; }
.erow .ev { color: var(--faint); font-size: 11.5px; } .erow .q { color: var(--muted); font-style: italic; }
.tl { margin: 0 22px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 11px 16px 13px; box-shadow: var(--shadow-card); }
.tl h2 { margin: 0 0 7px; font: 600 13px var(--font-body); }
.tl .ruler { display: flex; font: 10.5px var(--font-mono); color: var(--faint); margin-left: 150px; }
.tl .ruler span { flex: 1; text-align: center; }
.evrow { position: relative; height: 25px; margin-left: 150px; }
.evrow .lab { position: absolute; left: -150px; top: 2px; width: 142px; text-align: right; font-size: 12px; color: var(--muted); cursor: pointer; }
.evrow .lab:hover { color: var(--accent-strong); }
.evbar { position: absolute; top: 2px; height: 19px; border-radius: 6px; background: var(--accent-soft); border: 1px solid var(--accent); cursor: pointer; padding-left: 8px; font-size: 11px; color: var(--accent-strong); line-height: 18px; white-space: nowrap; overflow: hidden; }
.hookline { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
.hook { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px dashed var(--warn); color: var(--warn); background: var(--warn-soft); }
.hook.closed { border-style: solid; border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.foot { margin: 0 22px 20px; font-size: 11.5px; color: var(--faint); }
@media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="top">
  <h1 id="booktitle"></h1>
  <div class="badges">
    <span class="badge ed" id="statbadge"></span>
    <span class="badge" id="legendbadge">单文件离线 · 无 CDN</span>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>主角</span>
      <span><i style="background:var(--surface);border:1.5px solid var(--accent)"></i>配角</span>
      <span><i style="background:var(--err)"></i>反派</span>
      <span><i class="l-fac" style="background:var(--warn-soft);border:1.5px solid var(--warn)"></i>势力</span>
      <span><i class="l-item" style="background:var(--ok-soft);border:1.5px solid var(--ok)"></i>物品</span>
      <span>框＝地点（虚线大框＝上级）</span>
      <span>—线粗＝戏份·红＝敌对·黄＝从属—</span>
    </div>
  </div>
</header>
<div id="banner"></div>

<main class="stage">
  <div class="rail">
    <section class="panel">
      <h2>章链（进度轴）<span class="hint">点章＝场景图翻到此章</span></h2>
      <div class="tree" id="chapters"></div>
    </section>
    <section class="panel">
      <h2>地点归属树（空间轴）<span class="hint">上级 ▸ 下级</span></h2>
      <div class="tree" id="tree"></div>
    </section>
  </div>

  <section class="panel canvas-wrap">
    <h2>
      <span class="tabs">
        <button id="tabScene" class="on">场景 · 人在哪</button>
        <button id="tabNet">关系网 · 人与人的关系</button>
      </span>
      <span class="filters" id="netfilters" style="display:none">
        戏份 Top
        <select id="topn">
          <option value="0">全部</option>
          <option value="10">10</option>
          <option value="20">20</option>
        </select>
      </span>
      <span class="hint" id="canvasHint">地点为框 · 图钉＝本章在场 · 线＝本章关系</span>
    </h2>
    <div id="scenewrap">
      <svg id="scene" viewBox="0 0 860 470" aria-label="本章场景图"></svg>
      <div class="chapnav">
        <button id="prev" title="上一章">◀</button>
        <span class="now" id="nowNo"></span>
        <button id="next" title="下一章">▶</button>
        <span class="beat" id="nowBeat"></span>
      </div>
    </div>
    <div id="netwrap" style="display:none">
      <svg id="graph" viewBox="0 0 860 460" aria-label="人物关系网"></svg>
    </div>
  </section>

  <aside class="panel side" id="side"></aside>
</main>

<footer class="tl">
  <h2>主线事件（跨章段落）</h2>
  <div class="ruler" id="ruler"></div>
  <div id="evrows"></div>
  <div class="hookline" id="hooks"></div>
</footer>

<p class="foot">本文件为拆书导出件，由 AwesomeNovel 生成（契约 deconstruct-graph/6）；图谱.json 为唯一机器正身，本页与 图谱.svg 皆其视图；手改本文件不回流应用。建议使用现代浏览器打开（Chrome/Edge 111+ 或 Safari 16.4+）。</p>

<script id="graphdata" type="application/json">__GRAPH_JSON__</script>

<script>
(function () {
  "use strict";
  var banner = document.getElementById("banner");
  function showBanner(msg, isErr) {
    banner.style.display = "block";
    if (isErr) banner.className = "err";
    var b = document.createElement("b");
    b.textContent = isErr ? "图谱不可用：" : "图谱完成度：";
    banner.appendChild(b);
    banner.appendChild(document.createTextNode(msg));
  }
  var DATA;
  try {
    DATA = JSON.parse(document.getElementById("graphdata").textContent);
  } catch (e) {
    showBanner("数据岛解析失败，文件可能损坏。", true);
    return;
  }
  if (!DATA || String(DATA.contract || "").indexOf("deconstruct-graph/") !== 0) {
    showBanner("契约版本不符（需 deconstruct-graph/6），本页可能无法正确渲染。", true);
  }

  // ── 安全插值：一切模型/原文文本经 esc 后才进 DOM ──
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(tag, cls, parent) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (cls) e.setAttribute("class", cls);
    if (parent) parent.appendChild(e);
    return e;
  }
  function tx(parent, cls, x, y, text, anchor) {
    var t = el("text", cls, parent);
    t.setAttribute("x", x); t.setAttribute("y", y);
    if (anchor) t.setAttribute("text-anchor", anchor);
    t.textContent = text;
    return t;
  }

  var nodeById = {}, placeById = {}, eventById = {}, chapByNo = {};
  (DATA.nodes || []).forEach(function (n) { nodeById[n.id] = n; });
  (DATA.places || []).forEach(function (p) { placeById[p.id] = p; });
  (DATA.events || []).forEach(function (e) { eventById[e.id] = e; });
  (DATA.chapters || []).forEach(function (c) { chapByNo[c.no] = c; });
  var LAY = DATA.layout || {};
  var NET = LAY.net || {}, SCENE = LAY.scene || {};

  var childrenOf = {};
  (DATA.places || []).forEach(function (p) {
    if (p.parent && placeById[p.parent]) (childrenOf[p.parent] = childrenOf[p.parent] || []).push(p.id);
  });
  var leafPlaces = (DATA.places || []).filter(function (p) { return !childrenOf[p.id]; });

  var ROLE_CLS = { "主角": "n-zj", "配角": "n-pj", "反派": "n-fp" };
  function clsOf(n) { return n.type === "faction" ? "n-fac" : n.type === "item" ? "n-item" : (ROLE_CLS[n.role] || "n-pj"); }
  function roleLabel(n) { return n.type === "faction" ? "组织" : n.type === "item" ? "物品" : (n.role || "人物"); }
  var state = { chap: 1, tab: "scene", topN: 0, sel: null };

  // ── 头部 ──
  document.title = "拆书知识图谱 · " + (DATA.book || "");
  var h1 = document.getElementById("booktitle");
  h1.appendChild(document.createTextNode("《" + String(DATA.book || "") + "》"));
  var sub = document.createElement("span");
  sub.className = "sub"; sub.textContent = "拆书知识图谱 · 四视图";
  h1.appendChild(sub);
  var st = DATA.stats || {};
  document.getElementById("statbadge").textContent =
    "共 " + (st.chapters || 0) + " 章 · " + (st.words || 0).toLocaleString() + " 字";
  var warns = (DATA.meta && DATA.meta.warnings) || [];
  var comp = (DATA.meta && DATA.meta.completion) || {};
  // 完成度恒显（评审 P2-3：零警告书也要看得到覆盖账）；警告明细条件展开
  var nWarn = 0;
  warns.forEach(function (w) { nWarn += (w.count || 1); });
  banner.style.display = "block";
  banner.appendChild(document.createTextNode(
    "图谱完成度：在场 " + (comp.presence_placed || 0) + "/" + (comp.presence_total || 0)
    + " 条已定位 · " + (warns.length ? "警告 " + warns.length + " 类（约 " + nWarn + " 处）" : "无警告")));
  if (warns.length) {
    var dets = document.createElement("details");
    var sum = document.createElement("summary"); sum.textContent = "查看明细";
    dets.appendChild(sum);
    warns.forEach(function (w) {
      var pl = document.createElement("div");
      pl.textContent = "· " + String(w.msg || w.kind || "");
      dets.appendChild(pl);
    });
    banner.appendChild(dets);
  }

  // ── 左栏：章链 ──
  var chapBox = document.getElementById("chapters");
  (DATA.chapters || []).forEach(function (c) {
    var row = document.createElement("div"); row.className = "trow";
    var dot = document.createElement("span"); dot.className = "dot";
    var no = document.createElement("span"); no.className = "tc"; no.textContent = "第" + c.no + "章";
    var beat = document.createElement("span"); beat.className = "cbeat"; beat.textContent = c.beat || "";
    var cnt = document.createElement("span"); cnt.className = "tc";
    cnt.textContent = (c.at || []).length + "地·" + (c.who || []).length + "人";
    row.appendChild(dot); row.appendChild(no); row.appendChild(beat); row.appendChild(cnt);
    row.addEventListener("click", function () { selectChapter(c.no); setTab("scene"); });
    chapBox.appendChild(row);
    c.__row = row;
  });

  // ── 左栏：地点树 ──
  var treeBox = document.getElementById("tree");
  function placeDepth(p) { var d = 0, cur = p; var guard = 0; while (cur && cur.parent && placeById[cur.parent] && guard++ < 20) { d++; cur = placeById[cur.parent]; } return d; }
  function treeWalk(list, depth) {
    list.forEach(function (p) {
      var row = document.createElement("div"); row.className = "trow";
      row.style.paddingLeft = (8 + depth * 14) + "px";
      var conn = document.createElement("span"); conn.className = "tconn";
      conn.textContent = depth ? "└─" : "";
      var nm = document.createElement("span"); nm.className = "tn"; nm.textContent = p.label;
      var ch = document.createElement("span"); ch.className = "tc"; ch.textContent = "第" + (p.ch || 1) + "章";
      row.appendChild(conn); row.appendChild(nm); row.appendChild(ch);
      row.addEventListener("click", function () { selectPlace(p.id); });
      treeBox.appendChild(row);
      p.__row = row;
      treeWalk((DATA.places || []).filter(function (x) { return x.parent === p.id; }), depth + 1);
    });
  }
  treeWalk((DATA.places || []).filter(function (p) { return !p.parent; }), 0);

  // ── 页签 ──
  var tabScene = document.getElementById("tabScene"), tabNet = document.getElementById("tabNet");
  function setTab(which) {
    state.tab = which;
    document.getElementById("scenewrap").style.display = which === "scene" ? "" : "none";
    document.getElementById("netwrap").style.display = which === "net" ? "" : "none";
    document.getElementById("netfilters").style.display = which === "net" ? "inline-flex" : "none";
    tabScene.classList.toggle("on", which === "scene");
    tabNet.classList.toggle("on", which === "net");
    document.getElementById("canvasHint").textContent = which === "scene"
      ? "地点为框 · 图钉＝本章在场 · 线＝本章关系"
      : "滚轮不可用 · 点人聚焦关系圈 · TopN 按戏份过滤";
    if (which === "net") drawNet();
    else drawScene();
  }
  tabScene.addEventListener("click", function () { setTab("scene"); });
  tabNet.addEventListener("click", function () { setTab("net"); });
  document.getElementById("topn").addEventListener("change", function (e) {
    state.topN = parseInt(e.target.value, 10) || 0; drawNet();
  });

  // ── 场景图（地点为框·人在框中） ──
  function drawScene() {
    var svg = document.getElementById("scene");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var c = chapByNo[state.chap];
    document.getElementById("nowNo").textContent = "第" + state.chap + "章";
    document.getElementById("nowBeat").textContent = c ? (c.beat || "") : "";
    if (!c) return;

    // 上级框（虚线）先画，叶子框（实线）后画
    (DATA.places || []).forEach(function (p) {
      var b = SCENE[p.id]; if (!b) return;
      var isParent = !!childrenOf[p.id];
      var r = el("rect", "box" + (isParent ? " county" : ""), svg);
      r.setAttribute("x", b[0]); r.setAttribute("y", b[1]); r.setAttribute("width", b[2]); r.setAttribute("height", b[3]);
      r.setAttribute("rx", 12);
      tx(svg, "blab", b[0] + 12, b[1] + 21, p.label);
    });

    // 未知区：本章有 where=null 的在场才画
    var unplaced = c.presence.filter(function (p) { return !p.where; });
    var maxY = 0, maxX = 0;
    Object.keys(SCENE).forEach(function (k) {
      maxY = Math.max(maxY, SCENE[k][1] + SCENE[k][3]);
      maxX = Math.max(maxX, SCENE[k][0] + SCENE[k][2]);
    });
    var canvas = (LAY.scene_canvas && LAY.scene_canvas.length === 2) ? LAY.scene_canvas : [860, 470];
    var vh = Math.max(canvas[1], maxY + (unplaced.length ? 172 : 24));
    svg.setAttribute("viewBox", "0 0 " + Math.max(canvas[0], maxX + 28) + " " + vh);
    var ub = [20, maxY + 36, 220, 96];
    if (unplaced.length) {
      var ur = el("rect", "box unknown", svg);
      ur.setAttribute("x", ub[0]); ur.setAttribute("y", ub[1]); ur.setAttribute("width", ub[2]); ur.setAttribute("height", ub[3]);
      ur.setAttribute("rx", 12);
      tx(svg, "blab", ub[0] + 12, ub[1] + 21, "未知区 · 在场未定位");
    }

    // 图钉布位（框内网格）
    var slot = {}, pinPos = {};
    function placeFor(pres) {
      var box = pres.where && SCENE[pres.where] ? SCENE[pres.where] : ub;
      var key = pres.where || "_u";
      slot[key] = slot[key] || 0;
      var i = slot[key]++;
      var cols = Math.max(2, Math.floor((box[2] - 48) / 46));
      var x = box[0] + 30 + (i % cols) * 46;
      var y = box[1] + 52 + Math.floor(i / cols) * 46;
      return [x, y];
    }
    c.presence.forEach(function (pres) {
      var n = nodeById[pres.who]; if (!n) return;
      var pos = placeFor(pres);
      pinPos[n.id] = pos;
      var g = el("g", "pin", svg);
      if (n.type === "faction") {
        var r2 = el("rect", clsOf(n), g);
        r2.setAttribute("x", pos[0] - 10); r2.setAttribute("y", pos[1] - 10);
        r2.setAttribute("width", 20); r2.setAttribute("height", 20); r2.setAttribute("rx", 5);
      } else if (n.type === "item") {
        var pth = el("path", clsOf(n), g);
        pth.setAttribute("d", "M " + pos[0] + " " + (pos[1] - 11) + " L " + (pos[0] + 11) + " " + pos[1] + " L " + pos[0] + " " + (pos[1] + 11) + " L " + (pos[0] - 11) + " " + pos[1] + " Z");
      } else {
        var cc = el("circle", clsOf(n), g);
        cc.setAttribute("cx", pos[0]); cc.setAttribute("cy", pos[1]);
        cc.setAttribute("r", n.role === "主角" ? 13 : 10);
      }
      tx(g, "", pos[0], pos[1] + (n.role === "主角" ? 26 : 23), n.label, "middle");
      var tipTxt = n.label + (pres.where ? "" : "（在场，位置不明）");
      if (pres.t) tipTxt += "（" + pres.t + "线）";
      var ti = el("title", "", g); ti.textContent = tipTxt;
      g.addEventListener("click", function () { selectWho(n.id); });
    });

    // 本章可见关系（两端都在场）
    (DATA.edges || []).forEach(function (e) {
      if (!pinPos[e.from] || !pinPos[e.to]) return;
      var a = pinPos[e.from], b2 = pinPos[e.to];
      var ln = el("path", "sedge" + (e.kind === "敌对" ? " edge-fp" : ["师徒", "主从", "同门", "同僚"].indexOf(e.kind) >= 0 ? " edge-hier" : ""), svg);
      var mx = (a[0] + b2[0]) / 2, my = (a[1] + b2[1]) / 2 - 14;
      ln.setAttribute("d", "M " + a[0] + " " + a[1] + " Q " + mx + " " + my + " " + b2[0] + " " + b2[1]);
      var ti2 = el("title", "", ln); ti2.textContent = nodeById[e.from].label + " —" + e.kind + "→ " + nodeById[e.to].label + (e.quote ? "：" + e.quote : "");
      tx(svg, "slab", mx, my + 4, e.kind, "middle");
    });

    var hk = (DATA.hooks || []).filter(function (h) { return h.plant === c.no || h.payoff === c.no; });
    if (hk.length) {
      var label = "本章伏笔：" + hk.map(function (h) { return "⚑" + h.desc + "（" + (h.plant === c.no ? "埋" : "收") + "）"; }).join("　");
      tx(svg, "bsub", 20, (ub[1] + ub[3] + 22), label);
    }
    renderChapterPanel(c);
  }

  // ── 关系网（社会轴；不表达地点） ──
  function degreeOf(id) {
    var d = 0;
    (DATA.edges || []).forEach(function (e) { if (e.from === id || e.to === id) d += (e.w || 1); });
    return d;
  }
  function drawNet() {
    var svg = document.getElementById("graph");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var topSet = null;
    if (state.topN > 0) {
      var ranked = (DATA.nodes || []).slice().sort(function (a, b) { return degreeOf(b.id) - degreeOf(a.id); });
      topSet = {};
      ranked.slice(0, state.topN).forEach(function (n) { topSet[n.id] = true; });
    }
    var gEdges = el("g", "", svg), gNodes = el("g", "", svg);
    (DATA.edges || []).forEach(function (e) {
      var a = NET[e.from], b = NET[e.to];
      if (!a || !b) return;
      var ln = el("line", "edge" + (e.kind === "敌对" ? " edge-fp" : ["师徒", "主从", "同门", "同僚"].indexOf(e.kind) >= 0 ? " edge-hier" : ""), gEdges);
      ln.setAttribute("x1", a[0]); ln.setAttribute("y1", a[1]); ln.setAttribute("x2", b[0]); ln.setAttribute("y2", b[1]);
      ln.setAttribute("stroke-width", 1.2 + (e.w || 1) * 1.3);
      if (topSet && (!topSet[e.from] || !topSet[e.to])) ln.classList.add("dim");
      var ti3 = el("title", "", ln); ti3.textContent = nodeById[e.from].label + " —" + e.kind + "→ " + nodeById[e.to].label + " · 第" + e.ch + "章" + (e.quote ? "「" + e.quote + "」" : "");
    });
    (DATA.nodes || []).forEach(function (n) {
      var pos = NET[n.id]; if (!pos) return;
      var g = el("g", "node", gNodes);
      if (n.type === "faction") {
        var r = el("rect", clsOf(n), g);
        r.setAttribute("x", pos[0] - 30); r.setAttribute("y", pos[1] - 13);
        r.setAttribute("width", 60); r.setAttribute("height", 26); r.setAttribute("rx", 8);
      } else if (n.type === "item") {
        var pth = el("path", clsOf(n), g);
        pth.setAttribute("d", "M " + pos[0] + " " + (pos[1] - 14) + " L " + (pos[0] + 14) + " " + pos[1] + " L " + pos[0] + " " + (pos[1] + 14) + " L " + (pos[0] - 14) + " " + pos[1] + " Z");
      } else {
        var cc = el("circle", clsOf(n), g);
        cc.setAttribute("cx", pos[0]); cc.setAttribute("cy", pos[1]);
        cc.setAttribute("r", n.role === "主角" ? 19 : 14);
      }
      tx(g, "", pos[0], pos[1] + (n.type === "person" ? (n.role === "主角" ? 36 : 30) : 28), n.label, "middle");
      if (topSet && !topSet[n.id]) g.classList.add("dim");
      g.addEventListener("click", function () { selectWho(n.id); });
    });
  }

  // ── 选择与侧栏 ──
  var side = document.getElementById("side");
  function navBind(root) {
    root.querySelectorAll("[data-nav-who]").forEach(function (el2) { el2.addEventListener("click", function () { selectWho(el2.getAttribute("data-nav-who")); }); });
    root.querySelectorAll("[data-nav-place]").forEach(function (el2) { el2.addEventListener("click", function () { selectPlace(el2.getAttribute("data-nav-place")); }); });
    root.querySelectorAll("[data-nav-chap]").forEach(function (el2) { el2.addEventListener("click", function () { selectChapter(parseInt(el2.getAttribute("data-nav-chap"), 10)); setTab("scene"); }); });
    root.querySelectorAll("[data-nav-ev]").forEach(function (el2) { el2.addEventListener("click", function () { selectEvent(el2.getAttribute("data-nav-ev")); }); });
  }
  function chipWho(id) { var n = nodeById[id]; return n ? '<span class="chip" data-nav-who="' + esc(id) + '">' + esc(n.label) + "</span>" : ""; }
  function chipPlace(id) { var p = placeById[id]; return p ? '<span class="chip loc" data-nav-place="' + esc(id) + '">📍' + esc(p.label) + "</span>" : ""; }
  function selectChapter(no) {
    state.chap = no;
    (DATA.chapters || []).forEach(function (c) { c.__row && c.__row.classList.toggle("on", c.no === no); });
    setTab(state.tab === "net" ? "scene" : state.tab);
    drawScene();
    renderChapterPanel(chapByNo[no]);
  }
  function renderChapterPanel(c) {
    if (!c) return;
    var rels = (DATA.edges || []).filter(function (e) { return (c.who || []).indexOf(e.from) >= 0 && (c.who || []).indexOf(e.to) >= 0; });
    var whereRows = (c.presence || []).map(function (p) {
      var n = nodeById[p.who]; if (!n) return "";
      var loc = p.where && placeById[p.where] ? placeById[p.where].label : "未知区（在场未定位）";
      return '<div class="erow" data-nav-who="' + esc(p.who) + '"><span class="k">' + esc(n.label) + "</span><span>在 <b>" + esc(loc) + "</b>" + (p.t ? '<span class="ev">（' + esc(p.t) + "线）</span>" : "") + "</span></div>";
    }).join("");
    side.innerHTML =
      "<h3>第" + esc(c.no) + '章<span class="rolechip rc-章">章</span></h3>' +
      '<p style="color:var(--fg)">' + esc(c.beat) + "</p>" +
      (c.ev && eventById[c.ev] ? '<div class="chips"><span class="chip ev" data-nav-ev="' + esc(c.ev) + '">⚡ 属「' + esc(eventById[c.ev].title) + "」（第" + esc(eventById[c.ev].ch[0]) + "-" + esc(eventById[c.ev].ch[1]) + "章）</span></div>" : "") +
      '<h3 class="sh">谁在哪儿（本章）</h3>' + (whereRows || '<p>本章无在场记录。</p>') +
      (rels.length ? '<h3 class="sh">本章可见关系</h3>' + rels.map(function (e) {
        return '<div class="erow"><span class="k">' + esc(e.kind) + "</span><span><b>" + esc(nodeById[e.from].label) + "—" + esc(nodeById[e.to].label) + "</b>" + (e.quote ? ' <span class="q">「' + esc(e.quote) + "」</span>" : "") + "</span></div>";
      }).join("") : "");
    navBind(side);
  }
  function selectWho(id) {
    var n = nodeById[id]; if (!n) return;
    state.sel = id;
    // 视图分工：场景视图下章链亮他出现的章；关系网不表达地点（足迹仅场景页签展示）
    (DATA.chapters || []).forEach(function (c) {
      if (c.__row) c.__row.classList.toggle("hl", (c.who || []).indexOf(id) >= 0);
    });
    (DATA.places || []).forEach(function (p) {
      if (!p.__row) return;
      var foot = (DATA.links || []).some(function (l) { return l.who === id && l.where === p.id; });
      p.__row.classList.toggle("hl", state.tab === "scene" && foot);
    });
    var rels = (DATA.edges || []).filter(function (e) { return e.from === id || e.to === id; });
    var foot = (DATA.links || []).filter(function (l) { return l.who === id; });
    var evs = (DATA.events || []).filter(function (e) { return (e.members || []).indexOf(id) >= 0; });
    var chaps = (DATA.chapters || []).filter(function (c) { return (c.who || []).indexOf(id) >= 0; });
    side.innerHTML =
      "<h3>" + esc(n.label) + '<span class="rolechip rc-' + esc(roleLabel(n)) + '">' + esc(roleLabel(n)) + "</span></h3>" +
      (n.alias && n.alias.length ? "<p>别名：" + esc(n.alias.join("、")) + "</p>" : "") +
      (n.bio ? "<p>" + esc(n.bio) + "</p>" : "") +
      '<h3 class="sh">出现的章</h3><div class="chips">' + (chaps.length ? chaps.map(function (c) { return '<span class="chip" data-nav-chap="' + esc(c.no) + '">第' + esc(c.no) + "章</span>"; }).join("") : '<span class="chip">无</span>') + "</div>" +
      (state.tab === "scene" && foot.length ? '<h3 class="sh">足迹（仅场景视图）</h3>' + foot.map(function (l) {
        var p = placeById[l.where]; if (!p) return "";
        return '<div class="erow" data-nav-place="' + esc(l.where) + '"><span class="k">' + esc(l.kind) + "</span><span><b>" + esc(p.label) + "</b>" + (l.quote ? ' <span class="q">「' + esc(l.quote) + "」</span>" : "") + '<span class="ev"> 第' + esc(l.ch) + "章</span></span></div>";
      }).join("") : "") +
      '<h3 class="sh">关系（每条带出处）</h3>' + (rels.length ? rels.map(function (e) {
        var other = nodeById[e.from === id ? e.to : e.from];
        if (!other) return "";
        return '<div class="erow" data-nav-who="' + esc(other.id) + '"><span class="k">' + esc(e.kind) + "</span><span><b>" + esc(other.label) + "</b>" + (e.quote ? ' <span class="q">「' + esc(e.quote) + "」</span>" : "") + '<span class="ev"> 第' + esc(e.ch) + "章</span></span></div>";
      }).join("") : "<p>无记录。</p>") +
      '<h3 class="sh">卷入事件</h3>' + (evs.length ? evs.map(function (e) {
        return '<div class="erow" data-nav-ev="' + esc(e.id) + '"><span class="k">' + esc(e.title) + '</span><span>第' + esc(e.ch[0]) + "-" + esc(e.ch[1]) + "章</span></div>";
      }).join("") : "<p>无记录。</p>");
    navBind(side);
  }
  function selectPlace(id) {
    var p = placeById[id]; if (!p) return;
    var scope = {}; scope[id] = true;
    var changed = true, guard = 0;
    while (changed && guard++ < 30) {
      changed = false;
      (DATA.places || []).forEach(function (x) { if (x.parent && scope[x.parent] && !scope[x.id]) { scope[x.id] = true; changed = true; } });
    }
    (DATA.places || []).forEach(function (x) { x.__row && x.__row.classList.toggle("hl", !!scope[x.id]); });
    var links = (DATA.links || []).filter(function (l) { return scope[l.where]; });
    var chaps = (DATA.chapters || []).filter(function (c) {
      return (c.at || []).some(function (a) { return scope[a]; }) || (c.presence || []).some(function (pp2) { return pp2.where && scope[pp2.where]; });
    });
    var chain = [], cur = p, g2 = 0;
    while (cur && g2++ < 20) { chain.unshift(cur.label); cur = cur.parent && placeById[cur.parent]; }
    var crumb = chain.map(function (x, i) { return i === chain.length - 1 ? "<b>" + esc(x) + "</b>" : esc(x); }).join(" ▸ ");
    side.innerHTML =
      "<h3>" + esc(p.label) + '<span class="rolechip rc-地点">地点</span></h3>' +
      '<p class="crumb">' + crumb + "</p>" +
      (p.note ? "<p>" + esc(p.note) + "</p>" : "") +
      '<h3 class="sh">章链到此地</h3><div class="chips">' + (chaps.length ? chaps.map(function (c) { return '<span class="chip" data-nav-chap="' + esc(c.no) + '">第' + esc(c.no) + "章</span>"; }).join("") : '<span class="chip">无</span>') + "</div>" +
      '<h3 class="sh">此地之人（' + links.length + "）</h3>" + (links.length ? links.map(function (l) {
        var n = nodeById[l.who]; if (!n) return "";
        return '<div class="erow" data-nav-who="' + esc(l.who) + '"><span class="k">' + esc(l.kind) + "</span><span><b>" + esc(n.label) + "</b>" + (l.quote ? ' <span class="q">「' + esc(l.quote) + "」</span>" : "") + '<span class="ev"> 第' + esc(l.ch) + "章</span></span></div>";
      }).join("") : "<p>暂无记录。</p>");
    navBind(side);
  }
  function selectEvent(id) {
    var e = eventById[id]; if (!e) return;
    var p = e.at && placeById[e.at];
    side.innerHTML =
      "<h3>" + esc(e.title) + "</h3>" +
      '<div class="chips"><span class="chip">第' + esc(e.ch[0]) + "-" + esc(e.ch[1]) + "章</span>" + (p ? '<span class="chip loc" data-nav-place="' + esc(p.id) + '">📍 ' + esc(p.label) + "</span>" : "") + "</div>" +
      (e.note ? "<p>" + esc(e.note) + "</p>" : "") +
      '<h3 class="sh">参与</h3><div class="chips">' + (e.members || []).map(chipWho).join("") + "</div>";
    navBind(side);
  }
  function renderHome() {
    var persons = (DATA.nodes || []).filter(function (n) { return n.type === "person"; }).length;
    var facs = (DATA.nodes || []).filter(function (n) { return n.type === "faction"; }).length;
    var items = (DATA.nodes || []).filter(function (n) { return n.type === "item"; }).length;
    side.innerHTML =
      "<h3>本书书眼</h3>" +
      '<div class="chips"><span class="chip">共 ' + esc((DATA.stats || {}).chapters || 0) + " 章</span><span class=\"chip\">" + esc(((DATA.stats || {}).words || 0).toLocaleString()) + " 字</span></div>" +
      (DATA.logline ? "<p>" + esc(DATA.logline) + "</p>" : "") +
      '<h3 class="sh">一眼三问</h3>' +
      "<p><b>在哪</b>：左栏地点树 " + (DATA.places || []).length + " 处<br>" +
      "<b>有谁</b>：" + persons + " 人 · " + facs + " 势力 · " + items + " 物，" + (DATA.edges || []).length + " 条关系条条带出处<br>" +
      "<b>发生了啥</b>：底轴 " + (DATA.events || []).length + " 段主线 · " + (DATA.hooks || []).length + " 枚伏笔</p>" +
      '<h3 class="sh">怎么用</h3><p>场景页签看\u201c谁在哪儿干什么\u201d（点人＝同步亮章链）；关系网页签点人只亮关系圈（不涉地点）；点地点＝聚焦此地之人与章；Esc 回本书书眼面板。</p>';
  }

  // ── 底部：时间轴＋伏笔 ──
  function renderTimeline() {
    var CH = (DATA.stats || {}).chapters || 0;
    var ruler = document.getElementById("ruler");
    while (ruler.firstChild) ruler.removeChild(ruler.firstChild);
    for (var i = 1; i <= CH; i++) {
      var s = document.createElement("span"); s.textContent = String(i); ruler.appendChild(s);
    }
    var rows = document.getElementById("evrows");
    while (rows.firstChild) rows.removeChild(rows.firstChild);
    (DATA.events || []).forEach(function (e) {
      var d = document.createElement("div"); d.className = "evrow";
      var lab = document.createElement("span"); lab.className = "lab";
      lab.textContent = e.title + (e.at && placeById[e.at] ? " 📍" + placeById[e.at].label : "");
      lab.addEventListener("click", function () { selectEvent(e.id); });
      var bar = document.createElement("div"); bar.className = "evbar";
      bar.style.left = (((e.ch[0] - 1) / CH) * 100) + "%";
      bar.style.width = (((e.ch[1] - e.ch[0] + 1) / CH) * 100) + "%";
      bar.textContent = e.title;
      bar.addEventListener("click", function () { selectEvent(e.id); });
      d.append(lab, bar);
      rows.appendChild(d);
    });
    var hooks = document.getElementById("hooks");
    while (hooks.firstChild) hooks.removeChild(hooks.firstChild);
    (DATA.hooks || []).forEach(function (h) {
      var s = document.createElement("span");
      s.className = "hook" + (h.status === "已收" ? " closed" : "");
      s.textContent = "伏笔 · " + h.desc + "〔埋第" + h.plant + "章" + (h.payoff ? " · 收第" + h.payoff + "章" : " · 未收") + "〕";
      hooks.appendChild(s);
    });
  }

  document.getElementById("prev").addEventListener("click", function () { selectChapter(Math.max(1, state.chap - 1)); });
  document.getElementById("next").addEventListener("click", function () {
    selectChapter(Math.min((DATA.stats || {}).chapters || 1, state.chap + 1));
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") renderHome();
  });

  renderHome();
  selectChapter(1);
  setTab("scene");
})();
</script>
</body>
</html>
