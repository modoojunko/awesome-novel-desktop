<script>
(function () {
  "use strict";
  var banner = document.getElementById("banner");
  function showBanner(msg, isErr) {
    banner.style.display = "block";
    if (isErr) banner.className = "err";
    var b = document.createElement("b");
    b.textContent = isErr ? "图谱不可用：" : "图谱完成度：";
    banner.appendChild(b);
    banner.appendChild(document.createTextNode(msg));
  }
  var DATA;
  try {
    DATA = JSON.parse(document.getElementById("graphdata").textContent);
  } catch (e) {
    showBanner("数据岛解析失败，文件可能损坏。", true);
    return;
  }
  if (!DATA || String(DATA.contract || "").indexOf("deconstruct-graph/") !== 0) {
    showBanner("契约版本不符（需 deconstruct-graph/6），本页可能无法正确渲染。", true);
  }

  // ── 安全插值：一切模型/原文文本经 esc 后才进 DOM ──
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function el(tag, cls, parent) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (cls) e.setAttribute("class", cls);
    if (parent) parent.appendChild(e);
    return e;
  }
  function tx(parent, cls, x, y, text, anchor) {
    var t = el("text", cls, parent);
    t.setAttribute("x", x); t.setAttribute("y", y);
    if (anchor) t.setAttribute("text-anchor", anchor);
    t.textContent = text;
    return t;
  }

  var nodeById = {}, placeById = {}, eventById = {}, chapByNo = {};
  (DATA.nodes || []).forEach(function (n) { nodeById[n.id] = n; });
  (DATA.places || []).forEach(function (p) { placeById[p.id] = p; });
  (DATA.events || []).forEach(function (e) { eventById[e.id] = e; });
  (DATA.chapters || []).forEach(function (c) { chapByNo[c.no] = c; });
  var LAY = DATA.layout || {};
  var SCENE = LAY.scene || {};  // layout.net 仅供 图谱.svg 确定性渲染，关系网页签由库端布局

  var childrenOf = {};
  (DATA.places || []).forEach(function (p) {
    if (p.parent && placeById[p.parent]) (childrenOf[p.parent] = childrenOf[p.parent] || []).push(p.id);
  });
  var leafPlaces = (DATA.places || []).filter(function (p) { return !childrenOf[p.id]; });

  var ROLE_CLS = { "主角": "n-zj", "配角": "n-pj", "反派": "n-fp" };
  function clsOf(n) { return n.type === "faction" ? "n-fac" : n.type === "item" ? "n-item" : (ROLE_CLS[n.role] || "n-pj"); }
  function roleLabel(n) { return n.type === "faction" ? "组织" : n.type === "item" ? "物品" : (n.role || "人物"); }
  var state = { chap: 1, tab: "scene", topN: 0, sel: null };

  // ── 头部 ──
  document.title = "拆书知识图谱 · " + (DATA.book || "");
  var h1 = document.getElementById("booktitle");
  h1.appendChild(document.createTextNode("《" + String(DATA.book || "") + "》"));
  var sub = document.createElement("span");
  sub.className = "sub"; sub.textContent = "拆书知识图谱 · 四视图";
  h1.appendChild(sub);
  var st = DATA.stats || {};
  document.getElementById("statbadge").textContent =
    "共 " + (st.chapters || 0) + " 章 · " + (st.words || 0).toLocaleString() + " 字";
  var warns = (DATA.meta && DATA.meta.warnings) || [];
  var comp = (DATA.meta && DATA.meta.completion) || {};
  // 完成度恒显（评审 P2-3：零警告书也要看得到覆盖账）；警告明细条件展开
  var nWarn = 0;
  warns.forEach(function (w) { nWarn += (w.count || 1); });
  banner.style.display = "block";
  banner.appendChild(document.createTextNode(
    "图谱完成度：在场 " + (comp.presence_placed || 0) + "/" + (comp.presence_total || 0)
    + " 条已定位 · " + (warns.length ? "警告 " + warns.length + " 类（约 " + nWarn + " 处）" : "无警告")));
  if (warns.length) {
    var dets = document.createElement("details");
    var sum = document.createElement("summary"); sum.textContent = "查看明细";
    dets.appendChild(sum);
    warns.forEach(function (w) {
      var pl = document.createElement("div");
      pl.textContent = "· " + String(w.msg || w.kind || "");
      dets.appendChild(pl);
    });
    banner.appendChild(dets);
  }

  // ── 左栏：章链 ──
  var chapBox = document.getElementById("chapters");
  (DATA.chapters || []).forEach(function (c) {
    var row = document.createElement("div"); row.className = "trow";
    var dot = document.createElement("span"); dot.className = "dot";

  function paintNetFocus() {

  }
  function applyNetScope() {
    var ranked = CY.nodes().toArray().sort(function (a, b) { return b.data("rel") - a.data("rel"); });
    var keepSet = null;
    if (state.topN > 0) {
      keepSet = {};

    }
    CY.nodes().forEach(function (n) { n.toggleClass("hidden", !!keepSet && !keepSet[n.id()]); });
    CY.edges().forEach(function (e) {

  function runNetLayout(vis) {

  function netLabelAnchors() {

      var bw = Math.min(textW, 96), bh = textW > 96 ? 28 : 15;

        else if (prefs[k] === "left") { lh = "left"; box = { x1: p.x - r - bw, y1: p.y - bh / 2, x2: p.x - r, y2: p.y + bh / 2 }; }
        else if (prefs[k] === "bottom") { lv = "bottom"; box = { x1: p.x - bw / 2, y1: p.y + r, x2: p.x + bw / 2, y2: p.y + r + bh }; }
        else { lv = "top"; box = { x1: p.x - bw / 2, y1: p.y - r - bh, x2: p.x + bw / 2, y2: p.y - r }; }
        var clash = false;
        for (var j = 0; j < placed.length; j++) {
          var b2 = placed[j];
          if (box.x1 < b2.x2 + 2 && box.x2 > b2.x1 - 2 && box.y1 < b2.y2 + 2 && box.y2 > b2.y1 - 2) { clash = true; break; }
        }
        if (!clash) pick = { lh: lh, lv: lv, box: box };
      }
      if (!pick) pick = { lh: "center", lv: "bottom", box: { x1: p.x - bw / 2, y1: p.y + r, x2: p.x + bw / 2, y2: p.y + r + bh } };
      placed.push(pick.box);
      n.data("lh", pick.lh);
      n.data("lv", pick.lv);
    });
  }
  function netFallback() {
    document.getElementById("cy").style.display = "none";
    var box = document.getElementById("netfallback");
    box.style.display = "";
    var rows = (DATA.edges || []).map(function (e) {
      var a = nodeById[e.from], b = nodeById[e.to];
      if (!a || !b) return "";
      return '<div class="erow"><span class="k">' + esc(e.kind) + "</span><span><b>" + esc(a.label) +
        "</b>—<b>" + esc(b.label) + "</b>" +
        (e.quote ? ' <span class="q">「' + esc(e.quote) + '」</span>' : "") +
        '<span class="ev"> 第' + esc(e.ch) + "章</span></span></div>";
    }).join("");
    box.innerHTML = "<p>关系网画布不可用（渲染库未加载或初始化失败），以下为全部关系的文本清单；其余视图不受影响。</p>" +
      (rows || "<p>本书没有可展示的关系。</p>");
    document.getElementById("netwrap").setAttribute("data-fallback", "1");
  }
  function drawNet() {
    netAll = netBuild();
    document.getElementById("netfallback").style.display = "none";
    document.getElementById("cy").style.display = "";
    if (!CY) {
      try {
        if (!ensureCy()) throw new Error("cytoscape 未加载");
      } catch (e) {
        console.warn("关系网渲染库不可用，回落文本关系清单", e);
        CY = null;
        netFallback();
        return;
      }
    }
    try {
      CY.elements().remove();
      CY.add(netAll.nodes);
      CY.add(netAll.edges);
      netFocus = null;
      applyNetScope();
    } catch (e) {
      console.warn("关系网初始化失败，回落文本关系清单", e);
      try { if (CY) CY.destroy(); } catch (e2) {}
      CY = null;
      window.__net = null;  // 降级后调试口不得指向已销毁实例（评审 P3）
      netFallback();
    }
  }

  // ── 选择与侧栏 ──
  var side = document.getElementById("side");
  function navBind(root) {
    root.querySelectorAll("[data-nav-who]").forEach(function (el2) { el2.addEventListener("click", function () { selectWho(el2.getAttribute("data-nav-who")); }); });
    root.querySelectorAll("[data-nav-place]").forEach(function (el2) { el2.addEventListener("click", function () { selectPlace(el2.getAttribute("data-nav-place")); }); });
    root.querySelectorAll("[data-nav-chap]").forEach(function (el2) { el2.addEventListener("click", function () { selectChapter(parseInt(el2.getAttribute("data-nav-chap"), 10)); setTab("scene"); }); });
    root.querySelectorAll("[data-nav-ev]").forEach(function (el2) { el2.addEventListener("click", function () { selectEvent(el2.getAttribute("data-nav-ev")); }); });
  }
  function chipWho(id) { var n = nodeById[id]; return n ? '<span class="chip" data-nav-who="' + esc(id) + '">' + esc(n.label) + "</span>" : ""; }
  function chipPlace(id) { var p = placeById[id]; return p ? '<span class="chip loc" data-nav-place="' + esc(id) + '">📍' + esc(p.label) + "</span>" : ""; }
  function selectChapter(no) {
    state.chap = no;
    (DATA.chapters || []).forEach(function (c) { c.__row && c.__row.classList.toggle("on", c.no === no); });
    setTab(state.tab === "net" ? "scene" : state.tab);
    drawScene();
    renderChapterPanel(chapByNo[no]);
  }
  function renderChapterPanel(c) {
    if (!c) return;
    var rels = (DATA.edges || []).filter(function (e) { return (c.who || []).indexOf(e.from) >= 0 && (c.who || []).indexOf(e.to) >= 0; });
    var whereRows = (c.presence || []).map(function (p) {
      var n = nodeById[p.who]; if (!n) return "";
      var loc = p.where && placeById[p.where] ? placeById[p.where].label : "未知区（在场未定位）";
      return '<div class="erow" data-nav-who="' + esc(p.who) + '"><span class="k">' + esc(n.label) + "</span><span>在 <b>" + esc(loc) + "</b>" + (p.t ? '<span class="ev">（' + esc(p.t) + "线）</span>" : "") + "</span></div>";
    }).join("");
    side.innerHTML =
      "<h3>第" + esc(c.no) + '章<span class="rolechip rc-章">章</span></h3>' +
      '<p style="color:var(--fg)">' + esc(c.beat) + "</p>" +
      (c.ev && eventById[c.ev] ? '<div class="chips"><span class="chip ev" data-nav-ev="' + esc(c.ev) + '">⚡ 属「' + esc(eventById[c.ev].title) + "」（第" + esc(eventById[c.ev].ch[0]) + "-" + esc(eventById[c.ev].ch[1]) + "章）</span></div>" : "") +
      '<h3 class="sh">谁在哪儿（本章）</h3>' + (whereRows || '<p>本章无在场记录。</p>') +
      (rels.length ? '<h3 class="sh">本章可见关系</h3>' + rels.map(function (e) {
        return '<div class="erow"><span class="k">' + esc(e.kind) + "</span><span><b>" + esc(nodeById[e.from].label) + "—" + esc(nodeById[e.to].label) + "</b>" + (e.quote ? ' <span class="q">「' + esc(e.quote) + "」</span>" : "") + "</span></div>";
      }).join("") : "");
    navBind(side);
  }
  function selectWho(id) {
    var n = nodeById[id]; if (!n) return;
    state.sel = id;
    // 视图分工：场景视图下章链亮他出现的章；关系网不表达地点（足迹仅场景页签展示）
    (DATA.chapters || []).forEach(function (c) {
      if (c.__row) c.__row.classList.toggle("hl", (c.who || []).indexOf(id) >= 0);
    });
    (DATA.places || []).forEach(function (p) {
      if (!p.__row) return;
      var foot = (DATA.links || []).some(function (l) { return l.who === id && l.where === p.id; });
      p.__row.classList.toggle("hl", state.tab === "scene" && foot);
    });
    var rels = (DATA.edges || []).filter(function (e) { return e.from === id || e.to === id; });
    var foot = (DATA.links || []).filter(function (l) { return l.who === id; });
    var evs = (DATA.events || []).filter(function (e) { return (e.members || []).indexOf(id) >= 0; });
    var chaps = (DATA.chapters || []).filter(function (c) { return (c.who || []).indexOf(id) >= 0; });
    side.innerHTML =
      "<h3>" + esc(n.label) + '<span class="rolechip rc-' + esc(roleLabel(n)) + '">' + esc(roleLabel(n)) + "</span></h3>" +
      (n.alias && n.alias.length ? "<p>别名：" + esc(n.alias.join("、")) + "</p>" : "") +
      (n.bio ? "<p>" + esc(n.bio) + "</p>" : "") +
      '<h3 class="sh">出现的章</h3><div class="chips">' + (chaps.length ? chaps.map(function (c) { return '<span class="chip" data-nav-chap="' + esc(c.no) + '">第' + esc(c.no) + "章</span>"; }).join("") : '<span class="chip">无</span>') + "</div>" +
      (state.tab === "scene" && foot.length ? '<h3 class="sh">足迹（仅场景视图）</h3>' + foot.map(function (l) {
        var p = placeById[l.where]; if (!p) return "";
        return '<div class="erow" data-nav-place="' + esc(l.where) + '"><span class="k">' + esc(l.kind) + "</span><span><b>" + esc(p.label) + "</b>" + (l.quote ? ' <span class="q">「' + esc(l.quote) + "」</span>" : "") + '<span class="ev"> 第' + esc(l.ch) + "章</span></span></div>";
      }).join("") : "") +
      '<h3 class="sh">关系（每条带出处）</h3>' + (rels.length ? rels.map(function (e) {
        var other = nodeById[e.from === id ? e.to : e.from];
        if (!other) return "";
        return '<div class="erow" data-nav-who="' + esc(other.id) + '"><span class="k">' + esc(e.kind) + "</span><span><b>" + esc(other.label) + "</b>" + (e.quote ? ' <span class="q">「' + esc(e.quote) + "」</span>" : "") + '<span class="ev"> 第' + esc(e.ch) + "章</span></span></div>";
      }).join("") : "<p>无记录。</p>") +
      '<h3 class="sh">卷入事件</h3>' + (evs.length ? evs.map(function (e) {
        return '<div class="erow" data-nav-ev="' + esc(e.id) + '"><span class="k">' + esc(e.title) + '</span><span>第' + esc(e.ch[0]) + "-" + esc(e.ch[1]) + "章</span></div>";
      }).join("") : "<p>无记录。</p>");
    navBind(side);
  }
  function selectPlace(id) {
    var p = placeById[id]; if (!p) return;
    var scope = {}; scope[id] = true;
    var changed = true, guard = 0;
    while (changed && guard++ < 30) {
      changed = false;
      (DATA.places || []).forEach(function (x) { if (x.parent && scope[x.parent] && !scope[x.id]) { scope[x.id] = true; changed = true; } });
    }
    (DATA.places || []).forEach(function (x) { x.__row && x.__row.classList.toggle("hl", !!scope[x.id]); });
    var links = (DATA.links || []).filter(function (l) { return scope[l.where]; });
    var chaps = (DATA.chapters || []).filter(function (c) {
      return (c.at || []).some(function (a) { return scope[a]; }) || (c.presence || []).some(function (pp2) { return pp2.where && scope[pp2.where]; });
    });
    var chain = [], cur = p, g2 = 0;
    while (cur && g2++ < 20) { chain.unshift(cur.label); cur = cur.parent && placeById[cur.parent]; }
    var crumb = chain.map(function (x, i) { return i === chain.length - 1 ? "<b>" + esc(x) + "</b>" : esc(x); }).join(" ▸ ");
    side.innerHTML =
      "<h3>" + esc(p.label) + '<span class="rolechip rc-地点">地点</span></h3>' +
      '<p class="crumb">' + crumb + "</p>" +
      (p.note ? "<p>" + esc(p.note) + "</p>" : "") +
      '<h3 class="sh">章链到此地</h3><div class="chips">' + (chaps.length ? chaps.map(function (c) { return '<span class="chip" data-nav-chap="' + esc(c.no) + '">第' + esc(c.no) + "章</span>"; }).join("") : '<span class="chip">无</span>') + "</div>" +
      '<h3 class="sh">此地之人（' + links.length + "）</h3>" + (links.length ? links.map(function (l) {
        var n = nodeById[l.who]; if (!n) return "";
        return '<div class="erow" data-nav-who="' + esc(l.who) + '"><span class="k">' + esc(l.kind) + "</span><span><b>" + esc(n.label) + "</b>" + (l.quote ? ' <span class="q">「' + esc(l.quote) + "」</span>" : "") + '<span class="ev"> 第' + esc(l.ch) + "章</span></span></div>";
      }).join("") : "<p>暂无记录。</p>");
    navBind(side);
  }
  function selectEvent(id) {
    var e = eventById[id]; if (!e) return;
    var p = e.at && placeById[e.at];
    side.innerHTML =
      "<h3>" + esc(e.title) + "</h3>" +
      '<div class="chips"><span class="chip">第' + esc(e.ch[0]) + "-" + esc(e.ch[1]) + "章</span>" + (p ? '<span class="chip loc" data-nav-place="' + esc(p.id) + '">📍 ' + esc(p.label) + "</span>" : "") + "</div>" +
      (e.note ? "<p>" + esc(e.note) + "</p>" : "") +
      '<h3 class="sh">参与</h3><div class="chips">' + (e.members || []).map(chipWho).join("") + "</div>";
    navBind(side);
  }
  function renderHome() {
    var persons = (DATA.nodes || []).filter(function (n) { return n.type === "person"; }).length;
    var facs = (DATA.nodes || []).filter(function (n) { return n.type === "faction"; }).length;
    var items = (DATA.nodes || []).filter(function (n) { return n.type === "item"; }).length;
    side.innerHTML =
      "<h3>本书书眼</h3>" +
      '<div class="chips"><span class="chip">共 ' + esc((DATA.stats || {}).chapters || 0) + " 章</span><span class=\"chip\">" + esc(((DATA.stats || {}).words || 0).toLocaleString()) + " 字</span></div>" +
      (DATA.logline ? "<p>" + esc(DATA.logline) + "</p>" : "") +
      '<h3 class="sh">一眼三问</h3>' +
      "<p><b>在哪</b>：左栏地点树 " + (DATA.places || []).length + " 处<br>" +
      "<b>有谁</b>：" + persons + " 人 · " + facs + " 势力 · " + items + " 物，" + (DATA.edges || []).length + " 条关系条条带出处<br>" +
      "<b>发生了啥</b>：底轴 " + (DATA.events || []).length + " 段主线 · " + (DATA.hooks || []).length + " 枚伏笔</p>" +
      '<h3 class="sh">怎么用</h3><p>场景页签看\u201c谁在哪儿干什么\u201d（点人＝同步亮章链）；关系网页签点人只亮关系圈（不涉地点）；点地点＝聚焦此地之人与章；Esc 回本书书眼面板。</p>';
  }

  // ── 底部：时间轴＋伏笔 ──
  function renderTimeline() {
    var CH = (DATA.stats || {}).chapters || 0;
    var ruler = document.getElementById("ruler");
    while (ruler.firstChild) ruler.removeChild(ruler.firstChild);
    for (var i = 1; i <= CH; i++) {
      var s = document.createElement("span"); s.textContent = String(i); ruler.appendChild(s);
    }
    var rows = document.getElementById("evrows");
    while (rows.firstChild) rows.removeChild(rows.firstChild);
    (DATA.events || []).forEach(function (e) {
      var d = document.createElement("div"); d.className = "evrow";
      var lab = document.createElement("span"); lab.className = "lab";
      lab.textContent = e.title + (e.at && placeById[e.at] ? " 📍" + placeById[e.at].label : "");
      lab.addEventListener("click", function () { selectEvent(e.id); });
      var bar = document.createElement("div"); bar.className = "evbar";
      bar.style.left = (((e.ch[0] - 1) / CH) * 100) + "%";
      bar.style.width = (((e.ch[1] - e.ch[0] + 1) / CH) * 100) + "%";
      bar.textContent = e.title;
      bar.addEventListener("click", function () { selectEvent(e.id); });
      d.append(lab, bar);
      rows.appendChild(d);
    });
    var hooks = document.getElementById("hooks");
    while (hooks.firstChild) hooks.removeChild(hooks.firstChild);
    (DATA.hooks || []).forEach(function (h) {
      var s = document.createElement("span");
      s.className = "hook" + (h.status === "已收" ? " closed" : "");
      s.textContent = "伏笔 · " + h.desc + "〔埋第" + h.plant + "章" + (h.payoff ? " · 收第" + h.payoff + "章" : " · 未收") + "〕";
      hooks.appendChild(s);
    });
  }

  document.getElementById("prev").addEventListener("click", function () { selectChapter(Math.max(1, state.chap - 1)); });
  document.getElementById("next").addEventListener("click", function () {
    selectChapter(Math.min((DATA.stats || {}).chapters || 1, state.chap + 1));
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { clearNetFocus(); renderHome(); }
  });

  renderHome();
  selectChapter(1);
  setTab("scene");
})();
</script>
</body>
</html>
