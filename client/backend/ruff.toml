# ruff configuration for AI Novel backend
target-version = "py312"

[lint]
# B008 — FastAPI Depends() in default argument is the standard framework pattern
# ASYNC230 — blocking calls in async functions; we accept this in startup/shutdown
# RUF100 — ruff 0.16 默认不启用 E402，测试文件「env 先于 import」的
# # noqa: E402 会被判 unused；保留 noqa 作未来口径防御，忽略此告警
# DTZ — 全仓拍板「naive UTC 存储 + 前端上海展示」（PR #267），naive now() 是既定口径非缺陷
ignore = ["B008", "ASYNC230", "RUF100", "DTZ"]

# Per-file: broad exception catches are intentional
[lint.per-file-ignores]
"main.py" = ["BLE001", "S110"]
"auth_local/*.py" = ["BLE001"]
"backup/*.py" = ["BLE001"]
"backup/importer.py" = ["BLE001"]
"settings/*.py" = ["BLE001"]
"story/*.py" = ["BLE001", "S110"]
"projects/*.py" = ["BLE001", "S110"]
"novels/*.py" = ["BLE001", "S110", "S112"]
"workflow/*.py" = ["BLE001", "S110"]
# genres/*：story.yaml 缺失/损坏不阻断题材读取（注入要与简介同族读文件）
"genres/*.py" = ["BLE001", "S110"]
"tests/*.py" = ["BLE001", "S112"]
