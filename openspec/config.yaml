schema: spec-driven

# 项目上下文：任何 explore/propose/apply/archive 的 AI 都会先读到这一段。
context: |
  单用户桌面 AI 长篇小说应用「爱小说」（C端，本仓）：
    - client/frontend = React 19 + Vite + TS（HashRouter），屏为书架/工作台/设定/AI 四域。
  视觉基因：oklch 令牌与语义组件类定义在 src/design/base.css。
  ⚠ 拆仓注记（s-server-repo-split，2026-10）：S端（Vue 3 控制台/落地页）已迁独立
  私有仓（仓名不入库，本地检出路径由 S_SERVER_DIR 指定）；两端共用同一套视觉基因，
  基础段系逐字移植；
  Tailwind 不做视觉决策；图标唯一来源是各端注册表（client src/components/icons.tsx ·
  server src/components/ui/icons.ts），公共键 path 必须一致。

  设计事实源（改任何界面都要经过；标准唯一住在 docs/ux，design-c 只是运行资产）：
    - 标准正文 docs/ux/design-language.html —— §5 状态语言总表 / §6 组件词汇 /
      （S端 对应词汇表在 S端 私有仓，跨端对拍脚本 design-cross.mjs 需双 checkout——S_SERVER_DIR 指向该检出，在本地跑）
      §11 门控 / §12 删除分级 / §13 文案术语；docs/ux/uikit/ 可搬运候选组件
    - 全端裁决 docs/ux/cross-end.html —— 三层契约（L1 令牌与基础类逐字同 /
      L2 语义类同名同义 / L3 业务层白名单）、8 处漂移裁决、迁移映射表、仲裁规则
      （两端取值冲突时，以受 parity 门禁约束的 C端 为准）
    - 机器强制层：client/frontend 与 server/frontend 各自的 scripts/design-vocab.mjs，
      禁令两端同源；任何档位/任意值变更由标准正文派生，两端同批修改
    - 运行资产 docs/design-c/prototypes/*.html + prototypes/ADJUSTMENTS.md —— C端 像素
      parity 基线与偏差登记簿；S端 无原型基线，用两端渲染截图对照作为一致性证据

  硬性流程（任何用户可见改动）：
    1. 先改原型 prototypes/<screen>.html 并在 ADJUSTMENTS.md 登记每处偏差原因（仅 C端 需要；
       纯 S端 改动免原型，但要在 change 目录附截图对照）。
    2. 再改实现 src/；触碰两端共享段（base.css 令牌与基础组件类、pill/notice/sk/panel/f-err 家族）
       的必须双端同一次提交内同步落笔。
    3. 门禁按受影响端执行：各端 npm run design:lint → C端 npm run design:check 全绿（像素差 <0.2%）
       → 双端 tsc／vue-tsc --noEmit → 相关 e2e 更新后通过；
       触共享段时另跑 scripts/design-cross.mjs（脚本建基线前在回归小节注明「cross 校验待建」）。

rules:
  proposal:
    - 凡含用户可见界面改动的 proposal 必须包含「## Design Impact」段：写出受影响端（C端／S端／双端）、
      受影响的屏/弹层清单、用到或新增的对象状态（对照状态语言总表）、是否触碰两端共享段、
      是否需要原型先行、以及由谁产出设计工件（实现侧自查 or 设计侧会话）。
    - 用户可见文案遵循 design-language.html §13 口径：按钮词必须是动词、不出现内部术语（门控/就绪度/SSE 等）、
      补救语句必须带一个可点击出口。
    - 组件语气词表全站固定为 info、ok、warn、err——提示条（notice）、徽标（pill）、toast 一律用它，
      不得引入 success、danger 作为提示语气，不得新增 .b、.strip 或第四种胶囊形态；
      确需例外必须在 proposal 单列登记条目说明理由。
    - "Capabilities 段：改动落在令牌档位、组件词汇或状态语言上时，声明 Modified: design-system。"
  tasks:
    - UI 变更的第一个任务固定为「原型先行」：列出要改的 prototype 文件与 ADJUSTMENTS.md 待登记项
      （纯 S端 且不触共享段的改动可改为「双端影响判定」任务替代）。
    - 涉及共享段或跨端同名类的变更必须包含双端同改任务，回归里给出
      「node scripts/design-cross.mjs」的实际结论；单端不触共享段的要引用 proposal 里 Design Impact 的判定依据。
    - 「回归」小节必须给出门禁命令的实际输出结论：受影响端 npm run design:lint ／
      C端 npm run design:check ／ 双端 tsc 或 vue-tsc --noEmit ／ 触共享段时的 design-cross 结论。
    - 不允许引入词汇表之外的裸 hex、emoji 图形、未登记字号档位；确有必要的，单列一条登记任务而不是顺手内联。

operations:
  apply:
    guidance:
      - 动手前先核对对应原型已经更新且 ADJUSTMENTS.md 有登记；proposal 里声明了设计侧产出但工件尚未落地的，
        停下来向用户索取，不要凭空脑补视觉。
      - 共享段的编辑两端同批进行；取值分歧按仲裁规则以 C端 为准，S端 要保留差异必须在 change 里登记理由，
        否则视为漂移缺陷而不是个性定制。
      - 每个 UI 任务的完成证据 = 门禁输出摘要（design:check 各场景像素差百分比、design:cross 是否零差异）
        + 对照截图路径，追加在该 checkbox 下。
  archive:
    guidance:
      - 归档时把本次新增/改变的状态语义回填两端 scripts/design-vocab.mjs（同批），并核对
        docs/ux/design-language.html 对应小节仍与其一致；引入全新形态时先升格标准再归档。
      - 本次用到的组件若出自 docs/ux/uikit 候选集，在 uikit/README.md 映射表标注「已收编 + 收编位置」。
      - 本次若更名/新增共享类或语气档位，回填 docs/ux/cross-end.html 的漂移裁决表与迁移映射表状态，
        并核对两端图标注册表公共键 path 未分叉。
      - 若 Capability 属 design-system，同步核对该 spec 与原型基线仍一致。
