<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星海拾遗 · 卷下拆章（一章一章拆） — 爱小说</title>
<style>
  /* 绑定 docs/ux/design-language.html v2.1 令牌，与 design-c 原型同源 */
  :root{
    --bg:      oklch(98% 0.004 240);
    --surface: oklch(100% 0 0);
    --fg:      oklch(20% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.006 240);
    --accent:  oklch(48% 0.11 170);
    --accent-strong:oklch(41% 0.10 170);
    --accent-soft:color-mix(in oklch,var(--accent) 12%,transparent);
    --accent-faint:color-mix(in oklch,var(--accent) 6%,transparent);
    --ok:oklch(52% 0.11 155);--ok-soft:color-mix(in oklch,var(--ok) 14%,transparent);
    --warn:oklch(50% 0.13 75);--warn-soft:color-mix(in oklch,var(--warn) 16%,transparent);
    --err:oklch(50% 0.17 25);--err-soft:color-mix(in oklch,var(--err) 12%,transparent);
    --on-accent:oklch(100% 0 0);
    --fg-soft:color-mix(in oklch,var(--fg) 5%,transparent);
    --shadow-card:0 1px 2px color-mix(in oklch,var(--fg) 5%,transparent),
                  0 12px 32px -12px color-mix(in oklch,var(--fg) 14%,transparent);
    --shadow-pop:0 18px 50px -12px color-mix(in oklch,var(--fg) 26%,transparent);
    --accent-ink:var(--accent-strong);
    --hl:var(--fg-soft);
    --faint:color-mix(in oklch,var(--muted) 45%,var(--bg));
    --font-display:'Noto Serif SC','Songti SC','STSong','Iowan Old Style',Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,'JetBrains Mono',monospace;
    --radius:10px;--radius-lg:16px;--radius-sm:7px;--radius-pill:999px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.6;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  p{margin:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── 工作台壳层 appbar 48 / modnav 44（书名与当前主线并入顶栏，省出一整条给正文） ── */
  .appbar{position:sticky;top:0;z-index:32;min-height:48px;height:48px;flex:none;display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--surface);border-bottom:1px solid var(--border)}
  .logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.08em;white-space:nowrap;color:var(--fg);background:none;border:0;padding:5px 9px;margin-left:-9px;border-radius:8px}
  .logo:hover{background:var(--fg-soft)}
  .logo:active{background:var(--border)}
  .logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-size:14px;flex:none}
  .appbar .sep{width:1px;height:20px;background:var(--border);margin:0 2px;flex:none}
  .appbar .spacer,.modnav .spacer{flex:1}
  .acct{display:inline-flex}
  .acct-trigger{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--fg);font-size:12.5px}
  .acct-trigger:hover{border-color:var(--accent)}
  .acct-trigger .caret{width:14px;height:14px;color:var(--muted)}
  .avatar{width:24px;height:24px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
  .badge-accent{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11px;line-height:1.6;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}

  .novel-title{font-family:var(--font-display);font-size:15.5px;font-weight:600;white-space:nowrap;flex:none}
  .genre-tag{display:inline-flex;align-items:center;padding:2px 9px;border:1px solid var(--border);border-radius:999px;font-size:11.5px;color:var(--muted);background:var(--surface);white-space:nowrap}
  .pill-pro{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em}
  .pill-pro svg{width:11px;height:11px}

  /* 顶栏右段：当前主线定位（优先级 1） */
  .bar-here{display:flex;align-items:center;gap:11px;flex:1 1 auto;min-width:0}
  .bh-k{flex:none;margin:0;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--accent)}
  .bh-rule{width:1px;height:15px;background:var(--border);flex:none}
  .bh-t{flex:0 1 auto;min-width:0;margin:0;font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bh-t .n{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-right:7px}
  .bh-prog{display:flex;align-items:center;gap:9px;flex:none;width:168px}
  .bh-vol{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .bh-prog .prog-bar{flex:1}

  .modnav{position:sticky;top:48px;z-index:30;flex:none;display:flex;align-items:center;gap:4px;height:44px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .mtab{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:9px;font-size:13.5px;color:var(--muted);border:0;background:none}
  .mtab:hover{color:var(--fg);background:var(--fg-soft)}
  .mtab.on{color:var(--accent);background:var(--accent-soft);font-weight:500}
  .mtab[aria-disabled="true"],.mtab[aria-disabled="true"]:hover{color:var(--faint);background:none;cursor:default}
  .mtab .cnt{font-family:var(--font-mono);font-size:11px;letter-spacing:.02em}
  .mtab.on .cnt{color:var(--accent)}
  .modnav .side{font-size:12px;color:var(--muted)}

  /* ── buttons ── */
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;line-height:1;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:var(--radius);padding:9px 15px;transition:background .14s,border-color .14s,color .14s,transform .05s}
  .btn:hover{border-color:var(--fg)}
  .btn:active{transform:translateY(1px)}
  .btn-sm{padding:7px 11px;font-size:12.5px}
  .btn-ink{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
  .btn-ink:hover{background:color-mix(in oklch,var(--fg) 86%,var(--muted));border-color:color-mix(in oklch,var(--fg) 86%,var(--muted));color:var(--bg)}
  .btn-accent{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--surface);font-weight:600}
  .btn-accent:hover{background:color-mix(in oklch,var(--accent-ink) 84%,black);border-color:color-mix(in oklch,var(--accent-ink) 84%,black);color:var(--surface)}
  .btn-quiet{border-color:transparent;background:none;color:var(--muted);padding:8px 10px}
  .btn-quiet:hover{color:var(--fg);background:var(--hl);border-color:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn:disabled:hover{border-color:var(--border)}

  /* ── 三栏工作台 ── */
  .work{display:grid;grid-template-columns:272px minmax(0,1fr) 264px;height:calc(100vh - 92px);min-height:560px}

  /* 左栏：章节目录 */
  .col-tree{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface)}
  .prog-bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
  .prog-bar span{display:block;height:100%;background:var(--fg);border-radius:3px}
  .tree-tools{flex:none;padding:12px 15px;border-bottom:1px solid var(--border)}
  .toc-search{display:flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;background:var(--bg)}
  .toc-search:focus-within{border-color:var(--accent)}
  .toc-search svg{width:14px;height:14px;color:var(--faint);flex:none}
  .toc-search input{border:0;background:none;font:inherit;font-size:13px;color:var(--fg);width:100%}
  .toc-search input::placeholder{color:var(--faint)}
  .tree-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
  .toc-count{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .rail-jump{background:none;border:0;padding:0;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);border-bottom:1px solid transparent}
  .rail-jump:hover{color:var(--fg);border-bottom-color:var(--fg)}
  .toc{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:1px;padding:9px 8px 22px}
  .toc-empty{color:var(--muted);font-size:12.5px;padding:14px 6px}
  .volgrp{display:flex;flex-direction:column;gap:1px}
  .volgrp+.volgrp{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
  .volgrp-head{display:flex;align-items:center;gap:2px;border-radius:var(--radius);color:var(--muted);font-size:12.5px}
  .volgrp-head:hover{background:var(--hl)}
  .volgrp-head.on{color:var(--fg);font-weight:600}
  .volgrp-head.current:not(.on){color:var(--fg)}
  .volgrp-head.sel{background:var(--accent-soft)}
  .volgrp-head.sel .vg-name{color:var(--fg);font-weight:600}
  .vg-chev{background:none;border:0;display:flex;align-items:center;padding:9px 2px 9px 6px;color:inherit;flex:none}
  .volgrp-head .chev{font-family:var(--font-mono);font-size:9px;color:var(--faint);transition:transform .15s}
  .volgrp-head.on .chev{transform:rotate(90deg)}
  .vg-name{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:9px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vg-name:hover{text-decoration:underline}
  .volgrp-head .range{margin-left:auto;font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--faint);flex:none;padding:0 7px 0 4px}
  .trow{display:grid;grid-template-columns:26px minmax(0,1fr) 12px;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:var(--radius);padding:7px 8px;color:var(--fg);font-size:13.5px}
  .trow:hover{background:var(--hl)}
  .trow.sel{background:var(--accent-soft)}
  .trow.sel .ttl{font-weight:600}
  .trow.sel .tdot{background:var(--accent);border-color:var(--accent)}
  .trow .tno{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .trow .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .tdot{justify-self:end;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);background:var(--muted)}
  .trow[data-status="draft"] .tdot{background:var(--bg);border-width:2.5px;border-color:var(--fg)}
  .trow[data-status="pending"] .tdot{background:transparent;border-style:dashed;border-color:var(--muted)}
  .trow[data-status="planned"] .tdot{background:var(--bg);border-color:var(--accent)}
  .trow.pending{color:var(--muted)}
  .trow.has-j{grid-template-columns:26px minmax(0,1fr) auto 12px}
  .trow .tj{justify-self:end;font-family:var(--font-mono);font-size:9.5px;line-height:1;letter-spacing:.04em;color:var(--warn);background:color-mix(in oklch,var(--warn) 12%,var(--bg));border:1px solid color-mix(in oklch,var(--warn) 34%,var(--border));border-radius:999px;padding:2px 6px;white-space:nowrap}
  .trow.pending .ttl{font-family:var(--font-mono);font-size:12px}
  .tree-add{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:11px 8px 12px;border-top:1px solid var(--border);background:var(--surface)}
  .add-btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:none;border:1px dashed var(--border);border-radius:var(--radius);padding:8px 10px;font-size:12px;color:var(--muted)}
  .add-btn:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
  .trow-ghost{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;border-left:2px dashed var(--border);
    margin-left:15px;width:calc(100% - 15px);padding:6px 8px;border-radius:0 var(--radius) var(--radius) 0;color:var(--muted);font-size:12.5px}
  .trow-ghost:hover{background:var(--hl);color:var(--fg);border-left-color:var(--muted)}
  .trow-ghost.sel{background:var(--accent-soft);color:var(--fg);border-left-color:var(--fg)}
  .trow-ghost .tno{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);flex:none}
  .trow-ghost .ttl2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow-ghost .gm2{margin-left:auto;font-family:var(--font-mono);font-size:9.5px;color:var(--faint);flex:none}

  /* 中栏：编辑窗口 */
  .col-editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
  .e-head{flex:none;padding:16px 22px 13px;border-bottom:1px solid var(--border)}
  .e-kicker{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .e-title{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.012em;margin:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .e-title .n{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--muted)}
  .e-outline{margin-top:9px;font-size:13px;color:var(--muted);max-width:74ch}
  .e-outline em{font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--faint);margin-right:6px}
  .e-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .e-toolbar{flex:none;display:flex;align-items:stretch;flex-wrap:wrap;gap:0 12px;padding:0 14px;border-bottom:1px solid var(--border);background:color-mix(in oklch,var(--bg) 55%,var(--surface))}
  .e-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;align-self:center;margin-left:auto;padding:7px 0}
  .e-actions .tip{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .e-note{align-self:center;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
  .e-scroll{flex:1 1 auto;min-height:0;overflow:auto}
  .e-pad{padding:18px 22px 24px}
  .e-empty{padding:64px 26px;color:var(--muted);font-size:13.5px;text-align:center}
  .e-empty .be-k{margin:0 0 8px;font-family:var(--font-display);font-size:19px;color:var(--ink)}
  .e-empty .be-t{margin:0 auto 20px;max-width:380px;line-height:1.7}
  .e-empty .be-acts{margin:0;display:flex;gap:10px;justify-content:center}

  .vtabs{display:flex;flex-wrap:wrap;min-width:0}
  .vtab{background:none;border:0;border-bottom:2px solid transparent;padding:11px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
  .vtab:hover{color:var(--fg)}
  .vtab.on{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}

  .outline-box{font-family:var(--font-display);font-size:16px;line-height:1.8;color:var(--fg);max-width:66ch;padding:15px 17px;border:1px solid var(--border);border-radius:var(--radius);background:color-mix(in oklch,var(--bg) 55%,var(--surface))}
  .outline-box-empty{border-style:dashed;color:var(--muted);font-size:14px;background:none}
  .pos-line{display:flex;flex-wrap:wrap;gap:10px 30px;max-width:76ch}
  .pos-line .pos{display:flex;flex-direction:column;gap:3px;min-width:0}
  .pos-line .pos em{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .pos-line .pos b{font-size:12.5px;font-weight:500;color:var(--fg)}
  .edit-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px}
  .ol-top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:9px 12px;flex-wrap:wrap;
    margin:-18px -22px 10px;padding:11px 22px;background:var(--surface);border-bottom:1px solid var(--border)}
  .ol-top .req-line{flex:1 1 auto;max-width:76ch;margin:0;padding:0;border:0;background:none}
  .ol-top>.note{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
  .ol-top .push,.edit-bar .push{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .op-list{max-width:76ch}
  .op{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--border)}
  .op:last-child{border-bottom:0}
  .op-main{min-width:0}
  .op-t{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--fg)}
  .op-d{margin:0;max-width:54ch;font-size:12.5px;line-height:1.7;color:var(--muted)}
  .op>.btn{flex:none;align-self:center}
  .op-wb{margin-top:11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:11px 13px;max-width:54ch}
  .op-wb-h{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  /* 归档后的后台任务：归档即刻生效，AI 的总结与写回提案在后台跑 */
  .tk-lead{margin:0 0 9px;font-size:12px;line-height:1.7;color:var(--muted)}
  .tk-plan{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
  .tk-plan li{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 9px}
  .tk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 0;font-size:12px;line-height:1.6}
  .tk+.tk{border-top:1px solid var(--border)}
  .tk-t{color:var(--fg)}
  .tk-n{grid-column:1 / -1;margin:0;font-size:11.5px;line-height:1.65;color:var(--muted)}
  .tk-n.tk-p{color:var(--fg-soft)}
  .tk-n b{margin-right:5px;color:var(--fg);font-weight:600}
  .tk-s{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap;align-self:start}
  .tk-s.run{color:var(--accent-strong);border-color:color-mix(in oklch,var(--accent) 38%,var(--border))}
  .tk-s.review{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 38%,var(--border))}
  .tk-s.ok{color:var(--ok);border-color:color-mix(in oklch,var(--ok) 34%,var(--border))}
  .tk-s.fail{color:var(--warn);border-style:dashed}
  .tk-act{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
  .tk-closure{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:9px;margin-bottom:9px;border-bottom:1px solid var(--border)}
  .tk-closure.done{padding-bottom:0;margin-bottom:0;border-bottom:0}
  .tkc-t{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--fg)}
  .tkc-t.ok{color:var(--ok)}
  .tkc-n{font-size:11.5px;color:var(--muted)}
  .tkc-p{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;line-height:1;padding:3px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
  .tkc-p.run{color:var(--accent-strong);border-color:color-mix(in oklch,var(--accent) 38%,var(--border))}
  .tkc-p.review{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 38%,var(--border))}
  .tkc-p.fail{color:var(--warn);border-style:dashed}
  .tk-closure .btn{margin-left:auto}
  /* ── 完本检查 / 全书收尾 ── */
  .fin-sec{display:flex;flex-direction:column;margin-top:6px}
  .fin-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
  .fin-ico{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:1px;border:1px solid var(--border);color:var(--muted)}
  .fin-ico.ok{background:color-mix(in oklch,var(--ok) 13%,var(--bg));border-color:color-mix(in oklch,var(--ok) 42%,var(--border));color:var(--ok)}
  .fin-ico.warn{background:color-mix(in oklch,var(--warn) 13%,var(--bg));border-color:color-mix(in oklch,var(--warn) 42%,var(--border));color:var(--warn)}
  .fin-t{flex:1 1 auto;min-width:0}
  .fin-t b{font-size:13.5px;font-weight:600}
  .fin-t p{margin:3px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
  .fin-hooks{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .fin-hook{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;background:var(--surface);color:var(--fg);font:inherit;font-size:12.5px}
  .fin-hook:hover{border-color:var(--muted)}
  .fin-hook.on{border-color:color-mix(in oklch,var(--accent) 42%,var(--border));background:var(--accent-faint)}
  .fin-hook .mk{flex:none;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 8px}
  .fin-hook.on .mk{color:var(--accent-strong);border-color:color-mix(in oklch,var(--accent) 45%,var(--border))}
  .fin-hook .nm{font-weight:600}
  .fin-hook .from{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .fin-done{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in oklch,var(--accent) 40%,var(--border));background:var(--accent-faint);border-radius:var(--radius);padding:13px 14px;margin-top:13px}
  .fin-done b{font-size:13.5px}
  .fin-done p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
  .fin-jobs{margin-top:13px}
  /* 结构化字段：卷纲 / 章纲 */
  .fro{display:flex;flex-direction:column;gap:5px;padding:12px 0;border-bottom:1px solid color-mix(in oklch,var(--border) 55%,transparent);max-width:76ch}
  .fro:last-child{border-bottom:0}
  .fro>em{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .fro>em .req{color:var(--accent);margin-left:5px}
  .fro>p{margin:0;font-size:13.5px;line-height:1.75;color:var(--fg)}
  .fro>p.lead{font-family:var(--font-display);font-size:16.5px;line-height:1.85}
  .fro .none{color:var(--faint);font-size:12.5px}
  .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 30px;max-width:76ch}
  .fgrid .fro{max-width:none}
  .fgrid .fro.wide{grid-column:1 / -1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:color-mix(in oklch,var(--bg) 60%,var(--surface))}
  .src-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px;padding:9px 12px;border:1px solid color-mix(in oklch,var(--border) 60%,transparent);border-radius:6px;background:color-mix(in oklch,var(--surface) 55%,var(--bg))}
  .src-chips>em{font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .flist{margin:0;padding:0;list-style:none;max-width:76ch}
  .flist li{position:relative;padding:5px 0 5px 15px;font-size:13px;line-height:1.7;color:var(--fg)}
  .flist li:before{content:'';position:absolute;left:2px;top:13px;width:4px;height:4px;border-radius:50%;background:var(--faint)}
  .node{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid color-mix(in oklch,var(--border) 50%,transparent)}
  .node:last-child{border-bottom:0}
  .node .stg{flex:none;min-width:66px;text-align:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:3px 7px;white-space:nowrap}
  .node p{margin:0;font-size:13px;line-height:1.7;color:var(--fg)}
  .box-sm{padding:8px 10px;font-size:12.5px}
  .lbl{display:block;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .rowx{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid color-mix(in oklch,var(--border) 45%,transparent)}
  .rowx:last-child{border-bottom:0}
  .rowx .num{flex:none;width:22px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--faint);padding-top:9px}
  .rowx .cols{flex:1;min-width:0;display:grid;gap:9px}
  .rowx .cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rowx .cols.cn{grid-template-columns:142px minmax(0,1fr)}
  .rowx .cols .lbl{margin-bottom:4px}
  .rowx label{display:block;min-width:0}
  .rowx .cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rowx .cols.c3n{grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px}
  .rowx .cols .span{grid-column:1 / -1}
  .rowx .xbtn{flex:none;align-self:center}
  .cfgset{max-width:76ch}
  .cfgset>summary{cursor:pointer;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:13px 0 9px;list-style:none}
  .cfgset>summary::-webkit-details-marker{display:none}
  .cfgset>summary:hover{color:var(--fg)}
  .cfgset>summary:before{content:'＋';display:inline-block;width:14px;color:var(--faint)}
  .cfgset[open]>summary:before{content:'－'}
  .cfgset[open]>summary{border-bottom:1px solid var(--border);margin-bottom:4px}
  .cfgset[open]>summary:hover{color:var(--muted)}
  .cfgset>summary .req{color:var(--accent);margin-left:4px;letter-spacing:0;text-transform:none}
  .req-line{display:flex;flex-wrap:wrap;align-items:center;gap:7px;max-width:76ch;margin:0 0 2px;padding:9px 12px;border:1px solid var(--border);border-radius:5px;background:color-mix(in oklch,var(--accent) 4%,var(--surface));font-size:12px;color:var(--muted)}
  .req-line b{font-family:var(--font-mono);color:var(--fg)}
  .req-line .ok{color:var(--accent-strong);font-weight:600}
  .req-line .warn{color:var(--fg);opacity:.72}
  .req-line .sep{color:var(--faint)}
  .fro .box-sm,.rowx .box-sm{width:100%}

  .prose{font-family:var(--font-display);font-size:15.5px;line-height:1.85;max-width:64ch}
  .prose p+p{margin-top:11px}
  .prose blockquote{margin:13px 0;padding:5px 0 5px 15px;border-left:2px solid var(--border);color:var(--muted)}
  .prose .scene{margin:16px 0;text-align:center;color:var(--muted);letter-spacing:.5em;font-size:11.5px}
  .prompt{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--fg);max-width:82ch}
  .vempty{color:var(--muted);font-size:13px}

  /* ── 正文富文本编辑器 + 格式条 ── */
  .ms-edit{font-family:var(--font-display);font-size:16px;line-height:1.9;max-width:66ch;min-height:380px;
    border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:24px 28px}
  .ms-edit:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .ms-edit p{margin:0}
  .ms-edit p+p{margin-top:12px}
  .ms-edit:empty::before{content:attr(data-ph);color:var(--muted)}
  .ms-edit blockquote{margin:14px 0;padding:5px 0 5px 16px;border-left:2px solid var(--border);color:var(--muted)}
  .ms-edit .scene{margin:18px 0;text-align:center;color:var(--muted);letter-spacing:.5em;font-size:11.5px}
  .fmt-bar{display:flex;align-items:center;gap:4px;margin:0 0 12px;padding:5px;max-width:66ch;
    border:1px solid var(--border);border-radius:var(--radius);background:var(--bg)}
  .fmt{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:30px;padding:0 10px;
    font:inherit;font-size:12.5px;color:var(--fg);background:none;border:1px solid transparent;border-radius:6px}
  .fmt:hover{background:var(--fg-soft);border-color:var(--border)}
  .fmt:active{background:var(--border)}
  .fmt-sep{width:1px;height:18px;background:var(--border);margin:0 4px}
  .fmt-note{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted)}

  /* ── 提示词：按【小节】排版的文档视图 ── */
  .prompt-doc{font-family:var(--font-mono);font-size:12px;line-height:1.85;max-width:82ch;
    border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:16px 18px}
  .prompt-doc .pseg-h{display:flex;gap:8px;align-items:baseline;margin:14px 0 5px;color:var(--fg);font-weight:600;letter-spacing:.04em}
  .prompt-doc .pseg-h:first-child{margin-top:0}
  .prompt-doc .pseg-h span{color:var(--accent-strong);flex:none}
  .prompt-doc .pseg-b{margin:2px 0;color:var(--muted);white-space:pre-wrap}
  .prompt-doc .pblank{display:block;height:8px}

  .subseg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;flex-wrap:wrap}
  .subseg button{background:none;border:0;padding:7px 13px;font-size:12.5px;color:var(--muted)}
  .subseg button+button{border-left:1px solid var(--border)}
  .subseg button:hover{color:var(--fg)}
  .subseg button.on{background:var(--accent-strong);color:var(--on-accent);font-weight:600}

  .seg-h{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
  .seg-h:first-child{margin-top:0}
  .seg-h .note{font-family:var(--font-body);letter-spacing:0;text-transform:none;font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:400}
  /* 文风 tab：九维量化参数卡 · 只读 */
  .dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
  .dim{padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
  .dim-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .dim-h b{font-family:var(--font-display);font-size:13.5px;font-weight:600;color:var(--fg)}
  .dim-h .src{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;color:var(--faint);margin-left:auto;white-space:nowrap}
  .dim-vals{display:flex;flex-wrap:wrap;gap:5px 14px}
  .dv{font-size:12px;color:var(--muted)}
  .dv b{font-family:var(--font-mono);font-size:12.5px;font-weight:600;color:var(--fg)}
  .dv .u{font-size:11px;color:var(--faint)}
  .dim-note{margin-top:9px;font-size:11.5px;line-height:1.65;color:var(--muted)}
  /* 文风影子：本章覆盖（强调色语义＝「本章变更」，与关系图一致） */
  .ovb{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;color:var(--accent);border:1px solid color-mix(in oklch,var(--accent) 32%,transparent);border-radius:999px;padding:1px 6px;margin-left:6px;white-space:nowrap}
  .gv{margin:0;font-size:11.5px;line-height:1.6;color:var(--faint)}
  .gv b{font-family:var(--font-mono);font-weight:500;color:var(--muted)}
  .dim.ov{border-color:color-mix(in oklch,var(--accent) 30%,var(--border))}
  .dim-edit{display:flex;flex-wrap:wrap;gap:9px 16px}
  .dvx{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .dvx .u{font-size:11px;color:var(--faint)}
  .box-xs{width:66px;flex:none;padding:4px 7px;font-family:var(--font-mono);font-size:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--fg)}
  .box-xs:focus{border-color:var(--accent)}
  .flist.ov li:before{background:var(--accent)}
  .ledger-sum{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin:-2px 0 10px}
  .ledger-sum b{color:var(--fg);font-weight:600}
  .setrow{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border)}
  .setrow:last-child{border-bottom:0}
  .sk{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em}
  .sn{font-size:13.5px}
  .sn .orig{display:block;font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--faint);margin-top:3px}
  .setrow.is-stale .orig{color:var(--warn)}
  .sbadge{font-family:var(--font-mono);font-size:10px;text-align:right;color:var(--muted)}
  .chg-form{max-width:76ch}
  .chg-form .cbtns{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .chg-form .cbtns .note{font-family:var(--font-body);font-size:11.5px;color:var(--faint)}
  .b-new{color:var(--fg);font-weight:600}
  .b-upd{color:var(--muted)}
  .b-keep{color:var(--faint)}

  .ledger{display:flex;flex-direction:column}
  .lrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border)}
  .lrow:last-child{border-bottom:0}
  .lrow.hit{background:var(--accent-soft);margin:0 -8px;padding:9px 8px;border-radius:var(--radius);border-bottom-color:transparent}
  .lname{font-size:13.5px;min-width:0}
  .lname em{display:block;font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--faint);margin-top:3px}
  .lrow.hit .lname em{color:var(--accent)}
  .lstate{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;flex:none}
  .lstate.open{color:var(--fg);font-weight:600}
  .chrow{width:100%;background:none;border:0;border-bottom:1px solid var(--border);text-align:left;font:inherit;color:var(--fg);cursor:pointer}
  .chrow:hover{background:var(--hl)}
  .chrow:hover .lname{color:var(--accent)}
  .chrow:last-child{border-bottom:0}

  /* 角色关系图：点 / 边 */
  .graph{position:relative;margin:2px 0 6px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:6px 8px 2px}
  .graph svg{display:block;width:100%;height:auto}
  .gedge{stroke:var(--border);stroke-width:1.5}
  .gedge.hit{stroke:var(--accent);stroke-width:2.25}
  .gedge.stale{stroke-dasharray:5 4}
  .gnum circle{fill:var(--surface);stroke:var(--border)}
  .gnum text{font-family:var(--font-mono);font-size:9px;fill:var(--fg)}
  .gnum.hit circle{fill:var(--accent);stroke:var(--accent)}
  .gnum.hit text{fill:var(--on-accent)}
  .gnode circle{stroke-width:1.5}
  .gnode .gabbr{font-family:var(--font-display);font-size:13px;fill:var(--fg)}
  .gnode .glabel{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
  .gn-lead circle{fill:var(--fg);stroke:var(--fg)}
  .gn-lead .gabbr{fill:var(--on-accent);font-size:15px}
  .gn-cast circle{fill:var(--surface);stroke:var(--border)}
  .gn-force circle{fill:var(--warn-soft);stroke:var(--warn)}
  .gn-other circle{fill:var(--surface);stroke:var(--muted);stroke-dasharray:4 3}
  .gn-other .gabbr{fill:var(--fg)}
  .graph-legend{position:absolute;top:9px;right:11px;display:flex;gap:11px;font-family:var(--font-mono);font-size:9.5px;color:var(--muted)}
  .graph-legend .lg{display:inline-flex;align-items:center;gap:5px}
  .graph-legend i{width:9px;height:9px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);display:inline-block;flex:none}
  .graph-legend i.gn-lead{background:var(--fg);border-color:var(--fg)}
  .graph-legend i.gn-force{background:var(--warn-soft);border-color:var(--warn)}
  .graph-legend i.gn-other{border-color:var(--muted);border-style:dashed}
  .edge-ledger{margin-top:2px}
  .edge-row{align-items:center;gap:10px}
  .edge-row .lname{flex:1 1 auto;min-width:0}
  .enum{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);width:20px;flex:none}
  .edge-row.hit .enum{color:var(--accent);font-weight:600}
  .earrow{color:var(--muted)}
  .graph-iso{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin:10px 0 0}
  /* 角色关系：新增关系表单 · AI 认出的角色与物品变化 */
  .rel-form{max-width:76ch;margin:12px 0 6px;padding:12px 13px;border:1px solid color-mix(in oklch,var(--accent) 30%,var(--border));border-radius:var(--radius);background:color-mix(in oklch,var(--accent) 4%,var(--surface))}
  .rel-form .rowx{padding:0;border-bottom:0}
  .rd-grp{margin:0 0 12px}
  .rd-grp:last-child{margin-bottom:0}
  .rd-cat{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  .rd{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;cursor:pointer;color:var(--fg);transition:border-color .14s,background .14s}
  .rd+.rd{margin-top:6px}
  .rd:hover{background:var(--hl)}
  .rd.on{border-color:color-mix(in oklch,var(--accent) 44%,var(--border));background:var(--accent-soft)}
  .rd .tick{flex:none;width:14px;height:14px;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;position:relative}
  .rd.on .tick{border-color:var(--accent);background:var(--accent)}
  .rd.on .tick::after{content:"";position:absolute;left:3px;top:1px;width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .rd .tx{min-width:0}
  .rd .tx b{display:block;font-size:12.5px;font-weight:600;color:var(--fg)}
  .rd .tx em{display:block;font-style:normal;font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:2px}
  .rd .tx i{display:block;font-style:normal;font-family:var(--font-mono);font-size:10px;color:var(--faint);margin-top:3px}
  .rd-foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border)}
  .rd-foot .note{font-size:11px;color:var(--faint)}

  .field-label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
  .field-label:first-child{margin-top:0}
  .fnote{font-style:normal;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
  .box{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:12px 14px;border-radius:var(--radius)}
  .box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .box-lg{font-family:var(--font-display);font-size:16px}
  .box-pr{font-family:var(--font-mono);font-size:12px;line-height:1.75;min-height:260px}
  textarea.box{resize:vertical}
  .hint{font-size:11.5px;color:var(--muted);margin-top:7px}

  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:2px 8px;white-space:nowrap}
  .tag-live{color:var(--fg);border-color:color-mix(in oklch,var(--fg) 38%,transparent)}
  .tag-done{color:var(--accent-strong);border-color:color-mix(in oklch,var(--accent) 42%,transparent);background:var(--accent-faint)}
  .tag-stale{color:var(--fg);border-style:dashed;border-color:color-mix(in oklch,var(--fg) 45%,transparent)}
  .hash{font-family:var(--font-mono);font-size:11px;color:var(--muted)}

  .grow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:2px dashed var(--muted);border-radius:0 var(--radius) var(--radius) 0;padding:9px 12px;color:var(--muted);font-size:13px;flex-wrap:wrap;transition:border-color .12s,color .12s}
  .grow:hover{border-color:var(--muted);border-left-color:var(--fg);color:var(--fg)}
  .grow .tno{font-family:var(--font-mono);font-size:11px;flex:none}
  .grow .ttl{font-family:var(--font-display);font-size:14.5px;font-weight:600;color:var(--fg)}
  .grow .go{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44ch}
  .grow .gm{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--muted);flex:none}
  .d-ghosts{margin-top:20px;padding-top:14px;border-top:1px solid var(--border)}
  .d-ghosts-h{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .d-ghosts-h span{letter-spacing:0;text-transform:none;color:var(--faint);margin-left:8px}

  /* 右栏：AI 助手 */
  .col-ai{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;border-left:1px solid var(--border);background:var(--bg);padding:16px 15px 22px}
  .ai-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ai-title{font-family:var(--font-display);font-size:15px;font-weight:600}
  .ai-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:13px 14px}
  .ai-k{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .ai-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .ai-list li{font-size:12.5px;color:var(--fg);line-height:1.5;padding-left:14px;position:relative}
  .ai-list li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--muted)}
  .ai-list li.warn::before{background:var(--warn)}
  .ai-list li.ok::before{background:var(--ok)}
  .ai-note{font-size:12.5px;color:var(--muted);line-height:1.6}
  .ai-acts{display:flex;flex-wrap:wrap;gap:7px}
  .ai-ctx{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
  .ai-ctx em{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-style:normal}
  .ai-ctx span{color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:2px 9px;background:var(--surface)}
  .ai-lead{font-size:12.5px;color:var(--muted);line-height:1.65}
  .ai-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .ai-stat{background:var(--surface);padding:10px 11px;display:flex;flex-direction:column;gap:3px}
  .ai-stat em{font-style:normal;font-size:11px;color:var(--muted)}
  .ai-stat b{font-family:var(--font-mono);font-size:14px;font-weight:600;color:var(--fg)}
  .ai-foot{font-size:11px;color:var(--faint);line-height:1.6;border-top:1px solid var(--border);padding-top:12px;margin-top:auto}
  .ai-sub{margin-top:13px}
  /* 文风 tab：AI 按章纲调参 · 参数上直接标「基线 → 建议」，由作者逐项确认 */
  .dim.pro{border-color:color-mix(in oklch,var(--accent) 42%,var(--border));background:color-mix(in oklch,var(--accent) 4%,var(--surface))}
  .ovb.pro{background:color-mix(in oklch,var(--accent) 10%,transparent)}
  .dv-pro{font:inherit;font-size:12px;display:inline-flex;align-items:baseline;gap:4px;padding:2px 7px;margin:-2px -7px;border:1px solid transparent;border-radius:var(--radius-sm);background:none;color:var(--muted);cursor:pointer;transition:background .14s,border-color .14s,opacity .14s}
  .dv-pro:hover{background:var(--fg-soft);border-color:var(--border)}
  .dv-pro .pl{color:var(--muted)}
  .dv-pro .pv{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--faint)}
  .dv-pro .a{color:var(--faint);margin:0 2px}
  .dv-pro .to{font-family:var(--font-mono);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-strong)}
  .dv-pro .keep{font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:999px;padding:0 5px;margin-left:2px}
  .dv-pro .u{font-size:11px;color:var(--faint)}
  .dv-pro.off{opacity:.6}
  .dv-pro.off .pv{color:var(--muted);font-weight:600}
  .pro-notes{margin:9px 0 0;padding:8px 0 0;border-top:1px dashed var(--border);list-style:none}
  .pro-notes li{font-size:11.5px;line-height:1.6;color:var(--muted)}
  .pro-notes li+li{margin-top:3px}
  .pro-notes b{margin-right:5px;color:var(--fg);font-weight:600}
  .pro-why{margin:9px 0 0;font-size:12px;line-height:1.65;color:var(--fg-soft);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px}
  .pro-why .pw-tag{display:inline-block;margin-right:6px;font-weight:600;color:var(--fg)}
  .pro-why .pw-sig{display:inline-block;margin-right:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--accent-strong);border:1px solid var(--border);border-radius:999px;padding:0 6px;vertical-align:1px}

  /* ── modal ── */
  .modal{position:fixed;inset:0;z-index:60;display:none}
  .modal.on{display:block}
  .backdrop{position:absolute;inset:0;background:color-mix(in oklch,var(--fg) 42%,transparent)}
  .sheet{position:relative;margin:6vh auto 0;width:min(720px,calc(100% - 32px));background:var(--bg);border:1px solid var(--border);border-radius:calc(var(--radius) + 3px);padding:28px 30px 24px;max-height:86vh;overflow:auto}
  .sheet h2{font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.01em;margin:0}
  .sheet .lead{color:var(--muted);font-size:13.5px;margin-top:9px;max-width:62ch}
  .kicker{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .diagram{margin:20px 0 4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px 18px}
  .dlabel{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .drow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .drow+.drow{margin-top:14px}
  .nd-chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:12.5px;background:var(--bg)}
  .nd-chip .nu{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .nd-chip.old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted);border-style:dashed}
  .nd-chip.new{border-color:var(--fg);border-width:1.5px;font-weight:600}
  .nd-chip.keep{color:var(--muted)}
  .nd-chip.gone{border-style:dashed;color:var(--faint)}
  .nd-chip .st{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);border-left:1px solid var(--border);padding-left:6px;margin-left:2px}
  .arrow{font-family:var(--font-mono);color:var(--faint);font-size:12px}
  .mlist{list-style:none;padding:0;margin:18px 0 0}
  .mlist li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
  .mlist li b{color:var(--fg);font-weight:600;flex:none;min-width:66px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);z-index:80;background:var(--fg);color:var(--bg);font-size:13.5px;padding:11px 18px;border-radius:var(--radius);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:1320px){
    .appbar .genre-tag{display:none}
  }
  @media (max-width:1180px){
    .work{grid-template-columns:250px minmax(0,1fr)}
    .col-ai{display:none}
    .bh-prog{display:none}
  }
  @media (max-width:920px){
    .appbar{position:static;height:auto;min-height:0;flex-wrap:wrap;padding:9px 14px;gap:8px 10px}
    .appbar .sep{display:none}
    .acct{margin-left:auto}
    .bar-here{order:3;flex:1 1 100%;flex-wrap:wrap;gap:8px 10px;padding-top:8px;border-top:1px solid var(--border)}
    .bh-k,.bh-rule,.bh-prog{display:none}
    .modnav{position:static;padding:0 10px}
    .modnav .side{display:none}
    .work{grid-template-columns:1fr;height:auto;min-height:0}
    .col-tree{border-right:0;border-bottom:1px solid var(--border);max-height:52vh}
    .toc{overflow:auto;flex:1 1 auto}
    .col-editor{min-height:62vh}
    .col-ai{border-left:0;border-top:1px solid var(--border);display:flex}
    .op{flex-wrap:wrap;gap:12px}
    .op>.btn{width:100%;justify-content:center}
    .outline-box,.pos-line,.op-list{max-width:none}
    .dims{grid-template-columns:1fr}
    .ms-edit{padding:18px 16px;min-height:300px}
    .fmt-note{display:none}
    .prompt-doc{padding:13px 14px}
    /* 页面级滚动时 sticky 会盖到顶栏，改为随流 */
    .ol-top{position:static}
  }

  /* ══════════════ 阅读预览：左目录 / 中阅读 / 右配置 ══════════════ */
  [hidden]{display:none !important}
  .work-preview{grid-template-columns:250px minmax(0,1fr) 264px}
  .pv-tree{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface)}
  .pv-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
  .pv-head .t{font-size:13.5px;color:var(--fg);font-weight:600}
  .pv-head .sub{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
  .pv-toc{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 8px 22px;display:flex;flex-direction:column;gap:1px}
  .pv-vol{display:flex;align-items:baseline;gap:8px;padding:12px 10px 4px;font-family:var(--font-mono);font-size:10.5px;color:var(--faint);letter-spacing:.03em}
  .pv-vol:first-child{padding-top:10px}
  .pv-vol b{color:var(--muted);font-weight:500}
  .pv-ch{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:7px 10px;color:var(--muted);font:inherit}
  .pv-ch:hover{background:var(--hl);color:var(--fg)}
  .pv-ch.on{background:var(--accent-soft);color:var(--fg)}
  .pv-ch .no{font-family:var(--font-mono);font-size:10.5px;color:var(--faint);flex:none;min-width:34px}
  .pv-ch.on .no{color:var(--accent)}
  .pv-ch .ti{flex:1 1 auto;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-ch .wc{font-family:var(--font-mono);font-size:10px;color:var(--faint);flex:none}
  .pv-ch.on .wc{color:var(--accent)}
  .pv-ch .tag{font-size:9px;padding:1px 5px;border-radius:6px;flex:none;border:1px solid var(--border);color:var(--muted)}
  .pv-ch .tag.live{color:var(--accent);border-color:color-mix(in oklch,var(--accent) 35%,transparent)}
  .pv-ch .tag.wip{color:var(--warn);border-color:color-mix(in oklch,var(--warn) 35%,transparent)}

  .pv-read{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
  .pv-read-top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border)}
  .pv-read-top .pos{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
  .pv-turn{border:1px solid var(--border);background:none;color:var(--fg);font:inherit;font-size:12px;padding:5px 12px;border-radius:9px;flex:none}
  .pv-turn:hover{background:var(--fg-soft)}
  .pv-turn[aria-disabled="true"],.pv-turn[aria-disabled="true"]:hover{opacity:.35;cursor:default;background:none}
  .pv-prose-wrap{flex:1 1 auto;min-height:0;overflow:auto;padding:36px 48px 96px}
  .pv-prose-wrap.theme-paper{--pv-bg:var(--bg);--pv-fg:var(--fg);--pv-muted:var(--muted)}
  .pv-prose-wrap.theme-sepia{--pv-bg:oklch(0.955 0.014 80);--pv-fg:oklch(0.335 0.022 70);--pv-muted:oklch(0.55 0.02 70)}
  .pv-prose-wrap.theme-night{--pv-bg:oklch(0.19 0.012 245);--pv-fg:oklch(0.875 0.012 245);--pv-muted:oklch(0.6 0.012 245)}
  .pv-chapter{max-width:66ch;margin:0 auto;padding-bottom:20px;margin-bottom:28px;border-bottom:1px solid var(--border)}
  .pv-voltag{margin:0 0 4px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--pv-muted)}
  .pv-chapter h2{margin:0 0 6px;font-size:26px;font-weight:600;color:var(--pv-fg);font-family:var(--font-display)}
  .pv-meta{margin:0;font-family:var(--font-mono);font-size:11px;color:var(--pv-muted)}
  .pv-prose{max-width:66ch;margin:0 auto}
  #pv-read .pv-prose{font-family:var(--pv-font);font-size:var(--pv-size);line-height:var(--pv-line);color:var(--pv-fg)}
  #pv-read .pv-prose .prose{font-family:inherit;font-size:inherit;line-height:inherit;color:inherit;max-width:none;margin:0}
  #pv-read .pv-prose .prose p{margin:0 0 .95em}
  #pv-read .pv-prose .prose blockquote{margin:.8em 0;color:var(--pv-muted);border-left:2px solid var(--border);padding-left:14px}
  #pv-read .pv-prose .prose .scene{margin:1em 0;text-align:center;color:var(--pv-muted)}
  #pv-read .pv-prose .vempty{color:var(--pv-muted);padding:10px 0}

  .pv-side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto;border-left:1px solid var(--border);background:var(--bg);padding:16px 15px 22px}
  .pv-card{border:1px solid var(--border);border-radius:12px;padding:12px 13px;background:var(--surface)}
  .pv-card h4{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:500}
  .pv-card .stat-line{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--fg)}
  .pv-card .stat-line span{display:flex;justify-content:space-between;gap:10px}
  .pv-card .stat-line b{font-family:var(--font-mono);font-weight:500;color:var(--accent)}
  .pv-seg{display:flex;gap:4px}
  .pv-seg button{flex:1;border:1px solid var(--border);background:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 0;border-radius:8px;cursor:pointer}
  .pv-seg button:hover{color:var(--fg);border-color:var(--muted)}
  .pv-seg button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:500}
  .pv-export .btn{width:100%;justify-content:center;padding:9px 0}
  .pv-hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}

  /* ── 导出成稿弹窗：C 端 · 选本地保存位置 ＋ 勾选格式，导出在后台进行，不走浏览器下载 ── */
  .ex-body{display:flex;flex-direction:column;margin-top:20px}
  .ex-sec+.ex-sec{margin-top:18px}
  .ex-sec h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:500}
  .ex-path{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:0 12px}
  .ex-path .ex-folder{flex:none;color:var(--muted);display:grid;place-items:center}
  .ex-path .box{border:0;background:none;padding:10px 0;font-family:var(--font-mono);font-size:12.5px}
  .ex-path .box:focus{box-shadow:none}
  .ex-dirs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .ex-dirs .chip{cursor:pointer;border:1px solid var(--border);background:var(--surface)}
  .ex-dirs .chip:hover{border-color:var(--muted);color:var(--fg)}
  .ex-fmts{display:flex;flex-direction:column;gap:7px}
  .ex-fmt{display:flex;align-items:flex-start;gap:11px;text-align:left;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:10px 12px;cursor:pointer;font:inherit;color:var(--fg)}
  .ex-fmt:hover{border-color:var(--muted)}
  .ex-fmt.on{border-color:color-mix(in oklch,var(--accent) 42%,var(--border));background:color-mix(in oklch,var(--accent) 4%,var(--surface))}
  .ex-tick{flex:none;width:17px;height:17px;border:1px solid var(--border);border-radius:5px;display:grid;place-items:center;margin-top:1px;color:transparent;transition:background .14s,border-color .14s,color .14s}
  .ex-fmt.on .ex-tick{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--surface)}
  .ex-txt{display:flex;flex-direction:column;gap:2px}
  .ex-txt b{font-size:13.5px;font-weight:600}
  .ex-txt span{font-size:11.5px;color:var(--muted)}
  .ex-sum{margin-top:18px;padding-top:12px;border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
  .ex-stat{font-size:13px;color:var(--fg);margin:0 0 12px}
  .ex-bar{height:6px;border-radius:999px;background:var(--surface);border:1px solid var(--border);overflow:hidden}
  .ex-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}
  .ex-steps{list-style:none;margin:16px 0 0;padding:0}
  .ex-steps li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--border);font-size:12.5px}
  .ex-steps b{font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--fg)}
  .ex-steps em{font-style:normal;font-size:11.5px;color:var(--faint)}
  .ex-steps em.ok{color:var(--ok)}
  .ex-done{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in oklch,var(--ok) 38%,var(--border));background:color-mix(in oklch,var(--ok) 7%,var(--surface));border-radius:var(--radius);padding:13px 14px}
  .ex-done-ico{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ok);color:color-mix(in oklch,var(--surface) 10%,white);display:grid;place-items:center}
  .ex-done b{font-size:13.5px}
  .ex-done p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .ex-done .mono{font-family:var(--font-mono);font-size:11.5px;color:var(--fg)}

  /* ═══════════════════════════════════════════════════════════════════
     本稿新增：整书拆纲（分卷规划）
     空书起手 → 分卷依据 → 写一句 / 3 套可行走法 → 生成 → 中栏回填 → 体检
     令牌与组件全部沿用上文设计系统；新增件命名一律 kebab-case，可被 OpenDesign 收编
     ═══════════════════════════════════════════════════════════════════ */

  /* 空书起手卡：设定就绪标（原型原文的 .e-empty .be-k 引用了未定义的 --ink，本稿改用 --fg） */
  .e-empty .be-mark{margin:0 0 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;color:var(--accent)}
  .e-empty .be-k{color:var(--fg)}

  /* 右栏 · 分卷依据：每行 = 来源 + 状态，点一行回设定页 */
  button.dep-row{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 0;font:inherit;color:var(--fg);cursor:pointer;transition:background .12s}
  button.dep-row:hover{background:var(--hl)}
  .dep-row+.dep-row{border-top:1px solid var(--border)}
  .dep-k{flex:none;width:56px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .dep-v{flex:1 1 auto;min-width:0;font-size:12.5px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .dep-s{flex:none;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ok);padding-top:1px}
  .dep-s.muted{color:var(--faint)}

  /* ── c-卷下拆章：以下类**逐字取自产品 book.css**（c-volume-antagonist 终版），

<!-- 演示控制（非基线）：跳状态与切身份，收编前删除 -->
<div class="demo-bar" id="demo-bar" data-od-id="demo-bar"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   卷下拆章（逐章版，用户拍板：不要一次拆好多章）

   1. **一章一章拆**——与「整书拆卷」同一个节奏：每次只定**下一章**，AI 给 3 个剧情方向，
      选一个、改一改、排上；然后基于新章的落点再拆下一章。
   2. **衔接天然成立**：第 N+1 章的进场＝第 N 章的落点。拆章台顶上永远摆着
      「进场 ← 上一章落点」，作者看着它写，不会断链。
   3. **材料永远是卷自己已有的**：四问一页纸＋剩余的关键剧情节点＋剩余章数配额。
      AI 的工作是把「还没落到章上的节点」变成 3 个**互斥的剧情方向**——走向不越卷纲。
   4. **免费也能拆**：自己写这一章（标题/小故事/落点/阶段）；PRO 才多「让 AI 给 3 个方向」
      （置灰口径与分卷规划一致）。
   5. **排上即落库**：一次只建这一章（拟定），左树长一行；落点卡给「写这一章／继续拆下一章」。
      拆错了删掉重拆——与「＋ 新增一章」同一落点语义。
   ══════════════════════════════════════════════════════════════════════════ */

const CN = ['一','二','三','四','五','六','七','八','九','十'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const attr = s => esc(s);

/* ── 本卷（= 卷页上已有的东西） ───────────────────────────────────── */
const VOL = {
  no: 1,
  name: '星海初航',
  target: 6,
  /* 链头：第一章的进场。有上一卷＝上一卷实际收尾（事实优先）；第一卷＝主线起步 */
  entry: '导航员在旧星图上圈出一个不该存在的航标——全书从这里起步。',
  q: {
    what: '导航员沉舟在废弃星港捡到一枚不属于人类纪元的导航信标，为确认它指向哪里，她把坐标押给了船队。',
    conflict: '想只靠自己查清信标来历，可补给单上没有她的名字——要用船队的手，就得让出航线。',
    antType: '环境',
    antLine: '母港制度——信标要登记，登记就等于交出去',
    ending: '船头转向母港旧址：她拿到了坐标，也成了制度要处理的人。'
  },
  stages: ['开局铺垫','冲突初现','矛盾升级','重要转折','高潮爆发','卷末收束'],
  /* 关键剧情节点（六阶段）：拆章就是把还没落到章上的节点，变成章 */
  nodes: [
    { stage: '开局铺垫', text: '沉舟在废弃星港检修时，信标随残骸漂进舱门' },
    { stage: '冲突初现', text: '船队要求登记信标，她谎称只是块废铁' },
    { stage: '矛盾升级', text: '登记处的旧档案里，有一份与她同名的领航记录' },
    { stage: '重要转折', text: '她发现信标的应答周期，与三百年前的失踪船队一致' },
    { stage: '高潮爆发', text: '母港封港，她用未登记的坐标换出一条出港航道' },
    { stage: '卷末收束', text: '出港后坐标失效——信标认的是她，不是航线' }
  ]
};

/* ── 已拆的章（逐章长出来的；每章的落点是下一章的进场）────────────── */
const state = {
  view: 'vol',        // vol | desk | pick | done | landed
  pro: true,
  freeMode: false,
  chapters: [
    { title: '信标进舱', text: '沉舟在废弃星港检修时，信标随残骸漂进舱门——她认出那不是人类的造物，先藏了下来。',
      stage: '开局铺垫', exit: '她把信标藏进舱底，却被补给单点名要她出舱清点', node: 0 },
    { title: '登记与谎话', text: '要领工钱就必须登记信标；她谎称那只是块废铁，第一次对船队说谎。',
      stage: '冲突初现', exit: '登记处的旧档案里，翻出一份与她同名的领航记录', node: 1 }
  ],
  pick: null,
  pending: null,      // AI 给的 3 个剧情方向
  draft: null,        // 本章卡（选定后可改）
  checks: [
    '衔接：本章进场已自动接上第 2 章落点「登记处的旧档案…」✓',
    '节奏：目标 6 章、还剩 4 个节点——本章建议一次只吃 1 个节点，别把「应答周期」提前。'
  ],
  scIgnored: false
};

/* ── AI 给的 3 个剧情方向（下一章写什么；走向不越卷纲）────────────── */
const DIRECTIONS = [
  { k: 'clue', axis: '线索', title: '同名档案',
    story: '她顺着档案里的领航记录查下去：领航员与她同名同籍，三百年前就已注销——记录的最后一页被撕掉了。',
    exit: '她把撕页的残角收进怀里，决定去港区旧档堆里碰运气',
    stage: '矛盾升级', node: 2,
    after: '吃掉「同名领航记录」节点；悬念加深，节奏不变' },
  { k: 'deal', axis: '关系', title: '船队的条件',
    story: '船队长其实早发现她藏了信标，却没告发——他把信标变成交易的筹码：用半条航线，换她跟船队合作。',
    exit: '她第一次让出一半航线，换到继续留在船上的许可',
    stage: '矛盾升级', node: 2,
    after: '引入船队长这条关系线；「坎」从制度压到人情' },
  { k: 'raid', axis: '危机', title: '突击清查',
    story: '港警提前突击清查未登记造物，她带着信标出逃，慌乱中信标当众亮了一下。',
    exit: '信标暴露——全港都知道她手里有东西',
    stage: '重要转折', node: 3,
    after: '高潮提前：节奏加快，但后面要补一段躲避戏' }
];

/* ── 小工具 ─────────────────────────────────────────────────────────── */
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1800); }
function chapters(){ return state.chapters; }
function hasChapters(){ return state.chapters.length > 0; }
function lastChapter(){ return state.chapters[state.chapters.length-1] || null; }
/* 下一章的进场：有上一章＝它的落点；第一章＝卷链头 */
function nextEntry(){ return lastChapter() ? ('接上章：' + lastChapter().exit) : VOL.entry; }
/* 还没落到章上的节点 */
function openNodes(){ return VOL.nodes.filter((n,i)=> !state.chapters.some(c=>c.node===i)); }
function coveredCount(){ return VOL.nodes.length - openNodes().length; }
function remainQuota(){ return Math.max(0, VOL.target - state.chapters.length); }

/* ═══════════ 渲染：顶栏 ═══════════ */
function hereBarHTML(){
  const n = state.chapters.length;
  const last = lastChapter();
  if (!hasChapters())
    return '<p class="bh-k">空书</p><span class="bh-rule" aria-hidden="true"></span>'
    + '<p class="bh-t"><span class="n">第 1 章</span>待写</p><span class="tag">未开始</span>'
    + '<div class="bh-prog"><span class="bh-vol">还没有卷与章节</span></div>'
    + '<button class="btn btn-sm btn-accent" data-act="open-desk" data-od-id="empty-add-ch">⤨ 拆第一章</button>';
  return '<p class="bh-k">当前主线</p><span class="bh-rule" aria-hidden="true"></span>'
  + '<p class="bh-t"><span class="n">第 ' + n + ' 章</span>' + esc(last.title) + '</p>'
  + '<span class="tag">' + (state.view==='landed' ? '拟定' : '未开始') + '</span>'
  + '<div class="bh-prog"><span class="bh-vol">第' + CN[VOL.no-1] + '卷 · 0/' + n + '</span>'
  +   '<span class="prog-bar"><span style="width:0%"></span></span></div>'
  + '<button class="btn btn-sm btn-accent" data-act="stub" data-label="写这一章">写这一章</button>';
}

/* ═══════════ 渲染：左树 ═══════════ */
function tocHTML(){
  const rows = state.chapters.map((c,i)=>'<button class="trow pending" data-act="stub" data-label="章工作台" data-status="pending">'
    + '<span class="tno">' + String(i+1).padStart(2,'0') + '</span><span class="ttl">' + esc(c.title) + '</span><span class="tdot" aria-hidden="true"></span></button>').join('');
  return '<div class="volgrp">'
    + '<div class="volgrp-head on current sel">'
    +   '<button class="vg-chev" data-act="stub" aria-expanded="true" aria-label="展开第一卷"><span class="chev" aria-hidden="true">▶</span></button>'
    +   '<button class="vg-name" data-act="view-vol">第' + CN[VOL.no-1] + '卷 · ' + VOL.name + '</button>'
    +   '<span class="range">' + state.chapters.length + ' 章</span>'
    + '</div>' + rows + '</div>';
}

/* ═══════════ 渲染：卷页 ═══════════ */
function volPageHTML(){
  const q = VOL.q;
  const open = openNodes();
  return '<div class="e-head"><p class="e-kicker">卷 · 分卷计划</p>'
    + '<h2 class="e-title">第' + CN[VOL.no-1] + '卷 · ' + VOL.name + '</h2>'
    + '<div class="e-meta"><span class="tag">' + state.chapters.length + ' 章</span><span class="tag">已归档 0 章</span><span class="tag">目标 ' + VOL.target + ' 章</span></div></div>'
    + '<div class="e-toolbar">' + volTabs() + '</div>'
    + '<div class="e-scroll"><div class="e-pad">'
    +   '<div class="ol-top"><span class="note">卷纲 · 规划本卷剧情</span><span class="push">'
    +     '<button class="btn btn-sm btn-accent" data-act="open-desk" data-od-id="split-cta-top">'
    +       (hasChapters() ? '⤨ 拆下一章（第 ' + (state.chapters.length+1) + ' 章）' : '⤨ 按剧情拆第一章') + '</button>'
    +     '<button class="btn btn-sm btn-secondary" data-act="stub" data-label="编辑卷纲">编辑卷纲</button></span></div>'
    +   '<div class="fro" data-od-id="enter-row"><em>进场起点 <span class="tag">第一章从这里接</span></em>'
    +     '<p>' + esc(VOL.entry) + '</p><span class="none">第一卷 · 来自主线全景的「他从哪起步」</span></div>'
    +   qRow(1, '这一卷讲什么', q.what, true)
    +   qRow(2, '主要冲突', q.conflict, true)
    +   qRow(3, '这一卷的坎', q.antType + ' · ' + q.antLine, false)
    +   qRow(4, '卷末收在哪里', q.ending, false)
    +   nodeBlock(open)
    +   '<div class="fro"><em>本卷角色 <span class="tag">自动聚合</span></em>'
    +     '<p class="none">还没有写——写到谁（章纲登记出场），这里自动有谁</p></div>'
    +   splitProgress()
    +   '<p class="seg-h">本卷进度 <span class="note">由各章实际归属推导</span></p>'
    +   '<div class="pos-line" data-od-id="vol-progress">' + pos('已归档','0 章') + pos('草稿','0 章')
    +     pos('拟定', state.chapters.length + ' 章') + pos('待写', '第 ' + (state.chapters.length+1) + ' 章') + '</div>'
    + '</div></div>';
}
function qRow(n, label, text, lead){
  return '<div class="fro"><em><span class="qno">' + n + '</span>' + label + '</em>'
    + '<p' + (lead?' class="lead"':'') + '>' + esc(text) + '</p></div>';
}
/* 节点块：拆过的节点标「已排进第 N 章」——拆章就是把节点一个个吃掉 */
function nodeBlock(open){
  const rows = VOL.nodes.map((n,i)=>{
    const used = state.chapters.find(c=>c.node===i);
    return '<div class="node"><span class="stg">' + esc(n.stage) + '</span><p>' + esc(n.text)
      + (used ? ' <span class="tag">已排进第 ' + used.no + ' 章</span>' : ' <span class="tag">未排</span>') + '</p></div>';
  }).join('');
  return '<details class="cfgset" open><summary>关键剧情节点 <span class="chev" aria-hidden="true">▶</span></summary>'
    + '<div class="inner">' + rows + '</div></details>';
}
/* 拆章进度区：入口＋配额（剩余章数配额＝目标−已拆） */
function splitProgress(){
  const left = remainQuota(), leftNodes = openNodes().length;
  if (!state.chapters.length) {
    return '<div class="fro" data-od-id="split-entry"><em>拆章 <span class="tag">一章一章来</span></em>'
      + '<p>每次只拆**下一章**：AI 给 3 个剧情方向，选一个、改一改、排上；然后基于它的落点再拆下一章。</p>'
      + '<span class="none">免费可自己写；PRO 才有 AI 方向。拆完这一卷正好 ' + VOL.target + ' 章。</span>'
      + '<div class="split-sum"><button class="btn btn-sm btn-accent" data-act="open-desk" data-od-id="split-cta">⤨ 拆第一章</button>'
      + '<span>目标 ' + VOL.target + ' 章 · 现有 0 章</span></div></div>';
  }
  return '<div class="fro" data-od-id="split-entry"><em>拆章进度 <span class="tag">一章一章来</span></em>'
    + '<p>已拆 ' + state.chapters.length + ' 章（最后：第' + CN[state.chapters.length-1] + '章「' + esc(lastChapter().title) + '」）。'
    + '还剩 ' + leftNodes + ' 个剧情节点、' + left + ' 章配额。</p>'
    + '<div class="split-sum"><button class="btn btn-sm btn-accent" data-act="open-desk" data-od-id="split-cta">⤨ 拆下一章（第 ' + (state.chapters.length+1) + ' 章）</button>'
    + '<span>剩余节点：' + openNodes().map(n=>n.stage).join('、') + '</span></div></div>';
}
function volTabs(){
  const t = [['outline','卷纲'],['chapters','本卷章节'],['rels','角色关系'],['hooks','伏笔']];
  return '<div class="vtabs">' + t.map(x=>'<button class="vtab' + (x[0]==='outline'?' on':'') + '" data-act="tab" data-tab="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';
}
function pos(k,v){ return '<span class="pos"><em>' + esc(k) + '</em><b>' + esc(v) + '</b></span>'; }

/* ═══════════ 渲染：右栏（卷的验证）═══════════ */
function railHTML(){
  return '<div class="ai-head"><span class="ai-k">AI 助手</span><span class="pill-pro">PRO</span></div>'
  + '<div class="ai-ctx"><em>当前页签</em><span>卷 · 卷纲</span></div>'
  + '<div class="ai-card"><p class="ai-title">卷的验证</p>'

  +   '<div class="ai-stats">'
  +     '<div class="ai-stat"><b>' + state.chapters.length + '</b><span>本卷章数</span></div>'
  +     '<div class="ai-stat"><b>' + VOL.nodes.length + '</b><span>剧情节点</span></div>'
  +     '<div class="ai-stat"><b>' + openNodes().length + '</b><span>未排节点</span></div>'
  +   '</div>'
  +   '<button class="btn btn-sm btn-secondary" data-act="stub" data-label="立刻体检">立刻体检</button>'

  + '<div class="ai-card"><p class="ai-title">分卷依据 · 来自你的设定</p>'

  + '</div>';
}
function depRow(k,v){ return '<div class="dep-row"><span class="dep-k">' + esc(k) + '</span><span class="dep-v">' + esc(v) + '</span><span class="dep-s">已就绪</span></div>'; }

/* ═══════════ 渲染：拆章台（一次只拆一章）═══════════ */
function splitAnchor(){
  const last = lastChapter();
  return '<div class="plan-anchor">'
  + '<p class="kicker">这一章从哪里接</p>'
  + '<div class="fro"><em>进场 <span class="tag">' + (last ? '上一章落点' : '卷的起点') + '</span></em>'
  +   '<p>' + esc(nextEntry()) + '</p></div>'
  + '<div class="fro"><em>剩余材料</em><p>还没排的剧情节点：'
  +   (openNodes().length ? openNodes().map(n=>esc(n.stage + '·' + n.text)).join('；') : '（都排完了）')
  +   '</p></div>'
  + '<div class="fro"><em>章数配额</em><p>目标 ' + VOL.target + ' 章，已拆 ' + state.chapters.length + ' 章，这一章是第 '
  +   (state.chapters.length+1) + ' 章' + (remainQuota() ? '（还剩 ' + remainQuota() + ' 章配额）' : '（已是目标章数，再拆就超了——可以拆，或先把前面的写了）') + '</p></div>'
  + '</div>';
}
function splitDeps(){ return ''; }

function deskHTML(){

    return '<p class="plans-h">自己写这一章（免费可写；写完排上，落点留给下一章接）</p>'

  }

  + '<div class="plan-desk-acts">'
  +   '<button class="btn btn-primary" data-act="draw" data-od-id="draw-cta">让 AI 给 3 个剧情方向</button>'
  +   '<button class="btn btn-secondary" data-act="to-manual">自己写这一章</button>'
  +   '<span class="push">每次只拆一章——拆完基于它的落点再拆下一章</span>'
  + '</div>';
}
/* 三选一：3 个剧情方向（每卡=标题＋小故事＋落点＋阶段＋影响） */
function pickHTML(){
  const cards = DIRECTIONS.map((d,i)=>'<button type="button" class="pick-card' + (state.pick===i?' on':'') + '" data-act="pick" data-i="' + i + '" aria-checked="' + (state.pick===i) + '" role="radio">'
    + '<span class="pk-axis">' + esc(d.axis) + '</span>'
    + '<p class="pk-title">' + esc(d.title) + '</p>'
    + '<div class="pk-row"><b>小故事</b><span>' + esc(d.story) + '</span></div>'
    + '<div class="pk-row"><b>章末落点</b><span>' + esc(d.exit) + '</span></div>'
    + '<div class="pk-row"><b>阶段 · 影响</b><span>' + esc(d.stage) + ' · ' + esc(d.after) + '</span></div>'
    + (state.pick===i ? '<span class="pk-picked">✓ 就要这个方向</span>' : '')
    + '</button>').join('');
  return '<p class="plans-h">第' + CN[state.chapters.length] + '章的 3 个剧情方向 · 进场已接上：' + esc(nextEntry()) + '</p>'
  + '<div class="pick-grid" data-od-id="pick-grid">' + cards + '</div>';
}
/* 本章卡（选定后可改）＋自查 */
function doneHTML(){
  const d = state.draft;
  return '<div class="split-row" data-od-id="chapter-card">'
  + '<span class="s-no">' + String(state.chapters.length+1).padStart(2,'0') + '</span>'
  + '<div class="s-main">'
  +   '<p class="s-entry" data-testid="entry-line">进场 ← ' + esc(nextEntry()) + '</p>'
  +   '<input class="input ttl" value="' + attr(d.title) + '" aria-label="章标题" data-draft-title="1" />'
  +   '<input class="input txt" value="' + attr(d.story) + '" aria-label="这一章的小故事" data-draft-story="1" />'
  +   '<div class="s-exit"><span class="s-k">章末落点</span>'
  +     '<input class="input" value="' + attr(d.exit) + '" aria-label="章末落点" data-draft-exit="1" /></div>'
  + '</div>'
  + '<select class="input s-stg" aria-label="阶段" data-draft-stage="1">'
  +   VOL.stages.map(s=>'<option' + (s===d.stage?' selected':'') + '>' + s + '</option>').join('') + '</select>'
  + '</div>'
  + (state.scIgnored ? '' : selfcheckHTML());
}
function selfcheckHTML(){
  return '<details class="selfcheck" data-od-id="selfcheck" open><summary class="sc-h">AI 自查 · 这个方向它自己先过了一遍（' + state.checks.length + ' 条）</summary>'
  + '<ul>' + state.checks.map(t=>'<li><p>' + esc(t) + '</p></li>').join('') + '</ul>'
  + '<div class="edit-bar"><button class="btn btn-sm btn-quiet" data-act="sc-ignore">先不管</button></div></details>';
}
/* 排上后：中栏落点卡（与分卷规划落点卡同款） */
function landedHTML(){
  const c = state.chapters[state.chapters.length-1];
  return '<div class="e-empty" data-od-id="landing-card">'
  + '<p class="be-k">第' + CN[state.chapters.length-1] + '章「' + esc(c.title) + '」已排上（拟定）</p>'
  + '<p class="be-t">写这一章，还是继续拆下一章？</p>'
  + '<p class="be-desc">下一章的进场已经接上：「' + esc(c.exit) + '」。写的时候随时能改。</p>'
  + '<p class="be-acts">'
  +   '<button class="btn btn-primary" data-act="stub" data-label="写这一章" data-od-id="landing-write">写这一章</button>'
  +   '<button class="btn btn-secondary" data-act="open-desk" data-od-id="landing-next">⤨ 继续拆下一章</button>'
  + '</p></div>';
}

/* ═══════════ 主渲染 ═══════════ */
function render(){
  document.getElementById('here-bar-slot').innerHTML = hereBarHTML();
  document.getElementById('toc').innerHTML = tocHTML();
  document.getElementById('modWriteCnt').textContent = state.chapters.length + ' 章';
  document.getElementById('toc-count').textContent = '1 卷 · ' + state.chapters.length + ' 章';
  document.getElementById('editor').innerHTML = (state.view === 'landed' && hasChapters()) ? landedHTML() : volPageHTML();
  document.getElementById('ai-panel').innerHTML = railHTML();

  const open = ['desk','pick','done'].includes(state.view);
  const modal = document.getElementById('split-modal');
  modal.classList.toggle('on', open);
  document.querySelector('.sheet.plan-sheet').classList.toggle('wide', state.view === 'pick');
  if (open) {
    const nextNo = state.chapters.length + 1;
    document.getElementById('split-kick').textContent = '卷下拆章 · 第' + CN[VOL.no-1] + '卷 · 第' + nextNo + '章';
    document.getElementById('split-title').textContent = '拆第' + CN[nextNo-1] + '章';
    document.getElementById('split-anchor').innerHTML = splitAnchor();
    document.getElementById('split-deps').innerHTML = splitDeps();
    document.getElementById('split-desk').innerHTML = (state.view === 'desk') ? deskHTML() : '';
    document.getElementById('split-body').innerHTML = (state.view === 'pick') ? pickHTML() : (state.view === 'done' ? doneHTML() : '');
    document.getElementById('split-foot').innerHTML = footHTML();
  }
  renderDemo();
}
function footHTML(){
  if (state.view === 'done') {
    const d = state.draft;
    return '<span class="note">排上后左树长一行（拟定）；下一章的进场会自动接「' + esc((d||{}).exit || '') + '」。</span>'
      + '<button class="btn btn-sm btn-primary" data-act="adopt" data-od-id="split-adopt">排上这一章（第 ' + (state.chapters.length+1) + ' 章）</button>';
  }
  if (state.view === 'pick') return '<span class="note">三个方向都接得住上一章落点；选了还能改，排上之前不落库。</span>';
  return '<span class="note">一次只拆一章——拆完基于它的落点再拆下一章。</span><button class="btn btn-sm btn-secondary" data-act="split-close">先不拆</button>';
}

/* ═══════════ 交互 ═══════════ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'stub') { toast((el.dataset.label || '本原型未覆盖') + '（原型示意）'); return; }
  if (act === 'open-desk') { state.view = 'desk'; state.scIgnored = false; render(); return; }
  if (act === 'split-close') { state.view = 'vol'; render(); return; }
  if (act === 'to-manual') { state.freeMode = true; render(); return; }
  if (act === 'draw') { state.pending = DIRECTIONS; state.view = 'pick'; render(); return; }
  if (act === 'ai-fill') { toast('给剧情方向需 PRO——升级后可用（原型示意）'); return; }
  if (act === 'pick') {
    state.pick = Number(el.dataset.i);
    const d = state.pending[state.pick];
    state.draft = { title: d.title, story: d.story, exit: d.exit, stage: d.stage, node: d.node };
    state.view = 'done'; render(); return;
  }
  if (act === 'adopt-manual') {
    const t = document.getElementById('m-title'), x = document.getElementById('m-text'),
          x2 = document.getElementById('m-exit'), s = document.getElementById('m-stage');
    if (!t.value.trim()) { toast('先写个章标题'); return; }
    state.draft = { title: t.value.trim(), story: x.value.trim(), exit: x2.value.trim(), stage: s.value, node: -1 };
    state.view = 'done'; render(); return;
  }
  if (act === 'adopt') {
    const d = state.draft;
    state.chapters.push({ title: d.title, text: d.story, exit: d.exit, stage: d.stage, node: d.node });
    state.view = 'landed'; render();
    toast('已排上第 ' + state.chapters.length + ' 章「' + d.title + '」（拟定）');
    return;
  }
  if (act === 'sc-ignore') { state.scIgnored = true; render(); return; }
  if (act === 'jump') { toast('回到当前（原型示意）'); return; }
  if (act === 'view-vol') { state.view = 'vol'; render(); return; }
  if (act === 'manual-ch') { toast('本卷末尾排一章（原型示意）'); return; }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.draftTitle) state.draft.title = t.value;
  else if (t.dataset.draftStory) state.draft.story = t.value;
  else if (t.dataset.draftExit) state.draft.exit = t.value;
  else if (t.dataset.draftStage) state.draft.stage = t.value;
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.draftStage) { state.draft.stage = t.value; render(); }
});

/* ═══════════ 演示控制条（非基线）═══════════ */
const VIEWS = [
  ['vol','① 卷页 · 已拆 2 章'],
  ['desk','② 拆下一章 · 手写（免费）'],
  ['pick','③ 三选一 · 3 个剧情方向'],
  ['done','④ 本章卡 · 可改'],
  ['landed','⑤ 排上后 · 落点卡']
];
function renderDemo(){
  const bar = document.getElementById('demo-bar');
  bar.innerHTML = '<span class="demo-h">状态</span>'
    + VIEWS.map(v=>'<button class="chip-btn' + (state.view===v[0]?' on':'') + '" data-view="' + v[0] + '">' + v[1] + '</button>').join('')
    + '<span class="spacer"></span>'
    + '<button class="chip-btn' + (!state.freeMode?' on':'') + '" data-tier="pro">PRO</button>'
    + '<button class="chip-btn' + (state.freeMode?' on':'') + '" data-tier="free">免费</button>'
    + '<span class="demo-note">逐章拆分 · 复用清单见文件末尾注释</span>';
}
document.addEventListener('click', (e) => {
  const v = e.target.closest('[data-view]');
  if (v) {
    const k = v.dataset.view;
    if ((k === 'pick' || k === 'done') && !state.pending) state.pending = DIRECTIONS;
    if ((k === 'done' || k === 'landed') && !state.draft) {
      const d = DIRECTIONS[0];
      state.draft = { title: d.title, story: d.story, exit: d.exit, stage: d.stage, node: d.node };
    }
    state.view = k;
    if (k === 'desk') state.freeMode = true;
    if (k === 'landed' && state.chapters.length < 3) {
      const d = DIRECTIONS[2];
      state.chapters.push({ title: '突击清查', text: d.story, exit: d.exit, stage: d.stage, node: 3 });
    }
    render(); return;
  }
  const t = e.target.closest('[data-tier]');
  if (t) { state.freeMode = (t.dataset.tier === 'free'); render(); return; }
});

render();
</script>
</body>
</html>
