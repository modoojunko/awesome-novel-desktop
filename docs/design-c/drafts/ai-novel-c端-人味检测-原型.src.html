              <p class="chapter-head">第 1 章 河底的灯</p>
              <p>入夜，港口的灯一盏一盏灭下去，只剩稽查船的巡灯还在水面上扫。陆沉数着灯灭的节奏，把半张禁航图折小，塞进阿槎的袖口。</p>
              <p>舱里的空气闷得像要凝住，缆绳影子映在舱壁上。没有一个人先开口说话，油灯的火苗压得很低。图的事像一块石头，沉沉压在每个人的胸口。</p>
              <p>于是没有人再提图的事。阿槎蹲在舱角磨他那把刀，磨得很慢，一下一下，数得清清楚楚。</p>
              <p>陆沉按住阿槎的手背——掌心一片凉。「灯灭了三盏，」他盯着舱壁上的影子，「巡灯改线了。」</p>
              <p>甲板上脚步来回，检查完毕的灯语挂上桅顶。过了半刻，桅顶又把检查完毕四个字重新打了一遍，港里没有人回应。</p>
              <p>巡灯的光从舱门缝里切进来，在地板上走了一寸又一寸，所有人都在等它走过去，等它走过去了，才有人把憋了半天的气吐出来，把身子从阴影里挪回灯下。</p>
              <p>这不是勇气的问题，而是信任的问题。陆沉要的不是服从，而是把后背交出去的那份放心。</p>
              <p>舱里很静。灯芯结了花。阿槎把刀收回鞘。木壳船身在礁石外轻轻擦了一下。没有人说话。</p>
              <p>「三更了。」陆沉说。</p>
              <p>没有人接话。</p>
              <p>潮水拍着船底，一下，又一下。</p>
              <p>说白了，今夜出港，赌的是巡灯换岗的那一刻钟。谁去掐这个点？</p>
              <p>摆在所有人面前的，只有三个选择：交图、熄灯、或者在礁石区赌一条新路。</p>
              <p>阿槎把耳朵贴在舱板上听了半晌。潮声变了，比来时急，浪头一下一下砸在礁石上，震得舱板发麻。</p>
              <p>陆沉抬手，舱里的油灯随即熄了。黑暗里，只剩下巡灯远远扫过来的光，像一根慢慢抽走的白线。</p>
              <p>灯，灭了。</p>
              <p>「换岗还有一刻钟。」阿槎把刀横在膝上，朝着舱门坐了下去。陆沉没有再说话，把图角在袖口又按了按，朝舱门走了过去。</p>
              <p>巡灯的光又扫过来一次，在地上一寸寸挪，挪过缆绳的影子，挪过去了，舱里重新黑透。</p>
              <p>甲板上的脚步声近了，又远了。没有人出声。每个人都在数自己的呼吸。</p>
              <p>阿槎把缆绳又盘了一圈，绳子绕得很整齐，一圈压着一圈，压得很实。</p>
              <p>于是船舱里安静下来。灯灭了，人的轮廓散进黑暗里。黑暗不说话，它只是等着。</p>
              <p>黑暗里有东西滴水的声音，从船底上来，一下，一下。</p>
              <p>风从石缝里钻进来，凉的，贴着脚踝绕了一圈，又退回去。</p>
              <p>石缝里的水一滴一滴落在船板上，间隔很稳，数得清。</p>
              <p>巡灯换岗的声音从港里传来，隔着水，闷闷的一下。</p>
              <p>信号灯又亮了一遍，还是那四个字。这次没有人抬头看它。</p>
              <p>潮水把船抬起来，又放下。缆绳在桩子上咯吱作响，响一阵，停一阵。</p>
              <p>有人的胃叫了一声。没有人笑。</p>
              <p>问题没有解决，只是被推迟了。所有人都知道，出港之后，这笔账还是要算的。</p>
              <p>这就是夜航。等的时候，比走的时候长。</p>
              <p>等待比赶路更磨人。不知道要等多久的等，最磨人。</p>
              <p>阿槎把刀抽出来又还回去，反复了三次。第四次，刀归了鞘。</p>
              <p>舱里的温度跟水一样。陆沉靠着舱壁，数自己的呼吸，数到第一百下的时候，港那边响了梆子，很闷，隔着水。</p>
              <p>梆子响过三遍，港里的灯一盏一盏熄了。稽查船回了码头，码头空出来。</p>
              <p>陆沉睁开眼，把每个人看了一遍。看完了，点头。没有人问为什么。</p>
              <p>换岗了。</p>
              <p>巡灯的光调头回去，水面上最后一点亮也收走了。</p>
              <p>阿槎站起来，活动了一下腿，把刀插回腰后，刀鞘磕在门框上，响了一声。</p>
              <p>陆沉推门出去，夜风扑了满脸。港里静得能听见桅杆在响。</p>
              <p>门轴又响了一声，舱里的人都僵了一下。过了一会儿，脚步声一个跟一个出来了。</p>
              <p>解缆，收跳板，竹篙一点，船身擦着桩子滑出去。</p>
              <p>没有人说话。船走得极慢，快不得。水道里全是暗礁，图上标了七处，谁也不知道准不准。</p>
              <p>阿槎在船头打灯语，一下，两下，停。对岸没有回应。</p>
              <p>灯语打完第三遍，岸上突然亮了一下。很短，一灭。有人握紧了缆绳。</p>
              <p>水道越来越窄，两岸的黑影压过来，风也小了，只剩水在响。</p>
              <p>船底下的水声变急了。潮水推着船走。</p>
              <p>过了暗礁区，水面一下子宽了。所有人都松了口气，可谁都没有说话。</p>
              <p>风从船尾追上来，帆活了，绳子绷得直响。</p>
              <p>潮水在船头分开，又在船尾合上，没有一点多余的水声。</p>
              <p>图上的七处暗礁，过去了六处。每一处，都是阿槎先把灯语打出去，等一会儿，再打一遍。</p>
              <p>陆沉站在舵位，手心全是汗。他在心里把出港之后的路数了一遍，又数了一遍。</p>
              <p>风一阵一阵的，帆松了紧，紧了松。</p>
              <p>谁也没有提灯的事。灯还挂在桅顶，随着船身晃。</p>
              <p>走出礁区之前，谁都没有去碰那盏灯。它亮着，就当它只是亮着。</p>
              <p>阿槎回头望了一眼港口。港口的方向什么也看不见，只有水。</p>
              <p>水道拐了两个弯，把巡灯的方向彻底挡在了礁石后面。</p>
              <p>岸上有一点灯，很远，一闪一闪，不知道是巡灯还是渔火。</p>
              <p>没有人去数它闪了多少下。船没有回头。灯影消失的时候，天还早，风把水汽吹了满船。</p>

              <p class="chapter-head">第 2 章 第一位客人</p>
              <p>巡灯是亥时来的，光贴着水面一寸一寸扫过来的时候，阿槎正把最后半碗咸鱼粥推给陆沉……粥凉了，结了层薄油皮，腥气呛得嗓子发紧。</p>
              <p>「吃。」阿槎把碗往他手边又推了推，「查完这趟，天就该亮了。」</p>
              <p>陆沉没接话，几口把粥扒完，把碗扣在膝上，指甲一下一下刮着碗沿……巡灯的光从船头量到船尾，停了停，很快又退回去……船上只剩灯芯偶尔爆的一声轻响，和橹机上偶尔的一声吱呀……</p>
              <p>「没查我们？还是查了没说！」</p>
              <p>「查的是灯。」阿槎朝桅顶努了努嘴，那盏旧灯照旧挂着，晃晃悠悠，把两个人的影子投在舱板上，一会儿长，一会儿短，一会儿又叠在一起。</p>
              <p>「巡灯明晚还来？」</p>
              <p>「说不准。」阿槎把两只碗摞进桶里，「双日来，单日歇，明晚该歇。」</p>
              <p>陆沉盯着那点灯火看了半晌，忽然把袖子里的图按了按……还在。他松开手，掌心里一层薄汗……</p>
              <p>「到了暗礁区，叫醒我。」撂下这句，阿槎把外衣蒙在头上。</p>
              <p>潮水开始涨了，缆绳绷紧又松开，绷紧又松开，像船在夜里慢慢呼吸，远处暗礁区里浪头碎在石头上，沙沙地响，砸得人心里发慌。慌了一阵，又平了。</p>
              <p>按港里的规矩，查完灯就该装睡，陆沉把灯芯捻暗了半分，和衣躺下，耳朵却还留在潮声里，跟着潮头走，跟着潮尾回，一趟一趟……</p>
              <p>灯影在舱壁上晃，把梁的影子拉长又缩短。他盯着那道梁看了很久，直到眼睛发酸，才把眼睛闭上，只用耳朵。</p>
              <p>夜航的门道他比谁都熟，什么时候换岗，什么时候点灯，什么时候该把图贴身收着，他都记得清清楚楚……只是这一回，图是真是假，都得先活着出这道礁区才算数。</p>
              <p>他把这几天的潮时在心里排了一遍，明晚是单日，灯可以点得稍晚一些……省下的这半个时辰，够船悄悄走出一段黑路，也算把白日里欠的觉补了回来，天亮前这一段，就交给潮水……</p>
              <p>想到图，他又把袖口按了一遍。这一夜这动作做了四五回，手都快记住那块布的纹路了……</p>
              <p>后半夜，风换了方向，从岛那边过来，带着潮水的凉意，把舱里那点浊气换了换，也把困气换散了些……</p>
              <p>潮声一层压着一层，从远处的礁区滚过来，到了船底，散成细碎的响。阿槎的呼吸落进潮声里，一起一伏……</p>
              <p>阿槎翻了个身，说了半句梦话，没说完整，只剩两个字的尾音……</p>
              <p>陆沉应了一声，也不知道阿槎听见没有。舱里又静下来，只剩缆绳的吱呀，比先前慢了，也懒了……</p>
              <p>睡意是一阵一阵来的。来的时候沉，退的时候，耳朵反而更尖。尖到能听见舱外每一次换岗的脚步，听见它们走远……</p>
              <p>水声贴着船底走，从缓到急，又从急到缓，一圈一圈，跟着潮的性子……</p>
              <p>潮头一次比一次高。船身抬起的角度也一次比一次明显，连舱门都跟着吱呀了一声……</p>
              <p>他把碗摞好，收进桶里，又把桶往舱角推了推，免得船身一晃叮当响，吵醒好不容易来的困意。</p>
              <p>水位在涨，船身一点点抬高，系缆的绳子绷出新的角度……</p>
              <p>门缝里透进来的风变凉了，是后半夜的凉，露水气顺着门缝爬进来，把舱板洇出深色的一小片，一片连成一片……</p>
              <p>他把外衣裹紧了些。凉意从脚底爬上来，爬到膝盖，就停在那儿，不往上走……</p>
              <p>夜里的时间走得慢，黑不可怕，等才磨人，这是夜航的规矩。</p>
              <p>「什么时辰了？」</p>
              <p>「丑时过半。」陆沉看了看水位的记号，「再有一个时辰，进暗礁区。」</p>
              <p>「潮水几点转？」阿槎的声音从舱门那边过来，含糊，却清醒。</p>
              <p>「卯时。」陆沉竖起一根手指，「进礁区之前，还有一涨。」</p>
              <p>「图上标了几处？准吗？」</p>
              <p>「七处。」陆沉把图角从袖口抽出来一点，又塞回去，「标了七处，是十年前的图。水底下的礁，十年里会长高，也会搬家，谁说得准。」</p>
              <p>阿槎没再问，呼吸又匀了……</p>
              <p>陆沉把水位的记号又看了一遍。刻度在水线下面一点点爬，爬得不快，但一直在爬，稳当得叫人心里有底……</p>

              <p>他数潮。数到一百，乱了，重新数。数潮这件事没有什么用处，可是能让心里有着落。有落处的心，才压得住事。</p>

              <p>水一滴一滴从船板上退回去，退潮的节奏比涨潮慢。天亮之前的这一段，是一整夜里最黑的一段，也是最稳的一段。稳得能听见自己的心跳，一下，一下，跟潮错开半拍……</p>

    it.state = state;
    var paraAllSettled = fix.items.filter(function (x) { return x.f.para === it.f.para; })
      .every(function (x) { return x.state !== "pending"; });
    if (paraAllSettled) clearParaMark(fix.key, it.f.para);
    updateFixUI();
    if (!silent && state === "done") toast("这段过关了——随手重查，不花额度");
    checkAllDone();
  }
  function jumpTo(key, n) {
    var p = paraEl(key, n);
    if (!p) return;
    p.scrollIntoView({ behavior: "smooth", block: "center" });
    p.classList.remove("rw-flash");
    void p.offsetWidth;
    p.classList.add("rw-flash");
    setTimeout(function () { p.classList.remove("rw-flash"); }, 2200);
  }
  Object.keys(eds).forEach(function (key) {
    eds[key].addEventListener("click", function (e) {
      var doneBtn = e.target.closest("[data-fixdone]");
      var skipBtn = e.target.closest("[data-fixskip]");
      if (!doneBtn && !skipBtn) return;
      var n = Number((doneBtn || skipBtn).getAttribute(doneBtn ? "data-fixdone" : "data-fixskip"));
      fix.items.forEach(function (it, i) {
        if (it.f.para === n && it.state === "pending") setItemState(i, doneBtn ? "done" : "skip", !doneBtn);
      });
      if (!doneBtn) toast("已跳过——你的稿子你做主，这里不再提示");
    });
  });
  $("rw-m-body").addEventListener("click", function (e) {
    var fi = e.target.closest("[data-jump]");
    if (fi) { var n = Number(fi.getAttribute("data-jump")); closeModal("renwei"); jumpTo(current, n); }
  });

  /* ── 报告弹窗开关 ── */
  function openReport(key) {
    reportKey = key;
    setPhase(key, "intro");
    openModal("renwei");
  }
  function setPhase(key, phase) {
    var ch = RW.chapters[key];
    $("rw-m-pill").textContent = ch.label;
    $("rw-m-start").hidden = phase !== "intro";
    $("rw-m-clear").hidden = phase !== "result";
    $("rw-m-rerun").hidden = phase !== "result";
    $("rw-m-mark").hidden = phase !== "result";
    if (phase === "intro") {
      $("rw-m-note").textContent = "免费 · 正文不出你的电脑 · 只提建议，不动稿子";
      $("rw-m-body").innerHTML = '<div class="rw-intro">'
        + '<div class="rw-intro-k">这是做什么的</div>'
        + "<p>写完一章，让它和几百章真人小说对一对：哪里读起来像机器写的，直接圈出来，并告诉你怎么改。只提建议，动不动笔由你。</p>"
        + '<div class="rw-intro-k">怎么用——一轮四步，循环到满意</div>'
        + '<div class="rw-flow">'
        + '<div class="rw-fnode"><span class="fn-h"><span class="fn-n">1</span><b>验</b></span><i>先让朱雀查一遍，看 AI 占比</i></div>'
        + '<svg class="rw-farr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
        + '<div class="rw-fnode self"><span class="fn-h"><span class="fn-n">2</span><b>查</b></span><i>这里圈出像 AI 的地方（免费，随便查）</i></div>'
        + '<svg class="rw-farr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
        + '<div class="rw-fnode"><span class="fn-h"><span class="fn-n">3</span><b>改</b></span><i>照着边注提示自己动手，改一段看一段</i></div>'
        + '<svg class="rw-farr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h13M13 6l6 6-6 6"/></svg>'
        + '<div class="rw-fnode"><span class="fn-h"><span class="fn-n">4</span><b>再验</b></span><i>回朱雀再查一遍，看占比降了没</i></div>'
        + '</div>'
        + '<div class="rw-floop"><span>不满意就再来一轮——改到你觉得可以为止</span></div>'
        + '<div class="rw-intro-k">放心</div>'
        + "<p>免费，不花一分钱额度；正文不出你的电脑；太短的章节打不了分；只给建议，改不改你说了算。</p></div>";
    } else if (phase === "running") {
      $("rw-m-note").textContent = "正在对照真人基线…";
      $("rw-m-body").innerHTML = '<div class="rw-running">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.2-8.56"/></svg>'
        + "<span>正在把这一章和真人小说对照…</span></div>";
    } else {
      var ch2 = RW.chapters[key];
      $("rw-m-note").textContent = (ch2.findings || []).length
        ? "红＝一票否决 · 黄＝提示；改不改、怎么改，作家定夺"
        : "这里没发现毛病，不代表朱雀也放行——发布前不妨再让朱雀看一遍";
      renderResult(key);
    }
    requestAnimationFrame(function () { requestAnimationFrame(function () { $("rw-m-body").scrollTop = 0; }); });
  }

  /* ── 章切换（屏④换 13 章） ── */
  function setChapter(key) {
    current = key;
    var ch = RW.chapters[key];
    treeSel(key === "ch14" ? "第1章" : "第2章");
    $("rw-pct-num").textContent = ch.rail.now;
    qs(".pbar i").style.width = ch.rail.pbar + "%";
    $("rw-target-label").textContent = key === "ch13" ? "目标 2,000 字" : "目标 6,000 字";
    qs(".pct .sub").textContent = key === "ch13" ? "/2,000" : "/6,000";
    $(key === "ch13" ? "rw-status-words13" : "rw-status-words").textContent = ch.rail.now + " / " + (key === "ch13" ? "2,000" : "6,000") + " 字";
    $("rw-arch").innerHTML = key === "ch14"
      ? '<i data-ico="check"></i>上一章已归档 · 本章可写'
      : '<i data-ico="check"></i>本章已归档 · 可随时回改';
    document.querySelector("#rw-arch svg, #rw-arch i") && renderArchIcon();
    setTab("prose");
  }
  function renderArchIcon() {
    var el = document.querySelector("#rw-arch i[data-ico]");
    if (!el) return;
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "2");
    svg.setAttribute("width", "14");
    svg.setAttribute("height", "14");
    svg.innerHTML = '<path d="M5 13l4 4L19 7"/>';
    el.replaceWith(svg);
  }

  /* ── 四屏 ── */
  function go(screen) {
    document.querySelectorAll("[data-rwgo]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-rwgo") === screen); });
    if (screen === "s1") {
      current = "ch14";
      treeSel("第1章");
      $("rw-pct-num").textContent = RW.chapters.ch14.rail.now;
      qs(".pbar i").style.width = RW.chapters.ch14.rail.pbar + "%";
      $("rw-target-label").textContent = "目标 6,000 字";
      qs(".pct .sub").textContent = "/6,000";
      $("rw-status-words").textContent = RW.chapters.ch14.rail.now + " / 6,000 字";
      setTab("og");
      panes.ch14.hidden = true; panes.ch13.hidden = true;
      clearRw("ch14"); clearRw("ch13"); clearZq();
      closeModal("renwei");
      closeFixlist();
    } else if (screen === "s2") {
      setChapter("ch14"); applyZq(); openReport("ch14");
    } else if (screen === "s3") {
      setChapter("ch14"); applyZq(); applyRw("ch14"); openFixlist("ch14"); closeModal("renwei");
    } else if (screen === "s4") {
      setChapter("ch13"); applyRw("ch13"); closeFixlist(); openReport("ch13");
    }
  }
  document.querySelectorAll("[data-rwgo]").forEach(function (b) {
    b.addEventListener("click", function () { go(b.getAttribute("data-rwgo")); });
  });
  $("rw-rail-btn").addEventListener("click", function () { go("s2"); });
  $("rw-zq-btn").addEventListener("click", function () {
    toast("朱雀检测为既有在线检测——本原型演示其检测存档：见正文黄/红标注与章头占比条");
  });
  document.querySelectorAll("[data-rwzq]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.getAttribute("data-rwzq") === "clear") { clearZq(); toast("朱雀标注已清除（真实功能）"); }
      else { b.classList.remove("rw-hint"); toast("重检会消耗朱雀额度——真实功能，原型不模拟调用"); }
    });
  });

  /* ── 弹窗脚部 ── */
  $("rw-m-start").addEventListener("click", function () {
    setPhase(reportKey, "running");
    setTimeout(function () { setPhase(reportKey, "result"); }, 1200);
  });
  $("rw-m-rerun").addEventListener("click", function () {
    setPhase(reportKey, "running");
    setTimeout(function () { setPhase(reportKey, "result"); }, 1200);
  });
  $("rw-m-clear").addEventListener("click", function () {
    clearRw(current); closeFixlist(); toast("人味标注已清除");
  });
  $("rw-m-mark").addEventListener("click", function () {
    applyRw(reportKey); openFixlist(reportKey); closeModal("renwei");
    toast("已标记到正文——左右边注就是改稿提示，悬停边注看改法");
  });

  /* ── stale 演示：改到带标注的段＝逐段重扫精准消卡；改到别的位置＝全部失效＋朱雀置灰 ── */
  var staleTimer = null;
  var staleTarget = null;
  Object.keys(eds).forEach(function (key) {
    eds[key].addEventListener("input", function (e) {
      var t = e.target && e.target.closest ? e.target.closest("p") : null;
      if (!t) {
        var sel = window.getSelection();
        if (sel && sel.anchorNode) {
          var node = sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode;
          if (node) t = node.closest("p");
        }
      }
      staleTarget = t;
      if (staleTimer) clearTimeout(staleTimer);
      staleTimer = setTimeout(function () {
        var marked = staleTarget && staleTarget.classList.contains("rw-mark");
        if (marked) {
          var idx = parasOf(key).indexOf(staleTarget) + 1;
          clearParaMark(key, idx);
          if (fix.key === key) {
            fix.items.forEach(function (it) {
              if (it.f.para === idx && it.state === "pending") it.state = "done";
            });
            updateFixUI();
          }
          alignMarginNotes(key);
          if (key === "ch14" && zqApplied) {
            parasOf("ch14").forEach(function (p) {
              if (p.classList.contains("zq-warn") || p.classList.contains("zq-err")) {
                p.classList.remove("zq-warn", "zq-err");
                p.classList.add("zq-stale");
                var m = p.querySelector(".zq-mark");
                if (m) m.classList.add("stale");
              }
            });
            $("rw-zqhd").classList.add("stale");
          }
          toast("本段重扫通过，问题消除（本地 0 额度，随手可查）；朱雀结果置灰，可能过期");
          checkAllDone();
        } else {
          clearRw(key);
          if (key === "ch14" && zqApplied) {
            parasOf("ch14").forEach(function (p) {
              if (p.classList.contains("zq-warn") || p.classList.contains("zq-err")) {
                p.classList.remove("zq-warn", "zq-err");
                p.classList.add("zq-stale");
                var t2 = p.querySelector(".zq-mark");
                if (t2) t2.classList.add("stale");
              }
            });
            $("rw-zqhd").classList.add("stale");
          }
          toast("正文已修改：人味标注已清除（零成本，重新检测即刷新）；朱雀结果已置灰，可能过期");
        }
      }, 700);
    });
  });
})();
</script>
</body>
</html>
