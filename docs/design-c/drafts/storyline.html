/* 任务跑完：有提案就等作家确认，没有就直接算完成 */
function jobsAdvance(id, key){
  const jobs = state.jobs[id]; if(!jobs) return;
  const j = jobs.filter(function(x){ return x.key===key; })[0];
  if(!j || j.status!=='run') return;
  const set = j.set==='book' ? BOOK_TASKS : ARCHIVE_TASKS;
  const task = set.filter(function(x){ return x.key===key; })[0] || {};
  if(task.fail && !j.retried) j.status = 'fail';
  else if(j.proposal && j.proposal.length) j.status = 'review';
  else j.status = 'done';
  jobsTick(id);
}
/* 只在作家没在编辑、且正看着这一章时重绘，免得打断输入；全书收尾则重绘完本弹窗 */
function jobsTick(id){
  if(id==='__book'){ if(state.finishOpen) renderFinish(); return; }
  if(state.edit || state.sel!==id) return;
  render();
}
/* 归档卡里的任务区：归档前给清单，归档后给进度 */
function jobsClosure(jobs){
  const o = {total:(jobs||[]).length, run:0, review:0, fail:0, done:0};
  (jobs||[]).forEach(function(j){
    if(j.status==='run') o.run++;
    else if(j.status==='review') o.review++;
    else if(j.status==='fail') o.fail++;
    else o.done++;
  });
  o.left = o.run + o.review + o.fail;   /* 进行中 / 待确认 / 失败都算没收尾 */
  o.settled = o.total - o.left;
  o.closed = o.total>0 && o.left===0;
  return o;
}
/* 这一章还剩几项没收尾：章节树上的待办小点用它 */
function jobsLeft(id){
  const jobs = state.jobs[id];
  if(!jobs || !jobs.length) return 0;
  return jobsClosure(jobs).left;
}

    + '</div>';

function archiveJobsHTML(id){
  const jobs = state.jobs[id] || []; if(!jobs.length) return '';
  const k = jobsClosure(jobs);

    ? '<span class="tkc-t ok">归档收尾已完成</span><span class="tkc-n">'+jobs.length+' 项全部处理完</span>'
    : '<span class="tkc-t">归档收尾 · 已处理 '+k.settled+'/'+k.total+'</span>'
      + (k.run ? '<span class="tkc-p run">进行中 '+k.run+'</span>' : '')
      + (k.review ? '<span class="tkc-p review">待确认 '+k.review+'</span>' : '')
      + (k.fail ? '<span class="tkc-p fail">失败 '+k.fail+'</span>' : '');
  const toggle = k.closed
    ? '<button class="btn btn-sm btn-quiet" data-jobs-open="'+id+'">'+(open?'收起明细':'查看明细')+'</button>'
    : '';
  const showList = !k.closed || open;
  return '<div class="op-wb">'
    + '<div class="tk-closure'+(k.closed?' done':'')+'">'+status+toggle+'</div>'
    + (showList
      ? '<div class="tk-list">'+ jobs.map(function(j){ return taskRowHTML(id,j); }).join('') +'</div>'
      : '')
    + '</div>';
}
function taskRowHTML(id, j){
  const st = TK_ST[j.status] || ['',''];
  const props = (j.proposal && j.proposal.length) ? j.proposal.map(wbItemText).join('；') : '';

  else if(j.status==='fail') acts = '<span class="tk-act">'
    + '<button class="btn btn-sm" data-job="retry" data-job-id="'+id+'" data-job-key="'+j.key+'">重试</button></span>';

    + (props ? '<p class="tk-n tk-p"><b>提案</b>'+props+'</p>' : '')
    + acts
    + '</div>';
}
/* 后台任务的三个动作：确认写回 / 忽略 / 重试 */
function jobAction(act, id, key){
  const jobs = state.jobs[id]; if(!jobs) return;
  const j = jobs.filter(function(x){ return x.key===key; })[0]; if(!j) return;
  const book = id==='__book';
  if(act==='ok'){
    const c = byId(id);
    if(c){ /* 归档收尾：确认写回，进全书那套设定 */
      if(j.proposal && j.proposal.length)
        j.proposal.forEach(function(x){ c.changes.push({k:x.k, v:x.v, d:x.d}); });
      j.status = 'done'; render();
      toast(j.proposal && j.proposal.length ? ('已写回 '+j.proposal.length+' 条 · '+j.label) : (j.label+' 已完成'));
      return;
    }
    /* 全书收尾：确认即视为已处理，不写回开书骨架；伏笔巡检的确认把悬置伏笔记为故意留白 */
    if(book && j.key==='hook') openHooks().forEach(function(h){ state.book.parked[h.name] = true; });
    j.status = 'done'; j.proposal = [];
    j.result = j.result || '已确认处理完。';
    if(state.finishOpen) renderFinish(); else render();
    toast(j.label+' 已确认 · 开书骨架不受影响');
    return;
  }
  if(act==='no'){
    j.status = 'done'; j.proposal = [];
    j.result = book ? '这次的提案先搁置，之后可再跑一遍全书收尾。' : '已忽略这次的提案，全书那套设定不变。';
    if(state.finishOpen) renderFinish(); else render();
    toast(book ? '已搁置这次的提案' : '已忽略这次的提案');
    return;
  }
  if(act==='retry'){
    j.retried = true; j.status = 'run';
    if(state.finishOpen) renderFinish(); else render();
    setTimeout(function(){
      const cur = (state.jobs[id]||[]).filter(function(x){ return x.key===key; })[0];
      if(cur && cur.status==='run'){ cur.status = 'done'; jobsTick(id); }
    }, 1100);
    return;
  }

  Object.keys(CHAR_BASE).forEach(n=>{ s[n]=1; });
  CH.forEach(c=>(c.changes||[]).forEach(x=>{

function addChangeEntry(entry){
  const k = (entry.k||'').trim();
  if(!k) return 'empty';
  const v = (entry.v||'').trim(), d = entry.d||'new';
  if(state.write){
    state.write.changes = state.write.changes || [];
    if(state.write.changes.some(x=>x.k===k)) return 'dup';
    state.write.changes.push({k:k, v:v, d:d});
    return 'ok';
  }
  const c = state.sel ? byId(state.sel) : null;
  if(!c) return 'empty';
  c.changes = c.changes || [];
  if(c.changes.some(x=>x.k===k)) return 'dup';
  c.changes.push({k:k, v:v, d:d});
  if(c.status==='archived') downstreamStale(c);
  return 'ok';
}

/* AI 从正文与章纲里认出的三类变化：新增角色 / 角色设定变化 / 装备·物品 */
const ITEM_CUES = ['信标','锚点','航图','船徽','镜子','刻痕','频道','录音','接收阵列','跃迁阵列',
  '记录仪','圆盘','钥匙','徽章','晶体','罗盘','信物'];
function recordedText(){
  const L = [];
  BASE_SETTINGS.forEach(x=>L.push((x.k||'')+' '+(x.v||'')));
  CH.forEach(c=>(c.changes||[]).forEach(x=>L.push((x.k||'')+' '+(x.v||''))));
  return L.join(' ');
}
function detectCharChanges(no, ch){
  const o = ch ? olOf(ch) : blankOl();
  const cast = (o.cast||[]).slice();
  const known = {};
  Object.keys(NODE_META).forEach(n=>{ known[n]=1; });
  Object.keys(CHAR_BASE).forEach(n=>{ known[n]=1; });
  const rec = recordedText();
  const own = ch ? (ch.changes||[]) : (state.write ? (state.write.changes||[]) : []);
  const hasOwn = k => own.some(x=>(x.k||'')===k);
  const items = [];
  cast.forEach(n=>{
    if(!known[n] && !hasOwn('人物 · '+n))
      items.push({id:'新增角色|'+n, cat:'新增角色', k:'人物 · '+n, v:'本章登场，全书还没有档案', d:'new',
        why:'出场角色里出现了全书档案没有的「'+n+'」'});
  });
  cast.forEach(n=>{
    if(hasOwn('人物 · '+n)) return;
    const named = (o.change||'').indexOf(n)>=0 || (o.events||[]).join(' ').indexOf(n)>=0;
    if(known[n] && named){
      const v = (o.change||'').indexOf(n)>=0 ? o.change.replace(/^[^：]*：/,'') : '本章有新的动作与处境';
      items.push({id:'角色设定变化|'+n, cat:'角色设定变化', k:'人物 · '+n, v:v, d:'upd',
        why:'章纲里「'+n+'」有新的动作或变化，本章变化还没记这一条'});
    }
  });
  const seen = {};
  ITEM_CUES.forEach(cue=>{
    if(seen[cue] || rec.indexOf(cue)>=0) return;
    seen[cue] = 1;
    const text = [(o.events||[]).join(' '), o.story||'', o.place||'', (ch&&ch.body)||''].join(' ');
    if(text.indexOf(cue)<0 || hasOwn('核心物件 · '+cue)) return;
    items.push({id:'物品|'+cue, cat:'装备 · 物品', k:'核心物件 · '+cue,
      v:'本章出现的关键物件，还没登记', d:'new',
      why:'正文与章纲里出现了「'+cue+'」，全书设定与本章变化都还没有它'});
  });
  return {no:no, items:items};
}

function applyRelDetect(){
  const pr = state.relDetect; if(!pr) return;

  pr.items.forEach(x=>{
    if(p[x.id]===false) return;
    const r = addChangeEntry({k:x.k, v:x.v, d:x.d});
    if(r==='ok') n++; else if(r==='dup') dup++;
  });
  state.relDetect = null; state.relPick = null; render();
  if(!n){ toast(dup ? '这些变化本章已经登记过了' : '这一章还不能写入变化'); return; }

/* 角色关系 tab：图数据库式 · 点 / 边 · 全书一套 · 章内只读投影 · 本章边高亮
   本章可在图上新增关系：记的是本章变化，归档时并进全书那套关系 */
function relsHTML(no, order, canAdd){
  const g = graph(order);
  const L = graphLayout(g);
  const abbr = n => NODE_ABBR[n] || n.slice(-1);
  const edges = g.edges.map((e,i)=>{
    const p=L.pos[e.a], q=L.pos[e.b];
    if(!p || !q) return '';
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    const hit = !!(e.origin && e.origin.no===no);
    return '<line class="gedge'+(hit?' hit':'')+(e.stale?' stale':'')+'" x1="'+p.x+'" y1="'+p.y+'" x2="'+q.x+'" y2="'+q.y+'"/>'
      + '<g class="gnum'+(hit?' hit':'')+'"><circle cx="'+mx+'" cy="'+my+'" r="10"/>'
      + '<text x="'+mx+'" y="'+my+'" text-anchor="middle" dominant-baseline="central">'+pad(i+1)+'</text></g>';
  }).join('');
  const nodes = g.nodes.map(n=>{
    const p=L.pos[n.name];
    const lp=labelAt(p);
    return '<g class="gnode gn-'+n.type+'">'
      + '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+p.r+'"/>'
      + '<text class="gabbr" x="'+p.x+'" y="'+p.y+'" text-anchor="middle" dominant-baseline="central">'+esc(abbr(n.name))+'</text>'
      + '<text class="glabel" x="'+lp.x+'" y="'+lp.y+'" text-anchor="'+lp.anchor+'"'+(lp.mid?' dominant-baseline="central"':'')+'>'+esc(n.name)+'</text>'
    + '</g>';
  }).join('');
  const legend = '<div class="graph-legend">'
    + ['lead','cast','force','other'].map(t=>'<span class="lg"><i class="gn-'+t+'"></i>'+NODE_TAG[t]+'</span>').join('')
  + '</div>';
  const rows = g.edges.map((e,i)=>{
    const hit = !!(e.origin && e.origin.no===no);
    const state = !e.origin ? '开书设定' : (e.stale ? '基于旧设定' : '随剧情演变');
    const origin = e.origin ? ('第 '+e.origin.no+' 章 · '+e.origin.title) : '开书设定 · 全书统一';
    return '<div class="lrow edge-row'+(hit?' hit':'')+'">'
      + '<span class="enum">'+pad(i+1)+'</span>'
      + '<span class="lname">'+esc(e.a)+' <span class="earrow">↔</span> '+esc(e.b)+'<em>'+origin+' · '+esc(e.label)+'</em></span>'
      + '<span class="lstate">'+state+'</span>'
    + '</div>';
  }).join('');
  const top = canAdd
    ? (state.relDraft
        ? olTop('<span class="note">新增关系 · 记进第 '+no+' 章的本章变化</span>', '')
        : olTop('<span class="note">角色关系 · 全书统一维护，这一章只读投影</span>',
            '<button class="btn btn-sm" data-rel-add="1">＋ 添加关系</button>'))
    : '';
  return top
    + (state.relDraft ? relFormHTML() : '')
    + '<p class="seg-h">角色关系 <span class="note">点 = 人物 / 势力，边 = 关系 · 全书统一维护，这一章只读 · 本章新建或变化的关系在图上高亮</span></p>'
    + '<div class="graph">'+legend
      + '<svg viewBox="0 0 '+L.W+' '+L.H+'" role="img" aria-label="角色关系图：'+g.nodes.length+' 个人物或势力、'+g.edges.length+' 条关系">'
      + edges + nodes + '</svg></div>'
    + '<p class="seg-h">关系边 <span class="note">'+g.nodes.length+' 个人物 · '+g.edges.length+' 条关系</span></p>'
    + (rows ? '<div class="ledger edge-ledger">'+rows+'</div>' : '<p class="vempty">还没有关系边。</p>')
    + (g.isolates.length ? '<p class="graph-iso">还没连线：'+g.isolates.map(esc).join(' · ')+'</p>' : '');
}

function volumeEditorHTML(v){
  const mains = mainOf(v.id);
  const last = mains.slice(-1)[0] || plannedOf(v.id).slice(-1)[0];
  const order = last ? last.order : 0;
  let inner;
  if(state.viewTab==='chapters') inner = volChaptersHTML(v);
  else if(state.viewTab==='rels') inner = relsHTML(0, order, false);
  else if(state.viewTab==='hooks') inner = hooksHTML(0, order);
  else inner = volOutlineHTML(v);
  const archived = mains.filter(c=>c.status==='archived').length;
  const nCh = mains.length + plannedOf(v.id).length + (pendingInfo().vol===v.id?1:0);
  return ''

  +   '<p class="e-kicker">卷 · 分卷计划</p>'

  + '</div>'
  + '<div class="e-toolbar">'+volTabs()+'</div>'
  + '<div class="e-scroll"><div class="e-pad">'+inner+'</div></div>';
}
function editorHTML(){
  if(state.write) return writeEditorHTML();
  if(state.sel && state.sel.indexOf('__vol:')===0){ const v=volOf(state.sel.slice(6)); if(v) return volumeEditorHTML(v); }
  if(state.sel==='__pending') return pendingEditorHTML();
  const c = state.sel ? byId(state.sel) : null;
  if(!c) return '<div class="e-empty">在左侧目录里选一章，上面一行页签会展开它的章纲、正文、提示词、设定与关系伏笔，重写与回退收在「操作」页签里。</div>';
  if(c.ghostOf) return ghostEditorHTML(c);
  return readEditorHTML(c);
}

/* 调参提案预览：维度 · 基线值 → 建议值 · 依据 */
function styleProposalCard(pr){
  if(!pr || !pr.changes.length)

/* 当前语境：卷 / 待写 / 旧稿 / 阅读 / 写作 */
function aiCtx(){
  if(state.write){
    const w = state.write, c = w.id ? byId(w.id) : null;
    return { mode:'write', tab:state.viewTab, no:w.no, order:c?c.order:Infinity, ch:c };
  }
  if(state.sel && state.sel.indexOf('__vol:')===0){
    const v = volOf(state.sel.slice(6));
    return v ? { mode:'vol', tab:state.viewTab, vol:v } : null;
  }
  if(state.sel==='__pending'){
    const p = pendingInfo();
    return { mode:'pending', tab:state.viewTab, no:p.no, order:pendingOrder(p), ch:p.planned, p:p };
  }
  const c = state.sel ? byId(state.sel) : null;
  if(!c) return null;
  if(c.ghostOf) return { mode:'ghost', tab:state.viewTab, ch:c, no:c.no, order:c.order };
  return { mode:'read', tab:state.viewTab, ch:c, no:c.no, order:c.order };
}
/* 章节语境：8 个页签各给一套体检 + 动作 */
function aiChapterHTML(ctx){
  const isW = ctx.mode==='write';
  const w = isW ? state.write : null;
  const ch = ctx.ch || null;
  const p = ctx.p || null;
  const no = ctx.no, order = ctx.order, tab = ctx.tab;
  const o = ch ? olOf(ch) : blankOl();
  const key = 'm'+no;
  const vol = volOf(isW ? w.vol : (ch ? ch.vol : (p ? p.vol : null)));
  const vn = vol ? vol.name : '';
  const req = olReq(o);
  const reqOk = req.filter(x=>x[1]).length;
  const reqMiss = req.filter(x=>!x[1]).map(x=>x[0]);
  const bodyN = wordCount(isW ? (w.body||'') : (ch && ch.body ? ch.body : ''));
  const plan = o.words || 0;
  const pct = plan ? Math.min(100, Math.round(bodyN/plan*100)) : 0;
  const gr = growth(order);
  const gh = hooks(order);
  const opn = gh.filter(h=>!h.resolved);
  const plantHere = gh.filter(h=>h.planted && h.planted.no===no);
  const resHere = gh.filter(h=>h.resolved && h.resolved.no===no);
  const g = graph(order);
  const staleDn = ch ? allMain().filter(x=>x.order>order && x.stale).length : 0;
  const sh = styleShadow(key);
  const ov = sh ? shadowCount(sh) : 0;
  const promptStr = isW ? (w.prompt||'')
    : (ch ? promptOf(ch) : (p ? promptText(p.no, p.planned) : ''));
  const stName = isW ? '草稿' : (p ? '待写' : (ch && ch.status==='planned' ? '拟定'
    : (ch && ch.status==='draft' ? '草稿' : '已归档')));
  const words = v=>{ return v+' 字'; };
  let lead = '', cards = '';
  if(tab==='outline'){
    lead = '按'+vn+'卷纲与本卷人物检查、补全第 '+no+' 章的章纲；必填六项决定这一章能否归档。';
    cards = aiStats([['归档门槛', reqOk+'/6'],['计划字数', plan?words(plan):'未定'],
        ['关键事件', o.events.length+' 条'],['出场角色', o.cast.length+' 人']])
      + (reqMiss.length
        ? aiList('还缺', reqMiss.map(x=>['<b>'+esc(x)+'</b> 未填','warn']))
        : '')
      + aiActs('章纲辅助', [['剧情推演 · 按回合走一遍','剧情推演'],
          ['补全缺失字段','补全第 '+no+' 章缺失的章纲字段'],
          ['按卷纲生成本章章纲','按'+vn+'卷纲生成第 '+no+' 章章纲'],
          ['与卷纲冲突检测','检查第 '+no+' 章章纲与'+vn+'卷纲是否冲突']]);
  } else if(tab==='body'){
    lead = '贴着第 '+no+' 章的章纲与全书文风，续写、扩写或改写已有的正文。';
    cards = aiStats([['正文字数', words(bodyN)],['计划字数', plan?words(plan):'未定'],
        ['完成度', plan?pct+'%':'—'],['状态', stName]])
      + aiActs('正文辅助', [['续写这一段','续写第 '+no+' 章正文'],
          ['润色选中段落','润色第 '+no+' 章选中段落'],
          ['扩写场景','扩写第 '+no+' 章场景'],
          ['压缩啰嗦段落','压缩第 '+no+' 章的啰嗦段落']]);
  } else if(tab==='prompt'){
    lead = '提示词由六处来源自动组装：全书设定、卷纲、本章章纲、全书文风（含本章调整）、截至上一章的伏笔进展、本章涉及的角色设定。';

  const note = p ? ' <b>这一章尚未开写</b>：先把章纲补到能过归档门槛。'
    : (isW ? ' 当前在写作态，AI 产出先落进草稿，归档前不写回主线。' : '');
  return aiShell(tab, lead+note, cards);
}
/* 旧稿支线：只读对照 */
function aiGhostHTML(ctx){
  const c = ctx.ch;
  const sib = ghostsOf(c.vol, c.ghostOf).length;
  return aiShell('', '第 '+c.no+' 章是旧稿支线，已脱离主线、只读；AI 只做对照，不改写主线。',
    aiStats([['状态','旧稿支线'],['参与主线','否'],['脱离自','第 '+c.ghostOf+' 章'],['同源旧稿', sib+' 章']])
    + aiActs('对照辅助', [['与主线差异摘要','比较第 '+c.no+' 章旧稿与主线的差异'],
        ['提取可复用片段','从第 '+c.no+' 章旧稿里提取可复用片段']]));
}
/* 卷语境：卷纲 / 本卷章节 / 角色关系 / 伏笔 */
function aiVolHTML(ctx){
  const v = ctx.vol, tab = ctx.tab;
  const main = mainOf(v.id), plan = plannedOf(v.id);
  const arch = main.filter(c=>c.status==='archived').length;
  const draft = main.filter(c=>c.status==='draft').length;
  const needOl = main.concat(plan).filter(c=>{ const x = CH_OL[c.id]; return !x || !x.task; }).length;
  let lead = '', cards = '';
  if(tab==='outline'){
    lead = '卷纲只定剧情走向——核心矛盾、目标、关键节点与伏笔；角色的具体言行交给角色设定推导。';
    cards = aiStats([['章数目标', v.total?v.total+' 章':'不设'],['已写章节', main.length+' 章'],
        ['关键节点', (v.nodes?v.nodes.length:0)+' 个'],['登场人物', (v.cast?v.cast.length:0)+' 人']])
      + aiActs('卷纲辅助', [['按卷纲补全本卷章纲','按'+v.name+'卷纲补全本卷章节的章纲'],
          ['卷内节奏体检','体检'+v.name+'的节奏与节点分布'],
          ['生成卷末钩子建议','为'+v.name+'建议卷末钩子']]);
  } else if(tab==='chapters'){
    lead = '本卷共 '+main.length+' 章（另有 '+plan.length+' 章拟定）；缺章纲的章节会直接影响 AI 生成的稳定性。';
    cards = aiStats([['章节总数', main.length+' 章'],['已归档', arch+' 章'],
        ['草稿 / 拟定', draft+' / '+plan.length],['缺章纲', needOl+' 章']])
      + aiActs('章节辅助', [['章纲一致性检查','检查'+v.name+'各章章纲是否互相一致'],
          ['补全缺失章纲','补全'+v.name+'缺失的章纲'],
          ['重排章序建议','为'+v.name+'建议章节顺序']]);
  } else if(tab==='rels'){
    const all = graph(Infinity);
    const es = all.edges.filter(e=>!e.origin || e.origin.vol===v.id);
    const ns = {}; es.forEach(e=>{ ns[e.a]=1; ns[e.b]=1; });
    lead = '关系图是本卷章节写完后向上回写的结果，卷纲本身不改动。';
    cards = aiStats([['本卷关系边', es.length+' 条'],['涉及人物与势力', Object.keys(ns).length+' 个'],
        ['全书关系边', all.edges.length+' 条'],['开书设定关系', GRAPH_BASE.length+' 条']])
      + aiActs('关系辅助', [['本卷关系变化检测','检测'+v.name+'的关系变化'],
          ['关系冲突检测','检查'+v.name+'关系与全书关系图是否冲突']]);
  } else {
    const all = hooks(Infinity);
    const plantedHere = all.filter(h=>h.planted && h.planted.vol===v.id);
    const openHere = plantedHere.filter(h=>!h.resolved);
    const resHere = all.filter(h=>h.resolved && h.resolved.vol===v.id);
    lead = '本卷该埋与该收的伏笔；跨卷悬置的会继续挂在全书台账上。';
    cards = aiStats([['本卷埋下', plantedHere.length+' 条'],['本卷悬置', openHere.length+' 条'],
        ['本卷回收', resHere.length+' 条'],['全书悬置', all.filter(h=>!h.resolved).length+' 条']])
      + aiActs('伏笔辅助', [['本卷伏笔回收提醒','列出'+v.name+'该回收的伏笔'],
          ['伏笔冲突检测','检查'+v.name+'伏笔与全书台账是否冲突']]);
  }
  return aiShell(tab, lead, cards);
}
function aiHTML(){
  const ctx = aiCtx();
  if(!ctx) return aiShell('', '在左侧目录里选中一章或一卷，这里会给出对应页签的 AI 辅助：章纲检查、正文续写、提示词组装、设定与关系伏笔的检测。',
    aiStats([['当前主线', (()=>{ const c=currentChapter(); return c?('第 '+c.no+' 章'):'—'; })()],
      ['悬置伏笔', hooks(Infinity).filter(h=>!h.resolved).length+' 条'],

/* ═══════════ 阅读预览 ＋ 导出成稿 ═══════════
   预览三栏：左=主线章节目录 / 中=阅读排版（字号·字体·行距·主题）/ 右=配置与导出。
   阅读全部取主线（不含旧稿支线）；导出 pdf/word/txt/md 覆盖有正文的章节。 */
function pvChapters(){ return CH.filter(c=>!c.ghostOf).sort((a,b)=>a.order-b.order); }
function pvCurrent(){
  const id = state.pv.sel;
  const c = id && byId(id) && !byId(id).ghostOf ? byId(id) : null;
  if(c) return c;
  const chs = pvChapters();
  const withBody = chs.filter(x=>String(x.body||'').trim());
  const pick = withBody.slice(-1)[0] || chs[0] || null;
  if(pick) state.pv.sel = pick.id;
  return pick;
}
function pvStep(d){
  const chs = pvChapters();
  const cur = pvCurrent();
  const i = cur ? chs.findIndex(x=>x.id===cur.id) : -1;
  const n = i>=0 ? chs[i+d] : (d>0 ? chs[0] : chs[chs.length-1]);
  if(!n){ toast(d>0 ? '已经是最后一章了' : '已经在第一章了'); return; }
  state.pv.sel = n.id;
  renderPreview();
}
function pvSetCfg(d){
  const m = String(d||'').split(':');
  const kind = m[0], val = m[1];
  if(!kind || !val) return;
  if(!(kind==='font'||kind==='size'||kind==='line'||kind==='theme')) return;
  state.pv[kind] = val;
  const root = $('#pv-work'); if(root) pvApplyCfg(root);
  const wrap = $('#pv-read') ? $('.pv-prose-wrap', $('#pv-read')) : null;
  if(wrap){ wrap.classList.remove('theme-paper','theme-sepia','theme-night'); wrap.classList.add('theme-'+state.pv.theme); }
  const side = $('#pv-side'); if(side) side.innerHTML = pvSideHTML();
}
function pvApplyCfg(root){
  const p = state.pv;
  root.style.setProperty('--pv-size', p.size==='l' ? '18px' : p.size==='s' ? '14px' : '16px');
  root.style.setProperty('--pv-line', String(p.line));
  root.style.setProperty('--pv-font', p.font==='sans'
    ? "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    : p.font==='kai' ? "'Kaiti SC','KaiTi','STKaiti',Georgia,serif" : 'var(--font-display)');
}
function pvTocHTML(){
  return VOLS.map(v=>{
    const chs = pvChapters().filter(c=>c.vol===v.id);
    if(!chs.length) return '';
    return '<div class="pv-vol">第 <b>'+esc(v.name)+'</b> · '+chs.length+' 章</div>'
      + chs.map(c=>{
          const on = state.pv.sel===c.id;
          const has = String(c.body||'').trim();
          const tag = c.status==='planned' ? '<span class="tag wip">拟定</span>'
            : c.status==='draft' ? '<span class="tag live">草稿</span>' : '<span class="tag">已归档</span>';
          return '<button type="button" class="pv-ch'+(on?' on':'')+'" data-pv-sel="'+c.id+'" aria-pressed="'+(on?'true':'false')+'">'
            + '<span class="no">第'+c.no+'章</span>'
            + '<span class="ti">'+esc(c.title||'（未命名）')+'</span>'
            + (has?'<span class="wc">'+wordCount(c.body)+'字</span>':'')
            + tag
          + '</button>';
        }).join('');
  }).join('');
}
function pvReadHTML(){
  const c = pvCurrent();
  const chs = pvChapters();
  const i = c ? chs.findIndex(x=>x.id===c.id) : -1;
  const prev = i>0 ? chs[i-1] : null;
  const next = c && i<chs.length-1 ? chs[i+1] : null;
  const vol = c ? volOf(c.vol) : null;
  const body = (c && String(c.body||'').trim())
    ? proseHTML(c.body)
    : '<p class="vempty">这一章还没有正文，还在章纲阶段。</p>';
  const turnBtn = (dir,label,item)=>'<button type="button" class="pv-turn" data-pv-'+dir+'="1"'+(item?'':' aria-disabled="true"')+'>'+label+'</button>';
  return ''
    + '<div class="pv-read-top">'
    + '<span class="pos">'+(vol?'<b>'+esc(vol.name)+'</b> · ':'')+'第 '+(c?c.no:'—')+' 章'+(c?' · '+esc(c.title):'')+'</span>'
    + turnBtn('prev','上一章',prev)
    + turnBtn('next','下一章',next)
    + '</div>'
    + '<div class="pv-prose-wrap theme-'+state.pv.theme+'">'
    + (c
        ? '<div class="pv-chapter">'
          + (vol?'<p class="pv-voltag">'+esc(vol.name)+'</p>':'')
          + '<h2>'+esc(c.title||'第 '+c.no+' 章')+'</h2>'
          + '<p class="pv-meta">第 '+c.no+' 章 · '+statusText(c)+(c.stale?' · 基于旧设定':'')+' · '+wordCount(c.body)+' 字</p>'
        + '</div>'
        : '<p class="vempty">这本书还没有可预览的章节。</p>')
    + '<div class="pv-prose">'+body+'</div>'
    + '</div>';
}
function bookStatusHint(){
  if(state.book.done) return '<p class="pv-hint">状态：<b>已完结</b> · 顶栏「全书收尾」可看收尾进度或撤完本。</p>';
  if(bookFinishReady()) return '<p class="pv-hint">全书章节都已归档 · 回顶栏按下「完本」。</p>';
  const left = allMain().filter(c=>c.status!=='archived').length + plannedChapters().length;
  return '<p class="pv-hint">连载中 · 还差 '+left+' 章写完。</p>';
}
function pvSideHTML(){
  const p = state.pv;
  const chs = pvChapters();
  const totalWords = chs.reduce((a,c)=>a+wordCount(c.body),0);
  const archived = chs.filter(c=>c.status==='archived').length;

    + opts.map(o=>'<button type="button" data-pv-cfg="'+kind+':'+o[0]+'" class="'+(p[kind]===o[0]?'on':'')+'" aria-pressed="'+(p[kind]===o[0]?'true':'false')+'">'+o[1]+'</button>').join('')
    + '</div></div>';
  return ''
    + '<div class="pv-card"><h4>全书概览</h4><div class="stat-line">'
    + '<span>章节 <b>'+chs.length+'</b></span>'
    + '<span>字数 <b>'+totalWords+'</b></span>'
    + '<span>已归档 <b>'+archived+'</b> · 草稿 '+draft+' · 拟定 '+planned+'</span>'
    + '</div>' + bookStatusHint() + '</div>'
    + seg('size','字号',[['s','小'],['m','中'],['l','大']])
    + seg('font','字体',[['serif','衬线'],['sans','黑体'],['kai','楷体']])
    + seg('line','行距',[['1.6','紧凑'],['1.85','舒适'],['2.2','宽松']])
    + seg('theme','主题',[['paper','白纸'],['sepia','护眼'],['night','夜间']])
    + '<div class="pv-card"><h4>导出成稿</h4><div class="pv-export">'
    + '<button type="button" class="btn btn-accent" data-export-open data-od-id="export-open">导出成稿…</button>'
    + '</div><p class="pv-hint">选择格式与本地保存位置，导出 '+chs.filter(c=>String(c.body||'').trim()).length+' 章有正文的章节。</p></div>';
}
function renderPreview(){
  $('#pv-count').textContent = '主线 '+pvChapters().length+' 章 · '+VOLS.length+' 卷 · 不含旧稿';
  $('#pv-toc').innerHTML = pvTocHTML();

function switchMod(mod){
  if(mod!=='writing' && mod!=='preview') return;
  if(state.mod===mod) return;
  readWrite();
  state.mod = mod;
  const w = $('#write-work'), p = $('#pv-work');
  if(w) w.hidden = mod!=='writing';
  if(p) p.hidden = mod!=='preview';

/* ── 导出成稿：C 端弹窗 · 勾选格式并选本地保存地址，导出在后台进行，完成后提示 ·
   不产生浏览器下载；保存位置与文件产出由客户端在本机执行，原型只做交互与进度示意 ── */
const EX_FMTS = [
  {k:'pdf',  tit:'PDF',        ext:'.pdf',  sub:'按阅读排版导出，适合分享与打印'},
  {k:'word', tit:'Word',       ext:'.docx', sub:'保留章节标题与题记，便于继续编辑'},
  {k:'txt',  tit:'纯文本',      ext:'.txt',  sub:'只留正文，任何编辑器都能打开'},
  {k:'md',   tit:'Markdown',   ext:'.md',   sub:'保留标题层级与引用，方便排版'}
];
const EX_DIRS = ['文稿/星海拾遗/主线全稿','桌面/星海拾遗','下载/星海拾遗','文稿/我的作品/星海拾遗'];
function exOpen(){

  $('#pv-export').classList.add('on');
}
function exClose(){
  $('#pv-export').classList.remove('on');

  state.ex.phase = 'form'; state.ex.pct = 0;
}
function exBg(){
  /* 后台运行：只收起弹窗，导出继续；完成后 ex 定时器推 toast */
  $('#pv-export').classList.remove('on');
  toast('导出在后台继续 · 完成后会提示');
}
function exFmtOn(){ return EX_FMTS.filter(f=>state.ex.fmts[f.k]); }
function exSync(){
  const d = document.getElementById('ex-dir'); if(d && String(d.value||'').trim()) state.ex.dir = d.value.trim();
  const n = document.getElementById('ex-name'); if(n && String(n.value||'').trim()) state.ex.name = n.value.trim();
}
function exTickSvg(){ return '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 8.6l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function exFolderSvg(){ return '<svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M2.5 5.5h5.2l1.5 2h8.3v7.4a1.3 1.3 0 0 1-1.3 1.3H3.8a1.3 1.3 0 0 1-1.3-1.3V5.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'; }
function renderExport(){
  const chs = pvChapters().filter(c=>String(c.body||'').trim());
  const words = chs.reduce((a,c)=>a+wordCount(c.body),0);
  const b = $('#ex-body'), f = $('#ex-foot');
  if(!b || !f) return;
  $('#ex-lead').textContent = '把主线全稿导出到本地：勾选格式、定好保存位置，导出在后台进行，完成后就能在文件夹里拿到成稿。';
  if(state.ex.phase==='running'){ renderExportRun(f); return; }
  if(state.ex.phase==='done'){ renderExportDone(b,f); return; }
  const fmts = EX_FMTS.map(x=>'<button type="button" class="ex-fmt'+(state.ex.fmts[x.k]?' on':'')+'" data-ex-fmt="'+x.k+'" aria-pressed="'+(state.ex.fmts[x.k]?'true':'false')+'">'
      + '<span class="ex-tick">'+exTickSvg()+'</span>'
      + '<span class="ex-txt"><b>'+x.tit+'</b><span>'+x.ext+' · '+x.sub+'</span></span>'
    + '</button>').join('');
  b.innerHTML =

    + '</div>'
    + '<div class="ex-sec"><h4>文件名</h4>'

    + '<div class="ex-fmts">'+fmts+'</div>'
    + '</div>'
    + '<p class="ex-sum">本次导出 '+chs.length+' 章 · '+words+' 字 · 覆盖全书主线，不含旧稿支线。</p>';
  f.innerHTML = '<button type="button" class="btn" data-export-close>取消</button>'

function renderExportRun(f){
  const list = exFmtOn();
  $('#ex-body').innerHTML =
    '<p class="ex-stat" id="ex-stat">准备导出…</p>'
    + '<div class="ex-bar"><i id="ex-bar"></i></div>'
    + '<ul class="ex-steps">'+list.map(x=>'<li data-ex-step="'+x.k+'"><b>'+esc(state.ex.name+x.ext)+'</b><em>等待</em></li>').join('')+'</ul>';
  f.innerHTML = '<button type="button" class="btn" data-ex-bg>后台运行</button>';
}
function renderExportDone(b,f){
  const list = exFmtOn();
  b.innerHTML =
    '<div class="ex-done"><span class="ex-done-ico">'+exTickSvg()+'</span>'
    + '<div><b>导出完成</b><p>'+(list.length?list.length+' 个文件':'成稿')+'已保存到 <span class="mono">'+esc(state.ex.dir)+'</span></p></div></div>'
    + '<ul class="ex-steps">'+list.map(x=>'<li data-ex-step="'+x.k+'"><b>'+esc(state.ex.name+x.ext)+'</b><em class="ok">完成</em></li>').join('')+'</ul>';
  f.innerHTML = '<button type="button" class="btn" data-export-close>完成</button>'
    + '<button type="button" class="btn btn-ink" data-ex-open-dir>打开文件夹</button>';
}
function runExport(){
  const list = exFmtOn();
  if(!list.length){ toast('先勾选至少一种格式再进行导出'); return; }
  state.ex.phase = 'running'; state.ex.pct = 0;
  renderExport();
  const n = list.length;
  const setStat = txt => { const s = document.getElementById('ex-stat'); if(s) s.textContent = txt; };
  const setStep = (k,txt) => { const li = $('[data-ex-step="'+k+'"]'); if(li){ const em = li.querySelector('em'); if(em) em.textContent = txt; } };
  let done = 0;
  setStep(list[0].k,'导出中');
  setStat('正在导出 '+state.ex.name+list[0].ext+'…');
  state.ex.timer = setInterval(()=>{
    done++;
    setStep(list[done-1].k,'完成');
    state.ex.pct = Math.round(done/n*100);
    const bar = document.getElementById('ex-bar'); if(bar) bar.style.width = state.ex.pct+'%';
    if(done<n){
      setStat('正在导出 '+state.ex.name+list[done].ext+'…');
      setStep(list[done].k,'导出中');
    }else{
      clearInterval(state.ex.timer); state.ex.timer = null;
      setStat('导出完成');
      setTimeout(()=>{ if(state.ex.phase==='running') state.ex.phase = 'done'; renderExport();
        toast('导出完成 · '+n+' 个文件已保存到 '+state.ex.dir); }, 420);
    }
  }, 620);
}

/* ═══════════ 交互 ═══════════ */
function select(id){
  readWrite();
  state.write = null;
  state.edit = null;
  if(id==='__pending'){ state.sel='__pending'; state.viewTab='outline'; state.setTab='change'; state.openVols[pendingInfo().vol]=true; persist(); render(); return; }
  if(id.indexOf('__vol:')===0){
    const v = volOf(id.slice(6)); if(!v) return;
    state.sel = id; state.viewTab='outline'; state.openVols[v.id]=true;
    persist(); render(); return;
  }
  const c = byId(id); if(!c) return;
  state.sel = id; state.viewTab = c.status==='planned' ? 'outline' : 'body'; state.setTab='change';
  state.openVols[c.vol] = true;
  persist(); render();
}

/* 正文格式：加粗 / 斜体 / 题记 / 场景分隔（作用在当前选区） */
function applyFmt(cmd){
  const ed = document.getElementById('e-body-e');
  if(!ed) return;
  ed.focus();
  try{
    if(cmd==='bold') document.execCommand('bold');
    else if(cmd==='italic') document.execCommand('italic');
    else if(cmd==='quote') document.execCommand('formatBlock', false, 'blockquote');
    else if(cmd==='scene') document.execCommand('insertHTML', false, '<p class="scene">＊ ＊ ＊</p><p><br></p>');
  }catch(err){}
  if(state.write) updateWords();
}
/* 点格式按钮时保住正文里的选区 */
document.addEventListener('mousedown', e=>{
  const f = e.target && e.target.closest ? e.target.closest('[data-fmt]') : null;
  if(f) e.preventDefault();
});

document.addEventListener('click', e=>{

  if(t.dataset.simAgain!==undefined){ simAgain(); return; }

  if(t.dataset.fmt!==undefined){ applyFmt(t.dataset.fmt); return; }

  }
  if(t.dataset.volsel){ select('__vol:'+t.dataset.volsel); return; }
  if(t.dataset.goto==='frontier'){

    if(c){ state.openVols[c.vol]=true; select(c.id); }

  }
  if(t.dataset.edit!==undefined){
    const scope = t.dataset.edit, id = t.dataset.editId || null;
    readWrite();
    state.write = null; state.editText = null;
    state.edit = {scope:scope, id:id};
    if(scope==='ch'){ const c = byId(id); state.editDraft = c ? olOf(c) : blankOl(); }
    else if(scope==='changes'){
      const c = byId(id);
      state.chgDraft = c ? chgDraftOf(c.changes) : chgDraftOf(state.write && state.write.changes);
    }
    else if(scope==='pending'){ state.editDraft = blankOl(); }

    else if(scope==='style'){ state.viewTab = 'style'; state.styleProposal = null; state.proPick = null; }
    else if(scope==='body'||scope==='prompt'){ state.viewTab = scope; if(id) state.sel = id; }
    render(); return;
  }
  if(t.dataset.editSave!==undefined){ saveEdit(t.dataset.editScope, t.dataset.editId); return; }
  if(t.dataset.editCancel!==undefined){ state.edit=null; state.editDraft=null; state.volDraft=null; state.chgDraft=null; state.editText=null; state.styleProposal=null; state.proPick=null; render(); return; }
  if(t.dataset.chgAdd!==undefined){

  }
  if(t.dataset.chgDel){
    const i = parseInt(t.dataset.chgDel,10);
    const d = state.chgDraft || [];
    collectChg(d); d.splice(i,1);
    state.chgDraft = d; render(); return;
  }
  if(t.dataset.vcastAdd!==undefined){
    const d = state.volDraft || volDraft(volOf(state.edit && state.edit.id)||{});
    Object.assign(d, collectVol()); d.cast.push({who:'',target:'',change:''});
    state.volDraft = d; render(); return;
  }
  if(t.dataset.vcastDel){
    const i = parseInt(t.dataset.vcastDel,10);
    const d = state.volDraft || volDraft(volOf(state.edit && state.edit.id)||{});
    Object.assign(d, collectVol()); d.cast.splice(i,1);
    state.volDraft = d; render(); return;
  }
  if(t.dataset.vnodeAdd!==undefined){
    const d = state.volDraft || volDraft(volOf(state.edit && state.edit.id)||{});
    Object.assign(d, collectVol()); d.nodes.push({stage:NODE_STAGES[0],text:''});
    state.volDraft = d; render(); return;
  }
  if(t.dataset.vnodeDel){
    const i = parseInt(t.dataset.vnodeDel,10);
    const d = state.volDraft || volDraft(volOf(state.edit && state.edit.id)||{});
    Object.assign(d, collectVol()); d.nodes.splice(i,1);
    state.volDraft = d; render(); return;

  if(t.dataset.addCh!==undefined){ addPlanned(); return; }
  if(t.dataset.addVol!==undefined){ addVolume(); return; }
  if(t.dataset.delPlan){ deletePlan(t.dataset.delPlan); return; }
  if(t.dataset.promptReset){

  if(t.dataset.relCancelPro!==undefined){ state.relDetect=null; state.relPick=null; $('#ai-panel').innerHTML = aiHTML(); return; }
  if(t.dataset.ai){

      const ctx = aiCtx();
      const ch = (ctx && ctx.ch) ? ctx.ch : null;
      const no = ctx ? ctx.no : null;
      if(!no || (!ch && !state.write)){ toast('先在左侧选一章，再识别角色的变化'); return; }
      const pr = detectCharChanges(no, ch);
      if(!pr.items.length){ toast('第 '+no+' 章没认出还没登记的角色或物品变化'); return; }
      state.relDetect = pr; state.relPick = {};
      state.edit = null; state.viewTab = 'rels';
      render();

    }
    if(act==='按本章章纲调参'){

      if(!no || !target){ toast('先在左侧选中一章，或在章纲里补上内容再调参'); return; }

  if(t.dataset.proPick){
    const id = t.dataset.proPick;
    state.proPick = state.proPick || {};
    state.proPick[id] = state.proPick[id] === false;

  if(t.dataset.proApply!==undefined){ applyProposal(); return; }
  if(t.dataset.proCancel!==undefined){ cancelProposal(); return; }
  if(t.dataset.pvSel){ state.pv.sel = t.dataset.pvSel; renderPreview(); return; }
  if(t.dataset.pvPrev!==undefined){ if(t.getAttribute('aria-disabled')==='true') return; pvStep(-1); return; }
  if(t.dataset.pvNext!==undefined){ if(t.getAttribute('aria-disabled')==='true') return; pvStep(1); return; }
  if(t.dataset.pvCfg){ pvSetCfg(t.dataset.pvCfg); return; }
  if(t.dataset.exportOpen!==undefined){ exOpen(); return; }
  if(t.dataset.exportClose!==undefined){ exClose(); return; }
  if(t.dataset.exFmt){
    exSync();
    const k = t.dataset.exFmt;
    const known = EX_FMTS.some(f=>f.k===k);
    if(known) state.ex.fmts[k] = !state.ex.fmts[k];
    renderExport(); return;
  }
  if(t.dataset.exDir){ state.ex.dir = t.dataset.exDir; renderExport(); return; }
  if(t.dataset.exBg){ exBg(); return; }
  if(t.dataset.exStart!==undefined){ exSync(); runExport(); return; }
  if(t.dataset.exOpenDir!==undefined){ toast('演示稿：打开本地文件夹不在本原型范围'); return; }
  if(t.dataset.bookOpen!==undefined){ openFinish(); return; }
  if(t.dataset.bookReopen!==undefined){ reopenBook(); return; }
  if(t.dataset.finClose!==undefined){ closeFinish(); return; }
  if(t.dataset.finConfirm!==undefined){ confirmFinish(); return; }
  if(t.dataset.finHook){ toggleFinHook(t.dataset.finHook); return; }
  if(t.dataset.nav){
    if(t.getAttribute('aria-disabled')==='true'){ toast('演示稿：「'+t.textContent.trim().replace(/\s+/g,' ')+'」不在本原型范围'); return; }
    switchMod(t.dataset.nav);
    return;
  }
  if(t.hasAttribute('data-close')){ closeModal(); return; }
});

/* ═══════════ 弹窗 ═══════════ */
let pendingAction = null;
function chip(no,title,cls,st){
  return '<span class="nd-chip '+(cls||'')+'"><span class="nu">第'+no+'章</span>'+esc(title)+(st?'<span class="st">'+st+'</span>':'')+'</span>';
}
function arrow(){ return '<span class="arrow">→</span>'; }

function openRewrite(id){
  const c = byId(id);
  const before = mainOf(c.vol);
  const idx = before.findIndex(x=>x.id===id);
  const prev = before[idx-1];
  const next = before[idx+1];

  $('#m-kind').textContent = '重写 · 就地替换';
  $('#m-lbl-before').textContent = '原故事线';
  $('#m-lbl-after').textContent = '归档后';
  $('#m-title').textContent = '重写第'+c.no+'章 · '+c.title+'？';
  $('#m-lead').textContent = '这一章会打开写作窗口重写。归档后，新内容替换旧内容、接回主线；被替换的旧稿移入灰显支线，后面原样接着的章节会挂上「基于旧设定」角标。设定、关系与伏笔跟着重算，不做逐章撤销。';

  $('#m-before').innerHTML = [prev,{no:c.no,title:c.title,cls:'old'},next].filter(Boolean)
    .map(x=>chip(x.no,x.title,x.cls)).join(arrow());

  $('#m-after').innerHTML = [prev,
    {no:c.no,title:c.title,cls:'new',st:'新'},
    next?{no:next.no,title:next.title,cls:'keep',st:'基于旧设定'}:null
  ].filter(Boolean).map(x=>chip(x.no,x.title,x.cls,x.st)).join(arrow());

  $('#m-list').innerHTML = ''
  + '<li><b>旧稿</b><span>第'+c.no+'章「'+c.title+'」移入旧稿支线，可随时点开查看。</span></li>'
  + (next?'<li><b>后续</b><span>第'+next.no+'章起原样保留，但挂「基于旧设定」角标，提示上游设定已变。</span></li>':'')
  + '<li><b>设定</b><span>归档时确认本章变化；开书设定永不改写，之后累积的条目跟着重算。</span></li>';

  pendingAction = {type:'rewrite', id:id};
  $('#m-confirm').textContent = '打开写作窗口重写';
  $('#modal').classList.add('on');
}

function openRevert(id){
  const c = byId(id);
  const main = allMain();
  const idx = main.findIndex(x=>x.id===id);
  const prev = idx>0 ? main[idx-1] : null;
  const after = main.slice(idx+1);

  $('#m-kind').textContent = '回退 · 从下一章重开';
  $('#m-lbl-before').textContent = '原故事线';
  $('#m-lbl-after').textContent = '回退后';
  $('#m-title').textContent = '回退到第'+c.no+'章 · '+c.title+'？';
  $('#m-lead').textContent = '确认后主线缩短到这一章，第'+(c.no+1)+'章成为新的待写章节，主线直接指向它、从那里另起一条线。第'+c.no+'章之后的 '+(after.length?after.length+' 章':'章节')+'全部移入灰显旧稿支线。关系与伏笔跟着重算，第'+c.no+'章之后埋入或回收的条目自动作废。';

  $('#m-before').innerHTML = [prev,
    {no:c.no,title:c.title,cls:'new'},
    after[0]||null, after[1]||null
  ].filter(Boolean).map(x=>chip(x.no,x.title,x.cls,x===c?'回退点':'')).join(arrow());

  $('#m-after').innerHTML = [prev,
    {no:c.no,title:c.title,cls:'keep',st:'保留'},
    {no:c.no+1,title:'待写',cls:'new',st:'从这里开写'}
  ].filter(Boolean).map(x=>chip(x.no,x.title,x.cls,x.st)).join(arrow());

  $('#m-list').innerHTML = ''
  + '<li><b>主线</b><span>缩短到第'+c.no+'章；第'+(c.no+1)+'章成为待写章节，主线指向它，回退后直接进入写作窗口。</span></li>'
  + '<li><b>旧稿</b><span>'+(after.length?('第'+after[0].no+'–'+after[after.length-1].no+'章'):'后续章节')+'脱离主线，移入灰显旧稿支线，可点开查看。</span></li>'
  + '<li><b>设定</b><span>关系与伏笔不逐章撤：回退后自动重算，未回收的伏笔重新变回悬置。</span></li>';

  pendingAction = {type:'revert', id:id};
  $('#m-confirm').textContent = '确认回退';
  $('#modal').classList.add('on');
}

function closeModal(){ $('#modal').classList.remove('on'); pendingAction=null; }

$('#m-confirm').addEventListener('click', ()=>{
  if(!pendingAction) return;
  const act = pendingAction; closeModal();
  if(act.type==='revert') applyRevert(act.id);
  else startWrite('rewrite', act.id);
});

/* ═══════════ 剧情推演：从上一章结尾，按回合走一遍本章 ═══════════ */
let sim = null; /* { id, step, picks } · step = 已经展开的回合数，picks 记着每一回合定下的走法 */
function simPrevOf(c){
  const before = allMain().filter(x=>x.order < c.order);
  return before.length ? before[before.length-1] : null;
}
function simBeatsOf(o){
  let beats = (o.events && o.events.length) ? o.events.slice() : [];
  if(!beats.length && o.story) beats = o.story.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!beats.length && o.task) beats = [o.task];
  if(!beats.length) beats = ['把这一章的核心任务往前推一格'];
  return beats.slice(0,4);
}
function simMovesOf(o, who){
  const tail = (o.suspense && o.suspense[0]) ? '「'+o.suspense[0]+'」被压得更紧' : '悬念再多压一层';
  return [
    { k:'顺', tone:'ok', label: who+'顺着当前节奏动手',
      out:'事件按章纲落地，主情绪停在「'+(o.mood||'紧张')+'」，不多加波折。' },
    { k:'拗', tone:'warn', label: who+'先被外力打断一下',
      out:'多出一次波折，'+tail+'，收束前再拉回主线。' }
  ];
}
function simBuild(c){
  const o = olOf(c);
  const prev = simPrevOf(c);
  const entry = prev ? (olOf(prev).end || '上一章就此收束。')
    : '开书第一章：全书设定还是空白，这一章从零长出来。';
  const who = (o.cast && o.cast.length) ? o.cast.slice() : ['沉舟'];
  const beats = simBeatsOf(o);
  const rounds = beats.map((b,i)=>({
    n:i+1, beat:b, who: who[i%who.length],
    place: o.place || '本章场景', time: o.time || '',
    at: i===0 ? '承上：'+entry
      : (i===beats.length-1 ? '推向本章结尾' : '继续往下走'),
    shift: i===beats.length-1
      ? (o.change || o.end || '本章收束')
      : ((o.suspense && o.suspense[i]) ? '维持悬念：'+o.suspense[i]
        : (o.strategy ? '按预期策略推进：'+o.strategy : '局势往前一格')),
    moves: simMovesOf(o, who[i%who.length])
  }));
  return { c:c, o:o, prev:prev, entry:entry, exit:(o.end || '本章收束'), who:who, rounds:rounds };
}
function simRoundInner(r, onNow, pick){
  const moves = r.moves.map(m=>
    '<button class="btn btn-sm'+(pick===m.tone?' btn-ink':'')+'" data-sim-pick="'+r.n+':'+m.tone+'">'
    + esc(m.k)+' · '+esc(m.label)+'</button>').join('');
  return '<ul class="ai-list">'
    + '<li><b>关键事件</b> · '+esc(r.beat)+'</li>'
    + '<li><b>在场</b> · '+esc(r.who)+(r.place?' · '+esc(r.place):'')+(r.time?' · '+esc(r.time):'')+'</li>'
    + '<li><b>这一回合落下</b> · '+esc(r.shift)+'</li>'
    + '</ul>'
    + '<div class="ai-acts" style="margin-top:11px">'+moves+'</div>'
    + (pick
      ? '<p class="ai-note" style="margin-top:9px">走法已定 · '+esc(pick==='ok'?'顺':'拗')+'　'
        + esc(pick==='ok'?r.moves[0].out:r.moves[1].out)+'</p>'
      : (onNow ? '<p class="ai-note" style="margin-top:9px">先替这一回合选一个走法，再往下推。</p>' : ''));
}
function drawSim(){
  if(!sim) return;
  const c = byId(sim.id);
  if(!c){ closeSim(); return; }
  const m = simBuild(c);
  const total = m.rounds.length;
  const done = sim.step >= total;
  $('#sim-title').textContent = '第 '+c.no+' 章 · '+c.title;
  $('#sim-lead').textContent = '以上一章的结尾为起点，用本章章纲的关键事件与出场角色，一回合一步往下推：每一回合先替角色做一次选择，再推到本章结尾。';
  const head = aiStats([['起点', m.prev ? '第 '+m.prev.no+' 章结尾' : '开书'],
      ['终点', '第 '+c.no+' 章结尾'], ['回合', total+' 回合'], ['出场角色', m.who.length+' 人']]);
  const flow = aiCard('推演的起与收', '<ul class="ai-list">'
      + '<li><b>承接上一章</b> · '+esc(m.entry)+'</li>'
      + '<li><b>收束到本章</b> · '+esc(m.exit)+'</li>'
      + '<li><b>计划篇幅</b> · '+esc((m.o.words||0)?(m.o.words+' 字'):'未定')+'</li></ul>');
  const cards = m.rounds.map((r,i)=>{
    if(i >= sim.step) return aiCard('回合 '+r.n, '<p class="ai-note">还没走到——推到这里才会展开。</p>');
    const pick = sim.picks[r.n] || null;
    const onNow = i === sim.step-1;
    const key = '回合 '+r.n + (onNow ? ' · 待你定' : (pick ? ' · 已定' : ''));
    return aiCard(key, '<p class="ai-note" style="margin-bottom:9px">'+esc(r.at)+'</p>'
      + simRoundInner(r, onNow, pick));
  }).join('');
  $('#sim-body').innerHTML = head + flow + cards
    + (done ? '' : aiCard('还剩 '+(total-sim.step)+' 回合', '<p class="ai-note">每定一步，推演就更贴近本章结尾；走法只作参考，不会自动改动章纲。</p>'));
  $('#sim-foot').innerHTML = '<button class="btn" data-sim-close>关闭</button>'
    + '<button class="btn" data-sim-again>重新推演</button>'
    + (done
      ? '<button class="btn btn-ink" data-sim-adopt>按这条走法收进章纲</button>'
      : '<button class="btn btn-ink" data-sim-next>推演下一个回合</button>');
}
function openSim(id){
  const c = byId(id);
  if(!c){ toast('先选一章，再推演它的剧情'); return; }
  sim = { id:id, step:1, picks:{} };
  drawSim();
  $('#sim').classList.add('on');
}
function closeSim(){ $('#sim').classList.remove('on'); sim = null; }
function simPick(n,k){ if(!sim) return; sim.picks[n] = k; drawSim(); }
function simNext(){
  if(!sim) return;
  const c = byId(sim.id);
  if(!c){ closeSim(); return; }
  const r = simBuild(c).rounds[sim.step-1];
  if(r && !sim.picks[r.n]){ toast('先替这一回合选一个走法，再往下推'); return; }
  sim.step++; drawSim();
}
function simAgain(){ if(!sim) return; sim.step = 1; sim.picks = {}; drawSim(); }
function simAdopt(){
  if(!sim) return;
  const c = byId(sim.id);
  if(!c){ closeSim(); return; }
  const cur = simBuild(c).rounds[sim.step-1];
  if(cur && !sim.picks[cur.n]){ toast('先把这一回合的走法定下来，再收进章纲'); return; }
  if(state.edit || state.write){ toast('先退出正在改的稿子，再把推演走法收进章纲'); return; }
  const chosen = Object.keys(sim.picks).sort((a,b)=>a-b).map(n=>sim.picks[n]);
  const line = '推演走法 · '+(chosen.indexOf('warn')>=0 ? '中途先接一次意外，再拉回主线' : '顺着章纲节奏推进，不多加波折');
  CH_OL[c.id] = Object.assign({}, CH_OL[c.id], { strategy: line });
  closeSim(); render();
  toast('第 '+c.no+' 章「预期策略」已按推演走法更新');
}

/* ═══════════ 数据变更 ═══════════ */
function applyRevert(id){
  const c = byId(id);
  const mains = allMain();
  const idx = mains.findIndex(x=>x.id===id);
  const dropped = mains.slice(idx+1).filter(x=>CH_STYLE['m'+x.no]).length;
  /* 主线按全书顺序截断到这一章：其后所有章节（含跨卷）转入旧稿支线 */
  mains.slice(idx+1).forEach(x=>{ x.ghostOf = c.no; x.stale = false; delete CH_STYLE['m'+x.no]; });
  /* 主线指向回退后的下一章，直接从这里开写新线 */
  state.sel = '__pending';
  persist();
  startWrite('continue');
  toast('已回退到第'+c.no+'章 · 主线指向第'+(c.no+1)+'章，其后章节移入旧稿支线'+(dropped?'（含 '+dropped+' 章本章文风调整）':''));
}

function applyRewrite(id, title, outline, body, changes){
  const c = byId(id);
  const main = mainOf(c.vol);
  const idx = main.findIndex(x=>x.id===id);
  const downstream = main.slice(idx+1);
  c.ghostOf = main[idx-1] ? main[idx-1].no : c.no;
  const src = (changes && changes.length) ? changes : c.changes;
  const fresh = ch({ id:'c'+c.no+'-r'+Date.now(), no:c.no, vol:c.vol, order:c.order+0.01,
    title: title||c.title, outline: outline||c.outline, hash: hash(), body: body||c.body,
    changes: src.map(x=>Object.assign({},x)) });
  CH.push(fresh);
  downstream.forEach(x=>{ x.stale = true; });
  state.write = null; state.sel = fresh.id; state.viewTab='body';
  persist(); render();
  toast('第'+c.no+'章已重写归档 · 后续章节标记「基于旧设定」');
}

function applyDraft(id, title, outline, body, changes){
  const c = byId(id);
  c.title = title; c.outline = outline; c.body = body; c.hash = hash(); c.status = 'archived';
  if(changes) c.changes = changes.map(x=>Object.assign({},x));
  state.write = null; state.sel = c.id; state.viewTab='body';
  persist(); render();
  toast('第'+c.no+'章已归档 · 主线推进到第 '+c.no+' 章');
}

function applyContinue(vol, no, title, outline, body, changes){
  const chg = (changes||[]).map(x=>({k:x.k, v:x.v, d:x.d}));
  const p = pendingInfo();
  /* 待写落在了一章拟定上：就地把它写回主线，不另起新章 */
  if(p.planned && p.planned.no===no){
    const c = p.planned;
    c.title = title || c.title || '（未命名）';
    c.outline = outline || c.outline || '（待补章纲）';
    c.body = body || ''; c.hash = hash(); c.status = 'archived';
    c.changes = chg;
    state.write = null; state.sel = c.id; state.viewTab='body'; state.openVols[c.vol]=true;
    persist(); render();
    toast('第 '+no+'章已归档 · 主线推进到第 '+no+' 章');
    return;
  }
  const fresh = ch({ id:'c'+no+'-n'+Date.now(), no:no, vol:vol, order:no, title:title||'（未命名）',
    outline: outline||'（待补章纲）', hash: hash(), body: body||'', changes: chg });
  CH.push(fresh);
  state.write = null; state.sel = fresh.id; state.viewTab='body'; state.openVols[vol]=true;
  persist(); render();
  toast('第 '+no+'章已归档 · 主线推进到第 '+no+' 章');
}

/* ═══════════ 数据变更：卷纲 / 章纲的编辑与新增 ═══════════ */
function downstreamStale(c){ allMain().filter(x=>x.order>c.order).forEach(x=>{ x.stale = true; }); }
function saveEdit(scope, id){
  if(scope==='body'){
    const c = byId(id); if(!c){ state.edit=null; render(); return; }
    const el = document.getElementById('e-body-e');
    c.body = el ? cleanHTML(el.innerHTML) : (state.editText!=null ? state.editText : (c.body || ''));
    if(c.status==='archived') c.hash = hash();
    state.edit = null; state.editText = null; render();
    toast('第 '+c.no+' 章正文已保存 · '+wordCount(c.body)+' 字');
    return;
  }
  if(scope==='prompt'){
    const c = byId(id); if(!c){ state.edit=null; render(); return; }
    const el = document.getElementById('e-prompt');
    const v = el ? el.value : (state.editText!=null ? state.editText : '');
    if(!v.trim() || v === promptOf(c)) delete CH_PROMPT[c.id];
    else CH_PROMPT[c.id] = v;
    state.edit = null; state.editText = null; render();
    toast('第 '+c.no+' 章提示词已保存 · 只覆盖本章');
    return;
  }
  if(scope==='ch'){
    const c = byId(id); if(!c){ state.edit=null; render(); return; }
    const nt = grabEl('e-ol-title').trim(), no = grabEl('e-ol').trim();
    const ol = collectOl();
    const changed = (c.outline||'') !== no;
    if(nt) c.title = nt;
    c.outline = no;
    CH_OL[c.id] = ol;
    if(changed && c.status==='archived') downstreamStale(c);
    const miss = olReq(ol).filter(x=>!x[1]).map(x=>x[0]);
    const gate = miss.length ? ' · 归档前还差「'+miss.join('、')+'」' : '';
    const msg = changed && c.status==='archived' ? ' · 后续章节标记「基于旧设定」' : '';
    state.edit = null; state.editDraft = null; render();
    toast('第 '+c.no+' 章章纲已保存'+msg+gate);
    return;
  }
  if(scope==='vol'){
    const v = volOf(id); if(!v){ state.edit=null; render(); return; }
    const out = collectVol();
    if(out.name) v.name = out.name;
    v.struct = out.struct; v.total = out.total;
    v.summary = out.summary; v.conflict = out.conflict;
    v.goal = out.goal; v.ending = out.ending;
    v.cast = out.cast; v.nodes = out.nodes;
    v.plants = out.plants; v.reveals = out.reveals;
    state.edit = null; state.volDraft = null; render();
    toast(v.name+' 卷纲已保存');
    return;
  }
  if(scope==='pending'){
    const p = pendingInfo();
    if(p.planned){ state.edit=null; render(); return; }
    const n = p.no, v = volForNo(n);
    const title = grabEl('e-ol-title').trim();
    const outline = grabEl('e-ol').trim();
    const ol = collectOl();
    const any = title || outline || ol.task || ol.events.length || (ol.words||0)>0;
    if(!any){ state.edit=null; state.editDraft=null; render(); toast('章纲还是空的，先写一点再保存'); return; }
    const nid = 'c'+n+'-p'+Date.now();
    const fresh = ch({ id:nid, no:n, vol:v, order:n, status:'planned',
      title:title, outline:outline, hash:'', body:'', changes:[] });
    CH.push(fresh); CH_OL[nid] = ol;
    state.edit = null; state.editDraft = null; state.sel = fresh.id; state.viewTab = 'outline'; state.openVols[v] = true;
    persist(); render();
    toast('已拟定第 '+n+' 章章纲 · 开写时接着用');
    return;
  }
  if(scope==='style'){
    const key = id, no = key.slice(1);
    const out = collectStyle();
    state.edit = null; state.styleProposal = null; state.proPick = null;
    if(shadowCount(out)){ CH_STYLE[key] = out; render(); toast('第 '+no+' 章文风已保存 · 只作用于本章，全书文风不变'); }
    else { delete CH_STYLE[key]; render(); toast('没填任何改动 · 第 '+no+' 章沿用全书文风'); }
    return;
  }
  if(scope==='changes'){
    const arr = state.chgDraft || [];
    collectChg(arr);
    const clean = arr.filter(x=>(x.k||'').trim() || (x.v||'').trim())
      .map(x=>({k:(x.k||'').trim(), v:(x.v||'').trim(), d:x.d||'new'}));
    if(state.write){
      state.write.changes = clean;
      state.edit = null; state.chgDraft = null; render();
      toast('本章变化已存入草稿 · '+clean.length+' 条 · 归档时随本章写入主线');
      return;
    }
    const c = byId(id); if(!c){ state.edit=null; state.chgDraft=null; render(); return; }
    const prev = JSON.stringify(c.changes||[]);
    c.changes = clean;
    const changed = JSON.stringify(clean) !== prev;
    if(changed && c.status==='archived') downstreamStale(c);
    state.edit = null; state.chgDraft = null; render();
    toast('第 '+c.no+' 章本章变化已保存 · '+clean.length+' 条'+(changed?' · 后面的章节跟着重算':'')+(changed&&c.status==='archived'?'，后续章节标记「基于旧设定」':''));
    return;
  }
  state.edit = null; state.editDraft = null; state.volDraft = null; render();
}
/* 新增一章：在主线末端排一章拟定，直接进章纲编辑 */
function addPlanned(vol){
  if(state.book.done){ toast('这本书已完结 · 先撤完本再加新章'); return; }
  const n = nextPlanNo();
  const v = vol || volForNo(n);
  const fresh = ch({ id:'c'+n+'-p'+Date.now(), no:n, vol:v, order:n, status:'planned',
    title:'', outline:'', hash:'', body:'', changes:[] });
  CH.push(fresh);
  state.write = null; state.edit = {scope:'ch', id:fresh.id}; state.editDraft = blankOl();
  state.sel = fresh.id; state.viewTab = 'outline'; state.openVols[v] = true;
  persist(); render();
  toast('已新增拟定章节 · 第 '+n+' 章，先写章纲');
}
/* 新增一卷：追加到全书末尾 · 默认计划 6 章 */
function addVolume(){
  if(state.book.done){ toast('这本书已完结 · 先撤完本再加新卷'); return; }
  const CN = ['一','二','三','四','五','六','七','八','九','十'];
  const n = VOLS.length + 1;
  const v = { id:'v'+n, name:'第'+(CN[n-1]||n)+'卷 · 未命名', range:'', total:6, outline:'',
    struct:VOL_STRUCT[0], summary:'', conflict:'', goal:'', ending:'',
    cast:[{who:'',target:'',change:''}], nodes:[{stage:NODE_STAGES[0],text:''}], plants:[], reveals:[] };
  VOLS.push(v);
  /* 卷区间变了，把拟定章节重新按章号归卷 */
  plannedChapters().forEach(c=>{ c.vol = volForNo(c.no); });
  state.write = null; state.edit = {scope:'vol', id:v.id}; state.volDraft = volDraft(v);
  state.sel = '__vol:'+v.id; state.viewTab = 'outline'; state.openVols[v.id] = true;
  persist(); render();
  toast('已新增'+v.name+'，先写卷纲');
}
function deletePlan(id){
  const i = CH.findIndex(c=>c.id===id);
  if(i<0) return;
  const c = CH[i];
  if(c.status!=='planned') return;
  CH.splice(i,1);
  state.edit = null; state.sel = '__pending'; state.viewTab = 'outline';
  state.openVols[volForNo(Math.max(1, c.no-1))] = true;
  persist(); render();
  toast('已删除拟定章节 · 第 '+c.no+' 章');
}

function hash(){ const s='0123456789abcdef'; let r=''; for(let i=0;i<7;i++) r+=s[Math.floor(Math.random()*16)]; return r; }

/* ═══════════ 写作 ═══════════ */
function startWrite(mode, id){
  if(mode==='continue' && !id){
    const d = currentChapter();
    if(d && d.status==='draft'){ id = d.id; mode = 'draft'; }
  }
  let c = id ? byId(id) : null;
  let vol, no, title, outline, body, prompt;
  if(mode==='continue'){
    const p = pendingInfo();
    vol = p.vol; no = p.no; title = ''; outline = ''; body = '';
    prompt = promptText(no, p.planned);
  } else {
    vol = c.vol; no = c.no; title = c.title; outline = c.outline; body = c.body;
    prompt = promptOf(c);
  }
  state.write = { mode:mode, id:id||null, vol:vol, no:no, title:title, outline:outline, body:body, prompt:prompt,
    changes: c ? chgDraftOf(c.changes) : [] };
  state.viewTab = mode==='continue' ? 'outline' : 'body';
  state.setTab = 'change';
  if(vol) state.openVols[vol] = true;
  render();
}
function bodyValue(){
  const be = $('#e-body-e'); if(be) return cleanHTML(be.innerHTML);
  return null;
}
function readWrite(){
  if(!state.write) return;
  const t = $('#e-title'); if(t) state.write.title = t.value;
  const o = $('#e-outline'); if(o) state.write.outline = o.value;
  const bv = bodyValue(); if(bv!=null) state.write.body = bv;
  const p = $('#e-prompt'); if(p) state.write.prompt = p.value;
  if(state.edit && state.edit.scope==='changes' && state.chgDraft){
    collectChg(state.chgDraft);
    state.write.changes = state.chgDraft.map(x=>({k:x.k, v:x.v, d:x.d}));
  }
}
function updateWords(){
  const be = $('#e-body-e'); if(!be) return;
  const el = $('#e-words'); if(el) el.textContent = wordCount(be.textContent)+' 字';
}
function aiGenerate(){
  if(!state.write) return;
  readWrite();
  const o = (state.write.outline||'').trim() || '（未填章纲）';
  state.write.body = '（AI 生成占位）围绕「'+o+'」铺开的一章正文，交由作者重写与打磨。';
  state.viewTab = 'body';
  render();
  toast('已生成一版占位正文');
}
function archiveWrite(){
  if(!state.write) return;
  readWrite();
  const w = state.write;
  const title = (w.title||'').trim(), outline = (w.outline||'').trim(), body = (w.body||'').trim();
  if(!body){ toast('正文还是空的，先写一点再归档'); return; }
  if(!title){ toast('先给这一章起个名字，再归档'); return; }
  if(w.mode==='rewrite') applyRewrite(w.id, title, outline, body, w.changes);
  else if(w.mode==='draft') applyDraft(w.id, title, outline, body, w.changes);
  else applyContinue(w.vol, w.no, title, outline, body, w.changes);
  enqueueArchiveJobs(state.sel);
  state.viewTab = 'actions';
  render();
  toast('第 '+w.no+' 章已归档 · AI 总结与写回提案在「操作」里逐条确认');
}
/* 阅读态直接归档草稿章：不打开写作窗口，就地写回主线，随后挂上后台任务 */
function archiveDraft(id){
  const c = byId(id); if(!c) return;
  if(!(c.body||'').trim()){ toast('这一章还没有正文，先点顶栏「续写」写一点再归档'); return; }
  applyDraft(c.id, c.title, c.outline, c.body, c.changes);
  enqueueArchiveJobs(c.id);
  state.viewTab = 'actions';
  render();
  toast('第 '+c.no+' 章已归档 · AI 总结与写回提案在「操作」里逐条确认');
}

/* ═══════════ toast ═══════════ */
let toastTimer=null;
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),2600);
}

$('#btn-home').addEventListener('click',()=>toast('演示稿：返回我的作品（作品列表）不在本原型范围'));
$('#btn-acct').addEventListener('click',()=>toast('演示稿：账号与设置不在本原型范围'));

/* ═══════════ 启动 ═══════════ */
if(state.sel && state.sel.indexOf('__vol:')===0 && !volOf(state.sel.slice(6))) state.sel = null;
if(state.sel && state.sel!=='__pending' && state.sel.indexOf('__vol:')!==0 && !byId(state.sel)) state.sel = null;
if(!state.sel){ const c = currentChapter(); state.sel = c ? c.id : null; }
if(state.sel && state.sel!=='__pending' && state.sel.indexOf('__vol:')!==0){ const c = byId(state.sel); if(c) state.openVols[c.vol]=true; }
if(state.sel==='__pending'){ state.viewTab='outline'; state.openVols[pendingInfo().vol]=true; }
render();
</script>
