<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的作品 · 爱小说</title>
<style>
  /* 绑定 docs/ux/design-language.html v2.1 令牌，与 design-c 原型同源 */
  :root{
    --bg:      oklch(98% 0.004 240);
    --surface: oklch(100% 0 0);
    --fg:      oklch(20% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.006 240);
    --accent:  oklch(48% 0.11 170);
    --accent-strong:oklch(41% 0.10 170);
    --accent-soft:color-mix(in oklch,var(--accent) 12%,transparent);
    --accent-faint:color-mix(in oklch,var(--accent) 6%,transparent);
    --ok:oklch(52% 0.11 155);--ok-soft:color-mix(in oklch,var(--ok) 14%,transparent);
    --warn:oklch(50% 0.13 75);--warn-soft:color-mix(in oklch,var(--warn) 16%,transparent);
    --err:oklch(50% 0.17 25);--err-soft:color-mix(in oklch,var(--err) 12%,transparent);
    --on-accent:oklch(100% 0 0);
    --fg-soft:color-mix(in oklch,var(--fg) 5%,transparent);
    --shadow-card:0 1px 2px color-mix(in oklch,var(--fg) 5%,transparent),
                  0 12px 32px -12px color-mix(in oklch,var(--fg) 14%,transparent);
    --shadow-pop:0 18px 50px -12px color-mix(in oklch,var(--fg) 26%,transparent);
    --faint:color-mix(in oklch,var(--muted) 45%,var(--bg));
    --font-display:'Noto Serif SC','Songti SC','STSong','Iowan Old Style',Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
    --font-mono:ui-monospace,'SF Mono',Menlo,'JetBrains Mono',monospace;
    --radius:10px;--radius-lg:16px;--radius-sm:7px;--radius-pill:999px;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55;
    text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;padding-bottom:26px}
  p{margin:0}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  input,select{font:inherit}
  img,svg{display:block}
  a{color:inherit;text-decoration:none}
  .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .serif{font-family:var(--font-display)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:var(--radius);
    border:1px solid transparent;font-size:13.5px;font-weight:500;letter-spacing:.01em;transition:background .15s ease,border-color .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-primary:hover{background:var(--accent-strong)}
  .btn-secondary{background:var(--surface);color:var(--fg);border-color:var(--border)}
  .btn-secondary:hover{border-color:var(--fg)}
  .btn-ghost{background:transparent;color:var(--muted);padding:0 8px}
  .btn-ghost:hover{color:var(--fg);background:var(--fg-soft)}
  .btn-sm{height:28px;padding:0 12px;font-size:12.5px;border-radius:8px;gap:5px}
  .btn svg{width:15px;height:15px}
  .btn-sm svg{width:13px;height:13px}

  /* ═══ 全局更新提示条（client-update-notify）：所有屏顶端，info 语气，可关闭 ═══ */
  .notice{display:flex;align-items:center;gap:12px;border:1px solid color-mix(in oklch,var(--warn) 28%,var(--border));
    background:var(--warn-soft);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px}
  .notice.info{border-color:color-mix(in oklch,var(--accent) 30%,var(--border));background:var(--accent-soft)}
  .notice .nt{flex:1;min-width:0}
  .notice .nt b{font-weight:500}
  .notice .nt span{color:var(--muted);font-size:12.5px;margin-left:8px}
  .update-strip{width:min(100%,1080px);margin-inline:auto;padding:20px 32px 0}
  .update-strip .notice{margin-bottom:0}
  .icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
  .icon-btn:hover{color:var(--fg);background:var(--fg-soft)}
  .icon-btn svg{width:15px;height:15px}

  /* ── 壳层 appbar 48 ── */
  .appbar{height:48px;flex:none;display:flex;align-items:center;padding:0 20px;gap:12px;background:var(--surface);border-bottom:1px solid var(--border)}
  .logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:.08em;white-space:nowrap}
  .logo-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-size:14px;flex:none}
  .appbar .nav{display:inline-flex;gap:4px;margin-left:14px}
  .appbar .nav a{font-size:13.5px;color:var(--muted);padding:5px 10px;border-radius:8px}
  .appbar .nav a:hover{color:var(--fg)}
  .appbar .nav a.on{color:var(--fg);background:var(--fg-soft);font-weight:500}
  .appbar .spacer{flex:1}
  .acct{display:inline-flex}
  .acct-trigger{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--fg);font-size:12.5px}
  .acct-trigger:hover{border-color:var(--accent)}
  .acct-trigger.open{border-color:var(--accent);background:var(--accent-soft)}
  .acct-trigger .caret{width:14px;height:14px;color:var(--muted)}
  .avatar{width:24px;height:24px;border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
  .badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:var(--radius-pill);font-size:11px;line-height:1.6;white-space:nowrap}
  .badge-accent{background:var(--accent-soft);color:var(--accent)}

  /* ── 主体：作品清单 ── */
  .main{flex:1;width:min(100%,1080px);margin-inline:auto;padding:40px 32px 80px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}
  .page-head h1{font-family:var(--font-display);font-size:30px;font-weight:600;margin:0;letter-spacing:.01em}
  .page-head .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .head-acts{display:flex;gap:8px}

  /* ── 页头工具栏：搜索 · 状态筛选 · 排序 ── */
  .bk-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 6px}
  .bk-search{position:relative;flex:1 1 240px;min-width:200px}
  .bk-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
  .bk-search input{width:100%;height:36px;padding:0 12px 0 35px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--fg);font-size:13.5px}
  .bk-search input::placeholder{color:var(--muted)}
  .bk-search input:focus{border-color:var(--accent);outline:none}
  .bk-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
  .chip{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-pill);background:var(--surface);color:var(--muted);font-size:12.5px;transition:border-color .15s ease,color .15s ease,background .15s ease}
  .chip:hover{border-color:var(--fg);color:var(--fg)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .bk-sort{height:36px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--fg);font-size:13px;margin-left:auto;cursor:pointer}
  .bk-sort:hover{border-color:var(--fg)}

  /* ── 生命周期分组 ── */
  .bk-group{margin-bottom:26px}
  .bk-group-head{display:flex;align-items:center;gap:12px;padding:20px 0 4px;border-top:1px solid var(--border)}
  .bk-group:first-child .bk-group-head{border-top:0;padding-top:0}
  .gh-label{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:15px;font-weight:600}
  .gh-label .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .gh-label .dot.ready{background:var(--accent)}
  .gh-label .dot.writing{background:var(--warn)}
  .gh-label .dot.setting{background:color-mix(in oklch,var(--fg) 22%,transparent)}
  .gh-label .dot.done{background:var(--ok)}
  .gh-count{font-size:12px;color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .bk-group .cards{margin-top:14px}
  .gh-acts{margin-left:auto;display:inline-flex;gap:8px}

  /* ── 空态与加载更多 ── */
  .bk-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:64px 24px;text-align:center;
    background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-lg);color:var(--muted)}
  .bk-empty .em{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--fg)}
  .bk-empty .es{font-size:12.5px;line-height:1.7}
  .bk-empty .acts{display:inline-flex;gap:8px;margin-top:8px}
  .load-more{display:flex;justify-content:center;padding:22px 0 4px}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
  @media (max-width:600px){.cards{grid-template-columns:1fr}}
  .book-card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;cursor:pointer;
    transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
  .book-card:hover{border-color:color-mix(in oklch,var(--accent) 45%,var(--border));box-shadow:var(--shadow-card);transform:translateY(-2px)}
  .book-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .book-card .top{display:flex;align-items:center;gap:8px}
  .mono{flex:none;width:40px;height:40px;border-radius:10px;background:var(--fg-soft);border:1px solid var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:19px;color:var(--fg)}
  .genre{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border:1px solid var(--border);border-radius:var(--radius-pill);font-size:11.5px;color:var(--muted);background:var(--bg);white-space:nowrap}
  .genre svg{width:12px;height:12px}
  .top .b{margin-left:auto}
  .b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--radius-pill);font-size:11px;font-weight:500;white-space:nowrap}
  .b.writing{background:var(--warn-soft);color:var(--warn)}
  .b.setting{background:var(--fg-soft);color:var(--muted)}
  .b.ready{background:var(--accent-soft);color:var(--accent-strong)}
  .b.done{background:var(--ok-soft);color:var(--ok)}
  .b svg{width:11px;height:11px}
  .book-card h3{font-family:var(--font-display);font-size:21px;font-weight:600;margin:14px 0 0;letter-spacing:.01em}
  .book-card .summary{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .book-card .stats{display:flex;gap:18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  .book-card .stats b{display:block;color:var(--fg);font-weight:500;margin-bottom:1px}
  .book-card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:18px}
  .book-card .updated{font-size:11.5px;color:var(--muted)}
  .book-card .go{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--fg)}
  .book-card:hover .go{color:var(--accent)}
  .book-card .go svg{width:14px;height:14px}
  .foot-acts{display:inline-flex;gap:8px;flex:none}

  /* ── 弹窗 ── */
  .scrim{position:fixed;inset:0;background:color-mix(in oklch,var(--fg) 28%,transparent);z-index:40;opacity:0;transition:opacity .2s ease}
  .scrim.show{opacity:1}
  .modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px}
  .modal .mcard{width:min(420px,92vw);max-height:calc(100vh - 48px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    box-shadow:var(--shadow-card);transform:translateY(8px) scale(.98);opacity:0;transition:transform .18s ease,opacity .18s ease}
  .modal .mcard.wide{width:min(560px,92vw)}
  .modal.show .mcard{transform:none;opacity:1}
  .mcard-head{display:flex;align-items:center;gap:10px;padding:20px 24px 0}
  .mcard-head .mh{font-family:var(--font-display);font-size:17px;font-weight:600}
  .mcard-head .x{margin-left:auto}
  .mcard-body{padding:14px 24px 6px}
  .mcard-body h2{font-family:var(--font-display);font-size:19px;font-weight:600;margin:6px 0 0}
  .mcard-body .lead{font-size:12.5px;color:var(--muted);line-height:1.75;margin:8px 0 0}
  .mcard-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px}

  /* ── 完本清单 / 全书收尾 ── */
  .fin-sec{display:flex;flex-direction:column;margin-top:14px}
  .fin-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
  .fin-ico{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:1px;border:1px solid var(--border);color:var(--muted)}
  .fin-ico.ok{background:color-mix(in oklch,var(--ok) 13%,var(--bg));border-color:color-mix(in oklch,var(--ok) 42%,var(--border));color:var(--ok)}
  .fin-ico.warn{background:color-mix(in oklch,var(--warn) 13%,var(--bg));border-color:color-mix(in oklch,var(--warn) 42%,var(--border));color:var(--warn)}
  .fin-t{flex:1 1 auto;min-width:0}
  .fin-t b{font-size:13.5px;font-weight:600}
  .fin-t p{margin:3px 0 0;font-size:12.5px;line-height:1.7;color:var(--muted)}
  .fin-hooks{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .fin-hook{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;background:var(--surface);color:var(--fg);font:inherit;font-size:12.5px}
  .fin-hook:hover{border-color:var(--muted)}
  .fin-hook.on{border-color:color-mix(in oklch,var(--accent) 42%,var(--border));background:var(--accent-faint)}
  .fin-hook .mk{flex:none;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--border);border-radius:var(--radius-pill);padding:2px 8px}
  .fin-hook.on .mk{color:var(--accent-strong);border-color:color-mix(in oklch,var(--accent) 45%,var(--border))}
  .fin-hook .nm{font-weight:600}
  .fin-hook .from{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
  .fin-done{display:flex;gap:12px;align-items:flex-start;border:1px solid color-mix(in oklch,var(--accent) 40%,var(--border));background:var(--accent-faint);border-radius:var(--radius);padding:13px 14px}
  .fin-done b{font-size:13.5px}
  .fin-done p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

  .toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:var(--surface);padding:9px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-card);animation:toast-in .22s ease}
  .toast svg{width:14px;height:14px;color:var(--ok);flex:none}
  @keyframes toast-in{from{opacity:0;transform:translateY(8px)}}

  /* 底部状态条：左版权、右版本，固定窗口底 */
  .statusbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 16px;
    background:var(--surface);border-top:1px solid var(--border);color:var(--muted);font-size:12px}
  .statusbar .sb-ver{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* ═══ 控制中心面板（c-account-control-center）——头像胶囊唯一入口 ═══ */
  .acct-menu{position:fixed;width:280px;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow-pop);padding:6px;z-index:60}
  .am-head{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:4px}
  .am-head .avatar{width:28px;height:28px}
  .am-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px;margin-right:auto}
  .am-group{padding:8px 12px 2px;font-size:11px;color:var(--muted);letter-spacing:.02em}
  .am-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border:0;border-radius:8px;background:none;color:var(--fg);font:inherit;font-size:13px;text-align:left}
  .am-item:hover{background:var(--fg-soft)}
  .am-item svg{width:15px;height:15px;color:var(--muted);flex:none}
  .am-hint{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .am-item.danger{color:var(--warn)}
  .am-item.danger svg{color:var(--warn)}
  .am-foot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px}
  .am-version{display:block;padding:4px 12px 6px;font-size:11px;color:var(--muted);text-align:right}

  @media (max-width:480px){
    .appbar{padding:0 12px;gap:8px}
    .appbar .nav a[href="model-config.html"]{display:none}
    .main{padding:28px 16px 64px}
    .update-strip{padding:16px 16px 0}
    .page-head{flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:22px}
    .head-acts{align-self:stretch}
    .bk-toolbar{align-items:stretch}
    .bk-search{flex:1 1 100%}
    .bk-chips{max-width:100%}
    .bk-sort{margin-left:0}
  }
</style>
</head>
<body>

<!-- ═══ 全局更新提示条（client-update-notify）：所有屏顶端，info 语气，可关闭 ═══ -->
<div class="update-strip" data-od-id="update-notice-strip">
  <div class="notice info" data-od-id="update-notice">
    <span class="nt">
      <b>发现新版本 v0.19（当前 v0.18）</b>
      <span>完本后全书收尾更稳，修复若干问题</span>
    </span>
    <button class="btn btn-secondary btn-sm" data-out="去下载">去下载</button>
    <button class="btn btn-ghost btn-sm" data-out="查看更新内容">查看更新内容</button>
    <button class="btn btn-ghost btn-sm" data-dismiss-strip>知道了</button>
  </div>
</div>

<header class="appbar" data-od-id="appbar">
  <a class="logo" href="works.html" data-od-id="appbar-logo"><span class="logo-mark">爱</span>爱小说</a>
  <nav class="nav">
    <a class="on" href="works.html" aria-current="page" data-od-id="nav-works">我的作品</a>
    <a href="model-config.html" data-out="模型配置">模型配置</a>
  </nav>
  <span class="spacer"></span>
  <div class="acct">
    <button class="acct-trigger" id="btnAcct" data-od-id="acct-trigger" aria-haspopup="menu" aria-expanded="false">
      <span class="avatar" aria-hidden="true">m</span><span class="badge badge-accent" data-od-id="acct-badge">PRO 会员</span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</header>

<main class="main" data-od-id="book-list">
  <div class="page-head">
    <div>
      <h1>我的作品</h1>
      <p class="sub">建书即写 · 设定与大纲是高级配置，随时可补</p>
    </div>
    <div class="head-acts">
      <button class="btn btn-secondary" data-out="导入已有稿子（.md / .txt / .docx）" data-od-id="btn-import">

        导入

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>
<footer class="statusbar" data-od-id="app-status-bar"><span data-od-id="app-credits">© 2026 爱小说</span><span class="sb-ver" data-od-id="status-version">v0.19</span></footer>

<script>
/* ═══════════ 数据 ═══════════ */
const STORE = 'od.works.v1';
const STATE_META = {
  setting:{label:'设定中', cls:'setting'},
  writing:{label:'写作中', cls:'writing'},
  ready:{label:'待完本', cls:'ready'},
  done:{label:'已完结', cls:'done'}
};
const STAGE_ICON = {
  setting:'<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>',
  writing:'<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>',
  ready:'<path d="M6 4v16M6 5h11l-2 3 2 3H6"/>',
  done:'<path d="M5 13l4 4L19 7"/>'
};
const GENRE_ICON = {
  '科幻':'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
  '悬疑':'<path d="M9.5 11a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/><path d="M9.5 11v6M7 7L4.5 3.5M12 7l2.5-3.5M9.5 14H8M9.5 17H8"/>',
  '都市':'<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h4v6"/><path d="M9 10h.01M13 10h.01M11 7h.01"/>',
  '玄幻':'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>',
  '武侠':'<path d="M4 20c6-2 12-8 15-15M13 7l4 4M6 14l4 4"/>',
  '历史':'<path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  '其他':'<path d="M12 3v18M3 12h18"/>'
};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M3.5 8.6l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* 星海拾遗 主线已全部归档 → 待完本；雾中法庭 演示已完结态 */
const DAY = 86400000;
const T = Date.now();
const SEED = [
  { title:'星海拾遗', genre:'科幻', state:'ready', vols:3, chs:17, words:48210, updated:'2 小时前', createdAt:T-90*DAY, updatedAt:T-2*3600e3, parked:{},
    summary:'废弃星港上，导航员沉舟捡到一枚不属于人类纪元的导航信标，决定修好旧船去追一段回声。',
    hooks:[{name:'回声信号的源头', from:2},{name:'旧航图缺口上的摩挲痕迹', from:6}] },
  { title:'雾中法庭', genre:'都市', state:'done', vols:3, chs:9, words:12842, updated:'3 天前', finishedAt:'3 天前', createdAt:T-200*DAY, updatedAt:T-3.5*DAY,
    summary:'律所新人姜序被卷入一场横跨十二年的旧案，迷雾散去时，法槌落下。' },
  { title:'沙漏之下', genre:'玄幻', state:'writing', vols:2, chs:6, words:21400, updated:'昨天', createdAt:T-60*DAY, updatedAt:T-26*3600e3,
    summary:'时间在城外的沙丘上倒流，捡贝壳的少年成了唯一记得明天的人。' },
  { title:'长夜灯', genre:'悬疑', state:'setting', vols:1, chs:2, words:0, updated:'昨天', createdAt:T-5*DAY, updatedAt:T-30*3600e3,
    summary:'一座永远天亮不了的县城，一个在深夜点灯的人。' },
  { title:'潮汐图书馆', genre:'科幻', state:'writing', vols:1, chs:4, words:8600, updated:'3 天前', createdAt:T-30*DAY, updatedAt:T-3*DAY,
    summary:'图书馆每天涨潮一次，还回来的书里夹着上一位借阅者没写完的信。' },
  { title:'归墟纪年', genre:'玄幻', state:'setting', vols:2, chs:3, words:4200, updated:'上周', createdAt:T-20*DAY, updatedAt:T-9*DAY,
    summary:'归墟之下埋着上一轮文明的墓碑，考古队挖开的第一铲，挖出了自己的名字。' }
];

let books = [];
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  books = Array.isArray(saved) ? saved : SEED.map(b => JSON.parse(JSON.stringify(b)));
  if (!Array.isArray(saved)) localStorage.setItem(STORE, JSON.stringify(books));
} catch (e) { books = SEED.map(b => JSON.parse(JSON.stringify(b))); }

const normChanged = books.some(b => typeof b.updatedAt !== 'number' || typeof b.createdAt !== 'number');
if (normChanged) {
  books.forEach(b => {
    if (typeof b.updatedAt !== 'number') b.updatedAt = Date.now();
    if (typeof b.createdAt !== 'number') b.createdAt = Date.now();
  });
  try { localStorage.setItem(STORE, JSON.stringify(books)); } catch (e) {}
}

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('zh-CN');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function persist(){ try { localStorage.setItem(STORE, JSON.stringify(books)); } catch (e) {} }

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg><span></span>';
  t.querySelector('span').textContent = msg;
  $('toastWrap').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2400);
}

/* ═══════════ 作品清单 ═══════════ */
const PAGE = 12;
const filters = { kind:'all', q:'', sort:'recency', shown:PAGE };
let io = null;

function visibleBooks(){
  const list = [];
  books.forEach((b, idx) => {
    if (filters.kind !== 'all' && b.state !== filters.kind) return;
    if (filters.q && (b.title || '').toLowerCase().indexOf(filters.q) < 0) return;
    list.push({ book:b, idx });
  });
  const rank = b => b.state === 'ready' ? 0 : b.state === 'writing' ? 1 : b.state === 'setting' ? 2 : 3;
  const st = filters.sort;
  list.sort((x, y) => {
    const r = rank(x.book) - rank(y.book);
    if (r) return r;
    let d = 0;
    if (st === 'words') d = (y.book.words || 0) - (x.book.words || 0);
    else if (st === 'title') d = String(x.book.title || '').localeCompare(String(y.book.title || ''), 'zh');
    else if (st === 'created') d = (y.book.createdAt || 0) - (x.book.createdAt || 0);
    else d = (y.book.updatedAt || 0) - (x.book.updatedAt || 0);
    if (d) return d;
    return String(x.book.title || '').localeCompare(String(y.book.title || ''), 'zh');
  });
  return list;
}

function sectionBox(cls, odId, html){
  const box = document.createElement('div');
  box.className = cls;
  box.dataset.odId = odId;
  box.innerHTML = html;
  return box;
}

function draw(){
  const wrap = $('cards');
  const list = visibleBooks();
  wrap.innerHTML = '';
  if (!list.length) { wrap.innerHTML = emptyStateHTML(); return; }
  const slice = list.slice(0, filters.shown);
  if (filters.kind === 'all') {
    wrap.appendChild(sectionBox('cards', 'cards-all', slice.map(bookCard).join('')));
  } else {
    const k = filters.kind;
    const firstReady = list.find(it => it.book.state === 'ready');
    const sec = document.createElement('div');
    sec.className = 'bk-group';
    sec.dataset.odId = 'group-' + k;
    sec.innerHTML = groupHeadHTML(k, list.length, k === 'ready' && firstReady ? firstReady.idx : -1);
    sec.appendChild(sectionBox('cards', 'group-cards-' + k, slice.map(bookCard).join('')));
    wrap.appendChild(sec);
  }
  if (list.length > filters.shown) {
    const lm = document.createElement('div');
    lm.className = 'load-more';
    lm.innerHTML = '<button class="btn btn-secondary" data-load-more data-od-id="load-more">显示更多 · <b class="num">' + filters.shown + ' / ' + list.length + '</b></button>';
    wrap.appendChild(lm);
    observeSentinel(lm);
  }
}

function showMore(){
  const total = visibleBooks().length;
  if (filters.shown >= total) return;
  filters.shown = Math.min(filters.shown + PAGE, total);
  draw();
}

function observeSentinel(node){
  if (io) io.disconnect();
  if (!('IntersectionObserver' in window)) return;
  io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) showMore(); }, { rootMargin:'160px' });
  io.observe(node);
}

function applyChips(){
  document.querySelectorAll('#filters .chip').forEach(c => {
    const on = c.getAttribute('data-kind') === filters.kind;
    c.classList.toggle('on', on);
    c.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

function groupHeadHTML(key, count, readyIdx){
  const labels = { ready:'待完本', writing:'写作中', setting:'设定中', done:'已完结' };
  let acts = '';
  if (key === 'ready' && readyIdx >= 0) {
    acts = '<div class="gh-acts"><button class="btn btn-primary btn-sm" data-finish="' + readyIdx + '" data-od-id="group-finish">去完本</button></div>';
  }
  return '<div class="bk-group-head">'
    + '<span class="gh-label"><span class="dot ' + key + '"></span>' + labels[key] + '</span>'
    + '<span class="gh-count">' + count + ' 本' + (key === 'ready' ? ' · 主线已收齐' : '') + '</span>'
    + acts
    + '</div>';
}

function bookCard(it){
  const b = it.book, meta = STATE_META[b.state] || STATE_META.setting;
  const ic = GENRE_ICON[b.genre] || GENRE_ICON['其他'];
  let foot;
  if (b.state === 'ready') {
    foot = '<span class="updated">全书 ' + b.chs + ' 章已归档</span>'
      + '<span class="foot-acts">'
      +   '<button class="btn btn-secondary btn-sm" data-preview="' + it.idx + '" data-od-id="preview-open-' + it.idx + '">回看</button>'
      +   '<button class="btn btn-primary btn-sm" data-finish="' + it.idx + '" data-od-id="finish-open-' + it.idx + '" title="全书章节都已归档 · 完结这本书">完本</button>'
      + '</span>';
  } else {
    foot = '<span class="updated">' + (b.state === 'done' ? '完结于 ' + esc(b.finishedAt || '—') : '更新于 ' + esc(b.updated || '—')) + '</span>'
      + '<span class="foot-acts">'
      +   (b.state === 'done' ? '<button class="btn btn-secondary btn-sm" data-preview="' + it.idx + '" data-od-id="preview-open-' + it.idx + '">回看</button>' : '')
      +   '<span class="go">' + (b.state === 'done' ? '查看' : '继续创作') + ARROW + '</span>'
      + '</span>';
  }
  return '<div class="book-card" role="link" tabindex="0" data-open-book="' + it.idx + '" data-od-id="book-card-' + it.idx + '" aria-label="打开《' + esc(b.title) + '》">'
    + '<div class="top">'
    +   '<span class="mono">' + esc((b.title || '书')[0]) + '</span>'
    +   '<span class="genre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ic + '</svg>' + esc(b.genre) + '</span>'
    +   '<span class="b ' + meta.cls + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + STAGE_ICON[b.state] + '</svg>' + meta.label + '</span>'
    + '</div>'
    + '<h3>《' + esc(b.title) + '》</h3>'
    + '<p class="summary">' + esc(b.summary) + '</p>'
    + '<div class="stats">'
    +   '<span><b class="num">' + b.vols + ' 卷</b>结构</span>'
    +   '<span><b class="num">' + b.chs + ' 章</b>章节</span>'
    +   '<span><b class="num">' + fmt(b.words) + '</b>总字数</span>'
    + '</div>'
    + '<div class="foot">' + foot + '</div>'
    + '</div>';
}

function emptyStateHTML(){
  const filtered = filters.kind !== 'all' || !!filters.q;
  return '<div class="bk-empty" data-od-id="empty-state">'
    + '<span class="em">没有找到符合条件的作品</span>'
    + '<p class="es">' + (filtered ? '换个关键词或状态再试试。' : '这是你的第一本书，从设定开始。') + '</p>'
    + '<div class="acts">'
    +   (filtered ? '<button class="btn btn-secondary" data-clear-filters data-od-id="empty-clear">清除筛选</button>' : '')
    +   '<button class="btn btn-primary" data-out="新建作品" data-od-id="empty-create">新建作品</button>'
    + '</div>'
    + '</div>';
}

function renderCards(){
  applyChips();
  draw();
}

/* ═══════════ 完本清单 → 完结 → 全书收尾 ═══════════ */
let finIdx = -1;
function openFinish(i){
  finIdx = i;
  renderFinish();
  openModal('finish');
}
function renderFinish(){
  const b = books[finIdx];
  if (!b) return;
  const body = $('fin-body'), foot = $('fin-foot');
  if (b.state !== 'done') {
    b.parked = b.parked || {};
    const hooks = b.hooks || [];
    $('fin-kick').textContent = '完本 · 全书收尾';
    $('fin-title').textContent = '完结《' + b.title + '》？';
    $('fin-lead').textContent = '主线 ' + b.chs + ' 章 · ' + b.vols + ' 卷 · 约 ' + fmt(b.words) + ' 字都已归档。'
      + '完本是一个动作，按下后这本书标为已完结；全书收尾随即在后台跑，结论都留在这本书的「操作」页等你逐条确认。';
    const row = (ok, t, d, extra) => '<div class="fin-row">'
      + '<span class="fin-ico ' + (ok ? 'ok' : 'warn') + '">' + (ok ? CHECK : '!') + '</span>'
      + '<div class="fin-t"><b>' + t + '</b><p>' + d + '</p>' + (extra || '') + '</div></div>';
    body.innerHTML = '<div class="fin-sec">'
      + row(true, '章节已全部归档', '没有草稿、待写或拟定章，主线完整。')
      + row(hooks.length === 0, hooks.length ? '还有 ' + hooks.length + ' 条伏笔悬着' : '伏笔都已回收',
          hooks.length
            ? '下面是全书里埋下却还没回收的伏笔。确认是故意留白的就勾上，完本照常；否则先回去收掉。'
            : '没有埋下未收的伏笔，这本书的线都收干净了。',
          hooks.length ? '<ul class="fin-hooks">' + hooks.map(h => {
            const on = !!b.parked[h.name];
            return '<button type="button" class="fin-hook' + (on ? ' on' : '') + '" data-fin-hook="' + esc(h.name) + '" aria-pressed="' + (on ? 'true' : 'false') + '">'
              + '<span class="mk">' + (on ? '留白' : '未收') + '</span>'
              + '<span class="nm">' + esc(h.name) + '</span>'
              + '<span class="from">第 ' + h.from + ' 章埋下</span></button>';
          }).join('') + '</ul>' : '')
      + row(true, '归档收尾都已清', '每一章归档后的写回提案都处理完了。')
      + '</div>';
    foot.innerHTML = '<button class="btn btn-secondary" data-close="finish">再想想</button>'
      + '<button class="btn btn-primary" data-fin-confirm data-od-id="finish-confirm">完结这本书</button>';
    return;
  }
  $('fin-kick').textContent = '已完结 · 全书收尾';
  $('fin-title').textContent = '《' + b.title + '》已完结';
  $('fin-lead').textContent = '主线 ' + b.chs + ' 章 · ' + b.vols + ' 卷 · 约 ' + fmt(b.words) + ' 字 · 完结于' + (b.finishedAt || '—') + '。';
  body.innerHTML = '<div class="fin-sec"><div class="fin-done"><span class="fin-ico ok">' + CHECK + '</span><div><b>已完结</b>'
    + '<p>读者与编辑看到的状态是「已完结 · 连载结束」。想加新章或改结局，就先撤完本。</p></div></div></div>';
  foot.innerHTML = '<button class="btn btn-secondary" data-reopen data-od-id="book-reopen">撤完本 · 继续写</button>'
    + '<button class="btn btn-primary" data-close="finish">关闭</button>';
}
function confirmFinish(){
  const b = books[finIdx];
  if (!b || b.state === 'done') return;
  b.state = 'done';
  b.finishedAt = '刚刚';
  delete b.updated;
  persist();
  closeModal('finish');
  renderCards();
  toast('《' + b.title + '》已完结 · 全书收尾在后台跑，结论在这本书的「操作」页逐条确认');
}
function reopenBook(){
  const b = books[finIdx];
  if (!b || b.state !== 'done') return;
  b.state = 'ready';
  delete b.finishedAt;
  b.updated = '刚刚';
  persist();
  closeModal('finish');
  renderCards();
  toast('已撤完本 · 《' + b.title + '》回到待完本，可以接着写或加新章');
}

/* ═══════════ 弹窗通用 ═══════════ */
let lastFocus = null;
function openModal(id){
  const m = $(id);
  if (!m) return;
  lastFocus = document.activeElement;
  $('scrim').hidden = false;
  m.hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('show'); m.classList.add('show'); });
}
function closeModal(id){
  const m = $(id);
  if (!m) return;
  m.classList.remove('show');
  $('scrim').classList.remove('show');
  setTimeout(() => {
    m.hidden = true;
    $('scrim').hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }, 200);
}
$('scrim').addEventListener('click', () => { const o = document.querySelector('.modal:not([hidden])'); if (o) closeModal(o.id); });
$('finish').addEventListener('click', e => { if (e.target === $('finish')) closeModal('finish'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const o = document.querySelector('.modal:not([hidden])');
    if (o) { closeModal(o.id); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-open-book') !== null) {
    e.preventDefault(); location.href = 'storyline.html';
  }
});

/* ═══════════ 交互委派 ═══════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open-book],[data-preview],[data-finish],[data-fin-hook],[data-fin-confirm],[data-reopen],[data-kind],[data-load-more],[data-clear-filters],[data-dismiss-strip],[data-close],[data-out]');
  if (!t) return;
  if (t.hasAttribute('data-open-book')) { e.preventDefault(); location.href = 'storyline.html'; return; }
  if (t.hasAttribute('data-preview')) { e.preventDefault(); location.href = 'preview.html'; return; }
  if (t.hasAttribute('data-finish')) { e.preventDefault(); e.stopPropagation(); openFinish(parseInt(t.getAttribute('data-finish'), 10)); return; }
  if (t.hasAttribute('data-fin-hook')) {
    const b = books[finIdx];
    if (b) { b.parked = b.parked || {}; const n = t.getAttribute('data-fin-hook'); b.parked[n] = !b.parked[n]; renderFinish(); }
    return;
  }
  if (t.hasAttribute('data-fin-confirm')) { confirmFinish(); return; }
  if (t.hasAttribute('data-reopen')) { reopenBook(); return; }
  if (t.hasAttribute('data-kind')) { filters.kind = t.getAttribute('data-kind'); filters.shown = PAGE; renderCards(); return; }
  if (t.hasAttribute('data-load-more')) { e.preventDefault(); showMore(); return; }
  if (t.hasAttribute('data-clear-filters')) {
    filters.kind = 'all'; filters.sort = 'recency'; filters.q = ''; filters.shown = PAGE;
    $('q').value = '';
    renderCards();
    return;
  }
  if (t.hasAttribute('data-dismiss-strip')) { t.closest('.notice').remove(); return; }
  if (t.hasAttribute('data-close')) { closeModal(t.getAttribute('data-close')); return; }
  if (t.hasAttribute('data-out')) { e.preventDefault(); toast('演示稿：' + t.getAttribute('data-out') + ' 不在本原型范围'); return; }
});

/* ═══════════ 控制中心面板 ═══════════ */
const acctTrigger = $('btnAcct'), acctMenu = $('acctMenu');
function positionAcctMenu(){
  const r = acctTrigger.getBoundingClientRect();
  acctMenu.style.top = (r.bottom + 4) + 'px';
  acctMenu.style.right = (window.innerWidth - r.right) + 'px';
}
function setAcctOpen(open){
  acctMenu.hidden = !open;
  acctTrigger.classList.toggle('open', open);
  acctTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) positionAcctMenu();
}
acctTrigger.addEventListener('click', e => { e.stopPropagation(); setAcctOpen(acctMenu.hidden); });
document.addEventListener('click', e => {
  if (!acctMenu.hidden && !acctMenu.contains(e.target) && !acctTrigger.contains(e.target)) setAcctOpen(false);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !acctMenu.hidden) setAcctOpen(false); });
window.addEventListener('resize', () => { if (!acctMenu.hidden) positionAcctMenu(); });

/* ═══════════ 启动 ═══════════ */
$('q').addEventListener('input', e => { filters.q = e.target.value.trim().toLowerCase(); filters.shown = PAGE; renderCards(); });
$('sort').addEventListener('change', e => { filters.sort = e.target.value; filters.shown = PAGE; renderCards(); });
renderCards();
</script>
</body>
