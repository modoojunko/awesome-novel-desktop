/* 每卡＝五个问题的答案，只摆对后续章纲/正文生成有帮助的字段：
   讲什么（主旨）／主要冲突／这一卷的坎（类型+是谁）／角色（谁登场·作用）／卷末（收在哪） */
function pickCardsHTML(){
  const list = state.plans;
  const g = $('#pick-grid'); if(!g) return;
  if(!list || list==='busy'){
    g.innerHTML = '<div style="grid-column:1/-1" class="ai-note"><span class="ra-spin"></span>'
      + (list==='busy' ? '正在想三套思路——都按你的设定和上一卷的结尾推…' : '') + '</div>';
    return;
  }
  g.innerHTML = list.map(p=>{
    const o = planOl(p);
    const cast = (o.cast||[]).map(c=>'<span>'+esc(c.n)+' · '+esc(c.l)+'</span>').join('');
    const en = enterText();
    return '<button type="button" class="pick-card'+(state.pickPick===p.k?' on':'')+'" data-act="pick-select" data-k="'+p.k+'" data-od-id="pick-card-'+p.k.toLowerCase()+'">'
    + '<div class="pk-row pk-in" data-od-id="pick-enter-'+p.k.toLowerCase()+'"><b>'+esc(en.k)+'</b><span title="'+attr(en.v)+'">'+esc(en.v)+'</span></div>'
    + '<span class="pk-axis">'+esc(p.focus.split('——')[0].replace('侧重','').trim())+'</span>'
    + '<p class="pk-title">'+esc(p.spine)+'</p>'
    + '<div class="pk-row"><b>主要冲突</b><span>'+esc(o.conflict)+'</span></div>'
    + (p.ant ? '<div class="pk-row"><b>这一卷的坎</b><span>'+esc(p.ant)+'</span></div>' : '')
    + '<div class="pk-row"><b>卷末</b><span>'+esc(o.ending)+'</span></div>'
    + (state.pickPick===p.k?'<span class="pk-picked">✓ 已选这一套</span>':'')
    + '</button>';
  }).join('');
}
function pickFootHTML(){
  const f = $('#pick-foot'); if(!f) return;
  const chosen = state.pickPick;
  f.innerHTML =
      '<button class="btn btn-sm" data-act="plans-again" data-od-id="cta-plans-again">↻ 都不满意？换 3 套</button>'
    + '<span class="note">换一批新思路——或<button class="link" data-act="pick-to-desk">自己答四个问题</button>（答多少 AI 铺多少）</span>'
    + (state.pickGen
        ? '<button class="btn btn-sm btn-accent" disabled><span class="ra-spin"></span>正在铺这一卷…</button>'
        : '<button class="btn btn-sm btn-accent" data-act="pick-confirm" data-od-id="cta-pick-confirm"'+(chosen?'':' disabled')+'>确认这一套，成卷 →</button>');
}
/* 这一卷从哪里进场（第二卷起＝上一卷的结尾；首卷＝全景起步）。
   锚点块与每张抽卡卡片的「上接」行**同源**——滚到卡片区、锚点不在视野时仍能判断衔接。 */
function enterText(){
  const n = state.planVol;
  const prev = n > 1 ? state.vols[n-2] : null;
  return prev
    ? { k:'上接', v:(prev.ending || '（上一卷还没写卷末结局）') }
    : { k:'起点', v:BOOK.start };
}
function pickModalHTML(){
  const m = $('#pick-modal'); if(!m) return;
  if(!state.pickModal){ m.classList.remove('on'); $('#pick-grid').innerHTML=''; $('#pick-foot').innerHTML=''; return; }
  const n = state.planVol;
  $('#pick-kick').textContent = '规划第'+CN[n]+'卷 · 三选一';
  $('#pick-title').textContent = 'AI 想好了三套思路';
  pickCardsHTML(); pickFootHTML();
  m.classList.add('on');
}

/* 规划台的第一块材料：这一卷从哪里进场（上一卷的结尾／首卷用全景起步）＋全书卷数估计 */
function anchorHTML(){
  const n = state.planVol, v2 = n>1;
  const prev = v2 ? state.vols[n-2] : null;
  const lead = v2
    ? '规划第'+CN[n]+'卷，就是接着第'+CN[n-1]+'卷的结尾往下写——本卷讲什么、收在哪里。'
    : '规划第一卷，从全景的起步开始——本卷讲什么、收在哪里。';
  const rows = [];
  if(v2){
    rows.push(['上一卷的结尾',
      esc((prev && prev.ending) || '（上一卷还没写卷末结局）')
      + '<span class="pa-src">第'+CN[n-1]+'卷 · 预期结局——写到那里之后，这里换成实际收尾</span>']);
  } else {
    rows.push(['起点', esc(BOOK.start) + '<span class="pa-src">来自主线全景的「他从哪起步」</span>']);
    rows.push(['卷数', '按你写的结局估，这本书大约 <b>'+PLANNED+'</b> 卷——拆到哪一卷都行。']);
  }
  return '<p class="pa-lead">'+lead+'</p>'
    + rows.map(r=>'<div class="pa-row"><span class="pa-k">'+r[0]+'</span><span class="pa-v">'+r[1]+'</span></div>').join('');
}

function planHTML(){
  const modal = $('#plan-modal');
  if(!modal) return;
  if(!state.modal){ modal.classList.remove('on');
    /* 关弹窗即清内容：防隐藏 DOM 里的 data 属性双份（完成态清单等） */
    const d=$('#plan-desk'), c=$('#plan-cands'), f=$('#plan-foot');
    if(d) d.innerHTML=''; if(c) c.innerHTML=''; if(f) f.innerHTML=''; return; }
  const n = state.planVol, v2 = n>1;
  $('#plan-kick').textContent = '分卷规划 · 第'+CN[n]+'卷';
  $('#plan-title').textContent = '规划第'+CN[n]+'卷';
  $('#plan-anchor').innerHTML = anchorHTML();
  /* 生成中 / 生成完成：规划台里继续，写完之后由作者点「回填」 */
  const writing = state.genView && state.phase==='gen';
  if(writing){
    const done = state.genDone;
    $('#plan-deps').innerHTML = '';
    $('#plan-desk').innerHTML = genProgressHTML(done);

    $('#plan-again').innerHTML = '';

      ? '<span class="note">点「回填」，卷纲会在中栏一条条落下来</span><button class="btn btn-sm btn-accent" data-act="fill" data-od-id="cta-fill">回填 →</button>'
      : '<span class="note">生成在后台跑，关掉它也不影响</span><button class="btn btn-sm" data-act="plan-close">关掉</button>';

    +   '<button class="btn" data-act="manual-create" data-od-id="cta-manual-create">直接创建这一卷</button>'
    +   '<span class="push">'+(state.pro ? '你答过的它不改——AI 只铺空着的' : '<span class="pill-pro">PRO</span> 铺空缺需 PRO；手写与创建不受限')+'</span>'
    + '</div>'
    + '<p class="hint">三套都忠于全书主线、世界观、核心人物和终极目标——不同的只是走向、冲突和侧重点。</p>'
    + '<details class="cfgset plan-rules" data-od-id="plan-rules"><summary>展开时遵守的规则 · 每卷都带上</summary>'
    +   '<ul class="rp-list">'+RULES.map(r=>'<li class="rp-row"><span class="rp-dot" aria-hidden="true"></span><span class="rp-tx">'+esc(r)+'</span></li>').join('')+'</ul>'
    +   '<p class="ai-note" style="margin-top:10px">每次展开都守着这七条；「卷纲体检」也是照它们复核。</p>'
    + '</details>';
  $('#plan-foot').innerHTML = '<span class="note">规划台里的东西不会自己进书；卷名最后起；卷与卷之间留着没写到的部分，是正常的。</span>'
    + '<button class="btn btn-sm" data-act="plan-close">先不规划</button>';
  modal.classList.add('on');
}

/* ═══════════ 渲染：演示控制（非基线） ═══════════ */
function demoHTML(){
  $('#demo-bar').innerHTML = '<span class="db-k">演示 · 非基线</span>'
    + DEMO.map(d=>'<button data-act="demo" data-demo="'+d[0]+'"'+(state.demo===d[0]?' class="on"':'')+'>'+d[1]+'</button>').join('')
    + '<span class="db-sep"></span><span class="db-k">身份</span>'
    + '<button data-act="pro" data-pro="1"'+(state.pro?' class="on"':'')+'>PRO</button>'
    + '<button data-act="pro" data-pro="0"'+(state.pro?'':' class="on"')+'>免费</button>';
}

function render(){
  pickModalHTML();
  const av = $('#av-modal');
  if(av) av.classList.toggle('on', !!state.avModal);
  $('#here-bar-slot').innerHTML = barHere();
  const vols = state.vols.length;
  $('#modWriteCnt').textContent = vols ? '0/'+vols+' 章纲' : '0/0 章纲';
  $('#toc-count').textContent = vols ? vols+' 卷 · 共 0 章' : '共 0 章';
  $('#toc').innerHTML = tocHTML();
  $('#editor').innerHTML = editorHTML();
  $('#ai-panel').innerHTML = railHTML();
  $('#acct-badge').textContent = state.pro ? 'PRO 会员' : '免费版';
  planHTML(); demoHTML();
}

/* ═══════════ 抽卡数据加载 ═══════════ */
function drawPlans(){
  state.plans='busy'; if(state.pickModal) pickCardsHTML(); else render();
  const token = ++state.genToken;
  setTimeout(()=>{
    if(state.genToken!==token) return;
    state.plans = (state.plansRound ? PLANS_ALT[state.planVol] : PLANS[state.planVol]) || PLANS[state.planVol];
    if(!state.plans || !state.plans.length){ state.plans = PLANS[state.planVol]; }
    state.pickPick = null;
    if(state.pickModal){ pickCardsHTML(); pickFootHTML(); } else render();
  }, 900);
}

/* 卷角色＝聚合视图（demo 恒空——本稿没有章数据；实现＝卷下各章章纲 characters 合集） */
function viewedVolHasChapters(){ return false; }
function aggCastLine(){ return ''; }

/* ═══════════ 手动创建（四问页的免费路径）═══════════ */
/* 不经 AI：五问页上答了多少建多少，卷名兜底「第N卷」（卷名最后起），落点卡承接 */
function manualCreate(){
  syncDesk();
  const n = state.vols.length + 1;
  const vol = { name:'第'+CN[n]+'卷', summary:state.q1.trim(), conflict:state.q2.trim(),
    ending:state.q5.trim(),
    ant:{ type:state.antType==='先不选'?'':state.antType, line:state.antLine.trim() }, total:0 };
  state.vols.push(vol);
  Object.assign(state,{ modal:false, phase:'saved', selVol:-1, planVol:n, demo:'' });
  render();
  toast('第'+CN[n]+'卷已建好——卷名与章数进卷纲再定，角色清单也在卷纲里等你');
}
/* 五问页 → state（展开/创建前兜底同步；输入事件已即时同步，这里兜底失焦漏网） */
function syncDesk(){
  const g=id=>{ const el=$('#'+id); return el ? el.value : ''; };
  state.q1=g('q-what'); state.q2=g('q-conflict'); state.q5=g('q-ending');
  const t=$('#p-ant-type'), l=$('#p-ant-line');
  if(t) state.antType=t.value;
  if(l) state.antLine=l.value;
}

/* ═══════════ 动作 ═══════════ */
function collectVolEdits(){
  const g = id=>{ const el=$('#'+id); return el ? el.value : ''; };
  return { name:g('v-name').trim(), total:parseInt(g('v-total'),10)||0,
    summary:g('v-summary').trim(), conflict:g('v-conflict').trim(), ending:g('v-ending').trim(),
    ant:{ type:(()=>{ const el=$('#v-ant-type'); return el?el.value:''; })(), line:g('v-ant-line').trim() } };
}
function saveVol(){
  const d = collectVolEdits();
  if(!d.summary){ toast('本卷主旨是必填——一句就行'); return; }
  if(!d.conflict){ toast('核心矛盾是必填——这一卷要回答的问题'); return; }
  const i = state.planVol - 1;
  d.dir = curDir(); d.report = curOl().report; d.line = state.submittedLine || curLine();
  if(state.vols[i]) state.vols[i] = d; else state.vols.push(d);
  state.selVol = -1;   /* 回写作默认页 */
  state.phase = 'saved'; state.check = null; state.demo = 'saved';
  render();
  toast('已建立「'+(d.name||('第'+CN[state.planVol]+'卷'))+'」· 卷纲已保存，排第一章就能开写');
}
function startGen(){
  state.phase='gen'; state.check=null; state.scIgnored=false; state.genView=true; state.genDone=false;
  state.modal=true; state.demo='gen'; state.fill=0;
  const token = ++state.genToken;
  render();
  setTimeout(()=>{
    if(state.genToken!==token || state.phase!=='gen') return;
    const ol = curOl();
    /* 作家答过的它不改：Q1→主旨来源；Q2/Q4 非空覆盖 AI 稿；Q3（坎）覆盖 */
    if(state.q2.trim()) ol.conflict = state.q2.trim();
    if(state.q5.trim()) ol.ending = state.q5.trim();
    if(state.antLine.trim()) ol.ant = { type: state.antType==='先不选' ? '' : state.antType, line: state.antLine.trim() };

    state.genDone = true; render();
    if(!state.modal) beginFill();   /* 弹窗被关掉：不必再点一次，直接回填 */
  }, 2600);
}
/* 作者点「回填」：中栏整页一条条落下来 */
function beginFill(){
  state.phase='draft'; state.modal=false; state.genView=false; state.genDone=false;
  state.fill=0; state.demo='draft';
  const token = ++state.genToken;
  const total = FORM_BLOCKS.length;
  render();
  const step = ()=>{
    if(state.genToken!==token || state.phase!=='draft') return;
    state.fill = Math.min(total, state.fill+1);
    render();
    if(state.fill < total){ setTimeout(step, 300); return; }
    toast('卷纲已填好 · 改完点「保存卷纲」');
  };
  setTimeout(step, 240);
}
function runCheck(){
  state.check='busy'; render();
  const v = viewedVol() || {};
  const rows = v.report ? v.report.groups.reduce((a,g)=>a.concat(g[1]),[]) : [];
  const warn = rows.filter(r=>r[0]==='warn').length, ok = rows.filter(r=>r[0]==='ok').length;
  setTimeout(()=>{ if(state.check==='busy'){ state.check='done'; render(); toast('卷纲体检完成：'+warn+' 条要留意，'+ok+' 条通过 · 只读不拦'); } }, 900);
}
function openPlan(n){
  if(n>2){ toast('演示稿：本稿演到第二卷为止'); return; }
  state.planVol = n; state.pick = null; state.check = null; state.scIgnored = false;
  state.genView = false; state.genDone = false; state.fill = 0; state.submittedLine = ''; state.plans = null;
  state.q1=''; state.q2=''; state.q5=''; state.antType='先不选'; state.antLine=''; state.cast=[]; state.castIgnored=false;
  state.input = curLine();   /* 首卷＝演示里作家写好的那一句；第二卷留空 */
  state.plansRound = 0; state.pickPick = null; state.pickGen = false;
  /* 付费＝三选一抽卡弹窗（roguelike：AI 先把五问答好三份，作家决策）；免费＝五问手写页 */
  if(state.pro){
    state.pickModal = true; state.modal = false; state.demo = (n===2 ? 'next' : 'desk');
    render(); drawPlans();
  } else {
    state.modal = true; state.pickModal = false; state.demo = (n===2 ? 'next' : 'desk');
    render();
  }
}
function mkVol(c){ return Object.assign({}, JSON.parse(JSON.stringify(c.ol)), { dir:c.dir, why:c.why }); }
function setDemo(k){
  if(k==='empty'){ Object.assign(state,{phase:'empty',pick:null,vols:[],check:null,scIgnored:false,modal:false,input:'',submittedLine:'',planVol:1,genView:false,genDone:false,fill:0,selVol:-1}); }
  else if(k==='desk'){ Object.assign(state,{phase:'empty',pick:null,vols:[],check:null,scIgnored:false,modal:false,pickModal:false,input:CANDS[0].dir,submittedLine:'',planVol:1,genView:false,genDone:false,fill:0,selVol:-1,plans:null,plansRound:0,pickPick:null});
    if(state.pro){ state.pickModal=true; render(); drawPlans(); } else { state.modal=true; render(); } }
  else if(k==='genDone'){ Object.assign(state,{pick:'A',vols:[],modal:true,phase:'gen',planVol:1,genView:true,genDone:true,fill:0,check:null,scIgnored:false,input:CANDS[0].dir,submittedLine:CANDS[0].dir,selVol:-1}); }
  else if(k==='home'){ Object.assign(state,{pick:null,vols:[mkVol(CANDS[0]),mkVol(VOL2)],modal:false,phase:'saved',planVol:2,selVol:-1,check:null,genView:false,genDone:false,fill:FORM_BLOCKS.length,submittedLine:''}); }
  else if(k==='saved'){ Object.assign(state,{pick:'A',vols:[mkVol(CANDS[0])],modal:false,phase:'saved',planVol:1,selVol:-1,check:null,genView:false,genDone:false,fill:FORM_BLOCKS.length,submittedLine:CANDS[0].dir}); }
  else if(k==='vol'){ Object.assign(state,{pick:'A',vols:[mkVol(CANDS[0])],modal:false,phase:'saved',planVol:1,selVol:0,check:'done',genView:false,genDone:false,fill:FORM_BLOCKS.length,submittedLine:CANDS[0].dir}); }
  else if(k==='next'){ Object.assign(state,{pick:'A',vols:[mkVol(CANDS[0])],modal:true,phase:'saved',planVol:2,selVol:-1,input:'',submittedLine:'',check:null,genView:false,genDone:false,fill:0}); }
  state.demo=k;
  render();
}

const ACTS = {
  'plan-open': ()=>{ openPlan(nextNo()); },
  'next-vol': ()=>{ openPlan(nextNo()); },
  'plan-close': ()=>{ state.modal=false; state.genView=false; if(state.phase==='gen' && state.genDone) beginFill(); else render(); },
  'fill': ()=>{ beginFill(); },
  'expand': ()=>{ if(!state.pro){ toast('生成需 PRO'); return; }
    syncDesk();
    state.submittedLine = state.q1.trim(); state.pick = (curPlan() ? state.pick : (state.submittedLine ? 'custom' : null));
    state.modal=false; startGen(); },
  'manual-create': ()=>{ manualCreate(); },
  'plan-again': ()=>{ state.modal=true; state.genView=false; state.genDone=false; render(); },
  'plans': ()=>{ if(!state.pro){ toast('生成需 PRO'); return; }
    state.modal=false; state.pickModal=true; state.pickPick=null; state.plans='busy'; render(); drawPlans(); },
  'pick-select': el=>{ state.pickPick = el.dataset.k; pickCardsHTML(); pickFootHTML(); },
  'pick-close': ()=>{ state.pickModal=false; state.pickGen=false; state.genToken++; render(); },
  'pick-to-desk': ()=>{ state.pickModal=false; state.modal=true; render(); },
  'pick-confirm': ()=>{
    const p = (state.plans||[]).find(x=>x.k===state.pickPick);
    if(!p) return;
    state.pickGen = true; pickFootHTML();
    const token = ++state.genToken;   /* 确认中关闭＝取消不落库 */
    setTimeout(()=>{
      if(state.genToken!==token) return;
      const n = state.planVol;
      const o = planOl(p);
      const vol = Object.assign(JSON.parse(JSON.stringify(o)), {
        name:o.name||('第'+CN[n]+'卷'),
        ant:(p.ant?{type:String(p.ant).split(' · ')[0], line:String(p.ant).split(' · ').slice(1).join(' · ')}:{type:'',line:''}),
        total:o.total||0 });
      if(state.vols[n-1]) state.vols[n-1]=vol; else state.vols.push(vol);
      Object.assign(state,{ pickModal:false, pickGen:false, pickPick:null, phase:'saved',
        selVol:-1, check:null, scIgnored:false, submittedLine:p.spine, demo:'' });
      render();
      const nPlant = (o.plants||[]).length;
      toast('第'+CN[n]+'卷「'+vol.name+'」已生成 · 建议 '+(vol.total||'—')+' 章'
        + (nPlant ? ' · '+nPlant+' 条伏笔建议已登记台账（编号可查）' : '') + '——进卷纲可改，排第一章就能开写');
    }, 1200);
  },
  'plans-again': ()=>{ if(!state.pro){ toast('换思路需 PRO'); return; }
    state.pickPick=null; state.plans='busy'; state.pick=null;
    if(state.pickModal) pickCardsHTML(); else render();
    setTimeout(()=>{
      state.plansRound = 1 - state.plansRound;
      const alt = PLANS_ALT[state.planVol];
      if(!alt || !alt.length){ state.plans = PLANS[state.planVol]; render(); toast('演示稿：这一卷的备选组待补——实现侧会重抽'); return; }
      state.plans = alt; render(); if(state.pickModal) pickCardsHTML(); toast('换了 3 套 · 还是那本书，只是走法不同');
    }, 900); },
  'pick': el=>{ const p=(state.plans||[]).find(x=>x.k===el.dataset.k); if(!p) return;
    const o=planOl(p);
    state.pick=p.k; state.q1=p.spine; state.q2=o.conflict; state.q5=o.ending;
    if(p.ant){ const m=String(p.ant).split(' · '); state.antType=(m.length>1?m[0]:''); state.antLine=(m.length>1?m.slice(1).join(' · '):p.ant); }
    state.cast=(o.cast||[]).map(c=>({n:c.n,l:c.l}));
    state.input=p.spine; state.submittedLine=p.spine; state.modal=false; startGen(); },
  'cast-del': el=>{ state.cast[+el.dataset.i].del = true; render(); },
  'cast-add': ()=>{ state.cast.push({n:'', l:''}); render(); },
  'cast-ignore': ()=>{ state.castIgnored=true; state.cast=[]; render(); toast('已忽略 · 登场人物留到写的时候再补'); },
  'quick-card': el=>{ KNOWN.push(el.dataset.name); toast('已建最小卡：「'+el.dataset.name+'」——名字＋定位一句话，设定页可补全'); render(); },

  'vol-save': ()=>{ saveVol(); },
  'vol-cancel': ()=>{ Object.assign(state,{phase:'empty',pick:null,vols:[],check:null,scIgnored:false,planVol:1,genView:false,genDone:false,fill:0}); state.demo='empty'; render(); toast('已放弃这一版 · 方向可以重选'); },
  'check': ()=>{ runCheck(); },
  'verify-vol': el=>{ state.selVol = parseInt(el.dataset.i,10)||0; state.check=null; render(); runCheck(); },
  'view-vol': el=>{ state.selVol = parseInt(el.dataset.i,10)||0; state.check=null; render(); },
  'sc-fix': ()=>{ toast('演示稿：让 AI 按这条自查改一版（本稿不覆盖）'); },
  'sc-ignore': ()=>{ state.scIgnored=true; render(); },
  'dep': el=>{ toast('演示稿：跳回设定页「'+el.dataset.name+'」——本原型未覆盖设定视图'); },
  'manual-vol': ()=>openPlan(nextNo()),
  'manual-ch': ()=>{ toast('演示稿：手动排章走现有「先垫第一卷」路径（本稿不覆盖）'); },
  'resume': ()=>{ toast('演示稿：续写回到上次写到的那一章（本稿不覆盖章工作台）'); },
  'add-ch-in-vol': ()=>{ toast('演示稿：排第一章走现有章工作台（本稿不覆盖）'); },
  'jump': ()=>{ state.selVol = -1; state.check = null; render(); toast('回到写作页 · 没有选中卷或章'); },
  'tab': ()=>{ toast('演示稿：本稿只覆盖「卷纲」页签'); },
  'stub': el=>{ toast('演示稿：'+(el.dataset.label||el.textContent.trim())+' 不在本稿范围'); },
  'demo': el=>{ setDemo(el.dataset.demo); },
  'pro': el=>{ state.pro = el.dataset.pro==='1'; render(); toast(state.pro?'演示身份：PRO':'演示身份：免费——体检照旧可用，生成类置灰'); }
};

document.addEventListener('click', e=>{
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t) return;
  const fn = ACTS[t.dataset.act];
  if(fn){ e.preventDefault(); fn(t); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(!t) return;
  if(t.id==='plan-input'){ state.input = t.value; }
  if(t.id==='q-what'){ state.q1 = t.value; }
  if(t.id==='q-conflict'){ state.q2 = t.value; }
  if(t.id==='q-ending'){ state.q5 = t.value; }
  if(t.id==='p-ant-line'){
    state.antLine = t.value;
    const h = t.closest('.plan-hurdle');
    if(h){
      let note = h.querySelector('.quick-note');
      const n = newNameOf(t.value);
      if(t.value.trim() && n && !KNOWN.includes(n)){
        if(!note){ note = document.createElement('p'); note.className='ai-note quick-note'; note.style.marginTop='6px'; h.appendChild(note); }
        note.innerHTML = '「'+esc(n)+'」还不在角色表——<button class="link" data-act="quick-card" data-name="'+attr(n)+'">先建一张卡（名字＋定位一句话）</button>，建完它就进设定。';
      } else if(note){ note.remove(); }
    }
  }
  if(t.dataset.castN!==undefined){ state.cast[+t.dataset.castN].n = t.value; }
  if(t.dataset.castL!==undefined){ state.cast[+t.dataset.castL].l = t.value; }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if(t && t.id==='p-ant-type'){ state.antType = t.value; }
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(state.pickModal){ state.pickModal=false; render(); return; }
  if(state.avModal){ state.avModal=false; render(); return; }
  if(state.modal){ state.modal=false; render(); }
});
$('#btn-home').addEventListener('click',()=>toast('演示稿：返回我的作品（作品列表）不在本原型范围'));
$('#btn-acct').addEventListener('click',()=>toast('演示稿：账号与设置不在本原型范围'));
document.querySelectorAll('.mtab').forEach(b=>b.addEventListener('click',()=>{
  if(b.classList.contains('on')) return;
  toast('演示稿：预设 / 预览视图不在本原型范围');
}));

/* ═══════════ 启动 ═══════════ */
render();
</script>
