<path d="M174 154 q11 -6 21 0 M206 154 q11 -6 21 0" stroke="#101a20" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
<path d="M200 162 l-3 18 l6 0" stroke="#101a20" stroke-width="2" fill="none" opacity="0.35"/>
<path d="M186 198 q14 6 28 0" stroke="#101a20" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
<path d="M136 252 L200 312 L264 252" fill="none" stroke="#101a20" stroke-width="3" opacity="0.25"/>
<path d="M240 160 l8 20" stroke="#101a20" stroke-width="2" opacity="0.5"/>
<path d="M0 248 q72 -20 144 0 t144 0" fill="none" stroke="#9fc3d2" stroke-width="5" opacity="0.45"/>
<rect width="400" height="400" fill="url(#vig)"/>
<rect width="400" height="400" filter="url(#grain)" opacity="0.55" fill="none"/>
</svg>
