<text x="538" y="723" text-anchor="middle" font-family="Noto Serif SC, Songti SC, STSong, Iowan Old Style, Georgia, serif" font-size="19" fill="#f1e7d2">长</text>
<text x="538" y="744" text-anchor="middle" font-family="Noto Serif SC, Songti SC, STSong, Iowan Old Style, Georgia, serif" font-size="19" fill="#f1e7d2">夜</text>
</svg>
