<ellipse cx="0" cy="0" rx="66" ry="28"/>
<path d="M-60 0 l-18 72 M48 0 l12 72 M-30 0 l-12 72 M24 0 l18 72" stroke="#080d14" stroke-width="9" stroke-linecap="round"/>
<circle cx="6" cy="-80" r="17"/><path d="M-3 -68 q24 -16 30 16 l-6 40 l-24 0 Z"/>
<path d="M27 -60 l96 -8" stroke="#080d14" stroke-width="5" stroke-linecap="round"/>
</g>
<ellipse cx="300" cy="576" rx="360" ry="20" fill="#e8e4d8" opacity="0.12" filter="url(#soft)"/>
<ellipse cx="300" cy="640" rx="360" ry="20" fill="#e8e4d8" opacity="0.12" filter="url(#soft)"/>
<rect width="600" height="800" fill="url(#vig)"/>
