<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我的作品 · 爱小说</title>
<style>
  /* ─── tokens（与全站一致） ─────────────────────────────── */
  :root {
    --bg:      oklch(98% 0.004 240);
    --surface: oklch(100% 0 0);
    --fg:      oklch(20% 0.02 240);
    --muted:   oklch(50% 0.018 240);
    --border:  oklch(90% 0.006 240);
    --accent:  oklch(48% 0.11 170);
    --accent-strong: oklch(41% 0.10 170);
    --accent-soft:   color-mix(in oklch, var(--accent) 12%, transparent);
    --ok:    oklch(52% 0.11 155);  --ok-soft:   color-mix(in oklch, var(--ok) 14%, transparent);
    --warn:  oklch(50% 0.13 75);   --warn-soft: color-mix(in oklch, var(--warn) 16%, transparent);
    --fg-soft:   color-mix(in oklch, var(--fg) 5%, transparent);
    --shadow-card: 0 1px 2px color-mix(in oklch, var(--fg) 5%, transparent),
                   0 12px 32px -12px color-mix(in oklch, var(--fg) 14%, transparent);
    --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'Iowan Old Style', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, 'JetBrains Mono', monospace;
    --radius: 10px; --radius-lg: 16px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.55;
    text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  img, svg { display: block; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
  input, textarea, select { font: inherit; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .serif { font-family: var(--font-display); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 15px; border-radius: var(--radius); border: 1px solid transparent; font-size: 13.5px; font-weight: 500; letter-spacing: 0.01em; transition: background 0.15s ease, border-color 0.15s ease; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--surface); }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--fg); }
  .btn-ghost { background: transparent; color: var(--muted); padding: 0 8px; }
  .btn-ghost:hover { color: var(--fg); background: var(--fg-soft); }
  .btn-sm { height: 28px; padding: 0 12px; font-size: 12.5px; border-radius: 8px; gap: 5px; }
  .btn svg { width: 15px; height: 15px; }
  .btn-sm svg { width: 13px; height: 13px; }

  /* ═══ 更新提示条（client-update-notify）——.notice 家族四条逐字同实现侧 list.css ═══ */
  .notice { display: flex; align-items: center; gap: 12px; border: 1px solid color-mix(in oklch, var(--warn) 28%, var(--border)); background: var(--warn-soft); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
  .notice.info { border-color: color-mix(in oklch, var(--accent) 30%, var(--border)); background: var(--accent-soft); }
  .notice .nt { flex: 1; }
  .notice .nt b { font-weight: 500; }
  .notice .nt span { color: var(--muted); font-size: 12.5px; margin-left: 8px; }
  .update-strip { width: min(100%, 1080px); margin-inline: auto; padding: 20px 32px 0; }
  .update-strip .notice { margin-bottom: 0; }
  .icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px; color: var(--muted); }
  .icon-btn:hover { color: var(--fg); background: var(--fg-soft); }
  .icon-btn svg { width: 15px; height: 15px; }

  .appbar { height: 48px; display: flex; align-items: center; padding: 0 20px; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.08em; }
  .logo-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; }
  .appbar .nav { display: inline-flex; gap: 4px; margin-left: 14px; }
  .appbar .nav a { font-size: 13.5px; color: var(--muted); padding: 5px 10px; border-radius: 8px; }
  .appbar .nav a:hover { color: var(--fg); }
  .appbar .nav a.on { color: var(--fg); background: var(--fg-soft); font-weight: 500; }
  .appbar .spacer { flex: 1; }

  .main { flex: 1; width: min(100%, 1080px); margin-inline: auto; padding: 48px 32px 80px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
  .page-head h1 { font-family: var(--font-display); font-size: 30px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .page-head .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .cards { grid-template-columns: 1fr; } }
  .book-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; cursor: pointer; transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease; }
  .book-card:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--border)); box-shadow: var(--shadow-card); transform: translateY(-2px); }
  .book-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .book-card .top { display: flex; align-items: center; gap: 8px; }
  .mono { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--fg-soft); border: 1px solid var(--border); display: grid; place-items: center; font-family: var(--font-display); font-size: 19px; color: var(--fg); }
  .genre { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 11.5px; color: var(--muted); background: var(--bg); }
  .genre svg { width: 12px; height: 12px; }
  .top .b { margin-left: auto; }
  .b { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .b.writing { background: var(--warn-soft); color: var(--warn); }
  .b.setting { background: var(--fg-soft); color: var(--muted); }
  .b.done { background: var(--ok-soft); color: var(--ok); }
  .b svg { width: 11px; height: 11px; }
  .book-card h3 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 14px 0 0; letter-spacing: 0.01em; }
  .book-card .summary { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .book-card .stats { display: flex; gap: 18px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .book-card .stats b { display: block; color: var(--fg); font-weight: 500; margin-bottom: 1px; }
  .book-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
  .book-card .updated { font-size: 11.5px; color: var(--muted); }
  .book-card .go { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--fg); }
  .book-card:hover .go { color: var(--accent); }
  .book-card .go svg { width: 14px; height: 14px; }

  .empty { border: 1px dashed var(--border); border-radius: var(--radius-lg); padding: 64px 32px; text-align: center; color: var(--muted); }
  .empty .serif { font-family: var(--font-display); font-size: 19px; color: var(--fg); }
  .empty p { margin: 8px 0 0; font-size: 13.5px; }

  /* ═══ 书架三态组件（转正自 docs/ux/home.html；书架屏私有）═══ */

  /* 首启态：三步引导空态（.empty 家族内长出，不另造版式） */
  .first-run { max-width: 720px; margin: 8px auto 0; text-align: center; }
  .first-run .fr-title { font-family: var(--font-display); font-size: 34px; color: var(--fg); display: block; }
  .fr-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 30px 0 0; text-align: left; }
  .fr-steps .step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; }
  .fr-steps .fr-n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  .fr-steps .fr-ic { width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 10px 0 8px; }
  .fr-steps .fr-ic svg { width: 17px; height: 17px; }
  .fr-steps b { display: block; font-size: 13.5px; font-weight: 500; }
  .fr-steps p { font-size: 12.5px; color: var(--muted); margin: 5px 0 0; line-height: 1.6; }
  .fr-cta { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  .fr-note { font-size: 12px; color: var(--muted); margin-top: 14px; }

  /* 满额态：网格尾升级锁卡（入口锁定可见 + 升级出口） */
  .lock-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1px dashed color-mix(in oklch, var(--accent) 40%, var(--border)); border-radius: var(--radius-lg); padding: 22px; color: var(--muted); text-align: center; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  .lock-tile:hover { border-color: var(--accent); background: var(--accent-soft); }
  .lock-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lock-tile .lt-ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .lock-tile .lt-ic svg { width: 18px; height: 18px; }
  .lock-tile b { font-size: 13.5px; color: var(--fg); font-weight: 500; }
  .lock-tile span { font-size: 12px; }

  .scrim { position: fixed; inset: 0; background: color-mix(in oklch, var(--fg) 28%, transparent); z-index: 40; opacity: 0; transition: opacity 0.2s ease; }
  .scrim.show { opacity: 1; }
  .modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; }
  .modal .mcard { width: min(420px, 92vw); max-height: calc(100vh - 48px); overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card); transform: translateY(8px) scale(0.98); opacity: 0; transition: transform 0.18s ease, opacity 0.18s ease; }
  .modal.show .mcard { transform: none; opacity: 1; }
  .mcard-head { display: flex; align-items: center; padding: 20px 24px 0; }
  .mcard-head .mh { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .mcard-head .x { margin-left: auto; }
  .mcard-body { padding: 14px 24px 6px; }
  .mcard-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12.5px; color: var(--muted); }
  .input, select.input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--fg); font-size: 14px; }
  .input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.7; padding: 10px 12px; background: var(--fg-soft); border-radius: 9px; }
  .hint b { color: var(--fg); font-weight: 500; }

  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { display: inline-flex; align-items: center; gap: 8px; background: var(--fg); color: var(--surface); padding: 9px 16px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow-card); animation: toast-in 0.22s ease; }
  .toast svg { width: 14px; height: 14px; color: var(--ok); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

  .pref-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .pref-row:last-child { border-bottom: 0; }
  .pref-row .pl { font-size: 13.5px; }
  .pref-row .pm { font-size: 12px; color: var(--muted); }
  .seg { display: inline-flex; align-items: center; background: var(--fg-soft); border-radius: 9px; padding: 2px; }
  .seg button { height: 24px; padding: 0 9px; border-radius: 7px; font-size: 12px; color: var(--muted); }
  .seg button:hover { color: var(--fg); }
  .seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px color-mix(in oklch, var(--fg) 8%, transparent); font-weight: 500; }

  /* 底部状态条（c-version-account-visibility V3）：左版权、右版本，固定窗口底 */
  .statusbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; height: 26px; padding: 0 16px; background: var(--surface); border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .statusbar .sb-ver { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  body { padding-bottom: 26px; }

  /* 窄屏：收拢 appbar，主 CTA 换行成全宽，防止横向溢出 */
  @media (max-width: 480px) {
    .appbar { padding: 0 12px; gap: 8px; }
    .appbar .nav { margin-left: 0; }
    .appbar .nav a[href="book.html"] { display: none; }
    .main { padding: 32px 16px 64px; }
    .update-strip { padding: 16px 16px 0; }
    .page-head { flex-direction: column; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
    .page-head .btn { align-self: stretch; }
  }

  /* ═══ 控制中心面板（c-account-control-center）——头像胶囊唯一入口 ═══ */
  .acct { display: inline-flex; }
  .acct-trigger { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 5px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--fg); cursor: pointer; font: inherit; font-size: 12.5px; }
  .acct-trigger:hover { border-color: var(--accent); }
  .acct-trigger.open { border-color: var(--accent); background: var(--accent-soft); }
  .acct-trigger .caret { width: 14px; height: 14px; color: var(--muted); }
  .avatar { width: 24px; height: 24px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
  .badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 11px; line-height: 1.6; white-space: nowrap; }
  .badge-accent { background: var(--accent-soft); color: var(--accent); }
  .badge-muted { background: color-mix(in oklch, var(--fg) 6%, transparent); color: var(--muted); }
  .badge-warn { background: var(--warn-soft); color: var(--warn); }
  .acct-menu { position: fixed; width: 280px; max-height: calc(100vh - 24px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-card); padding: 6px; z-index: 60; }
  .am-head { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .am-head .avatar { width: 28px; height: 28px; }
  .am-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; margin-right: auto; }
  .am-group { padding: 8px 12px 2px; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .am-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 12px; border: 0; border-radius: 8px; background: none; color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; text-align: left; text-decoration: none; }
  .am-item:hover { background: color-mix(in oklch, var(--fg) 5%, transparent); }
  .am-item svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
  .am-hint { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .am-item.danger { color: var(--warn); }
  .am-item.danger svg { color: var(--warn); }
  .am-foot { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
  .am-version { display: block; padding: 4px 12px 6px; font-size: 11px; color: var(--muted); text-align: right; }
</style>
</head>
<body>

<!-- ═══ 全局更新提示条（client-update-notify）：所有屏顶端，info 语气，可关闭 ═══ -->
<div class="update-strip" data-od-id="update-notice-strip">
  <div class="notice info" data-od-id="update-notice">
    <span class="nt">
      <b>发现新版本 v0.13（当前 v0.11）</b>
      <span>提升章纲 AI 起草的稳定性，修复若干问题</span>
    </span>
    <button class="btn btn-secondary btn-sm" data-od-id="update-download">去下载</button>
    <button class="btn btn-ghost btn-sm" data-od-id="update-notes">查看更新内容</button>
    <button class="btn btn-ghost btn-sm" data-od-id="update-dismiss">知道了</button>
  </div>
</div>

<header class="appbar" data-od-id="appbar">
  <a class="logo" href="index.html"><span class="logo-mark">爱</span>爱小说</a>
  <nav class="nav">
    <a class="on" href="list.html" aria-current="page">我的作品</a>
    <a href="model-config.html">模型配置</a>
  </nav>
  <span class="spacer"></span>
  <div class="acct">
    <button class="acct-trigger" id="btnAcct" data-od-id="acct-trigger" aria-haspopup="menu" aria-expanded="false">
      <span class="avatar" aria-hidden="true">m</span><span class="badge badge-accent" data-od-id="acct-badge">PRO 会员</span><svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</header>

<main class="main" data-od-id="book-list">
  <div class="page-head">
    <div>
      <h1>我的作品</h1>
      <p class="sub">建书即写 · 设定与大纲是高级配置，随时可补</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-secondary" id="btnImport" title="导入已有稿子（.md / .txt / .docx）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V4M7 8l5-5 5 5M5 20h14"/></svg>
        导入
      </button>
      <button class="btn btn-primary" id="btnCreate" data-od-id="btn-create-novel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        新建作品
      </button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
  <div id="firstRunSlot"></div>
</main>

<!-- ═══ 创建弹窗 ═══ -->
<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modalCreate" hidden data-od-id="modal-create" role="dialog" aria-modal="true" aria-labelledby="createTitle">
  <div class="mcard">
    <div class="mcard-head">
      <span class="mh serif" id="createTitle">新建作品</span>
      <button class="icon-btn x" data-close="modalCreate" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="mcard-body">
      <div class="field">
        <label for="bkTitle">书名</label>
        <input class="input" id="bkTitle" placeholder="起个名字，10 秒内就能开始写" maxlength="30" />
      </div>
      <div class="field">
        <label for="bkGenre">类型 <span style="color:var(--muted); font-size:11px;">选填</span></label>
        <select class="input" id="bkGenre">
          <option value="玄幻">玄幻</option><option value="科幻">科幻</option><option value="都市">都市</option>
          <option value="悬疑">悬疑</option><option value="武侠">武侠</option><option value="历史">历史</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <p class="hint">创建后<b>直接进入这本书</b>。一本书两个模块：设定与大纲——大纲里点章，即可配章纲、看提示词、写正文；设定随时可补。</p>
    </div>
    <div class="mcard-foot">
      <button class="btn btn-secondary" data-close="modalCreate">取消</button>
      <button class="btn btn-primary" id="bkConfirm">创建并开始写作</button>
    </div>
  </div>
</div>

<!-- ═══ 控制中心面板（c-account-control-center）：头像胶囊唯一入口的右对齐 popover ═══ -->
<div class="acct-menu" id="acctMenu" hidden data-od-id="acct-menu" role="menu" aria-label="账号与设置">
  <div class="am-head" data-od-id="acct-menu-head">
    <span class="avatar" aria-hidden="true">m</span>
    <span class="am-name" title="modoojunko">modoojunko</span>
    <span class="badge badge-accent">PRO 会员</span>
  </div>
  <div class="am-group">数据</div>
  <button class="am-item" role="menuitem" data-od-id="acct-menu-backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 15V4M7 8l5-5 5 5M5 20h14"/></svg>备份<span class="am-hint">选择文件夹导出</span></button>
  <button class="am-item" role="menuitem" data-od-id="acct-menu-restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>恢复<span class="am-hint">从备份文件导入</span></button>

  <div class="am-foot">

    <span class="am-version" data-od-id="acct-menu-version">v0.19</span>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>
<footer class="statusbar" data-od-id="app-status-bar"><span data-od-id="app-credits">© 2026 爱小说</span><span class="sb-ver" data-od-id="status-version">v0.11</span></footer>

<script>
/* ═══════════ 数据 ═══════════ */
const SEED_BOOKS = [
  { title: '星海拾遗', genre: '科幻', stage: 'writing', stageLabel: '写作中', vols: 2, chs: 4, words: 1371, updated: '2 小时前', summary: '废弃星港上，导航员沉舟捡到一枚不属于人类纪元的导航信标，决定修好旧船去追一段回声。' },
  { title: '长夜灯', genre: '悬疑', stage: 'setting', stageLabel: '设定中', vols: 1, chs: 2, words: 0, updated: '昨天', summary: '一座永远天亮不了的县城，一个在深夜点灯的人。' },
  { title: '雾中法庭', genre: '都市', stage: 'done', stageLabel: '已归档', vols: 3, chs: 9, words: 12842, updated: '3 天前', summary: '律所新人姜序被卷入一场横跨十二年的旧案，迷雾散去时，法槌落下。' }
];
let books = [];
try {
  const saved = JSON.parse(localStorage.getItem('ainovel.books') || 'null');
  // 显式空数组 = 空态（parity 用）；非数组（首次访问）才落 SEED
  books = Array.isArray(saved) ? saved : SEED_BOOKS.map(b => ({ ...b }));
  if (!Array.isArray(saved)) localStorage.setItem('ainovel.books', JSON.stringify(books));
} catch (e) { books = SEED_BOOKS.map(b => ({ ...b })); }

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('zh-CN');
const isMember = localStorage.getItem('ainovel.member') !== '0';  // parity 注入：'0'=免费待遇
const FREE_LIMIT = 1;  // 与后端 require_project_limit 口径一致：免费/过期 1 个项目
const quota = !isMember && books.length >= FREE_LIMIT;
const GENRE_ICON = {
  '科幻': '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/>',
  '悬疑': '<path d="M9.5 11a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/><path d="M9.5 11v6M7 7L4.5 3.5M12 7l2.5-3.5M9.5 14H8M9.5 17H8"/>',
  '都市': '<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h4v6"/><path d="M9 10h.01M13 10h.01M11 7h.01"/>',
  '玄幻': '<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>',
  '武侠': '<path d="M4 20c6-2 12-8 15-15M13 7l4 4M6 14l4 4"/>',
  '历史': '<path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  '其他': '<path d="M12 3v18M3 12h18"/>'
};
const STAGE_DOT = { writing: '<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>', setting: '<circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/>', done: '<path d="M5 13l4 4L19 7"/>' };

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13l4 4L19 7"/></svg><span></span>';
  t.querySelector('span').textContent = msg;
  $('toastWrap').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 2200);
}

const FIRST_RUN_HTML = `
  <div class="first-run" data-od-id="first-run">
    <div class="empty" style="padding:56px 44px 48px;">
      <span class="fr-title serif">开始你的第一本书</span>
      <p>本地优先的 AI 长篇小说工作台——大纲、设定、正文，都保存在你这台电脑上。</p>
      <div class="fr-steps">
        <div class="step">
          <span class="fr-n">STEP 01</span>
          <span class="fr-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></span>
          <b>新建作品</b>
          <p>起书名、选题材，30 秒建好全书骨架。</p>
        </div>
        <div class="step">
          <span class="fr-n">STEP 02</span>
          <span class="fr-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M9 13h6M9 17h4"/></svg></span>
          <b>配置模型</b>
          <p>填入你自己的 API Key，只存本机，不经过第三方。</p>
        </div>
        <div class="step">
          <span class="fr-n">STEP 03</span>
          <span class="fr-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
          <b>开写第一章</b>
          <p>第一句想到什么就写什么，正文永远是最短路径。</p>
        </div>
      </div>
      <div class="fr-cta">
        <button class="btn btn-primary" id="frCreate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>新建作品</button>
        <button class="btn btn-secondary" id="frImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V4M7 8l5-5 5 5M5 20h14"/></svg>导入已有文稿</button>
      </div>
      <p class="fr-note">免费版可创建 <span class="num">1</span> 部作品 · 无需绑卡</p>
    </div>
  </div>`;

const LOCK_TILE_HTML = `
  <div class="lock-tile" data-od-id="lock-tile" role="button" tabindex="0" id="lockTile">
    <span class="lt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></span>
    <b>书架已满</b>
    <span>升级后不限作品数 · 现有作品不受影响</span>
    <span class="btn btn-secondary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 6.2L21 9l-5 4.4 1.6 6.6L12 16.6 6.4 20 8 13.4 3 9l6.6-.8z"/></svg>升级</span>
  </div>`;

function renderCards() {
  $('cards').innerHTML = '';
  $('cards').hidden = false;
  $('firstRunSlot').innerHTML = '';
  if (!books.length) {
    // 首启空态独占容器（.first-run 非 .cards 网格项，与实现侧同构）
    $('cards').hidden = true;
    $('firstRunSlot').innerHTML = FIRST_RUN_HTML;
    $('frCreate').addEventListener('click', () => { openModal('modalCreate'); setTimeout(() => { $('bkTitle').focus(); }, 60); });
    $('frImport').addEventListener('click', () => toast('导入入口在顶栏「导入」按钮'));
    return;
  }
  if (quota && !document.getElementById('quota-notice')) {
    document.querySelector('.page-head').insertAdjacentHTML('beforebegin', `
    <div class="notice info" data-od-id="quota-notice" role="status">
      <span class="nt"><b>免费版书架已满（<span class="num">1/1</span>）</b><span>升级后不限作品数，现有作品不受影响</span></span>
      <a class="btn btn-secondary btn-sm" href="#">升级</a>
    </div>`);
  }
  books.forEach((b, i) => {
    const card = document.createElement('a');
    card.className = 'book-card';
    card.href = 'book.html';
    card.dataset.odId = `book-card-${i}`;
    const icon = GENRE_ICON[b.genre] || GENRE_ICON['其他'];
    card.innerHTML = `
      <div class="top">
        <span class="mono">${(b.title || '书')[0]}</span>
        <span class="genre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${icon}</svg>${b.genre}</span>
        <span class="b ${b.stage}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">${STAGE_DOT[b.stage]}</svg>${b.stageLabel}</span>
      </div>
      <h3>《${b.title}》</h3>
      <p class="summary">${b.summary}</p>
      <div class="stats">
        <span><b class="num">${b.vols} 卷</b>结构</span>
        <span><b class="num">${b.chs} 章</b>章节</span>
        <span><b class="num">${fmt(b.words)}</b>总字数</span>
      </div>
      <div class="foot">
        <span class="updated">更新于 ${b.updated}</span>
        <span class="go">${b.stage === 'done' ? '查看' : '继续创作'}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </div>`;
    $('cards').appendChild(card);
  });
  if (quota) $('cards').insertAdjacentHTML('beforeend', LOCK_TILE_HTML);
}

/* ═══════════ 创建 ═══════════ */
const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>';
if (quota) $('btnCreate').innerHTML = LOCK_SVG + '新建作品';  // 锁定可见：主按钮带锁
$('btnCreate').addEventListener('click', () => {
  if (quota) { toast('免费版书架已满，升级后可继续创建'); return; }
  openModal('modalCreate'); setTimeout(() => { $('bkTitle').focus(); }, 60);
});
function doCreate() {
  const title = $('bkTitle').value.trim();
  if (!title) { toast('请填写书名'); $('bkTitle').focus(); return; }
  const genre = $('bkGenre').value;
  const book = { title, genre, stage: 'writing', stageLabel: '写作中', vols: 0, chs: 0, words: 0, updated: '刚刚', summary: '新作已创建 · 进入工作台开始写第一章。' };
  books.unshift(book);
  try { localStorage.setItem('ainovel.books', JSON.stringify(books)); } catch (e) {}
  closeModal('modalCreate');
  renderCards();
  toast(`已创建《${title}》，正在进入这本书…`);
  setTimeout(() => {
    const a = document.createElement('a');
    a.href = 'book.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }, 900);
}
$('bkConfirm').addEventListener('click', doCreate);
$('bkTitle').addEventListener('keydown', e => { if (e.key === 'Enter') doCreate(); });

/* ═══════════ 弹窗通用 ═══════════ */
let lastFocus = null;
function openModal(id) {
  const m = $(id);
  lastFocus = document.activeElement;
  $('scrim').hidden = false; m.hidden = false;
  requestAnimationFrame(() => { $('scrim').classList.add('show'); m.classList.add('show'); });
}
function closeModal(id) {
  const m = $(id);
  m.classList.remove('show'); $('scrim').classList.remove('show');
  setTimeout(() => {
    m.hidden = true; $('scrim').hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }, 200);
}
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); }));
/* 点遮罩关闭当前打开的弹窗（而非写死某一个） */
$('scrim').addEventListener('click', () => {
  const open = document.querySelector('.modal:not([hidden])');
  if (open) closeModal(open.id);
});
/* Esc 关闭弹窗；Tab 在弹窗内循环 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const open = document.querySelector('.modal:not([hidden])');
    if (open) closeModal(open.id);
    return;
  }
  if (e.key !== 'Tab') return;
  const open = document.querySelector('.modal:not([hidden])');
  if (!open) return;
  const focusables = [...open.querySelectorAll('button, a, input, select, [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* ═══════════ 控制中心面板（c-account-control-center）═══════════ */
const acctTrigger = $('btnAcct');
const acctMenu = $('acctMenu');
function positionAcctMenu() {
  const r = acctTrigger.getBoundingClientRect();
  acctMenu.style.top = (r.bottom + 4) + 'px';
  acctMenu.style.right = (window.innerWidth - r.right) + 'px';
}
function setAcctOpen(open) {
  acctMenu.hidden = !open;
  acctTrigger.classList.toggle('open', open);
  acctTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) positionAcctMenu();
}
acctTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  setAcctOpen(acctMenu.hidden);
});
/* 外点关闭：白名单含触发钮（防 toggle 双触发） */
document.addEventListener('click', (e) => {
  if (!acctMenu.hidden && !acctMenu.contains(e.target) && !acctTrigger.contains(e.target)) setAcctOpen(false);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !acctMenu.hidden) setAcctOpen(false);
});
window.addEventListener('resize', () => { if (!acctMenu.hidden) positionAcctMenu(); });

renderCards();
</script>
