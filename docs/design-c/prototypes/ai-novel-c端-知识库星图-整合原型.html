    function renderMarkdownToHtml(markdownText) {
      if (!markdownText) return '<p style="color: var(--text-muted);">Sin contenido adicional.</p>';
      
      let text = markdownText.replace(/^---[\s\S]*?---\s*/, '');
      
      // Transform inline [[wikilinks]] into interactive spans
      text = text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, target, alias) => {
        const display = (alias || target).trim();
        const safeTarget = target.trim().replace(/"/g, '&quot;');
        return `<span class="inline-wikilink" data-target="${safeTarget}" onclick="selectByLabel(this.dataset.target)">🔗 ${display}</span>`;
      });

      if (typeof marked !== 'undefined' && marked.parse) {
        try {
          return marked.parse(text);
        } catch(e) {
          console.warn('marked parse error:', e);
        }
      }

      // Fallback formatting
      return text
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/^- (.*)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/\n\n/g, '<br><br>');
    }

    function selectByLabel(targetLabel) {
      if (!targetLabel) return;
      const cleanTarget = targetLabel.toLowerCase().replace(/^\[\[|\]\]$/g, '').trim();
      const match = graphData.nodes.find(n => 
        n.label.toLowerCase() === cleanTarget || 
        n.id.toLowerCase() === cleanTarget ||
        n.label.toLowerCase().includes(cleanTarget)
      );
      if (match) {
        focusNode(match);
      }
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    // 关系说明按「谁看这条」拼：出边说这条怎么用对方，入边说对方怎么用这条
    function relNote(e, other, out) {
      const t = other || '另一条';
      const map = {
        refines: [() => `把「${t}」的用法收窄到这个场面。`, () => `「${t}」把这条的用法收窄到具体场面。`],
        contradicts: [() => `和「${t}」同时用会打架，按场景取一。`, () => `「${t}」和这条会打架，按场景取一。`],
        depends_on: [() => `先立住「${t}」，这条才成立。`, () => `「${t}」要等这条立住才成立。`],
        instance_of: [() => `是「${t}」这类做法的一个具体例子。`, () => `「${t}」是这类做法的一个具体例子。`],
        derived_from: [() => `和「${t}」从同一条原文里拆出来。`, () => `「${t}」和这条从同一条原文里拆出来。`],
        applies_to: [() => `这条落在「${t}」的场面上。`, () => `「${t}」落在这一条的场面上。`],
      };
      const pair = map[e.rel_type];
      return pair ? pair[out ? 0 : 1]() : (e.note || '');
    }

    // 条目详情四段式：概念 → 关系 → 总结 → 出处（顺序＝知识库读一条知识的路径）
    function openDrawer(node) {
      const drawer = document.getElementById('drawer');
      const tagEl = document.getElementById('drawer-group');
      const conceptColor = CONCEPT_COLORS[node.concept] || node.color;
      tagEl.innerText = node.isRoot ? (node.isSubPlanet ? '设定' : '题材') : (node.concept || '条目');
      tagEl.style.backgroundColor = conceptColor + '22';
      tagEl.style.color = conceptColor;
      tagEl.style.border = '1px solid ' + conceptColor;

      document.getElementById('drawer-title').innerText = node.label || '';
      const tagsContainer = document.getElementById('drawer-tags');
      tagsContainer.innerHTML = (node.tags || []).map(t => '<span class="tag">#' + esc(t) + '</span>').join('');

      const body = document.getElementById('drawer-body');
      if (node.isRoot && !node.isSubPlanet) {
        const cells = CONCEPTS.map(c => {
          const sp = graphData.nodes.find(n => n.id === `subplanet_${node.group}_${c}`);
          return { concept: c, count: sp ? sp.count : 0 };
        }).filter(x => x.count > 0);
        const total = graphData.nodes.filter(n => !n.isRoot && n.genre === node.group).length;
        body.innerHTML =
          '<section class="kb-sec"><h4>题材</h4>' +
            '<p class="kb-text">' + esc(node.description || '') + '</p>' +
            '<p class="kb-sub">' + cells.length + ' 个设定 · ' + total + ' 条写作知识</p>' +
            '<div class="kb-chips">' + cells.map(x =>
              `<span class="kb-chip" style="border-color:${CONCEPT_COLORS[x.concept]}66;color:${CONCEPT_COLORS[x.concept]}" onclick="focusById('subplanet_${node.group}_${x.concept}')">${x.concept} ${x.count}</span>`
            ).join('') + '</div>' +
          '</section>';
        drawer.classList.add('open');
        return;
      }
      if (node.isRoot && node.isSubPlanet) {
        const instances = node.instances || [];
        const rels = graphData.edges
          .filter(e => (e.source === node.id || e.target === node.id) && e.rel_type)
          .map(e => {
            const otherId = e.source === node.id ? e.target : e.source;
            const other = graphData.nodes.find(n => n.id === otherId);
            return { e, other, out: e.source === node.id };
          })
          .filter(r => r.other);
        const relHtml = rels.length
          ? rels.map(r =>
              '<div class="kb-rel" data-id="' + esc(r.other.id) + '" onclick="selectById(this.dataset.id)">' +
                '<span class="kb-rel-type" style="color:' + (REL_COLORS[r.e.rel_type] || '#7c9ef5') + '">' + esc(r.e.label || r.e.rel_type) + '</span>' +
                '<span class="kb-rel-name">' + esc(r.other.label) + '</span>' +
                '<span class="kb-rel-dir">' + (r.out ? '指向' : '来自') + '</span>' +
                '<div class="kb-rel-note">' + esc(r.e.note || '') + ' · 置信度 ' + Math.round((r.e.confidence || 0) * 100) + '%</div>' +
              '</div>'
            ).join('')
          : '<p class="kb-sub">这个概念还没有与其他概念建立关系</p>';
        const sources = [...new Set(instances.map(x => `《${x.src_novel_name}》第 ${x.src_chapter} 章`))];
        const quotes = [...new Set(instances.map(x => x.evidence))].slice(0, 2);
        const instHtml = instances.length
          ? instances.map(x =>
              '<div class="kb-rel">' +
                '<span class="kb-rel-name">' + esc(x.title) + '</span>' +
                '<div class="kb-rel-note">' + esc(x.instruction) + '</div>' +
              '</div>'
            ).join('')
          : '<p class="kb-sub">这个概念下还没有条目</p>';
        body.innerHTML =
          '<section class="kb-sec"><h4>解读</h4>' +
            '<p class="kb-text"><span class="kb-dot" style="background:' + conceptColor + '"></span>' +
              esc(node.concept) + ' · ' + esc(node.definition || '') + '</p>' +
            '<p class="kb-sub">题材：' + esc(node.group) + ' · ' + instances.length + ' 条实例</p>' +
          '</section>' +
          '<section class="kb-sec"><h4>关系</h4>' + relHtml + '</section>' +
          '<section class="kb-sec"><h4>总结</h4>' +
            '<p class="kb-text">' + esc(CONCEPT_SUMMARY[node.concept] || '') + '</p>' +
            '<p class="kb-sub">适用：' + esc((CONCEPT_COPY[node.concept] || {}).when || '') + '</p>' +
          '</section>' +
          '<section class="kb-sec"><h4>出处</h4>' +
            (sources.length ? sources.map(x => '<p class="kb-text">' + esc(x) + '</p>').join('') : '<p class="kb-sub">暂无出处</p>') +
          '</section>' +
          '<section class="kb-sec"><h4>原文</h4>' +
            (quotes.length ? quotes.map(q => '<blockquote class="kb-quote">' + esc(q) + '</blockquote>').join('') : '<p class="kb-sub">暂无原文摘句</p>') +
          '</section>' +
          '<section class="kb-sec"><h4>实例</h4>' + instHtml + '</section>';
        drawer.classList.add('open');
        return;
      }

      // 关系：kb_relations 六类（细化/相冲/依赖/属于/源自/适用于）
      const rels = graphData.edges
        .filter(e => e.source === node.id || e.target === node.id)
        .map(e => {
          const otherId = e.source === node.id ? e.target : e.source;
          const other = graphData.nodes.find(n => n.id === otherId);
          return { e, other, out: e.source === node.id, dir: e.source === node.id ? '指向' : '来自' };
        })
        .filter(r => r.other);
      const relHtml = rels.length
        ? rels.map(r =>
            '<div class="kb-rel" data-id="' + esc(r.other.id) + '" onclick="selectById(this.dataset.id)">' +
              '<span class="kb-rel-type" style="color:' + (REL_COLORS[r.e.rel_type] || '#7c9ef5') + '">' + esc(r.e.label || r.e.rel_type) + '</span>' +
              '<span class="kb-rel-name">' + esc(r.other.label) + '</span>' +
              '<span class="kb-rel-dir">' + r.dir + '</span>' +
              '<div class="kb-rel-note">' + esc(relNote(r.e, r.other.label, r.out)) + ' · 置信度 ' + Math.round((r.e.confidence || 0) * 100) + '%</div>' +
            '</div>'
          ).join('')
        : '<p class="kb-sub">还没有关联条目</p>';

      body.innerHTML =
        '<section class="kb-sec"><h4>概念</h4>' +
          '<p class="kb-text"><span class="kb-dot" style="background:' + conceptColor + '"></span>' +
            esc(node.concept) + ' · ' + esc(CONCEPT_DESC[node.concept] || '') + '</p>' +
          '<p class="kb-sub">题材：' + esc(node.genre) + '</p>' +
        '</section>' +
        '<section class="kb-sec"><h4>关系</h4>' + relHtml + '</section>' +
        '<section class="kb-sec"><h4>总结</h4>' +
          '<p class="kb-text">' + esc(node.instruction) + '</p>' +
          '<p class="kb-sub">适用：' + esc(node.when) + '</p>' +
          '<blockquote class="kb-quote">正例：' + esc(node.example) + '</blockquote>' +
        '</section>' +
        '<section class="kb-sec"><h4>出处</h4>' +
          '<p class="kb-text">《' + esc(node.src_novel_name) + '》第 ' + esc(node.src_chapter) + ' 章</p>' +
          '<blockquote class="kb-quote">' + esc(node.evidence) + '</blockquote>' +
          '<p class="kb-sub">来源：' + esc(node.src_kind) + '</p>' +
        '</section>';

      drawer.classList.add('open');
    }

    function selectById(nodeId) {
      const target = graphData.nodes.find(n => n.id === nodeId);
      if (target) focusNode(target);
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    let searchActive = false;
    let matchingNodeIds = new Set();

    function clearSearchSpotlight() {
      searchActive = false;
      matchingNodeIds.clear();
      const nodes = window.__cachedAllNodes || ((graphInstance && graphInstance.graphData && graphInstance.graphData().nodes) || (graphData && graphData.nodes) || []);
      nodes.forEach(n => {
        n.__searchMatch = false;
        n.__searchConnected = false;
        if (n.__threeObj) {
          n.__threeObj.visible = true;
        }
        if (n.__labelSprite && !n.isRoot) {
          n.__labelSprite.scale.set(34, 6.6, 1);
          n.__labelSprite.visible = false;
        }
      });
      if (window.__clusterOrbitGroups) {
        Object.values(window.__clusterOrbitGroups).forEach(grpObj => {
          grpObj.visible = true;
        });
      }
      if (graphInstance) {
        applySeaVisibility();
        graphInstance.nodeColor(node => {
          if (searchActive) {
            if (node.__searchMatch) return '#38bdf8';
            if (matchingNodeIds.has(node.id)) return 'rgba(56, 189, 248, 0.4)';
            return 'rgba(30, 41, 59, 0.18)';
          }
          const colorMap = { contacts: '#fbbf24', events: '#38bdf8', photos: '#f43f5e', learnings: '#10b981', emails: '#c084fc', projects: '#6366f1', tools: '#06b6d4', invoices: '#f59e0b' };
          return colorMap[node.group] || node.color || '#38bdf8';
        });
        graphInstance.linkColor(link => {
          if (searchActive) return '#38bdf8';
          const alpha = link.isStructural ? Math.min(0.65, 0.38 * linkBrightness) : Math.min(0.70, 0.45 * linkBrightness);
          return link.isStructural ? ('rgba(255, 255, 255, ' + alpha.toFixed(3) + ')') : ('rgba(56, 189, 248, ' + alpha.toFixed(3) + ')');
        });
        graphInstance.linkDirectionalParticles(link => {
          if (orbitalSpeedMultiplier === 0) return 0;
          if (searchActive) {
            const sId = (link.source && link.source.id) || link.source;
            const tId = (link.target && link.target.id) || link.target;
            if (!matchingNodeIds.has(sId) || !matchingNodeIds.has(tId)) return 0;
          }
          if (link.isStructural) {
            if (graphData.nodes.length > 30) {
               const tIdStr = String((link.target && link.target.id) || link.target);
               let hash = 0;
               for (let i = 0; i < tIdStr.length; i++) hash = (hash + tIdStr.charCodeAt(i)) % 10;
               if (hash !== 0) return 0;
            }
            return 2;
          }
          return 0;
        });
      }
    }

    function onSearch(query) {
      const q = (query || '').trim().toLowerCase();
      if (!q) {
        clearSearchSpotlight();
        return;
      }

      searchActive = true;
      matchingNodeIds.clear();

      const nodes = window.__cachedAllNodes || ((graphInstance && graphInstance.graphData && graphInstance.graphData().nodes) || (graphData && graphData.nodes) || []);
      const edges = (graphInstance && graphInstance.graphData && graphInstance.graphData().links) || (graphData && graphData.edges) || [];

      // 1. Identificar coincidencias directas
      const directMatchSet = new Set();
      const directMatches = [];
      nodes.forEach(n => {
        const match = !!(
          (n.label && n.label.toLowerCase().includes(q)) ||
          (n.tags && n.tags.some(t => (t || '').toLowerCase().includes(q))) ||
          (n.summary && n.summary.toLowerCase().includes(q)) ||
          (n.id && n.id.toLowerCase().includes(q))
        );
        n.__searchMatch = match;
        if (match) {
          directMatchSet.add(n.id);
          matchingNodeIds.add(n.id);
          directMatches.push(n);
        }
      });

      // 2. Mantener visibles los nodos raíz para que no queden "puntos flotando"
      matchingNodeIds.add("root_cortex");
      directMatches.forEach(n => {
         if (n.group) {
             matchingNodeIds.add(`root_${n.group}`);
             if (n.group.endsWith('s')) matchingNodeIds.add(`root_${n.group.slice(0, -1)}`);
             else matchingNodeIds.add(`root_${n.group}s`);
         }
      });

      // 3. Incluir relaciones directas entre nodos coincidentes
      edges.forEach(e => {
        const sId = (e.source && e.source.id) || e.source;
        const tId = (e.target && e.target.id) || e.target;
        
        // Always include the link if either end is a direct match, UNLESS the other end is a root node that wasn't added above
        if (directMatchSet.has(sId)) {
          if (!tId.startsWith('root_') || matchingNodeIds.has(tId)) matchingNodeIds.add(tId);
        }
        if (directMatchSet.has(tId)) {
          if (!sId.startsWith('root_') || matchingNodeIds.has(sId)) matchingNodeIds.add(sId);
        }
      });

      console.log('Search for:', q);
      console.log('matchingNodeIds contains:', Array.from(matchingNodeIds));
      
      // 3. OCULTAR TODOS LOS NODOS Y SUBNODOS SIN RELACIÓN
      nodes.forEach(n => {
        const isRelated = matchingNodeIds.has(n.id);
        n.__searchConnected = isRelated && !n.__searchMatch;

        // El motor nativo manejará la visibilidad del nodo (n.__threeObj)

        if (n.__labelSprite) {
          if (n.__searchMatch) {
            n.__labelSprite.visible = true;
            n.__labelSprite.material.opacity = 1.0;
            n.__labelSprite.scale.set(32, 6.1, 1);
          } else if (isRelated) {
            n.__labelSprite.visible = true;
            n.__labelSprite.material.opacity = 0.85;
          } else {
            n.__labelSprite.visible = false;
            n.__labelSprite.material.opacity = 0;
          }
        }
      });

      // 4. Ocultar anillos de órbita de clústeres no relacionados
      if (window.__clusterOrbitGroups) {
        Object.entries(window.__clusterOrbitGroups).forEach(([grp, grpObj]) => {
          const hasVisibleInGroup = nodes.some(n => n.group === grp && matchingNodeIds.has(n.id));
          grpObj.visible = hasVisibleInGroup;
        });
      }

      // 5. Volar la cámara hacia el nodo encontrado principal
      if (directMatches.length > 0) {
        const best = directMatches[0];
        targetLookAt.set(best.x || 0, best.y || 0, best.z || 0);
        targetRadius = Math.max(180, Math.min(320, 240));
        showToast('🔍 找到 ' + directMatches.length + ' 条');
      } else {
        showToast('⚠️ 没找到："' + q + '"');
      }

      // 6. Refrescar colores de links y partículas
      if (graphInstance) {
        applySeaVisibility();
        graphInstance.nodeColor(node => {
          if (searchActive) {
            if (node.__searchMatch) return '#38bdf8';
            if (matchingNodeIds.has(node.id)) return 'rgba(56, 189, 248, 0.4)';
            return 'rgba(30, 41, 59, 0.18)';
          }
          const colorMap = { contacts: '#fbbf24', events: '#38bdf8', photos: '#f43f5e', learnings: '#10b981', emails: '#c084fc', projects: '#6366f1', tools: '#06b6d4', invoices: '#f59e0b' };
          return colorMap[node.group] || node.color || '#38bdf8';
        });
        graphInstance.linkColor(link => {
          if (searchActive) return '#38bdf8';
          const alpha = link.isStructural ? Math.min(0.65, 0.38 * linkBrightness) : Math.min(0.70, 0.45 * linkBrightness);
          return link.isStructural ? ('rgba(255, 255, 255, ' + alpha.toFixed(3) + ')') : ('rgba(56, 189, 248, ' + alpha.toFixed(3) + ')');
        });
        graphInstance.linkDirectionalParticles(link => {
          if (orbitalSpeedMultiplier === 0) return 0;
          if (searchActive) {
            const sId = (link.source && link.source.id) || link.source;
            const tId = (link.target && link.target.id) || link.target;
            if (!matchingNodeIds.has(sId) || !matchingNodeIds.has(tId)) return 0;
          }
          if (link.isStructural) {
            if (graphData.nodes.length > 30) {
               const tIdStr = String((link.target && link.target.id) || link.target);
               let hash = 0;
               for (let i = 0; i < tIdStr.length; i++) hash = (hash + tIdStr.charCodeAt(i)) % 10;
               if (hash !== 0) return 0;
            }
            return 2;
          }
          return 0;
        });
      }
    }


    function filterGroup(group) {
      const menu = document.getElementById("taxonomy-menu");
      if (menu) menu.classList.remove("open");

      if (group === "all") {
        resetCamera();
        return;
      }

      const match = graphData.nodes.find(n => n.group === group);
      if (match) focusNode(match);
    }

    async function startApp() {
      // Sync initial slider values from localStorage
      const speedSlider = document.getElementById('orbital-speed-slider');
      const speedText = document.getElementById('speed-val-text');
      if (speedSlider) speedSlider.value = orbitalSpeedMultiplier;
      if (speedText) speedText.innerText = orbitalSpeedMultiplier === 0 ? '0.0x' : orbitalSpeedMultiplier.toFixed(1) + 'x';

      const brightSlider = document.getElementById('link-brightness-slider');
      const brightText = document.getElementById('brightness-val-text');
      if (brightSlider) brightSlider.value = linkBrightness;
      if (brightText) brightText.innerText = Math.round(linkBrightness * 100) + '%';

      const nodeSlider = document.getElementById('node-size-slider');
      const nodeText = document.getElementById('nodesize-val-text');
      if (nodeSlider) nodeSlider.value = nodeScaleMultiplier;
      if (nodeText) nodeText.innerText = nodeScaleMultiplier.toFixed(2) + 'x';

      if (localStorage.getItem('okf_hud_hidden') === 'true') {
        document.body.classList.add('hud-hidden');
      }
      updateHudToggleState();

      await initGraph();
      // Restaurar modo: Detectar hash o localStorage
      const hashMode = (window.location.hash.includes('cortex') || window.location.hash.includes('spherical')) ? 'spherical' : (window.location.hash.includes('galaxy') ? 'galaxy' : null);
      const savedMode = hashMode || localStorage.getItem('okf_viz_mode') || 'galaxy';
      if (savedMode === 'spherical') {
        setTimeout(() => switchVisualizationMode('spherical', true), 120);
      } else {
        setTimeout(() => switchVisualizationMode('galaxy', true), 120);
      }
      setTimeout(() => {
        STAR_GENRES.forEach(g => {
          expandedGenres.add(g.name);
          CONCEPTS.forEach(c => expandedCells.add(g.name + '|' + c));
        });
        applySeaVisibility();
      }, 700);
      if (window.location.hash.includes('zoom=close')) {
        targetRadius = 360;
        currentRadius = 360;
      }
    }

    // Initialize once DOM is ready or immediately if already loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }
  </script>
</body>
</html>
