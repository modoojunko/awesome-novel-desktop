<!DOCTYPE html>
<!-- ═══════════════════════════════════════════════════════════════════════
  知识库 · 星海模式 · 原型（ai-novel C端）
  定位：替换「图谱 / 条目图」两个页签，只保留一个写作知识星海视图。
  基座：okf-galaxy-visualizer（MIT，cabezondigital/okf-galaxy-visualizer）
       单文件 src/public/index.html，Three.js 0.160 + 3d-force-graph 1.73.3（CDN）。
       本原型只换数据源与 HUD 文案，星系/轨道/星尘/连线渲染均为基座原样。
  数据：内置写作知识演示数据（4 题材 × 6 概念，43 条条目），形状对齐
       /kb/graph/entries；真机由接口替换 buildStarSeaData()。
  演示交互：自动旋转 / 连线粒子 / 亮度 / 轨道速度 / 星体大小 / 题材筛选与聚焦 /
       搜索 / 点星出条目抽屉 / 回到全景 / H 收起界面。无任何真实网络调用。
═══════════════════════════════════════════════════════════════════════ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>知识库 · 星图页 · 整合原型 · ai-novel C端</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(6, 10, 18, 0.82);
      --border: rgba(255, 255, 255, 0.08);
      --accent-gold: #fbbf24;
      --accent-cyan: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-emerald: #22c55e;
      --accent-violet: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: #000000; color: var(--text); overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column; user-select: none; }
    #3d-graph { cursor: grab; }
    #3d-graph.grabbing { cursor: grabbing; }
    
    /* Top Bar: Ultra Minimal & Sleek */
    header {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
    body.hud-hidden header {
      transform: translateY(-120%);
      opacity: 0;
      pointer-events: none;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; background: linear-gradient(135deg, #ffffff, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; padding: 2px 7px; border-radius: 4px; background: rgba(56, 189, 248, 0.12); color: var(--accent-cyan); font-weight: 700; }

    /* Mode Switcher: 3D Spherical Cortex vs 3D Galaxy */
    .mode-selector {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2px;
      gap: 3px;
      margin-left: 6px;
    }
    .mode-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 4px 11px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mode-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.06);
    }
    .mode-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.22));
      color: #ffffff;
      border-color: rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }
    .mode-btn.active .mode-icon {
      filter: drop-shadow(0 0 6px var(--accent-cyan));
    }

    /* Mode Selector: Low (Default Cloud Mode) vs Full */
    .data-mode-capsule {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 20px;
      padding: 2px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    }
    .data-mode-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 4px 11px;
      border-radius: 16px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .data-mode-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.08);
    }
    .data-mode-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.28), rgba(16, 185, 129, 0.24));
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
      border-color: rgba(56, 189, 248, 0.45);
    }
    .data-mode-btn#btn-mode-full.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.28), rgba(59, 130, 246, 0.24));
      color: #c084fc;
      border-color: rgba(192, 132, 252, 0.45);
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.35);
    }

    /* Cloud Density Slider Capsule */
    .cloud-density-capsule {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 20px;
      padding: 3px 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
    }
    .cloud-density-capsule.hidden {
      display: none !important;
    }
    .cloud-icon { font-size: 0.82rem; }
    .cloud-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #94a3b8;
      user-select: none;
    }
    .cloud-slider {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .cloud-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .cloud-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .cloud-val {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-cyan);
      min-width: 24px;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .stats-bar { display: flex; gap: 14px; align-items: center; }
    .stat-pill { font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; }
    .stat-pill:hover { background: rgba(255,255,255,0.06); color: #fff; }
    /* Scalable Dynamic Taxonomy Dropdown */
    
    /* Checkbox for Layer Toggling */
    .layer-check {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      color: #000;
      font-weight: 900;
      margin-left: 8px;
      transition: all 0.2s;
    }
    .layer-check.checked {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #000;
    }

    /* Refresh Graph Button */
    .learn-btn {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.32);
      color: #4ade80;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .learn-btn:hover {
      background: rgba(34, 197, 94, 0.24);
      border-color: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
      color: #fff;
    }
    .learn-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Notification Toast */
    #brain-toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 12, 22, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.78rem;
      z-index: 100;
      display: none;
      backdrop-filter: blur(20px);
      transition: opacity 0.3s;
    }

    .taxonomy-dropdown-wrapper { position: relative; }
    .taxonomy-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .taxonomy-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-cyan); }
    .badge-count {
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent-cyan);
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 0.7rem;
    }
    .chevron { font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; }
    .taxonomy-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 240px;
      background: rgba(6, 10, 20, 0.96);
      backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 0;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      display: none;
      z-index: 50;
    }
    .taxonomy-menu.open { display: block; }
    .tax-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 0.78rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.18s;
    }
    .tax-item:hover { background: rgba(56, 189, 248, 0.12); color: #fff; }
    .tax-color-dot {
      width: 11px;
      height: 11px;
      min-width: 11px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      transition: transform 0.18s ease;
    }
    .tax-item:hover .tax-color-dot {
      transform: scale(1.35);
    }
    .tax-color-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
      letter-spacing: 0.5px;
      font-family: monospace;
      white-space: nowrap;
    }
    .tax-locate-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .tax-locate-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
      color: #fff;
      transform: scale(1.15);
    }

    
    .tax-name { flex: 1; }
    .tax-num {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 10px;
      color: #94a3b8;
    }
    .tax-divider { height: 1px; background: rgba(255, 255, 255, 0.08); margin: 6px 0; }
    .dot-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      display: inline-block;
      animation: pulseGlow 2s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    .master-pill {
      font-size: 0.78rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot.gold { background: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); }
    .dot.cyan { background: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan); }
    .dot.pink { background: var(--accent-pink); box-shadow: 0 0 8px var(--accent-pink); }
    .dot.emerald { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
    .dot.violet { background: var(--accent-violet); box-shadow: 0 0 8px var(--accent-violet); }

    .search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      outline: none;
      width: 180px;
      transition: all 0.25s;
    }
    .search-input:focus { border-color: var(--accent-cyan); width: 220px; background: rgba(255,255,255,0.08); }

    #main-container { flex: 1; position: relative; overflow: hidden; background: #000000; }
    #3d-graph { width: 100%; height: 100%; }

    /* =========================================
       SEMITRANSPARENT MINI-SPHERE TRACKBALL HUD
       ========================================= */
    .mini-sphere-hud {
      position: absolute;
      bottom: 28px;
      left: 28px;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 14px;
      background: transparent;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hud-controls-group {
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: left center;
      overflow: hidden;
      max-width: 1400px;
      opacity: 1;
    }
    body.hud-hidden .hud-controls-group {
      opacity: 0;
      transform: translateX(-35px) scale(0.92);
      pointer-events: none;
      max-width: 0;
      gap: 0;
      margin: 0;
      padding: 0;
    }
    .hud-toggle-btn {
      background: rgba(10, 15, 26, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      user-select: none;
    }
    .hud-toggle-btn:hover {
      border-color: rgba(56, 189, 248, 0.4);
      color: #ffffff;
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
    }
    body.hud-hidden .hud-toggle-btn {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--accent-cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    }

    /* The glowing 3D glass mini-sphere */
    .glass-orb {
      position: relative;
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.18), rgba(56, 189, 248, 0.06) 50%, rgba(5, 10, 20, 0.75) 90%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), inset 0 0 16px rgba(56, 189, 248, 0.22);
      cursor: grab;
      transition: box-shadow 0.3s;
    }
    .glass-orb:active { cursor: grabbing; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), inset 0 0 24px rgba(56, 189, 248, 0.4); }

    /* Subtle directional arrows on the sphere */
    .orb-arrow {
      position: absolute;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .orb-arrow:hover { color: var(--accent-cyan); text-shadow: 0 0 8px var(--accent-cyan); }
    .orb-arrow.up { top: 2px; left: 31px; }
    .orb-arrow.down { bottom: 2px; left: 31px; }
    .orb-arrow.left { top: 31px; left: 2px; }
    .orb-arrow.right { top: 31px; right: 2px; }
    
    /* Center pivot of the mini-sphere */
    .orb-center {
      position: absolute;
      top: 36px;
      left: 36px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 10px var(--accent-cyan);
      cursor: pointer;
      transition: all 0.2s;
    }
    .orb-center:hover { transform: scale(1.3); background: #fff; box-shadow: 0 0 14px #fff; }

    /* Subtle Minimalist Zoom Control */
    .subtle-zoom-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: rgba(10, 15, 26, 0.45);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 6px;
      border-radius: 20px;
    }
    .zoom-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      line-height: 1;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }
    .zoom-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    
    .zoom-track {
      width: 3px;
      height: 38px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      position: relative;
    }
    .zoom-pip {
      position: absolute;
      left: -2px;
      top: 14px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
    }

    /* Auto-Rotate Glass Pill */
    .auto-rotate-pill {
      background: rgba(10, 15, 26, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .auto-rotate-pill:hover { border-color: rgba(56, 189, 248, 0.4); color: #fff; }
    .auto-rotate-pill.active { color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.08); }

    /* Particle Density Pill (High/Low) */
    .particle-density-pill {
      background: rgba(10, 15, 26, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      user-select: none;
    }
    .particle-density-pill:hover { border-color: rgba(56, 189, 248, 0.4); color: #fff; }
    .particle-density-pill.high { color: var(--accent-cyan); border-color: rgba(56, 189, 248, 0.4); background: rgba(56, 189, 248, 0.08); }

    /* Inspection Drawer */
    #drawer {
      width: 390px;
      background: rgba(4, 7, 14, 0.92);
      backdrop-filter: blur(30px);
      border-left: 1px solid var(--border);
      padding: 24px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: -15px 0 40px rgba(0,0,0,0.85);
    }
    #drawer.open { transform: translateX(0); }

    .drawer-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    .node-type-tag { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; padding: 3px 9px; border-radius: 4px; display: inline-block; letter-spacing: 0.5px; }

    .content-box {

    .content-box li { position: relative; padding-left: 18px; margin-bottom: 8px; line-height: 1.5; }

    .content-box strong { color: #ffffff; font-weight: 600; }
    .content-box code {
      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(56, 189, 248, 0.2);

      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82em;
    }
    .content-box h1, .content-box h2, .content-box h3, .content-box h4 {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      margin: 14px 0 8px 0;
      padding-bottom: 4px;

    }
    .content-box h1:first-child, .content-box h2:first-child, .content-box h3:first-child { margin-top: 0; }
    .inline-wikilink {

    }
    .inline-wikilink:hover { color: #7dd3fc; border-bottom-color: #7dd3fc; }

    .wikilinks-list { display: flex; flex-direction: column; gap: 6px; }
    .wikilink-item { font-size: 0.8rem; color: var(--accent-cyan); background: rgba(56, 189, 248, 0.08); padding: 6px 10px; border-radius: 6px; text-decoration: none; border: 1px solid rgba(56, 189, 248, 0.15); cursor: pointer; transition: all 0.2s; }
    .wikilink-item:hover { background: rgba(56, 189, 248, 0.2); border-color: var(--accent-cyan); }
  
    /* Line Brightness Glass Capsule Slider */
    .line-brightness-hud {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 15, 26, 0.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }
    .line-brightness-hud:hover {
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
    }
    .brightness-icon {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      filter: drop-shadow(0 0 6px var(--accent-cyan));
      user-select: none;
    }
    .brightness-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 78px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.18);
      outline: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .brightness-slider:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .brightness-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .brightness-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    .brightness-val {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 32px;
      user-select: none;
    }

    /* 星海面包屑 */
    .sea-breadcrumb { position: absolute; top: 64px; left: 24px; z-index: 15; display: none; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: rgba(6,10,18,.72); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(10px); font-size: .76rem; color: #94a3b8; }
    .sea-breadcrumb.show { display: flex; }
    .sea-breadcrumb .crumb.clickable { cursor: pointer; color: #cbd5e1; }
    .sea-breadcrumb .crumb.clickable:hover { color: #fff; text-decoration: underline; }
    .sea-breadcrumb .crumb:last-child { color: #f8fafc; font-weight: 600; }
    .sea-breadcrumb .sep { color: #475569; }
    .kb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .kb-chip { padding: 3px 9px; border-radius: 999px; border: 1px solid; font-size: .72rem; cursor: pointer; background: rgba(255,255,255,.03); }

    /* 知识库四段式详情 */

    .kb-quote { margin: 8px 0 0; padding: 8px 10px; border-left: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.035); border-radius: 0 6px 6px 0; font-size: .8rem; line-height: 1.6; color: #cbd5e1; }
    .kb-rel { padding: 8px 10px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; background: rgba(255,255,255,.03); cursor: pointer; }

    /* ═══ 整合外壳：嵌进现有知识库界面（令牌与 base.css 同源） ═══ */
    #proto-chrome, #sea-breadcrumb, #drawer {
      --ui-bg: oklch(98% 0.004 240);
      --ui-surface: oklch(100% 0 0);
      --ui-fg: oklch(20% 0.02 240);
      --ui-muted: oklch(50% 0.018 240);
      --ui-faint: color-mix(in oklch, oklch(50% 0.018 240) 68%, transparent);
      --ui-border: oklch(90% 0.006 240);
      --ui-accent: oklch(48% 0.11 170);
      --ui-accent-strong: oklch(41% 0.10 170);
      --ui-accent-soft: color-mix(in oklch, oklch(48% 0.11 170) 12%, transparent);
      --ui-soft: color-mix(in oklch, oklch(20% 0.02 240) 5%, transparent);
      --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'Iowan Old Style', Georgia, serif;
      --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    }
    body { background: var(--ui-bg); color: var(--ui-fg); font-family: var(--font-body); }
    #proto-chrome { flex: none; background: var(--ui-bg); border-bottom: 1px solid var(--ui-border); }
    .pc-bar1 { display: flex; align-items: center; gap: 14px; padding: 8px 20px; border-bottom: 1px solid var(--ui-border); font-size: 12px; color: var(--ui-muted); }
    .pc-proto { font-size: 10px; letter-spacing: .12em; border: 1px solid var(--ui-muted); border-radius: 4px; padding: 1px 6px; color: var(--ui-faint); }
    .pc-crumb { font-size: 13px; color: var(--ui-muted); }

    .pc-tabs span.on { background: var(--ui-accent); border-color: var(--ui-accent); color: var(--ui-surface); }
    .pc-note { margin-left: auto; font-size: 11px; color: var(--ui-faint); }
    .pc-bar2 { display: flex; align-items: center; gap: 18px; padding: 0 24px; height: 40px; font-size: 13px; color: var(--ui-muted); }
    .pc-logo { font-weight: 700; color: var(--ui-accent); margin-right: 6px; }
    .pc-bar2 .on { color: var(--ui-accent); font-weight: 600; }
    #main-container { margin: 0 24px 24px; border-radius: 14px; border: 1px solid #2c3433; box-shadow: 0 18px 50px rgba(20,30,28,.25); background: #04060b; }
    #main-container > header { position: absolute; top: 0; left: 0; right: 0; z-index: 20; background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,0)); border-bottom: 0; padding: 10px 18px; }
    #main-container > header .brand-title { font-size: 1rem; }

    #drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 460px; z-index: 80;
      background: var(--ui-surface); border-left: 1px solid var(--ui-border); box-shadow: -18px 0 50px rgba(20,30,28,.18); color: var(--ui-fg); padding: 26px 28px; }
    #drawer .node-title { color: var(--ui-fg); }
    #drawer .node-type-tag { background: var(--ui-accent-soft) !important; }
    #drawer .tag { background: var(--ui-soft); color: var(--ui-muted); }
    #drawer .kb-sec h4 { color: var(--ui-muted); }
    #drawer .kb-text { color: var(--ui-fg); }
    #drawer .kb-sub { color: var(--ui-muted); }
    #drawer .kb-quote { background: var(--ui-soft); color: var(--ui-muted); border-left-color: #c9c0ae; }
    #drawer .kb-rel { background: var(--ui-surface); border-color: var(--ui-border); }
    #drawer .kb-rel:hover { background: var(--ui-accent-soft); border-color: var(--ui-accent); }

    #drawer .close-btn { color: var(--ui-muted); }
    /* 图例 */
    #proto-legend { position: absolute; right: 16px; bottom: 16px; z-index: 18; display: flex; gap: 10px;
      padding: 8px 12px; border-radius: 10px; background: rgba(6,10,18,.72); border: 1px solid rgba(255,255,255,.09);
      font-size: 11px; color: #cbd5e1; }
    #proto-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  </style>
</head>
<body>
<div id="proto-chrome">
  <div class="pc-bar1">
    <span class="pc-proto">PROTO</span>
    <span class="pc-crumb">写作知识库 · 2026-11-04</span>
    <nav class="pc-tabs"><span>◉ 知识库</span><span>◉ 库</span><span>◉ 条目</span><span>◉ 书内</span><span class="on">◉ 星图</span></nav>
    <span class="pc-note">演示书《星海拾遗》数据为演示数据</span>
  </div>
  <div class="pc-bar2"><span class="pc-logo">✎ 爱小说</span><span>我的作品</span><span class="on">写作工具</span><span>模型配置</span></div>
</div>


  <div id="sea-breadcrumb" class="sea-breadcrumb"></div>

  <header>
    <div class="brand">
      <div class="brand-title">✦ 写作知识星海</div>
      <div class="badge">星海模式 · 原型</div>
    </div>
            <div class="stats-bar">
      <div class="master-pill">
        <span class="dot-pulse"></span>
        <span id="vault-pill-text">星点 <strong id="stat-total-nodes" style="color: #fff">0</strong> 条 · 关联 <strong id="stat-total-edges" style="color: var(--accent-cyan)">0</strong> 条</span>
      </div>

      <!-- Scalable Dynamic Taxonomy Dropdown with Checkbox Layers -->
      <div class="taxonomy-dropdown-wrapper">
        <button class="taxonomy-btn" id="taxonomy-btn" onclick="toggleTaxonomyMenu(event)">
          <span style="color: var(--accent-cyan)">◈</span>
          <span>题材</span>
          <span class="badge-count" id="tax-count">0</span>
          <span class="chevron">▾</span>
        </button>
        <div class="taxonomy-menu" id="taxonomy-menu">
          <!-- Populated dynamically with checkboxes -->
        </div>
      </div>

      <!-- Executive Action: Refresh Graph -->
      <button class="learn-btn" onclick="resetCamera()" title="回到全景视角">
        <span>◎</span>
        <span>回到全景</span>
      </button>

      <input type="text" id="search-box" class="search-input" placeholder="🔍 搜索条目或题材…" oninput="onSearch(this.value)" />
    </div>
    <div id="brain-toast"></div>
  </header>

  <div id="main-container">
    <div id="3d-graph"></div>

    <!-- SEMITRANSPARENT MINI-SPHERE ROTATION & SUBTLE ZOOM HUD -->
    <div class="mini-sphere-hud" id="mini-sphere-hud">
      <div class="hud-controls-group" id="hud-controls-group">
        <!-- Mini Glass Orb with Chevrons -->
        <div class="glass-orb" id="glass-orb" title="Drag orb to rotate 3D graph in any direction">
          <div class="orb-arrow up" onclick="rotateSphere(0, -0.22)" title="Tilt Up">▲</div>
          <div class="orb-arrow down" onclick="rotateSphere(0, 0.22)" title="Tilt Down">▼</div>
          <div class="orb-arrow left" onclick="rotateSphere(0.22, 0)" title="Rotate Left">◀</div>
          <div class="orb-arrow right" onclick="rotateSphere(-0.22, 0)" title="Rotate Right">▶</div>
          <div class="orb-center" onclick="resetCamera()" title="Click para centrar vista"></div>
        </div>

        <!-- Subtle Slim Zoom Bar -->
        <div class="subtle-zoom-bar">
          <button class="zoom-btn" onclick="zoomCamera(0.85)" title="Zoom In">+</button>
          <div class="zoom-track"><div class="zoom-pip"></div></div>
          <button class="zoom-btn" onclick="zoomCamera(1.18)" title="Zoom Out">−</button>
        </div>

        <!-- Line Brightness Slider Capsule in Left Hub -->
        <div class="line-brightness-hud" title="Adjust line and synapse brightness">
          <span class="brightness-icon" title="Line Brightness">✨</span>
          <input 
            type="range" 
            id="link-brightness-slider" 
            class="brightness-slider" 
            min="0.2" 
            max="2.5" 
            step="0.05" 
            value="1.0" 
            oninput="onLinkBrightnessChange(this.value)"
          />
          <span id="brightness-val-text" class="brightness-val">100%</span>
        </div>

        <!-- Orbital Speed Slider Capsule in Left Hub -->
        <div class="line-brightness-hud" title="Orbital speed & auto-rotation (0x = Pause)">
          <span class="brightness-icon" title="Orbital Speed">⏱️</span>
          <input 
            type="range" 
            id="orbital-speed-slider" 
            class="brightness-slider" 
            min="0" 
            max="3.0" 
            step="0.1" 
            value="1.0" 
            oninput="onOrbitalSpeedChange(this.value)"
          />
          <span id="speed-val-text" class="brightness-val">1.0x</span>
        </div>

        <!-- Node Size Slider Capsule in Left Hub -->
        <div class="line-brightness-hud" title="Adjust node and planet scale (Suns / Subnodes)">
          <span class="brightness-icon" title="Node Size">🪐</span>
          <input 
            type="range" 
            id="node-size-slider" 
            class="brightness-slider" 
            min="0.3" 
            max="2.5" 
            step="0.05" 
            value="1.0" 
            oninput="onNodeSizeChange(this.value)"
          />
          <span id="nodesize-val-text" class="brightness-val">1.0x</span>
        </div>

        <div id="auto-rotate-pill" class="auto-rotate-pill active" onclick="toggleRotate()">
          <span>✦</span> 自动旋转
        </div>
        <div id="particle-density-pill" class="particle-density-pill" onclick="toggleParticleDensity()" title="Toggle particle density: High (1/3 links) or Low (1/10 links)">
          <span>⚡</span> <span id="particle-density-label">连线粒子：低</span>
        </div>
      </div>

      <!-- Toggle HUD Button -->
      <button id="hud-toggle-btn" class="hud-toggle-btn" onclick="toggleHud()" title="Hide interface & controls (Hotkey: H)">
        <span class="hud-toggle-icon">👁️</span>
        <span class="hud-toggle-label">收起界面</span>
      </button>
    </div>

    <!-- Inspection Drawer -->
    <div id="proto-legend">
    <span><i style="background:#7c9ef5"></i>文风</span>
    <span><i style="background:#f5b87c"></i>文笔</span>
    <span><i style="background:#9ef57c"></i>世界设定</span>
    <span><i style="background:#f57c9e"></i>角色设定</span>
    <span><i style="background:#7cf5d0"></i>手法</span>
    <span><i style="background:#c77cf5"></i>情节</span>
  </div>

  <aside id="drawer">
      <div class="drawer-header">
        <div>
          <span id="drawer-group" class="node-type-tag">题材</span>
          <h2 id="drawer-title" class="node-title">条目</h2>
          <div id="drawer-tags" class="node-tags"></div>
        </div>
        <button class="close-btn" onclick="closeDrawer()">&times;</button>
      </div>

      <div id="drawer-body"></div>
    </aside>
  </div>

  <script>
    (function () {
      var panel = document.getElementById('main-container');
      var hdr = document.querySelector('header');
      if (panel && hdr && !panel.contains(hdr)) panel.insertBefore(hdr, panel.firstChild);
    })();
  </script>
  <script>
    let graphData = { nodes: [], edges: [] };
    let graphInstance = null;
    let autoRotate = true;

    let isNodeBeingDragged = false;
    let physicsFreezeTimer = null;

    /**
     * Motor de congelamiento cinético (Option B - Smart Physics Cooldown):
     * Permite que la simulación D3 organice y estabilice el grafo inicialmente (~3.8-4.2s)
     * y luego congela el cálculo continuo de fuerzas D3 (alphaDecay alto, alphaTarget 0).
     * Esto reduce el uso de CPU de ~90% a ~1-2%, manteniendo la cámara orbital Three.js
     * y las animaciones a 60 FPS ultra fluidos.
     * Durante el arrastre de nodos, las físicas se despiertan suavemente y vuelven a congelarse al soltar.
     */
    function schedulePhysicsFreeze(delayMs = 3800) {
      if (physicsFreezeTimer) clearTimeout(physicsFreezeTimer);
      physicsFreezeTimer = setTimeout(() => {
        if (graphInstance) {
          console.log('❄️ [OKF Perf Engine] D3 physics frozen (CPU -> ~1-2%). 3D camera and orbits maintain 60 FPS.');
          graphInstance.d3AlphaTarget?.(0);
          graphInstance.d3AlphaDecay(0.08);
        }
      }, delayMs);
    }

    let linkBrightness = parseFloat(localStorage.getItem('okf_link_brightness') || '1.0');
    let orbitalSpeedMultiplier = parseFloat(localStorage.getItem('okf_orbital_speed') || '1.0');
    let particleDensityHigh = localStorage.getItem('okf_particle_density') === 'high';
    // Initialize particle density pill state on load
    requestAnimationFrame(() => {
      const pdPill = document.getElementById('particle-density-pill');
      const pdLabel = document.getElementById('particle-density-label');
      if (pdPill) pdPill.classList.toggle('high', particleDensityHigh);
      if (pdLabel) pdLabel.textContent = particleDensityHigh ? '连线粒子：高' : '连线粒子：低';
    });

    function onOrbitalSpeedChange(val) {
      orbitalSpeedMultiplier = parseFloat(val);
      const textEl = document.getElementById('speed-val-text');
      if (textEl) {
        textEl.innerText = orbitalSpeedMultiplier === 0 ? '0.0x' : orbitalSpeedMultiplier.toFixed(1) + 'x';
      }
      localStorage.setItem('okf_orbital_speed', val);
      if (graphInstance) {
        graphInstance.linkDirectionalParticleSpeed(link => (link.isStructural ? 0.0025 : 0.005) * orbitalSpeedMultiplier);
      }
    }

    function onLinkBrightnessChange(val) {
      linkBrightness = parseFloat(val);
      const textEl = document.getElementById('brightness-val-text');
      if (textEl) {
        textEl.innerText = Math.round(linkBrightness * 100) + '%';
      }
      localStorage.setItem('okf_link_brightness', val);

      if (graphInstance) {
        graphInstance.linkColor(graphInstance.linkColor());
      }

      if (window.__clusterOrbitGroups) {
        Object.values(window.__clusterOrbitGroups).forEach(group => {
          group.traverse(child => {
            if (child.isLine && child.material) {
              child.material.opacity = Math.max(0.04, Math.min(0.85, 0.22 * linkBrightness));
              child.material.needsUpdate = true;
            }
          });
        });
      }
    }

    let nodeScaleMultiplier = parseFloat(localStorage.getItem('okf_node_scale') || '1.0');

    function onNodeSizeChange(val) {
      nodeScaleMultiplier = parseFloat(val);
      const textEl = document.getElementById('nodesize-val-text');
      if (textEl) {
        textEl.innerText = nodeScaleMultiplier.toFixed(2) + 'x';
      }
      localStorage.setItem('okf_node_scale', val);

      const nodes = window.__cachedAllNodes || ((graphInstance && graphInstance.graphData && graphInstance.graphData().nodes) || (graphData && graphData.nodes) || []);
      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        if (n.__threeObj) {
          n.__threeObj.scale.set(nodeScaleMultiplier, nodeScaleMultiplier, nodeScaleMultiplier);
        }
      }
    }

    function setupGalaxyParameters(nodes) {
      if (!nodes || !nodes.length) return;
      // Separar: roots principales (no sub-planetas), sub-planetas, y hojas
      const mainRoots = nodes.filter(n => n.isRoot && !n.isSubPlanet);
      const subPlanets = nodes.filter(n => n.isSubPlanet);
      const N = Math.max(mainRoots.length, 1);

      // Distribución celestial dinámica para N sistemas (escala automáticamente desde 3 hasta 50+ sistemas)
      const goldenAngle = Math.PI * (3 - Math.sqrt(5)); // ~137.5 grados (Golden Spiral 3D)
      const dynamicGalaxyRadius = Math.max(300, 205 + Math.sqrt(N) * 46);

      // Posicionar roots principales (igual que antes)
      mainRoots.forEach((rn, idx) => {
        let anchor = null;
        if (N <= 8 && GALAXY_CLUSTERS[rn.group]) {
          anchor = GALAXY_CLUSTERS[rn.group];
        } else {
          // 单一大星系：题材坐落在 4 条旋臂上（XZ 平面，轻微起伏）
          const arms = 4;
          const arm = idx % arms;
          const theta = (arm / arms) * Math.PI * 2 + 0.45 + idx * 0.18;
          const radius = dynamicGalaxyRadius * (0.92 + (idx % 2) * 0.12);
          anchor = {
            x: Math.cos(theta) * radius,
            y: (idx % 2 === 0 ? 10 : -10),
            z: Math.sin(theta) * radius
          };
        }
        rn.starTargetX = anchor.x;
        rn.starTargetY = anchor.y;
        rn.starTargetZ = anchor.z;
      });

      // Construir mapa de roots por grupo para lookup
      const rootsByGroup = {};
      mainRoots.forEach(rn => { rootsByGroup[rn.group] = rn; });

      // Posicionar sub-planetas orbitando su root padre a radio cercano (~55-70)
      const subPlanetsByParent = {};
      subPlanets.forEach(sp => {
        const parentGroup = sp.group; // emails, invoices
        if (!subPlanetsByParent[parentGroup]) subPlanetsByParent[parentGroup] = [];
        subPlanetsByParent[parentGroup].push(sp);
      });

      Object.entries(subPlanetsByParent).forEach(([parentGroup, sps]) => {
        const parentRoot = rootsByGroup[parentGroup];
        if (!parentRoot) return;
        const subOrbitRadius = 55 + sps.length * 8; // Radio orbital de sub-planetas respecto a su root

        sps.forEach((sp, idx) => {
          const angle = (idx / Math.max(sps.length, 1)) * Math.PI * 2 + 0.3;
          const tiltY = 0;
          sp.starTargetX = (parentRoot.starTargetX || 0) + Math.cos(angle) * subOrbitRadius;
          sp.starTargetY = (parentRoot.starTargetY || 0) + tiltY;
          sp.starTargetZ = (parentRoot.starTargetZ || 0) + Math.sin(angle) * subOrbitRadius;
          // Dar al sub-planeta una órbita lenta alrededor de su root
          sp.subPlanetOrbit = {
            radius: subOrbitRadius,
            currentAngle: angle,
            orbitSpeed: 0.005, // rad/s（约 0.29°/s）
            tiltY: tiltY,
            parentGroup: parentGroup
          };
        });
      });

      // Construir mapa de sub-planetas por ID para lookup rápido
      const subPlanetMap = {};
      subPlanets.forEach(sp => { subPlanetMap[sp.id] = sp; });
      window.__subPlanetMap = subPlanetMap;

      // Identificar los nodos hoja y su centro orbital correcto
      const groupChildren = {};
      nodes.filter(n => !n.isRoot && !n.isSubPlanet).forEach(n => {
        // Si tiene subGroup, orbita el sub-planeta; si no, orbita el root de su grupo
        const orbitCenter = n.subGroup ? `subplanet_${n.group}_${n.subGroup}` : `root_${n.group}`;
        if (!groupChildren[orbitCenter]) groupChildren[orbitCenter] = [];
        groupChildren[orbitCenter].push(n);
      });

      window.__systemRingRadii = {};

      // Distribuir hojas sobre anillos orbitales Keplerianos alrededor de su centro (root o sub-planeta)
      Object.entries(groupChildren).forEach(([centerId, children]) => {
        const total = children.length;
        const numRings = Math.min(16, Math.max(5, Math.ceil(Math.sqrt(total) * 1.5)));
        // Sub-planetas tienen órbitas más compactas (max 85) que los roots directos (max 125)
        const isSubPlanetOrbit = centerId.startsWith('subplanet_');
        const maxR = isSubPlanetOrbit ? Math.min(85, 40 + Math.sqrt(total) * 5) : Math.min(125, 68 + Math.sqrt(total) * 4.5);
        const minR = isSubPlanetOrbit ? 16 : 24;
        const ringRadii = [];
        for (let rIdx = 0; rIdx < numRings; rIdx++) {
          ringRadii.push(minR + (rIdx / Math.max(numRings - 1, 1)) * (maxR - minR));
        }
        window.__systemRingRadii[centerId] = ringRadii;

        children.forEach((child, i) => {
          const ringIdx = i % ringRadii.length;
          const r = ringRadii[ringIdx];
          const rx = 0;
          const rz = 0;
          const baseAngle = (i / Math.max(total, 1)) * Math.PI * 2 + (ringIdx * 1.35) + (i * 0.35);

          child.solarOrbit = {
            radius: r,
            rx: rx,
            rz: rz,
            currentAngle: baseAngle,
            orbitSpeed: 0.0087 / Math.sqrt(r / (isSubPlanetOrbit ? 16 : 24))
          };
          // Guardar referencia al centro orbital del nodo hoja
          child.__orbitCenterId = centerId;
        });
      });
    }

    function switchVisualizationMode(mode, force = false) {
      if (currentMode === mode && !force) return;
      currentMode = mode;
      localStorage.setItem('okf_viz_mode', mode);
      window.location.hash = mode;

      const sphereBtn = document.getElementById('mode-spherical-btn');
      const galaxyBtn = document.getElementById('mode-galaxy-btn');
      if (sphereBtn) sphereBtn.classList.toggle('active', mode === 'spherical');
      if (galaxyBtn) galaxyBtn.classList.toggle('active', mode === 'galaxy');

      const nodes = (graphInstance && graphInstance.graphData()) ? graphInstance.graphData().nodes : [];
      const goldenRatio = (1 + Math.sqrt(5)) / 2;

      // Frenar instantáneamente cualquier inercia errática previa y liberar anclajes
      nodes.forEach(n => {
        n.vx = 0;
        n.vy = 0;
        n.vz = 0;
        n.fx = undefined;
        n.fy = undefined;
        n.fz = undefined;
      });

      if (mode === 'galaxy') {
        showToast('🌌 星海模式：点题材看设定，点设定看条目');
        setupGalaxyParameters(nodes);

        const rootsMap = new Map();
        const subPlanetsInitMap = new Map();
        nodes.filter(n => n.isRoot).forEach(rn => {
          if (rn.isSubPlanet) {
            subPlanetsInitMap.set(rn.id, rn);
          } else {
            rootsMap.set(rn.group, rn);
            rootsMap.set(rn.group + 's', rn);
            if (rn.group && rn.group.endsWith('s')) rootsMap.set(rn.group.slice(0, -1), rn);
          }
          rn.x = rn.starTargetX || 0;
          rn.y = rn.starTargetY || 0;
          rn.z = rn.starTargetZ || 0;
          rn.vx = 0; rn.vy = 0; rn.vz = 0;
        });

        // Posicionar cada planeta en su órbita concéntrica correspondiente alrededor de su Sol (o sub-planeta)
        nodes.filter(n => !n.isRoot).forEach(child => {
          let star = null;
          if (child.__orbitCenterId && child.__orbitCenterId.startsWith('subplanet_')) {
            star = subPlanetsInitMap.get(child.__orbitCenterId);
          }
          if (!star) star = rootsMap.get(child.group) || rootsMap.get(child.group + 's') || (child.group && child.group.endsWith('s') && rootsMap.get(child.group.slice(0, -1)));
          if (star && child.solarOrbit) {
            const ang = child.solarOrbit.currentAngle;
            const r = child.solarOrbit.radius;
            const lx0 = Math.cos(ang) * r;
            const lz0 = Math.sin(ang) * r;
            const rx = child.solarOrbit.rx || 0;
            const rz = child.solarOrbit.rz || 0;
            const y1 = -lz0 * Math.sin(rx);
            const z1 = lz0 * Math.cos(rx);
            const lx = lx0 * Math.cos(rz) - y1 * Math.sin(rz);
            const ly = lx0 * Math.sin(rz) + y1 * Math.cos(rz);
            const lz = z1;
            child.x = star.x + lx;
            child.y = star.y + ly;
            child.z = star.z + lz;
            child.vx = 0; child.vy = 0; child.vz = 0;
          }
        });

        if (window.__galaxyOrbitsMasterGroup) {
          window.__galaxyOrbitsMasterGroup.visible = true;
        }

        if (graphInstance && graphInstance.d3Force('charge')) {
          graphInstance.d3Force('charge').strength(0);
        }
        if (graphInstance && graphInstance.d3Force('link')) {
          graphInstance.d3Force('link').strength(0);
        }
      } else {
        showToast('🌐 星脑模式');

        if (window.__galaxyOrbitsMasterGroup) {
          window.__galaxyOrbitsMasterGroup.visible = false;
        }

        // Restauración limpia e inmediata sobre la corteza esférica de Fibonacci
        const roots = nodes.filter(n => n.isRoot);
        const nonRoots = nodes.filter(n => !n.isRoot);

        roots.forEach((rn, idx) => {
          const angle = (idx / Math.max(roots.length, 1)) * 2 * Math.PI;
          rn.x = currentSphereRadius * Math.cos(angle);
          rn.y = (idx % 2 === 0 ? 30 : -30);
          rn.z = currentSphereRadius * Math.sin(angle);
          rn.vx = 0; rn.vy = 0; rn.vz = 0;
        });

        nonRoots.forEach((node, i) => {
          const theta = 2 * Math.PI * i / goldenRatio;
          const phi = Math.acos(1 - 2 * (i + 0.5) / Math.max(nonRoots.length, 1));
          node.x = currentSphereRadius * Math.sin(phi) * Math.cos(theta);
          node.y = currentSphereRadius * Math.cos(phi);
          node.z = currentSphereRadius * Math.sin(phi) * Math.sin(theta);
          node.vx = 0; node.vy = 0; node.vz = 0;
        });

        if (graphInstance && graphInstance.d3Force('charge')) {
          graphInstance.d3Force('charge').strength(-90).distanceMax(380);
        }
        if (graphInstance && graphInstance.d3Force('link')) {
          graphInstance.d3Force('link')
            .distance(l => l.isStructural ? 70 : 120)
            .strength(0.04);
        }
      }

      if (graphInstance) {
        if (mode === 'galaxy') {
          graphInstance.d3AlphaDecay(0.02);
          graphInstance.d3VelocityDecay(0.18);
        } else {
          graphInstance.d3AlphaDecay(0.025);
          graphInstance.d3VelocityDecay(0.35);
        }
        schedulePhysicsFreeze(4000);

        // Re-evaluar curvas de enlaces dinámicamente según el modo seleccionado
        graphInstance.linkCurvature(graphInstance.linkCurvature());
        graphInstance.linkCurveRotation(graphInstance.linkCurveRotation());
        graphInstance.linkColor(graphInstance.linkColor());

        try {
          graphInstance.d3ReheatSimulation();
        } catch (e) {
          console.warn('Reheat simulation:', e);
        }
      }
    }

    // Cache static radial glow textures once to ensure high performance
    function buildGlowTexture(colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.2, colorHex);
      gradient.addColorStop(0.55, colorHex);
      // Extraemos RGB para desvanecer al mismo color pero con alpha 0 (evita bordes negros por interpolación premultiplicada)
      let r = 255, g = 255, b = 255;
      if (colorHex.startsWith('#')) {
        const hex = colorHex.replace('#', '');
        if (hex.length === 6) {
          r = parseInt(hex.substring(0, 2), 16);
          g = parseInt(hex.substring(2, 4), 16);
          b = parseInt(hex.substring(4, 6), 16);
        }
      }
      gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      ctx.beginPath();
      ctx.arc(64, 64, 64, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    const GLOW_TEXTURES = {};

    function getGlowTexture(colorHex) {
      if (!GLOW_TEXTURES[colorHex]) {
        const tex = buildGlowTexture(colorHex);
        tex.premultiplyAlpha = false;
        tex.needsUpdate = true;
        GLOW_TEXTURES[colorHex] = tex;
      }
      return GLOW_TEXTURES[colorHex];
    }

    function addGalacticCore(scene) {
      if (!scene || window.__galacticCore) return;
      const COUNT = 4200;
      const positions = new Float32Array(COUNT * 3);
      const colors = new Float32Array(COUNT * 3);
      const warm = new THREE.Color(0xffe6bd);
      const gold = new THREE.Color(0xffbf72);
      const tmp = new THREE.Color();
      for (let i = 0; i < COUNT; i++) {
        const r = 58 * Math.pow(Math.random(), 1.55);
        const theta = Math.random() * Math.PI * 2;
        const cosPhi = Math.random() * 2 - 1;
        const sinPhi = Math.sqrt(Math.max(0, 1 - cosPhi * cosPhi));
        positions[i * 3] = r * sinPhi * Math.cos(theta);
        positions[i * 3 + 1] = r * cosPhi * 0.55;
        positions[i * 3 + 2] = r * sinPhi * Math.sin(theta);
        tmp.copy(warm).lerp(gold, Math.random());
        const bright = 0.5 + Math.random() * 0.5;
        colors[i * 3] = tmp.r * bright;
        colors[i * 3 + 1] = tmp.g * bright;
        colors[i * 3 + 2] = tmp.b * bright;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 2.0, sizeAttenuation: true, vertexColors: true,
        transparent: true, opacity: 0.95, depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const g = new THREE.Group();
      g.add(new THREE.Points(geo, mat));
      const label = createRootLabelSprite('写作知识星海', '#ffe6bd');
      label.position.set(0, 58, 0);
      label.scale.set(58, 12, 1); window.__galacticCoreLabel = label;
      g.add(label);
      scene.add(g);
      window.__galacticCore = g;
    }
    function addSpiralArms(scene) {
      if (!scene || window.__spiralArms) return;
      const COUNT = 9000;
      const positions = new Float32Array(COUNT * 3);
      const colors = new Float32Array(COUNT * 3);
      const inner = new THREE.Color(0xffd9a8);
      const outer = new THREE.Color(0x6ea8ff);
      const tmp = new THREE.Color();
      const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
      for (let i = 0; i < COUNT; i++) {
        const arm = i % 4;
        const t = Math.pow(Math.random(), 0.55);
        const radius = 55 + t * 600;
        const theta = (arm / 4) * Math.PI * 2 + t * 2.6 + (Math.random() - 0.5) * 0.22;
        const spread = 14 + t * 46;
        positions[i * 3] = Math.cos(theta) * radius + gauss() * spread;
        positions[i * 3 + 1] = gauss() * (10 + t * 14);
        positions[i * 3 + 2] = Math.sin(theta) * radius + gauss() * spread;
        tmp.copy(inner).lerp(outer, Math.min(1, t * 1.2));
        const bright = 0.55 + Math.random() * 0.45;
        colors[i * 3] = tmp.r * bright;
        colors[i * 3 + 1] = tmp.g * bright;
        colors[i * 3 + 2] = tmp.b * bright;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({
        size: 1.5, sizeAttenuation: true, vertexColors: true,
        transparent: true, opacity: 0.55, depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geo, mat);
      scene.add(points);
      window.__spiralArms = points;
    }

    function updateCentralNebulaCloud(scene, density = 100, isLowMode = true) {
      if (!scene) return;
      if (window.__centralNebulaCloud) {
        scene.remove(window.__centralNebulaCloud);
        if (window.__centralNebulaCloud.geometry) window.__centralNebulaCloud.geometry.dispose();
        if (window.__centralNebulaCloud.material) window.__centralNebulaCloud.material.dispose();
        window.__centralNebulaCloud = null;
      }
      if (!isLowMode) return;

      const particleCount = Math.min(1500, Math.max(100, density * 15));
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const palette = [
        new THREE.Color(0x38bdf8), // Cyan
        new THREE.Color(0x818cf8), // Indigo
        new THREE.Color(0xc084fc), // Purple
        new THREE.Color(0x34d399), // Emerald
        new THREE.Color(0xffffff)  // Bright White
      ];

      for (let i = 0; i < particleCount; i++) {
        const radius = 25 + Math.pow(Math.random(), 2.2) * 170;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = (radius * Math.sin(phi) * Math.sin(theta)) * 0.42;
        positions[i * 3 + 2] = radius * Math.cos(phi);

        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 2.4,
        vertexColors: true,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const cloud = new THREE.Points(geometry, material);
      cloud.name = "centralNebulaCloud";
      scene.add(cloud);
      window.__centralNebulaCloud = cloud;
    }

      const statNodes = document.getElementById('stat-total-nodes');

          : `${data.nodes.length} <span style="font-size: 0.65rem; color: #a78bfa; font-weight: normal;">个</span>`;
      }
      if (statEdges) statEdges.innerText = (data.stats && data.stats.totalEdges) || data.edges.length;

      cachedRootNodes = data.nodes.filter(n => n.isRoot);
      if (currentMode === 'galaxy') {
        setupGalaxyParameters(data.nodes);
      }

      const validNodeIds = new Set((data.nodes || []).map(n => n.id));
      const formattedLinks = (data.edges || [])
        .filter(e => {
          const s = (e.source && e.source.id) || e.source;
          const t = (e.target && e.target.id) || e.target;
          return validNodeIds.has(s) && validNodeIds.has(t);
        })
        .map(e => ({
          source: (e.source && e.source.id) || e.source,
          target: (e.target && e.target.id) || e.target,
          label: e.label,
          isStructural: !!e.isStructural
        }));

      graphInstance.graphData({ nodes: data.nodes, links: formattedLinks });
      updateCentralNebulaCloud(graphInstance.scene(), currentCloudDensity, currentDataMode === 'low');
      renderTaxonomyMenu(data);

    function buildStarSeaData() {
      const nodes = [];

        nodes.push({
          id: `root_${g.name}`, label: g.name, group: g.name, color: GENRE_COLORS[g.name],
          isRoot: true, tags: ['题材'], description: g.summary,
          summary: `**${g.name}题材**\n\n${g.summary}`,
        });
        g.entries.forEach(([title, concept], i) => {
          const copy = CONCEPT_COPY[concept];
          const [book, chapter] = SOURCES[g.name][i % 3];
          (byConcept[concept] = byConcept[concept] || []).push({
            genre: g.name, title, concept,
            instruction: copy.instruction(title), when: copy.when, example: copy.example,
            evidence: copy.quotes[i % copy.quotes.length],
            src_novel_name: book, src_chapter: chapter,
          });
        });
      });
      STAR_GENRES.forEach(g => {
        CONCEPTS.forEach(concept => {
          const all = (byConcept[concept] || []).filter(x => x.genre === g.name);
          nodes.push({
            id: `subplanet_${g.name}_${concept}`,
            label: concept, group: g.name, subGroup: concept, concept,
            isRoot: true, isSubPlanet: true, color: CONCEPT_COLORS[concept],
            count: all.length, definition: CONCEPT_DESC[concept],
            instances: all, tags: ['设定'],
          });
          edges.push({ source: `root_${g.name}`, target: `subplanet_${g.name}_${concept}`, isStructural: true });
        });

                n.vx = (n.vx || 0) + dx * pullStrength;
                n.vy = (n.vy || 0) + dy * pullStrength;
                n.vz = (n.vz || 0) + dz * pullStrength;

                n.vx *= 0.92;
                n.vy *= 0.92;
                n.vz *= 0.92;
              } else if (isThisRootDragged) {
                // Raíz bajo arrastre manual
              } else {
                // Envoltura normal sobre la corteza esférica
                const delta = (currentSphereRadius - d) * 0.08;
                n.vx = (n.vx || 0) + (x / d) * delta;
                n.vy = (n.vy || 0) + (y / d) * delta;
                n.vz = (n.vz || 0) + (z / d) * delta;

                // Anillos orbitales de alambre 3D (Armillary Wireframe Spheres per Solar System)

        const clusterOrbitGroups = {};

        const roots = data.nodes.filter(n => n.isRoot && !n.isSubPlanet);

    // Smooth Cinematic Camera Rig with Physical Inertia & Volumetric Fly-To Targets
    let targetRadius = 950;
    let currentRadius = 660;
    let targetTheta = 0;
    let currentTheta = 0;
    let targetPhi = 1.02;
    let currentPhi = 1.02;

    const targetLookAt = new THREE.Vector3(0, 0, 0);
    const currentLookAt = new THREE.Vector3(0, 0, 0);
    let focusedNodeId = null;

    function applyCameraPosition() {
      if (!graphInstance) return;
      const cam = graphInstance.camera();
      if (!cam) return;

      // Suave vuelo cinematográfico hacia el objetivo (nodo enfocado o centro)
      currentLookAt.lerp(targetLookAt, 0.075);

      const cx = currentLookAt.x + currentRadius * Math.sin(currentPhi) * Math.sin(currentTheta);
      const cy = currentLookAt.y + currentRadius * Math.cos(currentPhi);
      const cz = currentLookAt.z + currentRadius * Math.sin(currentPhi) * Math.cos(currentTheta);

      cam.position.set(cx, cy, cz);
      cam.lookAt(currentLookAt);

      const controls = graphInstance.controls();
      if (controls) {
        controls.target.copy(currentLookAt);
      }
    }

    // Cache for root nodes to avoid creating arrays inside 60FPS tick()
    let cachedRootNodes = [];
    let lodFrameCounter = 0;

    // Proximity LOD: Labels fade in when zooming in / approaching any node (root or subnode)
    // Optimizado: Distancia al cuadrado (evita Math.sqrt innecesarios) y throttled a cada 2 frames
    function updateLabelLOD() {
      if (!graphInstance) return;
      lodFrameCounter++;
      if (lodFrameCounter % 2 !== 0 && !searchActive) return;

      const cam = graphInstance.camera();
      if (!cam) return;
      const camPos = cam.position;
      const nodes = window.__cachedAllNodes || ((graphInstance && graphInstance.graphData && graphInstance.graphData().nodes) || (graphData && graphData.nodes) || []);

      for (let i = 0; i < nodes.length; i++) {
        const n = nodes[i];
        const sprite = n.__labelSprite;
        if (!sprite) continue;

        if (n.isRoot) {
          if (!sprite.visible) sprite.visible = true;
          if (sprite.material.opacity !== 0.95) sprite.material.opacity = 0.95;
          continue;
        }

        // Si hay búsqueda activa o es el nodo enfocado, mantener visible
        if (n.__searchMatch || n.id === focusedNodeId) {
          if (!sprite.visible) sprite.visible = true;
          if (sprite.material.opacity !== 1.0) sprite.material.opacity = 1.0;
          continue;
        }
        if (searchActive && !n.__searchMatch) {
          const isRelated = matchingNodeIds.has(n.id);
          if (!isRelated) {
            if (sprite.visible) {
              sprite.visible = false;
              sprite.material.opacity = 0;
            }
            continue;
          } else {
             // Keep it visible but slightly dimmed as set in onSearch
             if (!sprite.visible) sprite.visible = true;
             continue;
          }
        }

        const dx = (n.x || 0) - camPos.x;
        const dy = (n.y || 0) - camPos.y;
        const dz = (n.z || 0) - camPos.z;
        const distSq = dx * dx + dy * dy + dz * dz;

        // Rango de visibilidad ampliado: 580^2 = 336400
        if (distSq < 336400) {
          const dist = Math.sqrt(distSq);
          const alpha = Math.max(0, Math.min(0.95, (580 - dist) / 220));
          sprite.material.opacity = alpha;
          sprite.visible = alpha > 0.04;
        } else {
          if (sprite.visible) {
            sprite.visible = false;
            sprite.material.opacity = 0;
          }
        }
      }
    }

    // 60 FPS Smooth Render Loop with Gentle Auto-Giro, Silky Inertia and Proximity Labels
    function startSmoothCameraLoop() {
      let lastFrameTs = 0;
      function tick(ts) {
        requestAnimationFrame(tick);
        if (!graphInstance) return;
        const dt = lastFrameTs ? Math.min(0.1, (ts - lastFrameTs) / 1000) : 0;
        lastFrameTs = ts;

        // 慢速自动旋转：0.5°/s（按时间积分，不受 60/120Hz 帧率影响）
        if (autoRotate && orbitalSpeedMultiplier > 0) {
          targetTheta += 0.0087 * orbitalSpeedMultiplier * dt;
        }
        // 镜头拉近看概念时，中央核球标题隐去，避免一屏大金字
        if (window.__galacticCoreLabel) {
          window.__galacticCoreLabel.visible = currentRadius > 420;
        }

        // Smooth physical interpolation (Lerp factor 0.065 for luxurious ease-in/ease-out)
        currentTheta += (targetTheta - currentTheta) * 0.065;
        currentPhi += (targetPhi - currentPhi) * 0.065;
        currentRadius += (targetRadius - currentRadius) * 0.065;

        applyCameraPosition();
        updateLabelLOD();

        // Actualizar posición de los anillos orbitales siguiendo a sus Soles (cero asignación de memoria en tick)
        if (window.__galaxyOrbitsMasterGroup) {
          window.__galaxyOrbitsMasterGroup.visible = (currentMode === 'galaxy');
          if (currentMode === 'galaxy' && cachedRootNodes.length > 0) {
            for (let i = 0; i < cachedRootNodes.length; i++) {
              const rn = cachedRootNodes[i];
              const holder = window.__clusterOrbitGroups && (window.__clusterOrbitGroups[rn.group] || window.__clusterOrbitGroups[rn.id]);
              if (holder) {
                holder.position.set(rn.x || 0, rn.y || 0, rn.z || 0);
              }
            }
          }
        }

        // Rotación estelar fluida de la nube nebulosa central
        if (window.__centralNebulaCloud) {
          const mult = (typeof orbitalSpeedMultiplier !== 'undefined') ? orbitalSpeedMultiplier : 1.0;
          window.__centralNebulaCloud.rotation.y += 0.004 * mult * dt;
          window.__centralNebulaCloud.rotation.x += 0.002 * mult * dt;
        }
      }
      requestAnimationFrame(tick);
    }
    startSmoothCameraLoop();

    
    // Native Mousewheel and Trackpad Scroll Gestures Support
    window.addEventListener('wheel', (e) => {
      // Smooth exponential zoom factor based on scroll direction
      const factor = e.deltaY > 0 ? 1.08 : 0.92;
      targetRadius = Math.max(160, Math.min(1800, targetRadius * factor));
    }, { passive: true });

    // Unified 3D Virtual Trackball & Globe Rotation
    // Rota la esfera exactamente en la dirección del gesto como si le pasaras la mano por encima a una bola 3D
    function rotateSphere(yawDelta, pitchDelta) {
      targetTheta += yawDelta;
      targetPhi += pitchDelta;
      // Evitar que la cámara se invierta en los polos exactos
      targetPhi = Math.max(0.10, Math.min(Math.PI - 0.10, targetPhi));
    }

    // isNodeBeingDragged ya está inicializado globalmente arriba
    isNodeBeingDragged = false;

    function setupGlassOrbDrag() {
      const graphContainer = document.getElementById('3d-graph');
      const orb = document.getElementById('glass-orb');
      let isDragging = false;
      let prevX = 0;
      let prevY = 0;
      let velX = 0;
      let velY = 0;

      function startDrag(clientX, clientY) {
        if (isNodeBeingDragged) return;
        isDragging = true;
        prevX = clientX;
        prevY = clientY;
        velX = 0;
        velY = 0;
        if (graphContainer) graphContainer.classList.add('grabbing');
      }

      function updateDrag(clientX, clientY) {
        if (!isDragging) return;
        const dx = clientX - prevX;
        const dy = clientY - prevY;
        prevX = clientX;
        prevY = clientY;

        velX = dx;
        velY = dy;

        // FÍSICA DE BOLA 3D:
        // Arrastrar hacia arriba (dy < 0) -> la esfera rueda hacia arriba (pitchDelta > 0)
        // Arrastrar hacia abajo (dy > 0) -> la esfera rueda hacia abajo (pitchDelta < 0)
        // Arrastrar hacia la derecha (dx > 0) -> la esfera gira a la derecha (yawDelta < 0)
        // Arrastrar hacia la izquierda (dx < 0) -> la esfera gira a la izquierda (yawDelta > 0)
        const sensitivity = 0.0042;
        const yawDelta = -dx * sensitivity;
        const pitchDelta = -dy * sensitivity;

        rotateSphere(yawDelta, pitchDelta);
      }

      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        if (graphContainer) graphContainer.classList.remove('grabbing');

        // Suave inercia física de despedida
        if (Math.abs(velX) > 1 || Math.abs(velY) > 1) {
          rotateSphere(-velX * 0.003, -velY * 0.003);
        }
      }

      // 1. Drag en el Canvas 3D principal
      if (graphContainer) {
        graphContainer.addEventListener('mousedown', (e) => {
          // Si hace clic con botón secundario o en interfaz, ignorar
          if (e.button !== 0) return;
          startDrag(e.clientX, e.clientY);
        });
      }

      // 2. Drag en el mini orbe HUD
      if (orb) {
        orb.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('orb-arrow') || e.target.classList.contains('orb-center')) return;
          startDrag(e.clientX, e.clientY);
        });
      }

      // 3. Listeners globales para arrastre continuo incluso al salir del canvas
      window.addEventListener('mousemove', (e) => {
        updateDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', () => {
        endDrag();
      });

      // 4. Soporte táctil y gestures
      if (graphContainer) {
        graphContainer.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            startDrag(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            updateDrag(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

        window.addEventListener('touchend', () => {
          endDrag();
        });
      }
    }

    function zoomCamera(scaleFactor) {

    // 逐层展开：星海（中心）→ 题材 → 设定 → 条目

      graphInstance.linkVisibility(l => {

        const sn = graphData.nodes.find(n => n.id === sId);

    function updateBreadcrumb(node) {
      const el = document.getElementById('sea-breadcrumb');

      const crumbs = [{ label: '星海', act: 'collapseSea()' }];
