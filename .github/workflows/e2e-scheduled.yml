name: e2e-scheduled

# 功能 e2e 不挂 PR（本地 runbook 见 handoff.md §3）：每日跑一次，
# 且仅当默认分支自上次成功运行后出现新提交（sha 相同即跳过整轮）。
# 2026-08-29 起：仓库转私有（Actions 免费额度 2000 分钟/月），从每 3 小时降频
# 至每日一次；主保障改为「改动代码本机先跑全量 e2e」，CI 仅作每日兜底。
# DESIGN_PARITY 像素比对依赖本地原型资产（gitignored），不在 CI 范围。
on:
  schedule:
    - cron: "0 19 * * *" # UTC 19:00 = 北京时间次日 03:00
  workflow_dispatch: {} # 手动调试/验证用

concurrency:
  group: e2e-scheduled
  cancel-in-progress: false

permissions:
  actions: read # changes job 查询本 workflow 的上次成功运行
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: 自上次成功运行以来是否有新提交
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST="$(gh api "repos/${{ github.repository }}/actions/workflows/e2e-scheduled.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          echo "last success: ${LAST:-<无，首次运行>}"
          if [ -n "$LAST" ] && [ "$LAST" = "${{ github.sha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 拆仓（s-server-repo-split）：S端 源码在私有仓 awesome-novel-server，
      # compose 以 S_SERVER_DIR 取服务端构建上下文——双 checkout 到 s-server/。
      # ⚠ 需在仓库 secrets 配 S_SERVER_TOKEN（PAT，对 awesome-novel-server 有读权限）。
      - uses: actions/checkout@v4
        with:
          repository: modoojunko/awesome-novel-server
          token: ${{ secrets.S_SERVER_TOKEN }}
          path: s-server

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # writeOAuthSession 会读取并改写 docker 栈的 config.json（bind mount
      # .docker-data/client → /app/data），文件须先存在；后端只读不建。
      - name: 播种 C 端会话文件
        run: |
          mkdir -p .docker-data/client
          echo '{}' > .docker-data/client/config.json

      - name: 起四服务 docker 栈
        run: docker compose up -d --build
        env:
          S_SERVER_DIR: ${{ github.workspace }}/s-server/server

      - name: 等待服务就绪（C 前端 5174 / C 后端 health / S 后端 19000 TCP）
        run: |
          ok=0
          for i in $(seq 1 60); do
            ok=1
            curl -sf http://localhost:5174/ >/dev/null || ok=0
            curl -sf http://localhost:8000/api/health >/dev/null || ok=0
            (exec 3<>/dev/tcp/127.0.0.1/19000) 2>/dev/null || ok=0
            [ "$ok" = 1 ] && break
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            docker compose ps || true
            docker compose logs --tail=80 || true
            exit 1
          fi

      - name: 安装依赖与 Playwright Chromium
        run: cd client/frontend && npm ci && npx playwright install --with-deps chromium

      # UP11_DATA_DIR（c-db-version-hardening）：库版本升级活体链路（db-version-upgrade.spec）
      # 需要宿主侧多版本旧库目录；不设则该组整体 skip＝规格「每版本 PR 以演练全绿为
      # 验收门」沦为纸面。指向宿主挂载目录（compose 已 bind mount .docker-data）。
      - name: 播种 UP-11 多版本旧库目录
        run: |
          mkdir -p .docker-data/up11
          echo '{}' > .docker-data/up11/config.json
      - name: 跑全量功能 e2e
        run: cd client/frontend && npx playwright test
        env:
          UP11_DATA_DIR: ${{ github.workspace }}/.docker-data/up11

      - name: 库版本链演练（upgrade_drill --all）
        run: |
          cd client/backend
          python -m pip install --quiet -r requirements.txt
          python scripts/upgrade_drill.py --all --work /tmp/drill-work

      # s-contract-live-check 的 S web 契约活体冒烟已随拆仓迁至 awesome-novel-server
      # 仓自有 workflow（s-contract-live.yml）——那是 S端 自己的测试套件，不再挂
      # C端 nightly 跑别的仓的代码。本 workflow 的 S端 源码检出仅用于构建四服务栈。

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/frontend/playwright-report/
          retention-days: 3
