name: S端 自动发布 CloudBase

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: "checkout 的分支/tag/commit（默认 main；可用于部署 feature 分支）"
        required: false
        default: "main"

permissions:
  contents: read

# 串行化部署：连续合 PR 会触发多条 run 并发，tcb 平台侧同时只允许一个部署任务，
# 相撞会卡在「已有部署任务运行」交互提示上以 exit 130 失败。
# 不用 cancel-in-progress：中途取消同样会让下一条 run 撞上平台侧进行中的部署；
# 排队等待虽会多跑几轮，但每轮都部署当时的最新 main，最终状态必为最新。
concurrency:
  group: s-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 触发时部署 tag 快照（github.ref=refs/tags/v*）；手动触发走 inputs.ref
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 tcb CLI
        run: npm install -g @cloudbase/cli

      - name: 登录（环境 API Key，无账号交互）
        run: tcb login --cloudbase-api-key ${{ secrets.TCB_API_KEY }} -e ${{ vars.TCB_ENV_ID }}

      # ── 后端：云托管（云端构建镜像，本地无需 Docker）──
      # 用 secrets 生成部署配置（仓库内 cloudbaserc.json 只放占位符，凭据不入库）。
      # ⚠️ envParams 是每次部署的全量覆盖：云托管控制台手动加的环境变量会被这里
      #    冲掉——新增环境变量必须同步补进本配置。CRON_TOKEN/SERVERCHAN_SENDKEY
      #    未配 secrets 时注入空串，后端语义安全（cron token fail-closed；
      #    SendKey 降级日志）。**JWT_SECRET/ADMIN_TOKEN/PAYMENTS_GATEWAY 未配即空串
      #    时后端拒绝启动（s-security-hardening 起 fail-closed）**——下方"生产配置
      #    门禁"步骤在部署前先行拦截，避免把不合格配置推成起不来的容器。
      #    WXPAY_*（Change 2）：gateway=wxpay 时任一缺失即拒绝启动（fail-fast）；
      #    密钥类值经 GitHub Secrets 注入，绝不入库。
      - name: 生产配置门禁（密钥/网关不合格即中止，先于部署）
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PAYMENTS_GATEWAY: ${{ secrets.PAYMENTS_GATEWAY }}
        run: |
          python3 - <<'PY'
          import os, sys
          jwt = os.environ.get("JWT_SECRET", "")
          adm = os.environ.get("ADMIN_TOKEN", "")
          gw = os.environ.get("PAYMENTS_GATEWAY", "")
          bad = []
          if not jwt or jwt == "local-license-secret" or len(jwt) < 32:
              bad.append("JWT_SECRET（须 ≥32 字符强随机值；空=secrets 缺失）")
          if not adm or adm == "admin123" or len(adm) < 16:
              bad.append("ADMIN_TOKEN（须 ≥16 字符强随机值；空=secrets 缺失）")
          if not gw:
              bad.append("PAYMENTS_GATEWAY（生产必须显式配置 wxpay/mock，禁止静默回落 mock）")
          if bad:
              print("生产配置门禁未通过，中止部署：")
              for b in bad:
                  print("  -", b)
              sys.exit(1)
          print(f"生产配置门禁通过（gateway={gw}；密钥长度已校验，不回显本体）")
          PY

      - name: 生成后端部署配置
        run: |
          cat > server/cloudbaserc.json <<'EOF'
          {
            "envId": "${{ vars.TCB_ENV_ID }}",
            "cloudrun": {
              "name": "novel-s-server",
              "serverType": "container",
              "openAccessTypes": ["PUBLIC"],
              "cpu": 0.25,
              "mem": 0.5,
              "envParams": {
                "DB_BACKEND": "pg_http",
                "TCB_PG_ENV_ID": "${{ vars.TCB_ENV_ID }}",
                "TCB_PG_API_KEY": "${{ secrets.TCB_API_KEY }}",
                "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
                "ADMIN_TOKEN": "${{ secrets.ADMIN_TOKEN }}",
                "PAYMENTS_GATEWAY": "${{ secrets.PAYMENTS_GATEWAY }}",
                "CRON_TOKEN": "${{ secrets.CRON_TOKEN }}",
                "SERVERCHAN_SENDKEY": "${{ secrets.SERVERCHAN_SENDKEY }}",
                "WXPAY_MCH_ID": "${{ secrets.WXPAY_MCH_ID }}",
                "WXPAY_APPID": "${{ secrets.WXPAY_APPID }}",
                "WXPAY_CERT_SERIAL": "${{ secrets.WXPAY_CERT_SERIAL }}",
                "WXPAY_APIV3_KEY": "${{ secrets.WXPAY_APIV3_KEY }}",
                "WXPAY_PUB_KEY_ID": "${{ secrets.WXPAY_PUB_KEY_ID }}",
                "WXPAY_NOTIFY_URL": "${{ vars.WXPAY_NOTIFY_URL }}",
                "WXPAY_PRIVATE_KEY_PATH": "/app/secrets/wxpay_apiclient_key.pem",
                "WXPAY_PUB_KEY_PATH": "/app/secrets/wxpay_pub_key.pem"
              }
            }
          }
          EOF

      # ── key 指纹探针①：生成配置中的 DB key（只打哈希与长度，绝不落 key 本体）──
      # 与 secret 指纹（job 开头）、CloudBase 存储指纹（部署后）、运行时指纹
      # （CLS event=env_fingerprint）四点对拍，任一环节字符被转译/替换即当场定位。
      - name: 指纹·生成配置中的 DB key
        run: |
          python3 -c "
          import json, hashlib
          k = json.load(open('server/cloudbaserc.json'))['cloudrun']['envParams']['TCB_PG_API_KEY']
          print(f'fingerprint stage=generated len={len(k)} sha256={hashlib.sha256(k.encode()).hexdigest()}')
          "

      # ── key 指纹探针②：job 注入视角的 secret（对照 GitHub 侧存储）──
      - name: 指纹·secret 注入视角
        run: |
          python3 -c "
          import os, hashlib
          k = os.environ['TCB_API_KEY']
          print(f'fingerprint stage=secret-injected len={len(k)} sha256={hashlib.sha256(k.encode()).hexdigest()}')
          "
        env:
          TCB_API_KEY: ${{ secrets.TCB_API_KEY }}

      # 密钥文件：secrets 值写为部署包内文件（wechatpayv3 读 PEM 内容，
      # 私钥/公钥经 secrets 传递，不进 git）；wxpay 未启用时 secrets 为空，
      # 写空文件无副作用（mock 模式不读）
      - name: 生成微信支付密钥文件
        run: |
          mkdir -p server/secrets
          printf '%s\n' "${{ secrets.WXPAY_PRIVATE_KEY_PEM }}" > server/secrets/wxpay_apiclient_key.pem
          printf '%s\n' "${{ secrets.WXPAY_PUB_KEY_PEM }}" > server/secrets/wxpay_pub_key.pem

      # 生产 schema 门禁（design D5）：代码上线而 DDL 漏执行的漂移在发布前拦截。
      # 判定逻辑与后端启动自检同源（app/infrastructure/pg_schema.py）。
      # 探测失败按 fail-closed 中止（防网络抖动放行），re-run 即可重试。
      - name: 生产 schema 门禁（缺表/列即中止部署）
        run: |
          pip3 install --quiet httpx
          python3 server/scripts/pg_gate.py
        env:
          TCB_PG_ENV_ID: ${{ vars.TCB_ENV_ID }}
          TCB_PG_API_KEY: ${{ secrets.TCB_API_KEY }}

      - name: 部署后端（novel-s-server）
        # printf 回答灰度提问（No=部署成功后自动切换流量）；--wait 等待构建完成
        run: printf 'n\n' | tcb cloudrun deploy --service-name novel-s-server --source ./server --env-id ${{ vars.TCB_ENV_ID }} --force --wait

      # ── key 指纹探针③：CloudBase 存储侧（部署落库后的 EnvParams 读回）──
      # 与探针①（生成配置）不一致 ⇒ 字符在 tcb CLI/云 API 传输或 CloudBase 存储环节被转译/替换
      - name: 指纹·CloudBase 存储的 DB key
        run: |
          tcb cloudrun detail -e ${{ vars.TCB_ENV_ID }} -s novel-s-server 2>&1 | python3 -c "
          import sys, json, re, hashlib
          raw = sys.stdin.read()
          d = json.loads(re.search(r'\{.*\}', raw, re.S).group(0))
          env = d['ServerConfig']['EnvParams']
          if isinstance(env, str):
              env = json.loads(env)
          key = env['TCB_PG_API_KEY']
          digest = hashlib.sha256(key.encode()).hexdigest()
          print('fingerprint stage=cloudbase-stored len=%d sha256=%s' % (len(key), digest))
          "

      # 09-04 事故教训：新版本对服务配置（env/规格）的继承曾整体失灵，全量 401 到
      # PG 数据面；check-auth 不碰 DB 测不出来，必须探 skus（读 SKU 表走 pg_http）。
      # 失败即响亮报错并给出回滚命令，人工执行一条即回到上一稳定版本。
      - name: 部署后健康探活（skus 触 DB）
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://www.awesomenovel.com/api/pay/skus || echo 000)
            echo "probe $i: skus=$CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::部署后 skus 探活 5 轮失败（新版本 env/规格异常）。回滚：tcb cloudrun version rollback -s novel-s-server -e ${{ vars.TCB_ENV_ID }} --rollback-version-name <上一稳定版本名> --force"
          exit 1

      # ── 前端：本地构建 → 静态托管 app（独立域名 + 版本管理）──
      # TCB_BACKEND_DOMAIN 支持两种形态：裸域名（https://<统一域名>）或已带 /api
      # 尾巴——这里先归一化去掉尾部斜杠与 /api 再统一补一次，保证绝不出现 /api/api
      #
      # ⚠️ 备案号注入的两个事实（#204 复盘）：
      # 1. `tcb app deploy` 的 --build-command "" 并不会跳过云端构建——平台侧
      #    会检测 Vite 后用 npm run build 重建并作为线上最终产物，runner 上带
      #    secret 的构建只随包上传、被云端产物覆盖（历史注释「CI 注入失效」同理：
      #    VITE_API_BASE 当年也是被云端重建吃掉后才改写死 .env.production 的）。
      # 2. 云端构建读不到 runner 的 export，但会读包内的 .env 文件。
      # => 把 secret 值生成到 .env.production.local（vite 优先级高于
      #    .env.production，无同键覆盖歧义）：文件仅存在于 runner 工作区，
      #    *.local 在 .gitignore 内永不入库；打包上传后云端按值烘焙 = 变量替换生效。
      - name: 构建前端
        working-directory: server/frontend
        run: |
          npm ci
          BASE="$(printf '%s' "${{ vars.TCB_BACKEND_DOMAIN }}" | sed -E 's#/*$##; s#/api$##')"
          export VITE_API_BASE="${BASE}/api"
          export VITE_BEIAN_ICP="${{ secrets.VITE_BEIAN_ICP }}"
          export VITE_BEIAN_POLICE="${{ secrets.VITE_BEIAN_POLICE }}"
          export VITE_BEIAN_POLICE_LINK="${{ secrets.VITE_BEIAN_POLICE_LINK }}"
          {
            printf 'VITE_BEIAN_ICP=%s\n' "$VITE_BEIAN_ICP"
            printf 'VITE_BEIAN_POLICE=%s\n' "$VITE_BEIAN_POLICE"
            printf 'VITE_BEIAN_POLICE_LINK=%s\n' "$VITE_BEIAN_POLICE_LINK"
          } > .env.production.local
          npm run build && npm run probe:beian

      - name: 部署前端（novel-s-web）
        # 在根目录执行（与 login 同目录）；--cwd 指定项目目录
        # --ignore 排除 node_modules 等大目录（否则上传数百 MB 卡死）
        run: tcb app deploy novel-s-web --env-id ${{ vars.TCB_ENV_ID }} --cwd server/frontend --install-command "" --build-command "" --output-dir dist --deploy-path / --force --ignore "**/node_modules/**,**/e2e/**,**/playwright-report/**"

      - name: 部署结果
        run: |
          echo "后端: https://novel-s-server-297265-7-1468883265.sh.run.tcloudbase.com"
          echo "前端: https://novel-s-web-ai-novel-test-d1ghsr86ra814c12c.webapps.tcloudbase.com"
