name: C端 打包 (exe + dmg)

on:
  # 每个 PR 做打包验证：改动到 C端/工作流时出双平台安装包（artifact 可下载实测）
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/client-package.yml"
  # release：打 v* tag 即出包并发布。
  # 注意不设 paths 过滤——tag 推送的 paths 判定不可靠，可能静默跳过，保证每个 tag 都跑。
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# PR 推送新 commit 时取消旧构建，省 CI 分钟
concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS: macos-latest = Apple Silicon (arm64)——目标仅 arm64（用户已确认）
          - os: macos-latest
            artifact: AI-Novel-Setup-mac
          - os: windows-latest
            artifact: AI-Novel-Setup-win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 门禁：打包入口 F821（未定义名）检查。v0.15 事故：js_api=bridge 引用了从未
      # 实例化的 bridge，GUI 启动即炸（NameError）而 --smoke 无 GUI 全绿——此类包
      # 必须在 CI 就拦下，不许进 Release。
      - name: Lint packaging entry (ruff F821)
        shell: bash
        run: |
          pip install ruff
          ruff check --select F821 client/packaging/build/pywebview_app.py

      # 主体名防漂移：installer.iss 的 MyAppPublisher 是 brand.json company 的唯一
      # 手写字面量副本（Inno 读不了 JSON），两侧漂移没有任何运行时测试能红——在此钉死
      - name: Assert installer publisher matches brand.json
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          company = json.loads(Path("brand/brand.json").read_text(encoding="utf-8"))["company"].strip()
          iss = Path("client/packaging/build/installer.iss").read_text(encoding="utf-8")
          m = re.search(r'#define MyAppPublisher "(.+)"', iss)
          assert m, "installer.iss 缺 MyAppPublisher 定义"
          assert m.group(1) == company, (
              f"AppPublisher 字面量与 brand.json company 漂移：iss={m.group(1)!r} vs json={company!r}——两处须同批改")
          print("publisher sync OK:", company)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: client/backend/requirements.txt

      - name: Build frontend
        shell: bash
        run: |
          cd client/frontend
          npm ci
          npm run build

      # ── 发布期注入：S端 域名 + 客户端版本 + 更新检测地址，写成 release.json 随 datas 烘进安装包 ──
      # 换域名只改仓库 Variables：CLIENT_SERVER_API_BASE / CLIENT_SERVER_API_FALLBACK /
      # CLIENT_DOWNLOAD_BASE / CLIENT_DOWNLOAD_BASE_FALLBACK；
      # 未配置 Variable（含 fork PR 场景）回落默认值——开箱可用、与营销域名解耦。
      # 运行时优先级：用户 config.json / 环境变量 > 包内 release.json（见 pywebview_app.start_server）。
      # client_version：tag 构建写去 v 前缀真实版本；PR/手动构建写 dev（应用侧跳过更新检测）。
      # 注意：本步骤在「Install deps」之前，故 components 只 import 后端**零依赖叶子**
      # （schema_version / backup.format），不得触碰 models/config。
      - name: Generate release.json (bake S端 endpoints + version + update urls)
        working-directory: client/packaging/build
        shell: bash
        env:
          RELEASE_SERVER_API_BASE: ${{ vars.CLIENT_SERVER_API_BASE || 'https://novel-s-server-297265-7-1468883265.sh.run.tcloudbase.com/api' }}
          RELEASE_SERVER_API_FALLBACK: ${{ vars.CLIENT_SERVER_API_FALLBACK || 'https://novel-s-server-297265-7-1468883265.sh.run.tcloudbase.com/api' }}
          RELEASE_DOWNLOAD_BASE: ${{ vars.CLIENT_DOWNLOAD_BASE || 'https://www.awesomenovel.com/download' }}
          RELEASE_DOWNLOAD_FALLBACK_BASE: ${{ vars.CLIENT_DOWNLOAD_BASE_FALLBACK || 'https://ai-novel-test-d1ghsr86ra814c12c-1468883265.tcloudbaseapp.com/download' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CLIENT_VERSION="$(printf '%s' "${GITHUB_REF_NAME#v}" | tr -c 'A-Za-z0-9._-' '-')"
          else
            CLIENT_VERSION="dev"
          fi
          # c-db-per-version：版本形态门禁——库文件名＝版本派生，纯数字 tag（v1）
          # 会与遗留代数名 novel-v1.db 同形、后缀形态必须能被单源解析
          python - "$CLIENT_VERSION" <<'PY'
          import re, sys
          v = sys.argv[1]
          if v != "dev":
              ok = re.fullmatch(r"[0-9]+(\.[0-9]+)+([-._][A-Za-z0-9._-]+)?", v)
              assert ok, f"tag 清洗后版本形态非法：{v!r}（需 0.x(.y) 形态，可带后缀）"
              assert not re.fullmatch(r"[0-9]+", v), f"纯数字 tag 禁用：v{v} 与遗留代数库名同形"
          print("version-shape ok:", v)
          PY
          python - "$CLIENT_VERSION" <<'PY'
          import json, os, subprocess, sys
          version = sys.argv[1]
          # 组件清单：构建期从后端单源读取（脚本在 backend 内 import 真源）
          comp = json.loads(subprocess.check_output(
              [sys.executable, "scripts/release_components.py", version],
              cwd="client/backend", text=True))
          cfg = {
              "server_api_base": os.environ["RELEASE_SERVER_API_BASE"],
              "server_api_fallback": os.environ["RELEASE_SERVER_API_FALLBACK"],
              "client_version": version,
              "client_update_url": os.environ["RELEASE_DOWNLOAD_BASE"].rstrip("/") + "/latest.json",
              "client_update_url_fallback": os.environ["RELEASE_DOWNLOAD_FALLBACK_BASE"].rstrip("/") + "/latest.json",
              "components": comp,
          }
          for k in ("server_api_base", "client_update_url", "client_update_url_fallback"):
              assert str(cfg[k]).startswith("https://"), (k, cfg[k])
          assert comp.get("db_filename") == (f"novel-v{version}.db" if version != "dev" else "novel-dev.db"), comp
          assert isinstance(comp.get("backup_format_version"), int), comp
          with open("release.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print(json.dumps(cfg, ensure_ascii=False))
          PY

      - name: Install deps (backend + packaging)
        shell: bash
        run: |
          pip install -r client/backend/requirements.txt
          pip install -r client/packaging/build/requirements.txt

      - name: Build app (PyInstaller)
        shell: bash
        env:
          # exe 版本资源（发布者/FileVersion 元数据）的版本口径——build.spec 内
          # 做 tag 去 v 前缀与清洗，与 iscc 安装包同源
          APP_VERSION: ${{ github.ref_name }}
        run: |
          cd client/packaging/build
          rm -rf dist build_py
          python -m PyInstaller build.spec --clean --noconfirm --workpath build_py

      # 冒烟前置断言：release.json 必须真实烘进产物（两平台布局不同，find 探测不硬编码）
      - name: Assert release.json baked into bundle
        shell: bash
        run: |
          F="$(find "client/packaging/build/dist" -name release.json -print -quit)"
          if [ -z "$F" ]; then
            echo "::error::release.json 未打进安装包——检查 build.spec datas 条件与生成步骤"
            exit 1
          fi
          python -c "
          import json, sys
          d = json.load(open(sys.argv[1], encoding='utf-8'))
          assert str(d.get('server_api_base', '')).startswith('https://'), d
          assert str(d.get('client_version', '')).strip(), d
          assert str(d.get('client_update_url', '')).startswith('https://'), d
          assert str(d.get('client_update_url_fallback', '')).startswith('https://'), d
          # c-db-per-version：组件清单（BOM）——缺失或与后端单源不一致即失败
          comp = d.get('components')
          assert isinstance(comp, dict), ('release.json 缺 components 键', d)
          sys.path.insert(0, 'client/backend')
          from backup.format import FORMAT_VERSION
          from schema_version import db_filename_for
          assert comp['db_filename'] == db_filename_for(d['client_version']), (comp, d['client_version'])
          assert comp['backup_format_version'] == FORMAT_VERSION, (comp, FORMAT_VERSION)
          print('baked:', sys.argv[1], '->', d['client_version'], d['client_update_url'],
                'components=', comp)
          " "$F"

      # 冒烟：跑真实产物（--smoke 无头模式，不起 GUI），轮询 /api/health + 断言前端被服务。
      # 不跑这步，缺失 datas/hiddenimport 的坏包照样绿（历史上漏过 prompts/env.js）。
      - name: Smoke test (exe — backend + SPA)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE="client/packaging/build/dist/AI Novel/AI Novel.exe"
          PORT_JSON="$APPDATA/AI Novel/port.json"
          "$EXE" --smoke >/tmp/ainovel-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          PORT=""
          for i in $(seq 1 60); do
            PORT="$(grep -oE '"port"[[:space:]]*:[[:space:]]*[0-9]+' "$PORT_JSON" 2>/dev/null | grep -oE '[0-9]+' || true)"
            if [ -n "$PORT" ] && curl -sf "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ -z "$PORT" ] || ! curl -sf "http://127.0.0.1:$PORT/api/health" >/dev/null; then
            echo "::error::SMOKE FAILED — backend not ready"
            echo "--- app log ---"; cat /tmp/ainovel-smoke.log || true
            echo "--- startup.log ---"; cat "$APPDATA/AI Novel/startup.log" 2>/dev/null || true
            echo "--- uvicorn.log ---"; cat "$APPDATA/AI Novel/uvicorn.log" 2>/dev/null || true
            exit 1
          fi
          curl -sf "http://127.0.0.1:$PORT/" | grep -q 'id="root"' || {
            echo "::error::SMOKE FAILED — SPA index.html not served at /"
            exit 1
          }
          echo "SMOKE OK — health + SPA on port $PORT"

      # ── Windows 专属：Inno Setup 安装包 ──
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          # Git Bash(MSYS2) 会把 /DMyAppVersion=... 转换成 Windows 路径，
          # iscc 于是看到两个脚本文件而报错 → 关闭参数路径转换
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 手动 dispatch 到 feature 分支时 ref_name 可能含 / 等文件名非法字符，
          # 清洗进版本号（tag v1.2.3 → 1.2.3 不受影响）
          VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          cd client/packaging/build
          iscc /DMyAppVersion=$VERSION installer.iss

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/packaging/dist/AI_Novel_Setup_*.exe

      # ── macOS 专属：签名 + DMG ──
      # 用户拍板：用自签证书 awesome-novel-design 签名（非 ad-hoc），
      # 证书 .p12 从 GitHub Secret MACOS_SIGNING_CERT_P12 解码导入。
      - name: Import signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain-db"
          security create-keychain -p "ci-build-tmp" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "ci-build-tmp" "$KEYCHAIN"
          echo "$CERT_P12" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci-build-tmp" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Codesign app (certificate)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          KEYCHAIN="build.keychain-db"
          security unlock-keychain -p "ci-build-tmp" "$KEYCHAIN"
          codesign --force --deep --sign "awesome-novel-design" --keychain "$KEYCHAIN" "client/packaging/build/dist/AI Novel.app"
          codesign -v --deep "client/packaging/build/dist/AI Novel.app"

      - name: Smoke test (.app — backend + SPA)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="client/packaging/build/dist/AI Novel.app/Contents/MacOS/AI Novel"
          PORT_JSON="$HOME/Library/Application Support/AI Novel/port.json"
          "$APP" --smoke >/tmp/ainovel-smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          PORT=""
          for i in $(seq 1 60); do
            PORT="$(grep -oE '"port"[[:space:]]*:[[:space:]]*[0-9]+' "$PORT_JSON" 2>/dev/null | grep -oE '[0-9]+' || true)"
            if [ -n "$PORT" ] && curl -sf "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if [ -z "$PORT" ] || ! curl -sf "http://127.0.0.1:$PORT/api/health" >/dev/null; then
            echo "::error::SMOKE FAILED — backend not ready"
            echo "--- app log ---"; cat /tmp/ainovel-smoke.log || true
            echo "--- startup.log ---"; cat "$HOME/Library/Application Support/AI Novel/startup.log" 2>/dev/null || true
            echo "--- uvicorn.log ---"; cat "$HOME/Library/Application Support/AI Novel/uvicorn.log" 2>/dev/null || true
            exit 1
          fi
          curl -sf "http://127.0.0.1:$PORT/" | grep -q 'id="root"' || {
            echo "::error::SMOKE FAILED — SPA index.html not served at /"
            exit 1
          }
          echo "SMOKE OK — health + SPA on port $PORT"

      - name: Build DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          cd client/packaging/build
          STAGE=.dmg_stage
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "dist/AI Novel.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # 输出名带 v 前缀，与 exe（installer.iss 模板内置 v）统一——
          # 落地页版本化直链按此文件名拼接（src/constants/client-release.ts）
          hdiutil create -volname "AI Novel" -srcfolder "$STAGE" -ov -format UDZO "dist/AI_Novel_mac_v$VERSION.dmg"
          rm -rf "$STAGE"

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/packaging/build/dist/AI_Novel_mac_*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout#290：tag 触发时 checkout 只取 tag 指向的 commit，不取带注释的
      # tag 对象本身 → git tag -l %(contents) 为空、附注丢失。显式补取 tag 对象。
      # 勿用 "tag <name>" 简写——runner git 2.55 起判 invalid refspec（v0.14 首发实挂），
      # 必须写显式 refspec。
      - name: Fetch tag object (annotation)
        run: git fetch origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --no-tags --force
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release (exe + dmg)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            双平台桌面客户端安装包：Windows（exe）与 macOS（DMG）。
            macOS 首次打开若提示"无法验证开发者"：先点"完成"关掉提示（勿点"移到废纸篓"），再到 系统设置 → 隐私与安全性 点"仍要打开"。
            Windows 若出现 SmartScreen 提示：点「更多信息」→「仍要运行」。
      # ── 国内分发：转存安装包到静态托管 + 更新 latest.json + 生成版本更新说明页 ──
      # www 根路径路由指向静态托管（/api 才是云托管），上传后 www/download/… 即可直接下载。
      # 版本化路径只增不改，CDN 长缓存安全；latest.json 是落地页下载弹窗与 C端 更新检测
      # 共同的唯一版本事实源；notes.html 是该版本的更新说明页（C端 提示条「查看更新内容」直达）。
      # 任一校验失败即流水线标红，不静默。
      - name: Publish to static hosting (CN CDN)
        env:
          TCB_API_KEY: ${{ secrets.TCB_API_KEY }}
          TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
          RELEASE_DOWNLOAD_BASE: ${{ vars.CLIENT_DOWNLOAD_BASE || 'https://www.awesomenovel.com/download' }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          EXE="$(find artifacts -name 'AI_Novel_Setup_*.exe' -print -quit)"
          DMG="$(find artifacts -name 'AI_Novel_mac_*.dmg' -print -quit)"
          [ -n "$EXE" ] && [ -n "$DMG" ] || { echo "::error::artifacts 缺少安装包"; exit 1; }
          npm install -g @cloudbase/cli
          tcb login --cloudbase-api-key "$TCB_API_KEY" -e "$TCB_ENV_ID"
          tcb hosting deploy "$EXE" "download/v$VER/$(basename "$EXE")" -e "$TCB_ENV_ID"
          tcb hosting deploy "$DMG" "download/v$VER/$(basename "$DMG")" -e "$TCB_ENV_ID"
          # ── 更新说明内容三级回退：tag 附注 → 上一版以来提交摘要 → 通用兜底 ──
          NOTES_FROM_TAG=0
          NOTES_FULL="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)"
          [ -n "$NOTES_FULL" ] && NOTES_FROM_TAG=1
          if [ -z "$NOTES_FULL" ]; then
            PREV="$(git describe --abbrev=0 --tags "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$PREV" ]; then
              NOTES_FULL="$(git log --oneline "$PREV..$GITHUB_REF_NAME" 2>/dev/null | head -30 || true)"
            fi
          fi
          [ -z "$NOTES_FULL" ] && NOTES_FULL="问题修复与体验优化"
          export NOTES_BASE="$RELEASE_DOWNLOAD_BASE" NOTES_FULL NOTES_VER="$VER" NOTES_FROM_TAG
          python - <<'PY'
          import html, json, os, textwrap
          ver = os.environ["NOTES_VER"]
          base = os.environ["NOTES_BASE"].rstrip("/")
          full = os.environ["NOTES_FULL"].strip()
          lines = [ln.strip() for ln in full.splitlines() if ln.strip()]
          first = lines[0] if lines else ""
          # latest.json：version 必写；notes 仅当内容来自 tag 附注时取首行写入（回退内容不进摘要键）
          latest = {"version": ver}
          if os.environ["NOTES_FROM_TAG"] == "1" and first:
              latest["notes"] = first
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(latest, f, ensure_ascii=False)
          # notes.html：版本号 + 更新内容（全文，多行保留）+ 双平台版本化直链 + 回首页
          body = html.escape(full).replace("\n", "<br>")
          # notes.html 生成：HTML 整体缩进 + dedent，保证 YAML 块标量缩进完整
          page = textwrap.dedent(f"""\
              <!DOCTYPE html>
              <html lang="zh-CN">
              <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>爱小说 v{ver} 更新说明</title>
              <style>
                :root {{ color-scheme: light; }}
                * {{ box-sizing: border-box; }}
                body {{ margin: 0; background: #f7f8f7; color: #1c1e21;
                       font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
                       line-height: 1.7; }}
                main {{ max-width: 680px; margin: 0 auto; padding: 48px 24px 64px; }}
                h1 {{ font-size: 22px; margin: 0 0 4px; }}
                h1 span {{ color: #5b6b66; font-weight: 500; font-size: 16px; margin-left: 8px; }}
                .notes {{ background: #fff; border: 1px solid #e4e7e5; border-radius: 12px;
                          padding: 20px 24px; margin: 24px 0; font-size: 14.5px; }}
                h2 {{ font-size: 15px; margin: 0 0 12px; }}
                .dl a {{ display: block; background: #fff; border: 1px solid #e4e7e5; border-radius: 10px;
                         padding: 12px 18px; margin-bottom: 10px; text-decoration: none; color: #1c1e21;
                         font-size: 14.5px; }}
                .dl a:hover {{ border-color: #9fb8b1; }}
                .dl small {{ color: #6b7370; margin-left: 6px; }}
                .home {{ margin-top: 28px; }}
                .home a {{ color: #2f6f61; }}
              </style>
              </head>
              <body>
              <main>
                <h1>爱小说 <span>v{ver}</span> 更新说明</h1>
                <div class="notes">{body}</div>
                <section class="dl">
                  <h2>下载本版本</h2>
                  <a href="{base}/v{ver}/AI_Novel_Setup_v{ver}.exe">Windows 安装包<small>exe</small></a>
                  <a href="{base}/v{ver}/AI_Novel_mac_v{ver}.dmg">macOS 安装包<small>dmg</small></a>
                </section>
                <p class="home"><a href="https://www.awesomenovel.com/">回到官网首页</a></p>
              </main>
              </body>
              </html>
              """)
          with open("notes.html", "w", encoding="utf-8") as f:
              f.write(page)
          print("latest.json:", json.dumps(latest, ensure_ascii=False))
          PY
          tcb hosting deploy ./notes.html "download/v$VER/notes.html" -e "$TCB_ENV_ID"
          tcb hosting deploy ./latest.json "download/latest.json" -e "$TCB_ENV_ID"
          # 校验：www 直链 HEAD 200 且 content-length 与本地一致；latest.json 内容断言
          check() {
            for i in 1 2 3 4 5 6; do
              LEN="$(curl -sfIL "$1" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)"
              [ -n "$LEN" ] && [ "$LEN" = "$2" ] && return 0
              sleep 5
            done
            echo "::error::校验失败：$1"; return 1
          }
          check "https://www.awesomenovel.com/download/v$VER/$(basename "$EXE")" "$(stat -c%s "$EXE")" || exit 1
          check "https://www.awesomenovel.com/download/v$VER/$(basename "$DMG")" "$(stat -c%s "$DMG")" || exit 1
          check "https://www.awesomenovel.com/download/v$VER/notes.html" "$(stat -c%s notes.html)" || exit 1
          EXPECTED="$(python -c "import json;print(json.dumps(json.load(open('latest.json',encoding='utf-8')),ensure_ascii=False,separators=(',',':')))")"
          for i in 1 2 3 4 5 6; do
            GOT="$(curl -sf https://www.awesomenovel.com/download/latest.json | python -c "import json,sys;print(json.dumps(json.load(sys.stdin),ensure_ascii=False,separators=(',',':')))" 2>/dev/null || true)"
            [ "$GOT" = "$EXPECTED" ] && break
            sleep 5
          done
          [ "$GOT" = "$EXPECTED" ] || { echo "::error::latest.json 内容不符（期望 $EXPECTED，实得 ${GOT:-空}）"; exit 1; }
          echo "CN CDN 发布完成：download/v$VER/（安装包 + notes.html）+ latest.json"

      # ── 托管旧版本清理：发布校验全绿后，按版本语义序只保留最近 2 个版本目录 ──
      # 每版净增约 70MB 且托管无生命周期机制；旧版本无任何引用入口（latest.json / 落地页直链 /
      # notes.html 都只指当前版），历史版本获取由 GitHub Release 承接。latest.json 永不在删除
      # 路径；dry-run 预览先行；从未上过托管的 tag（如本地遗留 tag）报错降级为 warning；清理
      # 失败不阻塞发版（发布已成功，下个版本自动重试）。本步骤不设 if: always()——发布或校验
      # 失败时旧版本目录是当时唯一可下载来源，绝不能先删后建。
      - name: Prune old hosting versions (keep last 2)
        env:
          TCB_API_KEY: ${{ secrets.TCB_API_KEY }}
          TCB_ENV_ID: ${{ vars.TCB_ENV_ID }}
        run: |
          KEEP=2
          # checkout 不保证 tag 对象齐全（见本 job 顶部 checkout#290 注释），显式补取
          git fetch origin 'refs/tags/v*:refs/tags/v*' --force
          # 版本语义序（v0.13 > v0.4），勿用时间序——v0.9 / v0.11 会错排
          OLD_TAGS="$(git tag -l 'v*' --sort=-v:refname | tail -n +$((KEEP+1)))"
          if [ -z "$OLD_TAGS" ]; then
            echo "保留集内已无更老版本，无需清理"
            exit 0
          fi
          echo "保留最近 $KEEP 个版本，待删集合："
          echo "$OLD_TAGS"
          while IFS= read -r TAG; do
            VER="${TAG#v}"
            echo "--- 预览 download/v$VER/ ---"
            tcb hosting delete "download/v$VER" --dir --dry-run -e "$TCB_ENV_ID" || true
            if tcb hosting delete "download/v$VER" --dir -e "$TCB_ENV_ID"; then
              echo "已删除 download/v$VER/"
            else
              echo "::warning::清理 download/v$VER 失败（可能从未上过托管），已跳过"
            fi
          done <<< "$OLD_TAGS"
          echo "旧版本清理完成（保留最近 $KEEP 个版本）"
