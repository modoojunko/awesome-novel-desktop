name: C端 后端 CI

on:
  push:
    branches:
      - main
    paths:
      - "client/backend/**"
      # 前后端对拍测试读前端源（tests/test_shared_constants_parity.py）：
      # 只改前端也必须跑后端套件，否则「改一侧忘另一侧会被拦住」不成立
      - "client/frontend/src/lib/nodeTitle.ts"
      - "client/frontend/src/__tests__/nodeTitle.test.ts"
      - ".github/workflows/client-backend-ci.yml"
  pull_request:
    paths:
      - "client/backend/**"
      - "client/frontend/src/lib/nodeTitle.ts"
      - "client/frontend/src/__tests__/nodeTitle.test.ts"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 依赖许可证门禁（relicense-proprietary）：插在运行时依赖与 dev 工具安装之间——
      # 扫描面＝纯 requirements venv（dev 工具不进面）；严禁复用到 client-package.yml
      # （那里把 pyinstaller 装进同一 venv，bootloader 许可会在白名单外）
      - name: Dependency license gate
        run: python scripts/check_py_licenses.py
      # ruff 钉版本（与本地 venv/ruff.toml 口径一致；不钉会随上游新规则漂移——
      # 2026-10-06 实锤：未钉时装 0.16.10，对新代码凭空 +49 条红。判例同 S端 #633）
      - run: pip install ruff==0.16.3 pytest pytest-timeout pytest-asyncio
      - name: Lint
        run: ruff check --extend-select F811,F821,F841 .
      - name: Test
        # 不再用 || 掩盖 —— pytest 失败必须让 CI 红
        run: python -m pytest tests/ -q --timeout=30
