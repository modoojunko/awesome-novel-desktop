name: Docker 镜像构建

on:
  push:
    paths:
      - "docker-compose.yml"
      - "client/**/Dockerfile"
      - "client/**/.dockerignore"
      - "client/backend/requirements.txt"
      - "client/frontend/package.json"
      - "client/frontend/package-lock.json"
      - "client/frontend/src/**"
      - "brand/**"
      - ".github/workflows/docker-build-ci.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "client/**/Dockerfile"
      - "client/**/.dockerignore"
      - "client/backend/requirements.txt"
      - "client/frontend/package.json"
      - "client/frontend/package-lock.json"
      - "client/frontend/src/**"
      - "brand/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # C端 两镜像（拆仓后 S端 两镜像在 awesome-novel-server 仓构建；
      # compose 的 server 构建上下文指向 sibling 仓，CI 单仓检出不具备——
      # 只构建 client 两服务；编排合法性校验随四服务栈移至 e2e-scheduled（双 checkout）。
      - name: Build client-backend (C端 后端)
        run: docker compose build client-backend

      - name: Build client-frontend (C端 前端 nginx)
        run: docker compose build client-frontend
