name: C端 前端 CI

on:
  push:
    paths:
      - "client/frontend/**"
      - ".github/workflows/client-frontend-ci.yml"
  pull_request:
    paths:
      - "client/frontend/**"
      - ".github/workflows/client-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22：vitest 4 + jsdom 30 依赖的 undici 需要 Node ≥ 22.5
          # （Node 20 下实跑报 `webidl.util.markAsUncloneable is not a function`）
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 单测门禁（2026-09-10 补）：此前 CI 只跑 tsc + build，vitest 从不执行——
      # 改 lib/* 消费方时单测红过而 main 无人察觉。全部 mock、不依赖 docker 栈。
      # 2026-09-18 起带覆盖率：vitest.config.ts 锁了 5 个交付文件四项 100% 阈值，
      # --coverage 让契约真正进门禁（实测只多 ~0.2s，只 instrument 这 5 个文件）。
      - run: npx vitest run --coverage
      - run: npm run build
