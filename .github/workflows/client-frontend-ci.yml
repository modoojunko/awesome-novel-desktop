name: C端 前端 CI

on:
  push:
    paths:
      - "client/frontend/**"
      - ".github/workflows/client-frontend-ci.yml"
  pull_request:
    paths:
      - "client/frontend/**"
      - ".github/workflows/client-frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 防御性超时：渲染期抖环这类回归会让 vitest 永远不返回（testTimeout 触发不了），
    # 没有它就会挂到 GitHub 默认 6 小时
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22：vitest 4 + jsdom 30 依赖的 undici 需要 Node ≥ 22.5
          # （Node 20 下实跑报 `webidl.util.markAsUncloneable is not a function`）
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/frontend/package-lock.json
      - run: npm ci
      # 依赖许可证门禁（relicense-proprietary）：npm 分发面禁 copyleft——白名单制，
      # 误红补白名单（=许可评审），勿改脚本
      - run: node scripts/check-npm-licenses.mjs
      - run: npx tsc --noEmit
      # 单测门禁（2026-09-10 补）：此前 CI 只跑 tsc + build，vitest 从不执行——
      # 改 lib/* 消费方时单测红过而 main 无人察觉。全部 mock、不依赖 docker 栈。
      # 2026-09-18 起带覆盖率：契约清单在 src/coverage-contract.ts（config import 它），
      # 每批交付追加；--coverage 让四项 100% 阈值真正进门禁（实测与不开覆盖率无显著差异）。
      - run: npx vitest run --coverage
      - run: npm run build
