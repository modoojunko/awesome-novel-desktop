name: secret-fingerprint
on:
  workflow_dispatch:
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: fingerprint
        env:
          K1: ${{ secrets.TCB_API_KEY }}
          K2: ${{ secrets.CRON_TOKEN }}
        run: |
          python3 - <<'EOF'
          import hashlib, os
          for name, env in (("TCB_API_KEY", "K1"), ("CRON_TOKEN", "K2")):
              k = os.environ.get(env, "")
              print(f"[{name}] len:", len(k), " sha256:", hashlib.sha256(k.encode()).hexdigest())
          EOF
