name: C端 更新 runner 自检

# c-update-fail-safe §5：PR 门禁（不依赖签名 secret，不编译安装包）
# - runner 端到端：真 PowerShell + 假安装器（一次成功 / 首败重试 / 两次失败回滚）
# - 打包门禁单测：脚本三段留痕、目录预填链、autodesktop、argv 无 MERGETASKS
on:
  pull_request:
    paths:
      - 'client/packaging/**'
      - 'client/backend/tests/test_packaging_*.py'
      - '.github/workflows/client-packaging-selftest.yml'
  workflow_dispatch:

concurrency:
  group: packaging-selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Runner self-test (real PowerShell + fake installer)
        run: python client/packaging/build/runner_selftest.py
      - name: Packaging gate unit tests
        run: >
          python -m pytest
          client/backend/tests/test_packaging_shell_apply.py
          client/backend/tests/test_packaging_installer_dir_choice.py
          client/backend/tests/test_packaging_installer_silent_upgrade.py
          client/backend/tests/test_packaging_installer_guard.py
          -q
