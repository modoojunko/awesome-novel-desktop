name: S端 后端 CI

on:
  push:
    paths:
      - "server/app/**"
      - "server/alembic/**"
      - "server/scripts/**"
      - "server/tests/**"
      - "server/requirements.txt"
      - ".github/workflows/server-backend-ci.yml"
  pull_request:
    paths:
      - "server/app/**"
      - "server/alembic/**"
      - "server/scripts/**"
      - "server/tests/**"
      - "server/requirements.txt"
      - ".github/workflows/server-backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ruff==0.16.3 pytest==9.1.1 pytest-timeout==2.4.0
      - name: Lint
        run: ruff check app/ tests/ scripts/
      # s-db-migrate-pipeline：多头时 startup upgrade head 必抛（曾因 fail-open 被
      # 掩盖，sqlite 路径迁移链从未执行）。改迁移不触发本 CI 的历史在此收口。
      - name: alembic 单头断言
        run: |
          python3 - <<'EOF'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          cfg = Config()
          cfg.set_main_option("script_location", "alembic")
          heads = ScriptDirectory.from_config(cfg).get_heads()
          assert len(heads) == 1, f"alembic 迁移链出现多头: {heads}"
          print(f"alembic heads ok: {heads}")
          EOF
      - name: Test
        run: python -m pytest tests/ -v --timeout=60
